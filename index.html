// Rende fisse (sticky) durante lo scroll: l'intestazione globale in alto (già gestita via CSS),
// e — per ogni schermata — tutto ciò che precede la prima tabella (titolo/pulsanti/campi form),
// più la riga di intestazione della prima tabella stessa. Il resto (righe della tabella) scorre
// liberamente. Le altezze sono misurate dal vero DOM ad ogni render, quindi si adattano da sole
// anche quando il contenuto della schermata cambia (form più lungo, banner di avviso, ecc.).
// Oltre questa altezza, il blocco prima della tabella NON viene reso sticky: su schermate con
// liste lunghe e variabili (es. ME21N con tante richieste d'acquisto selezionabili) renderlo
// sticky bloccava lo scroll in modo innaturale (bisognava scorrere a vuoto per tutta la sua
// altezza prima che la pagina si muovesse davvero).
const MAX_ALTEZZA_STICKY_TOP = 260;
function applicaLayoutSticky() {
  const headerEl = document.querySelector('.app-header-sticky');
  if (headerEl) document.documentElement.style.setProperty('--header-h', headerEl.offsetHeight + 'px');
  const cont = document.getElementById('screen-content');
  if (!cont) return;
  const figli = Array.from(cont.children);
  const idxTabella = figli.findIndex(c => c.classList && c.classList.contains('tablewrap'));
  if (idxTabella > 0) {
    let altezzaBlocco = 0;
    for (let i = 0; i < idxTabella; i++) altezzaBlocco += figli[i].offsetHeight;
    if (altezzaBlocco <= MAX_ALTEZZA_STICKY_TOP) {
      const wrapper = document.createElement('div');
      wrapper.className = 'screen-sticky-top';
      cont.insertBefore(wrapper, figli[0]);
      for (let i = 0; i < idxTabella; i++) wrapper.appendChild(figli[i]);
      document.documentElement.style.setProperty('--screen-top-h', wrapper.offsetHeight + 'px');
    } else {
      document.documentElement.style.setProperty('--screen-top-h', '0px');
    }
  } else {
    document.documentElement.style.setProperty('--screen-top-h', '0px');
  }
  // L'intestazione sticky (vedi CSS .tablewrap-sticky-head) ha senso SOLO quando la schermata ha
  // UNA sola tabella lunga in cui si scorre (le sue righe): lì l'intestazione che resta visibile
  // mentre scorri è utile. Se la schermata ha PIÙ tabelle in sequenza (es. MF50: una per linea, una
  // per prodotto), rendere sticky anche solo la prima è comunque sbagliato: mentre scorri oltre la
  // sua fine, la sua intestazione resta incollata in cima e le righe di tabelle successive e del
  // tutto diverse scorrono sotto, dando l'impressione che la prima "inglobi" le altre. Quindi qui si
  // applica lo sticky solo se la tabella trovata è l'UNICA della schermata.
  const tutteLeTabelle = cont.querySelectorAll('.tablewrap');
  if (tutteLeTabelle.length === 1) tutteLeTabelle[0].classList.add('tablewrap-sticky-head');
}
window.addEventListener('resize', () => { if (document.getElementById('screen-content')) applicaLayoutSticky(); });

// ============ ORDINAMENTO GENERICO DELLE TABELLE (click su intestazione colonna, stile SAP) ============
// Si applica a qualunque tabella dentro #screen-content che NON abbia già un ordinamento "su misura"
// (riconosciuto dalla presenza di intestazioni con classe che finisce per "-sort-th", es. MB51/MIGO/MMBE/LS24).
// Ordina il DOM direttamente (senza toccare lo stato dell'app): comodo e leggero, ma non sopravvive
// a un nuovo render della schermata — esattamente come un click su intestazione in SAP GUI.
function abilitaOrdinamentoGenerico() {
  const cont = document.getElementById('screen-content');
  if (!cont) return;
  const COLONNE_NON_ORDINABILI = ['azioni', 'azione', 'stampa'];
  cont.querySelectorAll('table').forEach(tabella => {
    if (tabella.querySelector('th[class$="-sort-th"]')) return; // già gestita a mano
    const thead = tabella.querySelector('thead');
    const tbody = tabella.querySelector('tbody');
    if (!thead || !tbody) return;
    const ths = Array.from(thead.querySelectorAll('tr:last-child th'));
    if (ths.length === 0) return;
    ths.forEach((th, colIdx) => {
      const etichetta = (th.textContent || '').trim().toLowerCase();
      if (COLONNE_NON_ORDINABILI.includes(etichetta)) return;
      if (th.dataset.genOrdSetup) return; // evita doppio binding se richiamata più volte
      th.dataset.genOrdSetup = '1';
      if (!th.dataset.genOrdLabel) th.dataset.genOrdLabel = th.textContent;
      th.style.cursor = 'pointer';
      th.style.userSelect = 'none';
      th.title = 'Clicca per ordinare';
      th.addEventListener('click', () => {
        const righe = Array.from(tbody.querySelectorAll('tr'));
        // Non ordinare tabelle vuote/segnaposto (riga unica con colspan diverso dal numero di colonne).
        if (righe.length === 0 || righe.some(r => r.children.length !== ths.length)) return;
        const asc = th.dataset.genOrdAsc !== 'true';
        ths.forEach(t => { t.dataset.genOrdAsc = ''; t.textContent = t.dataset.genOrdLabel || t.textContent; });
        th.dataset.genOrdAsc = String(asc);
        th.textContent = (th.dataset.genOrdLabel || th.textContent) + (asc ? ' ▲' : ' ▼');
        const valoreCella = (tr) => (tr.children[colIdx].textContent || '').trim();
        const tuttiNumerici = righe.every(tr => { const v = valoreCella(tr).replace(/[€%\s]/g,'').replace(',','.'); return v === '' || !isNaN(Number(v)); });
        righe.sort((a, b) => {
          let va = valoreCella(a), vb = valoreCella(b);
          if (tuttiNumerici) {
            const na = Number(va.replace(/[€%\s]/g,'').replace(',','.')) || 0;
            const nb = Number(vb.replace(/[€%\s]/g,'').replace(',','.')) || 0;
            return asc ? na - nb : nb - na;
          }
          return asc ? va.localeCompare(vb, 'it') : vb.localeCompare(va, 'it');
        });
        righe.forEach(tr => tbody.appendChild(tr));
      });
    });
  });
}

// ============ HELPERS DI DOMINIO ============
// Elenco in memoria da controllare per ciascun prefisso di numerazione, per evitare che un
// numero "nuovo" collida con uno già esistente (es. dati storici migrati da un vecchio schema
// di numerazione, prima dell'introduzione del contatore atomico). Senza questo controllo, due
// documenti diversi potrebbero finire con lo stesso "numero", e ogni ricerca/stampa/azione basata
// su quel numero troverebbe sempre il PRIMO dei due (causa nota di bug tipo "clicco un ordine e
// me ne mostra un altro").
function _elencoPerPrefisso(prefisso) {
  if (prefisso === 'OV') return ordiniVendita;
  if (prefisso === 'OA') return ordiniAcquisto;
  if (prefisso === 'RA') return richiesteAcquisto;
  if (prefisso === 'OP') return ordiniProduzione;
  if (prefisso === 'DDT') return consegne;
  if (prefisso === 'COGI') return erroriMovimenti;
  if (prefisso === 'DM') return [...new Set(movimentazioni.map(m => m.documento).filter(Boolean))].map(n => ({ numero: n }));
  return [];
}
// Genera il numero successivo per un tipo di documento (OV, OA, RA, OP, DDT) in modo
// ATOMICO lato server: Firebase incrementa il contatore e restituisce il nuovo valore in
// un'unica operazione, quindi due scritture quasi simultanee non possono mai produrre
// lo stesso numero (il vecchio schema "conta quanti ce ne sono e aggiungi 1" invece sì).
// In più, se il numero generato risulta già usato da un documento esistente (tipicamente dati
// storici migrati con un altro schema di numerazione), il contatore viene fatto avanzare finché
// non si trova un numero davvero libero, così da auto-correggersi senza intervento manuale.
async function prossimoNumero(prefisso) {
  if (!STORAGE_CONFIGURATO) return prefisso + '-' + String(Date.now()).slice(-4);
  const elenco = _elencoPerPrefisso(prefisso);
  try {
    const chiave = corsoKey('contatori::' + prefisso);
    const url = FIREBASE_URL + '/storage/' + encodeURIComponent(chiave) + '.json';
    for (let tentativo = 0; tentativo < 20; tentativo++) {
      let nuovoValore;
      if (USA_SUPABASE) nuovoValore = await remoteStorageSupabase.incrementa(chiave);
      else {
        const res = await fetch(url, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ '.sv': { increment: 1 } })
        });
        nuovoValore = await res.json();
      }
      const candidato = prefisso + '-' + String(nuovoValore).padStart(4, '0');
      if (!elenco.some(r => r.numero === candidato)) return candidato;
      // Numero già usato (dato storico): il contatore è già avanzato di 1, si riprova al giro successivo.
    }
    // Non dovrebbe mai arrivare qui salvo un numero enorme di collisioni: ripiego con timestamp.
    return prefisso + '-' + String(Date.now()).slice(-4);
  } catch (e) {
    // Ripiego raro (rete assente): un numero comunque univoco per sessione, meglio di un duplicato certo.
    return prefisso + '-' + String(Date.now()).slice(-4);
  }
}
function getBOM(codiceProdotto) {
  return distinte.find(d => d.prodotto === codiceProdotto);
}
// ---- Distinte multilivello (semilavorati): un componente di tipo PF può avere a sua volta una distinta.
// Si usa solo se serve: una distinta con soli componenti MP resta a un livello, come prima.
function componenteDistintaOpzioni(padre) {
  return materiali.filter(m => (m.tipo === 'MP' || m.tipo === 'PF') && m.codice !== padre)
    .map(m => ({ value: m.codice, label: materialeLabel(m.codice) + (m.tipo === 'PF' ? '  [semilavorato]' : '') }));
}
// true se aggiungere questi componenti al padre crea un ciclo (il padre compare tra i propri discendenti)
function distintaCreaCiclo(padre, componenti) {
  const visti = new Set();
  const scendi = (cod) => {
    if (cod === padre) return true;
    if (visti.has(cod)) return false;
    visti.add(cod);
    const b = getBOM(cod);
    return b ? b.componenti.some(c => scendi(c.codice)) : false;
  };
  return componenti.some(c => scendi(c.codice));
}
// Esplosione verso il basso: [{livello, codice, qtaUnit (per 1 pezzo del padre diretto), qtaTot (per qta pezzi del prodotto in cima), via}]
function esplodiDistinta(codice, qta, livello = 1, percorso = [codice]) {
  const b = getBOM(codice); const out = [];
  if (!b) return out;
  b.componenti.forEach(c => {
    if (percorso.includes(c.codice)) return; // protezione da cicli in dati storici
    const tot = Number(c.qta) * qta;
    out.push({ livello, codice: c.codice, padre: codice, qtaUnit: Number(c.qta), qtaTot: tot });
    out.push(...esplodiDistinta(c.codice, tot, livello + 1, [...percorso, c.codice]));
  });
  return out;
}
// Lista di impiego (verso l'alto): dove è usato un materiale. molt = quantità del materiale per 1 pezzo del prodotto trovato.
function impiegoMateriale(codice, multilivello, molt = 1, livello = 1, percorso = [codice]) {
  const out = [];
  distinte.forEach(d => {
    const c = d.componenti.find(x => x.codice === codice);
    if (!c || percorso.includes(d.prodotto)) return;
    const m = molt * Number(c.qta);
    out.push({ livello, prodotto: d.prodotto, figlio: codice, qtaDiretta: Number(c.qta), qtaPerPezzo: m, percorso: [...percorso, d.prodotto] });
    if (multilivello) out.push(...impiegoMateriale(d.prodotto, true, m, livello + 1, [...percorso, d.prodotto]));
  });
  return out;
}
// ============ SEMAFORO DI STATO (stile SAP) ============
// verde = completato/ok, giallo = in corso/aperto, rosso = bloccato/critico/scaduto
function semaforo(colore, testo) {
  const classe = { verde:'semaforo-verde', giallo:'semaforo-giallo', rosso:'semaforo-rosso' }[colore] || 'semaforo-giallo';
  return `<span class="stato-badge"><span class="semaforo ${classe}"></span>${testo}</span>`;
}
function semaforoStatoOrdine(stato) {
  const mappa = {
    'aperto': 'giallo', 'aperta': 'giallo',
    'confermato': 'verde', 'convertita': 'verde', 'ricevuto': 'verde', 'evaso': 'verde',
  };
  return semaforo(mappa[stato] || 'giallo', stato);
}

function materialeLabel(codice) {
  const m = materiali.find(m => m.codice === codice);
  return m ? `${codice} - ${m.descrizione}` : codice;
}
function fornitoreLabel(codice) {
  const f = fornitori.find(f => f.codice === codice);
  return f ? `${codice} - ${f.ragioneSociale}` : codice;
}
function clienteLabel(codice) {
  const c = clienti.find(c => c.codice === codice);
  return c ? `${codice} - ${c.ragioneSociale}` : codice;
}

// ============ SAP-LIKE: SCHEDE (TAB) PER LE SCHERMATE MULTI-SEZIONE ============
// Genera l'intestazione a schede (stile MM01 reale: "Dati base", "MRP", ecc.). Lo stato (quale
// scheda è attiva) resta in una variabile a livello di schermata, dichiarata dal chiamante — così
// cambiare scheda non tocca né azzera i dati già scritti nelle altre.
function renderSapTabsHTML(tabs, attivo) {
  return `<div class="sap-tabs">${tabs.map(t => `<div class="sap-tab ${t.key===attivo?'sap-tab-attivo':''}" data-tab="${t.key}">${t.label}</div>`).join('')}</div>`;
}
// Attacca i listener di click alle schede appena renderizzate. onCambio riceve la chiave della
// scheda cliccata: il chiamante aggiorna la propria variabile di stato e richiama renderScreenContent().
function attachSapTabsListeners(onCambio) {
  document.querySelectorAll('.sap-tab').forEach(t => {
    t.addEventListener('click', () => onCambio(t.dataset.tab));
  });
}

// ============ SAP-LIKE: CAMPO CON AIUTO RICERCA "F4" (al posto delle <select> semplici) ============
// Riproduce il value-help F4 di SAP: un campo di sola lettura che mostra l'etichetta scelta, con un
// pulsante 🔍 che apre un popup con elenco filtrabile. Più robusto delle liste "banner" (select
// multiple nativa) e più vicino all'esperienza SAP reale di quanto sia una <select> del browser.
let f4Attivo = null; // { titolo, items:[{value,label}], onSelect(value), query }
function apriF4(titolo, items, onSelect) {
  f4Attivo = { titolo, items, onSelect, query: '' };
  renderF4();
}
function chiudiF4() {
  f4Attivo = null;
  const root = document.getElementById('f4-overlay-root');
  if (root) root.innerHTML = '';
}
function renderF4() {
  const root = document.getElementById('f4-overlay-root');
  if (!root) return;
  if (!f4Attivo) { root.innerHTML = ''; return; }
  const q = f4Attivo.query.trim().toLowerCase();
  const filtrati = q ? f4Attivo.items.filter(it => it.label.toLowerCase().includes(q)) : f4Attivo.items;
  root.innerHTML = `
    <div class="f4-overlay" id="f4-overlay-bg">
      <div class="f4-popup">
        <div class="f4-popup-header"><span>🔍 ${f4Attivo.titolo}</span><span class="f4-close" id="f4-close-btn">✕</span></div>
        <div class="f4-popup-search"><input id="f4-search-input" type="text" placeholder="Cerca..." value="${f4Attivo.query.replace(/"/g,'&quot;')}"></div>
        <div class="f4-popup-list">
          ${filtrati.length===0 ? '<div style="padding:12px; color:#9a9a8f; font-size:11px;">Nessun risultato.</div>' :
            filtrati.map(it => `<div class="f4-popup-row" data-value="${it.value}">${it.label}</div>`).join('')}
        </div>
      </div>
    </div>`;
  const bg = document.getElementById('f4-overlay-bg');
  bg.addEventListener('click', (e) => { if (e.target.id === 'f4-overlay-bg') chiudiF4(); });
  document.getElementById('f4-close-btn').addEventListener('click', chiudiF4);
  const searchInp = document.getElementById('f4-search-input');
  searchInp.focus();
  searchInp.selectionStart = searchInp.selectionEnd = searchInp.value.length;
  searchInp.addEventListener('input', e => {
    f4Attivo.query = e.target.value;
    renderF4();
  });
  searchInp.addEventListener('keydown', e => { if (e.key === 'Escape') chiudiF4(); });
  root.querySelectorAll('.f4-popup-row').forEach(row => {
    row.addEventListener('click', () => {
      const valore = row.dataset.value;
      const cb = f4Attivo.onSelect;
      chiudiF4();
      cb(valore);
    });
  });
}
// Markup del campo F4 (input di sola lettura + pulsante 🔍). data-f4-valore porta il valore
// grezzo selezionato (il testo visibile è solo l'etichetta leggibile); il chiamante legge il
// valore dal proprio stato (aggiornato subito da onSelect), mai da .value dell'input.
function campoF4HTML(id, etichettaCorrente, placeholder) {
  return `<div class="f4-field-row">
    <input id="${id}" type="text" readonly value="${(etichettaCorrente||'').replace(/"/g,'&quot;')}" placeholder="${placeholder||'-- seleziona --'}">
    <button type="button" class="f4-field-btn" id="${id}-btn" title="Cerca (F4)">🔍</button>
  </div>`;
}

// Stampa del verbale di ricevimento a partire dal MOVIMENTO stesso (movimentazioni), non
// dall'ordine d'acquisto: l'ordine può essere modificato o cancellato in seguito (annullo riga,
// pulizia massiva, ecc.), ma il movimento resta per sempre nello storico — quindi la stampa non
// deve MAI dipendere dal fatto che l'ordine esista ancora, altrimenti il link resta visibile in
// MB51 ma il click non produce nulla (silenziosamente). Per i movimenti registrati da qui in poi,
// tutti i dati necessari sono già salvati sul movimento stesso (vedi extra passato a
// registraMovimento in MIGO). Per movimenti storici (creati prima di questi campi), si tenta un
// recupero "best effort" dalla causale e, se l'ordine esiste ancora, da lì — ma anche se questo
// fallisce, si stampa comunque con quello che il movimento sa di per sé (materiale, quantità,
// causale, data, chi l'ha fatto): non si torna mai a mani vuote finché il movimento esiste.
function stampaMovimentoRicevimento(movimentoNumero) {
  const m = movimentazioni.find(x => x.numero === movimentoNumero);
  if (!m) { setStatus('Impossibile stampare: il movimento non è più nello storico (dato inatteso).', true); return; }
  let numeroOrdineRif = m.numeroOrdineRif || null;
  let fornitoreCod = m.fornitore || null;
  let ddt = m.ddtFornitore || null;
  let ricevutoDa = m.ricevutoDa || m.creatoDa;
  if (!numeroOrdineRif) {
    const match = (m.causale || '').match(/\(([A-Za-z0-9\-]+)/);
    if (match) {
      numeroOrdineRif = match[1];
      const o = ordiniAcquisto.find(x => x.numero === numeroOrdineRif);
      if (o) {
        fornitoreCod = fornitoreCod || o.fornitore;
        const riga = o.righe.find(r => r.materiale === m.materiale);
        if (riga) { ddt = ddt || riga.ddtFornitore; ricevutoDa = ricevutoDa || riga.ricevutoDa; }
      }
    }
  }
  const forn = fornitoreCod ? fornitori.find(f => f.codice === fornitoreCod) : null;
  stampaDocumento(`
    <h2 style="margin:0 0 4px 0;">Verbale di Ricevimento Merce</h2>
    <p style="margin:0 0 14px 0; color:#666; font-size:12px;">Rif. ordine d'acquisto ${numeroOrdineRif || '-'} — movimento ${m.numero}</p>
    <p style="margin:2px 0;"><strong>Fornitore:</strong> ${forn ? forn.codice+' - '+forn.ragioneSociale : (fornitoreCod || '-')}</p>
    <p style="margin:2px 0;"><strong>Materiale:</strong> ${materialeLabel(m.materiale)}</p>
    <p style="margin:2px 0;"><strong>Quantità ricevuta (questo movimento):</strong> ${m.quantita}</p>
    <p style="margin:10px 0 2px 0;"><strong>N. DDT fornitore:</strong> ${ddt || '-'}</p>
    <p style="margin:2px 0;"><strong>Data ricevimento:</strong> ${m.creatoIl || m.data || '-'}</p>
    <p style="margin:2px 0;"><strong>Ricevuto da:</strong> ${ricevutoDa || '-'}</p>
  `);
}

// ============ MF50 ============
// Fabbisogno dipendente: un semilavorato (PF usato come componente) è richiesto dagli ordini di produzione aperti dei padri.
function domandaDipendente(codice) {
  const out = [];
  ordiniProduzione.forEach(o => {
    if (o.stato !== 'aperto' || o.prodotto === codice) return;
    (o.componenti || []).forEach(c => { if (c.codice === codice) out.push({ data: o.dataPianificata || oggiISO(), qta: Number(c.qtaTotale) || 0 }); });
  });
  return out;
}
function demandForProduct(codice) {
  let totale = 0;
  let dataMinima = null;
  domandaDipendente(codice).forEach(d => { totale += d.qta; if (!dataMinima || d.data < dataMinima) dataMinima = d.data; });
  ordiniVendita.filter(o => o.stato === 'aperto').forEach(o => {
    o.righe.forEach(r => {
      if (r.prodotto === codice) {
        totale += Math.max(0, r.quantita - (r.consegnato || 0));
        if (!dataMinima || r.dataRichiesta < dataMinima) dataMinima = r.dataRichiesta;
      }
    });
  });
  return { totale, dataMinima };
}

function pianificatoApertoPer(codice) {
  return ordiniProduzione.filter(o => o.prodotto === codice && o.stato === 'aperto').reduce((s,o) => s + o.quantita, 0);
}
// ---- "In uscita": quanto di questo materiale è già impegnato da ordini aperti, in due forme:
// come componente di un ordine di produzione non ancora confermato, o come prodotto venduto
// non ancora consegnato del tutto. Serve per la giacenza proiettata di MMBE.
function consumoProduzioneApertoPer(codice) {
  let tot = 0;
  ordiniProduzione.forEach(o => {
    if (o.stato !== 'aperto') return;
    (o.componenti || []).forEach(c => { if (c.codice === codice) tot += Number(c.qtaTotale) || 0; });
  });
  return tot;
}
function venditeAperteApertoPer(codice) {
  let tot = 0;
  ordiniVendita.forEach(o => {
    if (o.stato === 'evaso') return;
    (o.righe || []).forEach(r => { if (r.prodotto === codice) { const residuo = Number(r.quantita) - Number(r.consegnato||0); if (residuo > 0) tot += residuo; } });
  });
  return tot;
}

// ---- Bucket settimanali (lun-dom), stile matrice SAP MF50 ----
function mondayOf(date) {
  const d = new Date(date);
  const day = d.getDay(); // 0=dom, 1=lun...
  const diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  d.setHours(0,0,0,0);
  return d;
}
function isoDate(d) {
  // NB: NON usare toISOString() qui — converte in UTC, e in Italia (UTC+1/+2) la mezzanotte
  // locale può "scivolare" al giorno prima nella rappresentazione UTC, disallineando di un
  // giorno tutte le date dei bucket rispetto alle date reali (es. dataRichiesta) inserite
  // dagli utenti tramite <input type="date">. Costruiamo la stringa dai campi locali.
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function fmtGG_MM(d) {
  return String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0');
}
function weekNumber(d) {
  const target = new Date(d.getTime());
  target.setHours(0,0,0,0);
  target.setDate(target.getDate() + 3 - ((target.getDay() + 6) % 7));
  const firstThursday = new Date(target.getFullYear(), 0, 4);
  const diff = target - firstThursday;
  return 1 + Math.round(diff / (7*24*60*60*1000));
}
// Festività italiane fisse (le mobili, Pasqua e Pasquetta, si calcolano a parte più sotto).
const FESTIVITA_FISSE_MMGG = ['01-01','01-06','04-25','05-01','06-02','08-15','11-01','12-08','12-25','12-26'];
function pasquaDiPasquetta(anno) {
  // Algoritmo di Gauss per la domenica di Pasqua; Pasquetta è il giorno dopo.
  const a = anno % 19, b = Math.floor(anno/100), c = anno % 100;
  const d = Math.floor(b/4), e = b % 4, f = Math.floor((b+8)/25), g = Math.floor((b-f+1)/3);
  const h = (19*a + b - d - g + 15) % 30, i = Math.floor(c/4), k = c % 4;
  const l = (32 + 2*e + 2*i - h - k) % 7, m = Math.floor((a + 11*h + 22*l)/451);
  const mese = Math.floor((h + l - 7*m + 114)/31), giorno = ((h + l - 7*m + 114) % 31) + 1;
  const pasqua = new Date(anno, mese-1, giorno);
  const pasquetta = new Date(pasqua); pasquetta.setDate(pasqua.getDate()+1);
  return [isoDate(pasqua), isoDate(pasquetta)];
}
function isFestivo(d) {
  const mmgg = String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  if (FESTIVITA_FISSE_MMGG.includes(mmgg)) return true;
  return pasquaDiPasquetta(d.getFullYear()).includes(isoDate(d));
}
function isWeekendOFestivo(d) {
  return d.getDay() === 0 || d.getDay() === 6 || isFestivo(d);
}
function generateWeekBuckets(nGiorni = 14, nSettimaneDopo = 8) {
  const buckets = [];
  const oggi = new Date(); oggi.setHours(0,0,0,0);
  const inizio = mondayOf(oggi); // la vista giornaliera parte SEMPRE dal lunedì della settimana corrente
  for (let i = 0; i < nGiorni; i++) {
    const d = new Date(inizio); d.setDate(d.getDate() + i);
    const nomeGiorno = ['dom','lun','mar','mer','gio','ven','sab'][d.getDay()];
    buckets.push({ label: nomeGiorno+' '+fmtGG_MM(d), startISO: isoDate(d), endISO: isoDate(d), speciale: isWeekendOFestivo(d), oggi: isoDate(d) === isoDate(oggi) });
  }
  const cursor = new Date(inizio); cursor.setDate(cursor.getDate() + nGiorni);
  for (let i = 0; i < nSettimaneDopo; i++) {
    const s = new Date(cursor); s.setDate(s.getDate() + i*7);
    const e = new Date(s); e.setDate(e.getDate() + 6);
    buckets.push({ label: `S${weekNumber(s)} (${fmtGG_MM(s)})`, startISO: isoDate(s), endISO: isoDate(e), speciale: false, oggi: false });
  }
  return buckets;
}
function bucketIndexForDate(dateStr, buckets) {
  if (!dateStr) return null;
  for (let i = 0; i < buckets.length; i++) {
    if (dateStr <= buckets[i].endISO) return i; // include tutto ciò che è prima/durante il primo bucket, e clamp sull'ultimo sotto
  }
  return buckets.length - 1; // oltre l'orizzonte visibile: accumula sull'ultima colonna
}

// ---- Bucket per MF50: colonna unica per l'arretrato, poi giornaliero da oggi fino al venerdì
// della terza settimana (inclusa), poi settimanale. Diversa da generateWeekBuckets (usata da MD01,
// che parte dal lunedì della settimana corrente e mostra ogni giorno passato/futuro separatamente):
// qui il passato va compresso in un'unica colonna aggregata, come richiesto per il piano di
// produzione (il dettaglio giorno-per-giorno del passato non serve più una volta trascorso).
function generateBucketsMF50() {
  const buckets = [];
  const oggi = new Date(); oggi.setHours(0,0,0,0);
  const ieri = new Date(oggi); ieri.setDate(ieri.getDate() - 1);
  // Colonna 0: tutto il passato aggregato in un'unica colonna. Un eventuale nuovo ordine generato
  // da qui (per coprire arretrato) va datato "oggi" (creaDataISO), dato che non si può pianificare
  // produzione nel passato.
  buckets.push({
    label: '⚠ Arretrato', startISO: '0001-01-01', endISO: isoDate(ieri),
    speciale: false, oggi: false, arretrato: true, creaDataISO: isoDate(oggi),
  });
  // Giornaliero da oggi fino al venerdì della terza settimana (settimana corrente = 1a).
  const lunediSettimanaCorrente = mondayOf(oggi);
  const venerdiTerzaSettimana = new Date(lunediSettimanaCorrente);
  venerdiTerzaSettimana.setDate(venerdiTerzaSettimana.getDate() + 18); // lun sett.1 + 18gg = ven sett.3
  const cursorGiorno = new Date(oggi);
  while (cursorGiorno <= venerdiTerzaSettimana) {
    const d = new Date(cursorGiorno);
    const nomeGiorno = ['dom','lun','mar','mer','gio','ven','sab'][d.getDay()];
    const iso = isoDate(d);
    buckets.push({ label: nomeGiorno+' '+fmtGG_MM(d), startISO: iso, endISO: iso, speciale: isWeekendOFestivo(d), oggi: iso === isoDate(oggi), creaDataISO: iso });
    cursorGiorno.setDate(cursorGiorno.getDate() + 1);
  }
  // Dopo i 3 settimane giornaliere: UNA SOLA colonna "Oltre" che raccoglie tutto da lunedì della 4a settimana in poi.
  const inizioOltre = new Date(lunediSettimanaCorrente); inizioOltre.setDate(inizioOltre.getDate() + 21);
  buckets.push({ label: `Oltre (da ${fmtGG_MM(inizioOltre)})`, startISO: isoDate(inizioOltre), endISO: '9999-12-31', speciale: false, oggi: false, oltre: true, creaDataISO: isoDate(inizioOltre) });
  return buckets;
}

function mf50Key(codice, linea) {
  return codice + '::' + (linea || '_');
}

// Schermata di selezione iniziale (stile SAP): scegli linee, gruppi prodotti, materiale, orizzonte e ordinamento,
// poi "Esegui" mostra la tabella di pianificazione solo per quella selezione. Selezione vuota = tutto.
const MF50_NESSUNA_LINEA = '(nessuna linea)';
const MF50_SENZA_GRUPPO = '(senza gruppo)';
function renderMF50Selezione(el) {

        <label>Materiale</label>
        <div>${campoF4HTML('mf50-sel-mat', mf50Sel.materiale ? materialeLabel(mf50Sel.materiale) : '', '-- tutti (F4) --')}${mf50Sel.materiale ? ' <span class="rowaction" id="mf50-sel-mat-x" style="cursor:pointer;">✕</span>' : ''}</div>

          <option value="codice" ${mf50Sel.ordina === 'codice' ? 'selected' : ''}>per codice</option>

  const x = document.getElementById('mf50-sel-mat-x'); if (x) x.addEventListener('click', () => { leggi(); mf50Sel.materiale = ''; renderScreenContent(); });

  document.getElementById('mf50-azzera').addEventListener('click', () => { mf50Sel = { applicata:false, linee:[], gruppi:[], materiale:'', soloFabbisogno:false, settimane:8, ordina:'linea' }; renderScreenContent(); });
}
// giorni lavorativi in un periodo (per la capacità settimanale della linea)
function giorniLavInBucket(b) {
  if (b.arretrato || b.oltre) return 0; // arretrato e colonna "Oltre" non hanno una capacità giornaliera confrontabile
  let n = 0; const d = new Date(b.startISO + 'T00:00:00'); const fine = new Date(b.endISO + 'T00:00:00');
  while (d <= fine) { if (!isWeekendOFestivo(d)) n++; d.setDate(d.getDate() + 1); }
  return n;
}

function renderMF50(el) {
  if (!mf50Sel.applicata) { renderMF50Selezione(el); return; }
  const prodottiFiniti = materiali.filter(m => m.tipo === 'PF');
  const buckets = generateBucketsMF50();

  const righeCalc = prodottiFiniti.map(p => {
    const { totale, dataMinima } = demandForProduct(p.codice);
    const giacenza = getGiacenza(p.codice);
    const pianificatoAperto = pianificatoApertoPer(p.codice);
    const giacenzaTeorica = giacenza + pianificatoAperto;
    const fabbisogno = Math.max(0, totale - giacenzaTeorica);
    const hasBOM = !!getBOM(p.codice);
    const linee = assegnazioni.filter(a => a.prodotto === p.codice).map(a => a.linea);
    return { codice: p.codice, descrizione: p.descrizione, gruppo: p.gruppoProdotti || '', richiesto: totale, dataMinima, giacenza, pianificatoAperto, giacenzaTeorica, fabbisogno, hasBOM, linee };
  }).filter(r => {
    if (mf50Sel.materiale && r.codice !== mf50Sel.materiale) return false;
    if (mf50Sel.gruppi.length && !mf50Sel.gruppi.includes(r.gruppo || MF50_SENZA_GRUPPO)) return false;
    if (mf50Sel.linee.length && !(r.linee.length ? r.linee : [MF50_NESSUNA_LINEA]).some(l => mf50Sel.linee.includes(l))) return false;
    if (mf50Sel.soloFabbisogno && !(r.fabbisogno > 0)) return false;
    return true;
  });
  const prodottiVisibili = new Set(righeCalc.map(r => r.codice));
  const lineaVisibile = (l) => !mf50Sel.linee.length || mf50Sel.linee.includes(l || MF50_NESSUNA_LINEA);

  // ---- Recap per linea: produzione totale pianificata, con più codici possibili sulla stessa linea ----
  function recapPerLineaHTML() {
    // Set: se per dati storici esistono più record linea con lo stesso codice (possibile con
    // vecchi dati duplicati), evita di renderizzare più blocchi identici sovrapposti per la
    // stessa linea ("si ammucchiano").
    const lineeChiavi = [...new Set(lineeProduzione.map(l => l.codice))];
    const haNonAssegnata = ordiniProduzione.some(o => o.stato === 'aperto' && !o.linea && prodottiVisibili.has(o.prodotto));
    if (haNonAssegnata && lineaVisibile(null)) lineeChiavi.push('(non assegnata)');
    for (let i = lineeChiavi.length - 1; i >= 0; i--) if (lineeChiavi[i] !== '(non assegnata)' && !lineaVisibile(lineeChiavi[i])) lineeChiavi.splice(i, 1);
    if (lineeChiavi.length === 0) {
      return `
        <div style="margin:0 10px 14px 10px;">
          <div style="background:#e5e0cc; border:1px solid #c8c2a8; padding:5px 8px; font-weight:600; font-size:11.5px;">📊 Produzione pianificata per linea</div>
          <p style="font-size:11px;color:#9a9a8f;padding:8px;">Nessuna linea definita e nessun ordine senza linea. Crea una linea in CR01.</p>
        </div>`;
    }

    const blocchi = lineeChiavi.map(lineaKey => {
      const ordiniLinea = ordiniProduzione.filter(o => o.stato === 'aperto' && prodottiVisibili.has(o.prodotto) && (o.linea || '(non assegnata)') === lineaKey);
      const totalePerBucket = new Array(buckets.length).fill(0);
      const perCodice = {};
      ordiniLinea.forEach(o => {
        const idx = bucketIndexForDate(o.dataPianificata, buckets);
        if (idx === null) return;
        totalePerBucket[idx] += o.quantita;
        if (!perCodice[o.prodotto]) perCodice[o.prodotto] = new Array(buckets.length).fill(0);
        perCodice[o.prodotto][idx] += o.quantita;
      });
      // Aggiunge in tempo reale anche quanto scritto in "Da aggiungere ora" per i prodotti
      // assegnati a questa linea, ANCHE prima di generare gli ordini di produzione: così il
      // recap qui sopra riflette subito la pianificazione digitata più sotto, non solo dopo
      // aver confermato con "Genera ordini di produzione".
      righeCalc.forEach(r => {
        const lineeRiga = r.linee.length > 0 ? r.linee : [null];
        lineeRiga.forEach(l => {
          if ((l || '(non assegnata)') !== lineaKey) return;
          const key = l || '_';
          for (let i = 0; i < buckets.length; i++) {
            const cellKey = `${r.codice}::${key}::${i}`;
            const daAggiungere = mf50CellDraft[cellKey] !== undefined ? (Number(mf50CellDraft[cellKey]) || 0) : 0;
            if (daAggiungere === 0) continue;
            totalePerBucket[i] += daAggiungere;
            if (!perCodice[r.codice]) perCodice[r.codice] = new Array(buckets.length).fill(0);
            perCodice[r.codice][i] += daAggiungere;
          }
        });
      });
      const infoLinea = lineeProduzione.find(l => l.codice === lineaKey);
      const nomeLinea = lineaKey === '(non assegnata)' ? '(non assegnata)' : (infoLinea ? `${lineaKey} - ${infoLinea.descrizione}` : lineaKey);
      const capacitaMax = infoLinea ? Number(infoLinea.capacitaMax) || 0 : 0;
      const righeCodici = Object.entries(perCodice).map(([cod, arr]) =>
        `<tr><td style="padding-left:14px; color:#3a5a8c;">↳ ${materialeLabel(cod)}</td>${arr.map(v => `<td style="text-align:center; font-size:10.5px;">${v||''}</td>`).join('')}</tr>`
      ).join('');

      return `
        <div style="margin:0 0 18px 0; padding-bottom:6px; border-bottom:2px solid #d8d8c8;">
          <div class="tablewrap" style="margin:0 0 0 0;">
            <table style="min-width:${140+buckets.length*52}px;">
              <thead><tr><th style="min-width:150px;">${nomeLinea}${capacitaMax>0?` <span style="font-weight:400; font-size:9.5px; color:#5a6470;">(max ${capacitaMax}/g)</span>`:''}</th>${buckets.map(b => `<th style="text-align:center; min-width:48px; font-size:10px; ${b.arretrato?'background:#ffe0b3; color:#8a4a00; font-weight:700;':(b.speciale?'color:#a83232; background:#fbeaea;':'')} ${b.oggi?'text-decoration:underline;':''}">${b.label}</th>`).join('')}</tr></thead>
              <tbody>
                <tr style="background:#f4f4ee; font-weight:600;"><td>Totale linea</td>${totalePerBucket.map((v,i) => {
                  const sopraCapacita = capacitaMax>0 && v>capacitaMax && !buckets[i].oltre && !buckets[i].arretrato;
                  return `<td style="text-align:center; ${sopraCapacita?'color:#a83232; background:#fbeaea;':''}" ${sopraCapacita?`title="Supera la capacità massima della linea (${capacitaMax}/giorno)"`:''}>${v||0}${sopraCapacita?' ⚠':''}</td>`;
                }).join('')}</tr>
                ${capacitaMax > 0 ? `<tr><td style="font-size:10.5px; color:#5a6470;">Carico linea % (capacità ${capacitaMax}/giorno lav.)</td>${totalePerBucket.map((v, i) => { const cap = capacitaMax * giorniLavInBucket(buckets[i]); if (!cap) return '<td></td>'; const pc = Math.round(v / cap * 100); return `<td style="text-align:center; font-size:10.5px; font-weight:600; color:${pc > 100 ? '#a83232' : pc > 80 ? '#a86a1a' : '#1a6b2e'};">${v ? pc + '%' : ''}</td>`; }).join('')}</tr>` : ''}
                ${righeCodici || '<tr><td colspan="'+(buckets.length+1)+'" style="text-align:center;color:#9a9a8f;font-size:10.5px;padding:4px;">Nessun ordine pianificato su questa linea.</td></tr>'}
              </tbody>
            </table>
          </div>
        </div>`;
    }).join('');

    return `
      <div style="margin:0 10px 14px 10px;">
        <div style="background:#e5e0cc; border:1px solid #c8c2a8; padding:5px 8px; font-weight:600; font-size:11.5px;">📊 Produzione pianificata per linea (ordini aperti: giorni per 3 settimane, poi colonna "Oltre")</div>
        ${blocchi}
      </div>`;
  }

  // ---- Matrice settimanale EDITABILE (unico punto di pianificazione) ----
  function existingPlanPerWeek(codice, linea) {
    const arr = new Array(buckets.length).fill(0);
    // NB: solo ordini "aperto" — un ordine "confermato" ha già generato il prodotto finito
    // (la giacenza lo riflette), quindi non va più contato come "pianificato futuro" qui:
    // altrimenti questa riga mostra un valore che il recap "Totale linea" qui sopra (che conta
    // solo gli ordini aperti) non riflette, disallineando i due totali.
    ordiniProduzione.filter(o => o.stato === 'aperto' && o.prodotto === codice && (o.linea || null) === (linea || null)).forEach(o => {
      const idx = bucketIndexForDate(o.dataPianificata, buckets);
      if (idx !== null) arr[idx] += o.quantita;
    });
    return arr;
  }

  function matriceProdottoHTML(r) {
    if (!r.hasBOM) return ''; // senza BOM non si può generare nulla: non ha senso pianificare
    const richiestoWeek = new Array(buckets.length).fill(0);
    ordiniVendita.filter(o => o.stato === 'aperto').forEach(o => {
      o.righe.forEach(riga => {
        if (riga.prodotto === r.codice) {
          const idx = bucketIndexForDate(riga.dataRichiesta, buckets);
          if (idx !== null) richiestoWeek[idx] += Math.max(0, riga.quantita - (riga.consegnato || 0));
        }
      });
    });
    domandaDipendente(r.codice).forEach(d => { const idx = bucketIndexForDate(d.data, buckets); if (idx !== null) richiestoWeek[idx] += d.qta; });

    const lineeRiga = r.linee.length > 0 ? r.linee : [null]; // null = "non assegnata a una linea specifica"
    const baselinePerLinea = {};
    lineeRiga.forEach(l => { baselinePerLinea[l || '_'] = existingPlanPerWeek(r.codice, l); });

    // NB: mf50CellDraft NON è più il "totale" della cella, ma la quantità AGGIUNTIVA da
    // generare ora, sopra a quanto già pianificato (baselinePerLinea, sempre mostrato in
    // chiaro nella riga "Già programmato" qui sotto, mai editabile). Così il già-programmato
    // resta sempre visibile e non può mai sembrare "vuoto", e un secondo click su "Genera"
    // senza aver scritto nulla di nuovo non ricrea nulla (il campo riparte sempre da vuoto).
    function pianificatoTotWeekCorrente() {
      const tot = new Array(buckets.length).fill(0);
      lineeRiga.forEach(l => {
        const key = l || '_';
        for (let i = 0; i < buckets.length; i++) {
          const cellKey = `${r.codice}::${key}::${i}`;
          const daAggiungere = mf50CellDraft[cellKey] !== undefined ? (Number(mf50CellDraft[cellKey]) || 0) : 0;
          tot[i] += (baselinePerLinea[key][i] || 0) + daAggiungere;
        }
      });
      return tot;
    }

    const lineeVis = lineeRiga.filter(lineaVisibile);
    const righeLinea = lineeVis.map(l => {
      const key = l || '_';
      const cellsGiaProgrammato = buckets.map((b, i) => {
        const v = baselinePerLinea[key][i];
        return `<td style="text-align:center; font-size:10.5px; ${v>0?'font-weight:600; color:#1a6b2e;':'color:#9a9a8f;'}">${v || ''}</td>`;
      }).join('');
      const cellsDaAggiungere = buckets.map((b, i) => {
        const cellKey = `${r.codice}::${key}::${i}`;
        const val = mf50CellDraft[cellKey] !== undefined ? mf50CellDraft[cellKey] : '';
        return `<td style="padding:2px;"><input type="number" min="0" class="mat-cell" data-prodotto="${r.codice}" data-linea="${l||''}" data-week="${i}" value="${val}" placeholder="0" style="width:52px; font-size:10.5px; padding:2px; border:1px solid #b9c4d6; text-align:center;"></td>`;
      }).join('');
      const etichettaLinea = l ? '(' + l + ')' : '(nessuna linea)';
      return `<tr><td style="padding-left:14px; color:#1a6b2e; white-space:nowrap;">✓ Già programmato ${etichettaLinea}</td>${cellsGiaProgrammato}</tr>` +
             `<tr><td style="padding-left:14px; color:#3a5a8c; white-space:nowrap;">↳ Da aggiungere ora ${etichettaLinea}</td>${cellsDaAggiungere}</tr>`;
    }).join('');

    const pianificatoTot = pianificatoTotWeekCorrente();
    const giacenzaProiettata = [];
    let run = r.giacenza; // parte dalla giacenza fisica; "già pianificato aperto" è incluso via le celle stesse (baseline = ODP esistenti)
    for (let i = 0; i < buckets.length; i++) {
      run = run + pianificatoTot[i] - richiestoWeek[i];
      giacenzaProiettata.push(run);
    }

    return `
      <div style="margin:0 10px 18px 10px;" data-prodotto-block="${r.codice}">
        <div style="background:#dfe6f0; border:1px solid #b9c4d6; padding:6px 8px; font-weight:600; font-size:11.5px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;">
          <span>${r.codice} - ${r.descrizione}</span>
          <span style="font-weight:400; font-size:10.5px; color:#3a4453;">Giacenza fisica: ${r.giacenza} | Già pianificato: ${r.pianificatoAperto} | Giacenza teorica: <strong>${r.giacenzaTeorica}</strong> | Fabbisogno residuo: <strong style="color:${r.fabbisogno>0?'#a83232':'#1a6b2e'}">${r.fabbisogno}</strong></span>
        </div>
        <div class="tablewrap" style="margin:0;">
          <table style="min-width:${140+buckets.length*60}px;">
            <thead>
              <tr><th style="min-width:150px;">Dato</th>${buckets.map(b => `<th style="text-align:center; min-width:56px; font-size:10px; ${b.arretrato?'background:#ffe0b3; color:#8a4a00; font-weight:700;':(b.speciale?'color:#a83232; background:#fbeaea;':'')} ${b.oggi?'text-decoration:underline;':''}">${b.label}</th>`).join('')}</tr>
            </thead>
            <tbody>
              <tr style="background:#f4f4ee;"><td>Giacenza proiettata</td>${giacenzaProiettata.map(v => `<td class="proiezione-cell" style="text-align:center; font-weight:600; color:${v<0?'#a83232':'#1a6b2e'};">${v}</td>`).join('')}</tr>
              <tr><td>Richiesto</td>${richiestoWeek.map(v => `<td style="text-align:center; font-size:10.5px;">${v||''}</td>`).join('')}</tr>
              ${righeLinea}
            </tbody>
          </table>
        </div>
        <div style="display:flex; align-items:center; gap:10px; margin-top:6px;">
          <button class="actionbtn genera-piano" data-prodotto="${r.codice}" style="padding:5px 10px; font-size:11px;">✔ Genera ordini di produzione da questo piano</button>
          <span class="piano-confirm" data-prodotto="${r.codice}" style="font-size:10.5px; color:#1a6b2e;"></span>
        </div>
      </div>`;
  }

  const primaLinea = r => (r.linee.length ? r.linee.slice().sort()[0] : '￿');
  const ordinati = righeCalc.slice().sort((a, b) =>
    mf50Sel.ordina === 'fabbisogno' ? (b.fabbisogno - a.fabbisogno || a.codice.localeCompare(b.codice))
    : mf50Sel.ordina === 'codice' ? a.codice.localeCompare(b.codice)
    : (primaLinea(a).localeCompare(primaLinea(b)) || a.codice.localeCompare(b.codice)));
  let lineaPrec = null;
  const matriciHTML = ordinati.map(r => {
    const h = matriceProdottoHTML(r);
    if (!h || mf50Sel.ordina !== 'linea') return h;
    const pl = r.linee.length ? primaLinea(r) : MF50_NESSUNA_LINEA;
    let testa = '';
    if (pl !== lineaPrec) { lineaPrec = pl; const info = lineeProduzione.find(l => l.codice === pl); testa = `<div style="margin:12px 10px 4px 10px; font-weight:700; font-size:12px; color:#3a5a8c; border-bottom:1px solid #b9c4d6;">▸ ${pl}${info ? ' — ' + info.descrizione : ''}</div>`; }
    return testa + h;
  }).join('');
  const descrSel = [mf50Sel.linee.length ? 'linee: ' + mf50Sel.linee.join(', ') : '', mf50Sel.gruppi.length ? 'gruppi: ' + mf50Sel.gruppi.join(', ') : '', mf50Sel.materiale ? 'materiale: ' + mf50Sel.materiale : '', mf50Sel.soloFabbisogno ? 'solo con fabbisogno' : ''].filter(Boolean).join(' · ') || 'tutto';

  el.innerHTML = `
    <div class="actionrow"><button class="actionbtn" id="mf50-modifica-sel">✎ Modifica selezione</button><span style="font-size:11px;color:#5a6470;margin-left:10px;">Selezione: <strong>${descrSel}</strong> — ${righeCalc.length} prodotti</span></div>
    <div class="formwrap" style="padding-bottom:0;">
      <p style="font-size:11px;color:#5a6470;margin:0 0 4px 0;">Scrivi direttamente nella matrice le quantità da produrre (il passato è raggruppato in un'unica colonna "⚠ Arretrato", da oggi al venerdì della 3ª settimana è giornaliero, poi settimanale), poi conferma: verranno creati gli ordini di produzione necessari. Le pianificazioni non verificano ancora la capacità della linea (gestione futura).</p>
    </div>
    <div style="flex:1; overflow:auto;">
      ${lineeProduzione.length === 0 ? '<p style="font-size:11px;color:#a83232;margin:0 10px 10px 10px;">Nessuna linea di produzione definita: crearle in CR01 per vedere il recap qui sotto.</p>' : ''}
      <div id="mf50-recap-linee">${recapPerLineaHTML()}</div>
      <div style="margin:0 10px 6px 10px; border-top:2px solid #b9c4d6; padding-top:10px;">
        <strong style="font-size:13px;">📅 Piano per prodotto — scrivi qui per pianificare</strong>
        <p style="font-size:10.5px; color:#8a8a80; margin:2px 0 10px 0;">Colonna "⚠ Arretrato": tutto ciò che è nel passato, aggregato in un unico totale (un nuovo ordine generato da qui viene datato ad oggi). Da oggi fino al venerdì della 3ª settimana: colonne giornaliere. Da lì in poi: colonne settimanali. La riga "✓ Già programmato" (sola lettura, sempre visibile) mostra quanto è già stato generato in ordini di produzione per quel periodo/linea. La riga "↳ Da aggiungere ora" è dove scrivi SOLO la quantità aggiuntiva da generare: parte sempre vuota, così un click su "Genera" senza nuovi numeri non crea nulla di duplicato. "Giacenza proiettata" è la giacenza attesa a fine periodo se tutto va come pianificato (già programmato + da aggiungere ora): se scende sotto zero, la copertura non basta ancora.</p>
        ${matriciHTML || '<p style="font-size:11px;color:#9a9a8f; margin-left:10px;">Nessun prodotto con distinta base da pianificare. Crea prima una BOM in CS01.</p>'}
      </div>
    </div>
  `;

  document.getElementById('mf50-modifica-sel').addEventListener('click', () => { mf50Sel.applicata = false; renderScreenContent(); });
  document.querySelectorAll('.mat-cell').forEach(inp => {
    inp.addEventListener('input', e => {
      const { prodotto, linea, week } = e.target.dataset;
      const cellKey = `${prodotto}::${linea||'_'}::${week}`;
      mf50CellDraft[cellKey] = e.target.value;
      // ricalcola live SOLO la riga "Giacenza proiettata" del blocco di questo prodotto
      const blocco = document.querySelector(`[data-prodotto-block="${prodotto}"]`);
      if (!blocco) return;
      const r = righeCalc.find(x => x.codice === prodotto);
      const richiestoWeek = new Array(buckets.length).fill(0);
      ordiniVendita.filter(o => o.stato === 'aperto').forEach(o => {
        o.righe.forEach(riga => { if (riga.prodotto === prodotto) {
          const idx = bucketIndexForDate(riga.dataRichiesta, buckets);
          if (idx !== null) richiestoWeek[idx] += Math.max(0, riga.quantita - (riga.consegnato || 0));
        }});
      });
      domandaDipendente(prodotto).forEach(d => { const idx = bucketIndexForDate(d.data, buckets); if (idx !== null) richiestoWeek[idx] += d.qta; });
      const lineeRiga = r.linee.length > 0 ? r.linee : [null];
      const pianificatoTot = new Array(buckets.length).fill(0);
      lineeRiga.forEach(l => {
        const key = l || '_';
        const baseline = existingPlanPerWeek(prodotto, l);
        for (let i = 0; i < buckets.length; i++) {
          const ck = `${prodotto}::${key}::${i}`;
          const daAggiungere = mf50CellDraft[ck] !== undefined ? (Number(mf50CellDraft[ck]) || 0) : 0;
          pianificatoTot[i] += (baseline[i] || 0) + daAggiungere;
        }
      });
      let run = r.giacenza;
      const proiez = [];
      for (let i = 0; i < buckets.length; i++) { run = run + pianificatoTot[i] - richiestoWeek[i]; proiez.push(run); }
      blocco.querySelectorAll('.proiezione-cell').forEach((td, i) => {
        td.textContent = proiez[i];
        td.style.color = proiez[i] < 0 ? '#a83232' : '#1a6b2e';
      });
      // ricalcola anche il recap per linea qui sopra: deve riflettere in tempo reale quanto
      // scritto qui sotto, anche prima di generare gli ordini di produzione.
      const recapEl = document.getElementById('mf50-recap-linee');
      if (recapEl) recapEl.innerHTML = recapPerLineaHTML();
    });
  });

  document.querySelectorAll('.genera-piano').forEach(btn => {
    btn.addEventListener('click', () => withGuard(async () => {
      const prodotto = btn.dataset.prodotto;
      const r = righeCalc.find(x => x.codice === prodotto);
      const bom = getBOM(prodotto);
      const lineeRiga = r.linee.length > 0 ? r.linee : [null];
      const creati = [];

      // Ricarico la lista più recente prima di calcolare la baseline e generare i numeri ordine,
      // per evitare che due discenti che confermano quasi in contemporanea si cancellino a vicenda.
      const opFreschi = await loadList('ordiniProduzione');
      ordiniProduzione = opFreschi;

      for (const l of lineeRiga) {
        const key = l || '_';
        for (let i = 0; i < buckets.length; i++) {
          const cellKey = `${prodotto}::${key}::${i}`;
          if (mf50CellDraft[cellKey] === undefined) continue;
          // Il campo "Da aggiungere ora" contiene già la quantità AGGIUNTIVA da generare
          // (non più un totale da cui sottrarre il già-programmato): niente più ambiguità
          // tra "quanto c'era" e "quanto scrivo".
          const delta = Number(mf50CellDraft[cellKey]) || 0;
          if (delta > 0) {
            const rec = {
              numero: await prossimoNumero('OP'), prodotto, quantita: delta, origine: 'MF50/MRP (piano settimanale)', stato: 'aperto',
              dataPianificata: buckets[i].creaDataISO || buckets[i].startISO, linea: l,
              componenti: bom.componenti.map(c => ({ codice: c.codice, qtaUnitaria: Number(c.qta), qtaTotale: Number(c.qta) * delta })),
              creatoDa: currentUser, creatoIl: nowStr(), confermatoDa: null, confermatoIl: null,
            };
            creati.push(rec);
          }
          delete mf50CellDraft[cellKey];
        }
      }

      if (creati.length === 0) {
        setStatus('Nessuna nuova quantità pianificata da confermare per questo prodotto.', true);
        return;
      }
      for (const rec of creati) { await aggiungiRecord('ordiniProduzione', rec); ordiniProduzione.push(rec); }
      const riepilogo = creati.map(c => `${c.numero}${c.linea ? ' ('+c.linea+')' : ''}: ${c.quantita} pz il ${c.dataPianificata}`).join(' — ');
      setStatus(`Generati ${creati.length} ordine/i di produzione per ${prodotto}: ${riepilogo}`);
      renderMain();
    }));
  });
}

// ============ CR01 (Linee di produzione) ============
function renderCR01(el) {
  el.innerHTML = `
    <div class="actionrow">
      <button class="actionbtn" id="save-cr01">✔ ${editandoLinea ? 'Salva modifiche' : 'Salva linea di produzione'}</button>
      ${editandoLinea ? '<button class="actionbtn" id="annulla-modifica-cr01">✕ Annulla modifica</button>' : ''}
    </div>
    <div class="formwrap">
      ${editandoLinea ? `<p style="font-size:10.5px; color:#3a5a8c; margin:0 0 8px 0;">Stai modificando la linea <strong>${editandoLinea}</strong>.</p>` : ''}
      <div class="formgrid">
        <label>Codice linea</label><input id="f-codice" value="${draftLinea.codice}" placeholder="es. LINEA-1" ${editandoLinea ? 'disabled' : ''}>
        <label>Descrizione</label><input id="f-desc" value="${draftLinea.descrizione}" placeholder="es. Linea assemblaggio A">
        <label>Capacità massima/giorno</label><input id="f-capacita" type="number" min="0" value="${draftLinea.capacitaMax||''}" placeholder="es. 500 (facoltativo, 0 o vuoto = nessun limite)">
      </div>
    </div>
    <div class="tablewrap">
      <table>
        <thead><tr><th>Codice</th><th>Descrizione</th><th>Capacità max/giorno</th><th>Creato da</th><th>Azioni</th></tr></thead>
        <tbody>${lineeProduzione.length===0 ? '<tr><td colspan="5" style="text-align:center;color:#9a9a8f;padding:16px;">Nessuna linea definita.</td></tr>' :
          lineeProduzione.map(l => `<tr><td>${l.codice}</td><td>${l.descrizione}</td><td style="text-align:center;">${l.capacitaMax || '—'}</td><td>${l.creatoDa}</td><td><span class="rowaction modifica-linea" data-codice="${l.codice}">modifica</span> ${deleteActionCell('lin-'+l.codice)}</td></tr>`).join('')}
        </tbody>
      </table>
      <p style="font-size:10px; color:#8a8a80; padding:6px 8px;">Eliminando una linea vengono rimosse anche le assegnazioni prodotto→linea collegate.</p>
    </div>
  `;
  attachDeleteBaseListeners();
  document.querySelectorAll('.confirm-delete-yes').forEach(el => {
    el.addEventListener('click', () => withGuard(async () => {
      const codice = el.dataset.key.replace('lin-', '');
      const daRimuovere = assegnazioni.filter(a => a.linea === codice);
      await eliminaRecord('lineeProduzione', codice);
      for (const a of daRimuovere) { await eliminaRecord('assegnazioni', chiaveDiRecord('assegnazioni', a)); }
      lineeProduzione = lineeProduzione.filter(l => l.codice !== codice);
      assegnazioni = assegnazioni.filter(a => a.linea !== codice);
      confirmDeleteKey = null;
      if (editandoLinea === codice) { editandoLinea = null; draftLinea = { codice:"", descrizione:"", capacitaMax:"" }; }
      setStatus(`Linea ${codice} eliminata (${daRimuovere.length} assegnazioni collegate rimosse).`);
      renderMain();
    }));
  });
  document.querySelectorAll('.modifica-linea').forEach(elx => {
    elx.addEventListener('click', () => {
      const l = lineeProduzione.find(x => x.codice === elx.dataset.codice);
      if (!l) return;
      editandoLinea = l.codice;
      draftLinea = { codice: l.codice, descrizione: l.descrizione, capacitaMax: l.capacitaMax || '' };
      renderScreenContent();
    });
  });
  const btnAnnullaMod = document.getElementById('annulla-modifica-cr01');
  if (btnAnnullaMod) btnAnnullaMod.addEventListener('click', () => {
    editandoLinea = null;
    draftLinea = { codice:"", descrizione:"", capacitaMax:"" };
    renderScreenContent();
  });
  document.getElementById('f-codice').addEventListener('input', e => draftLinea.codice = e.target.value);
  document.getElementById('f-desc').addEventListener('input', e => draftLinea.descrizione = e.target.value);
  document.getElementById('f-capacita').addEventListener('input', e => draftLinea.capacitaMax = e.target.value);
  document.getElementById('save-cr01').addEventListener('click', () => withGuard(async () => {
    if (!draftLinea.descrizione.trim()) { setStatus('La descrizione è obbligatoria.', true); return; }
    if (editandoLinea) {
      const nuoviValori = { descrizione: draftLinea.descrizione.trim(), capacitaMax: Number(draftLinea.capacitaMax)||0 };
      await applicaPatch('lineeProduzione', editandoLinea, nuoviValori);
      const l = lineeProduzione.find(x => x.codice === editandoLinea);
      if (l) Object.assign(l, nuoviValori);
      setStatus(`Linea ${editandoLinea} aggiornata.`);
      editandoLinea = null;
      draftLinea = { codice:"", descrizione:"", capacitaMax:"" };
      renderMain();
      return;
    }
    if (!draftLinea.codice.trim()) { setStatus('Il codice è obbligatorio.', true); return; }
    const codice = draftLinea.codice.trim().toUpperCase();
    lineeProduzione = await loadList('lineeProduzione');
    if (lineeProduzione.some(l => l.codice === codice)) { setStatus('Codice linea già esistente.', true); return; }
    const rec = { codice, descrizione: draftLinea.descrizione.trim(), capacitaMax: Number(draftLinea.capacitaMax)||0, creatoDa: currentUser, creatoIl: nowStr() };
    await aggiungiRecord('lineeProduzione', rec);
    lineeProduzione.push(rec);
    draftLinea = { codice:"", descrizione:"", capacitaMax:"" };
    setStatus(`Linea ${rec.codice} creata con successo.`);
    renderMain();
  }));
}

// ============ Assegnazione prodotto -> linea ============
function renderAssegnazione(el) {
  const prodottiFiniti = materiali.filter(m => m.tipo === 'PF');
  const linSelezionate = draftAssegnazione.linee;

  el.innerHTML = `
    <div class="formwrap" style="padding-bottom:0;">
      <p style="font-size:11px;color:#5a6470;margin:0 0 8px 0;">Versione semplificata: in SAP reale questo collegamento fa parte della <strong>Versione di Produzione</strong> (C223), che lega materiale, distinta base e centro di lavoro/ciclo per determinare il processo produttivo da usare.</p>
    </div>
    <div class="actionrow"><button class="actionbtn" id="save-assegna">✔ Salva assegnazione</button></div>
    <div class="formwrap">
      <div class="formgrid">
        <label>Prodotto finito</label>
        ${campoF4HTML('f-prodotto', draftAssegnazione.prodotto ? materialeLabel(draftAssegnazione.prodotto) : '', '-- cerca prodotto finito (F4) --')}
      </div>
      ${lineeProduzione.length===0 ? '<p style="font-size:11px;color:#a83232;margin-top:8px;">Nessuna linea di produzione definita: crearle prima in CR01.</p>' :
        `<div style="margin-top:10px;">
          <span style="font-size:11.5px; display:block; margin-bottom:6px;">Linee assegnate (selezionabili più di una):</span>
          ${lineeProduzione.map(l => `
            <label style="display:inline-flex; align-items:center; gap:4px; margin-right:16px; font-size:11.5px; font-weight:400; text-align:left;">
              <input type="checkbox" class="linea-check" value="${l.codice}" ${linSelezionate.includes(l.codice)?'checked':''}>
              ${l.codice} - ${l.descrizione}
            </label>
          `).join('')}
        </div>`}
    </div>
    <div class="tablewrap">
      <table>
        <thead><tr><th>Prodotto</th><th>Linea</th><th>Creato da</th><th>Azioni</th></tr></thead>
        <tbody>${assegnazioni.length===0 ? '<tr><td colspan="4" style="text-align:center;color:#9a9a8f;padding:16px;">Nessuna assegnazione.</td></tr>' :
          assegnazioni.map((a,i) => `<tr><td>${materialeLabel(a.prodotto)}</td><td>${a.linea}</td><td>${a.creatoDa||'-'}</td><td>${deleteActionCell('asg-'+i)}</td></tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;
  attachDeleteBaseListeners();
  document.querySelectorAll('.confirm-delete-yes').forEach(el => {
    el.addEventListener('click', () => withGuard(async () => {
      const idx = Number(el.dataset.key.replace('asg-', ''));
      const rec = assegnazioni[idx];
      await eliminaRecord('assegnazioni', chiaveDiRecord('assegnazioni', rec));
      assegnazioni.splice(idx, 1);
      confirmDeleteKey = null;
      setStatus('Assegnazione rimossa.');
      renderMain();
    }));
  });
  collegaF4('f-prodotto', 'Cerca prodotto finito', prodottiFiniti.map(p => ({ value: p.codice, label: materialeLabel(p.codice) })), (valore) => {
    draftAssegnazione.prodotto = valore;
    draftAssegnazione.linee = assegnazioni.filter(a => a.prodotto === valore).map(a => a.linea);
    renderScreenContent();
  });
  document.querySelectorAll('.linea-check').forEach(cb => {
    cb.addEventListener('change', () => {
      const selected = [...document.querySelectorAll('.linea-check:checked')].map(c => c.value);
      draftAssegnazione.linee = selected;
    });
  });
  document.getElementById('save-assegna').addEventListener('click', () => withGuard(async () => {
    if (!draftAssegnazione.prodotto) { setStatus('Seleziona un prodotto.', true); return; }
    assegnazioni = await loadList('assegnazioni');
    const esistenti = assegnazioni.filter(a => a.prodotto === draftAssegnazione.prodotto);
    for (const vecchia of esistenti) {
      if (!draftAssegnazione.linee.includes(vecchia.linea)) await eliminaRecord('assegnazioni', chiaveDiRecord('assegnazioni', vecchia));
    }
    for (const linea of draftAssegnazione.linee) {
      if (!esistenti.some(e => e.linea === linea)) await aggiungiRecord('assegnazioni', { prodotto: draftAssegnazione.prodotto, linea, creatoDa: currentUser, creatoIl: nowStr() });
    }
    assegnazioni = await loadList('assegnazioni');
    setStatus(`Assegnazione per ${draftAssegnazione.prodotto} aggiornata (${draftAssegnazione.linee.length} linea/e).`);
    renderMain();
  }));
}

          fornitoriMateriale.map((a,i) => `<tr><td>${materialeLabel(a.materiale)}</td><td>${fornitoreLabel(a.fornitore)}</td><td>${a.creatoDa||'-'}</td><td>${deleteActionCell('fm-'+i)}</td></tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;
  attachDeleteBaseListeners();
  document.querySelectorAll('.confirm-delete-yes').forEach(elx => {
    elx.addEventListener('click', () => withGuard(async () => {
      const idx = Number(elx.dataset.key.replace('fm-', ''));
      const rec = fornitoriMateriale[idx];
      await eliminaRecord('fornitoriMateriale', chiaveDiRecord('fornitoriMateriale', rec));
      fornitoriMateriale.splice(idx, 1);
