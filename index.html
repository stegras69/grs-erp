<body>
    <div id="app"></div>
    <div id="print-area" style="display:none;"></div>

    <script>
    // ============ STORAGE HELPERS ============
    // Backend: Google Apps Script + Google Sheet (sostituisce lo storage di Claude,
    // che richiedeva un piano a pagamento per funzionare — questo funziona per chiunque,
    // gratis, con qualunque browser, dentro o fuori claude.ai).
    //
    // >>> IMPORTANTE: incolla qui sotto l'URL del tuo Web App di Google Apps Script <<<
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxBhS2MyaZC3PKAgdKRU8yukes3woz2FZMb4etXup6S1_re8BtvKOcxKfRGceu132ZYsQ/exec';
    const STORAGE_CONFIGURATO = !APPS_SCRIPT_URL.startsWith('INSERISCI_QUI');

    let storageOk = true; // true = backend condiviso raggiungibile, false = fallback locale (solo in memoria, non condiviso)
    const _localFallback = {};
    let currentCorso = null;

    const remoteStorage = {
        async get(key) {
            // "&_=" con timestamp: impedisce al browser di servire una risposta vecchia
            // dalla cache per questo stesso indirizzo (successo con letture subito dopo una scrittura).
            const res = await fetch(APPS_SCRIPT_URL + '?action=get&key=' + encodeURIComponent(key) + '&_=' + Date.now(),
            {
                method: 'GET',
                cache: 'no-store'
            });
            // Nota: Google Apps Script a volte riporta uno stato HTTP fuorviante (es. 404) anche
            // quando il contenuto restituito è corretto — per questo NON controlliamo res.ok qui,
            // ma solo se il corpo si può leggere come JSON valido e senza campo "error".
            const data = await res.json();
            if (data.error)
                throw new Error(data.error);
            return data.found ? {
                value: data.value
            } : null;
        },
        // Legge in UN SOLO viaggio di rete tutte le chiavi che iniziano con "prefix".
        // Ritorna una mappa { chiave: valore }. Usato per caricare tutto un corso in un colpo solo.
        async getPrefix(prefix) {
            const res = await fetch(APPS_SCRIPT_URL + '?action=getPrefix&prefix=' + encodeURIComponent(prefix) + '&_=' + Date.now(),
            {
                method: 'GET',
                cache: 'no-store'
            });
            const data = await res.json();
            if (data.error)
                throw new Error(data.error);
            const mappa = {};
            for (const riga of (data.rows || []))
                mappa[riga.key] = riga.value;
            return mappa;
        },
        async set(key, value) {
            const res = await fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8'
                },
                // testo semplice = niente preflight CORS
                body: JSON.stringify({
                    action: 'set',
                    key,
                    value
                })
            });
            const data = await res.json();
            if (data.error)
                throw new Error(data.error);
        },
        async delete(key) {
            const res = await fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8'
                },
                body: JSON.stringify({
                    action: 'delete',
                    key
                })
            });
            const data = await res.json();
            if (data.error)
                throw new Error(data.error);
        },
        // Aggiunge un elemento a una lista condivisa in modo ATOMICO lato server (nessuna
        // finestra di tempo in cui due utenti possano perdere la modifica l'uno dell'altro).
        async appendIfAbsent(key, item, matchField, matchValue) {
            const res = await fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8'
                },
                body: JSON.stringify({
                    action: 'appendIfAbsent',
                    key,
                    item,
                    matchField,
                    matchValue
                })
            });
            const data = await res.json();
            if (data.error)
                throw new Error(data.error);
            return JSON.parse(data.value);
        },
        // Rimuove un elemento da una lista condivisa, anche questa in modo atomico.
        async removeMatching(key, matchField, matchValue) {
            const res = await fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8'
                },
                body: JSON.stringify({
                    action: 'removeMatching',
                    key,
                    matchField,
                    matchValue
                })
            });
            const data = await res.json();
            if (data.error)
                throw new Error(data.error);
            return JSON.parse(data.value);
        }
    };

    // ---- CACHE DI SESSIONE: evita decine di richieste separate per ogni schermata.
    // All'apertura del corso (e a ogni 🔄 aggiorna) scarichiamo TUTTE le chiavi del corso
    // in una volta sola e le teniamo qui; getRaw le legge da qui invece che dalla rete.
    let _cacheCorso = null; // null = non ancora caricata; altrimenti { chiave: valoreStringa }
    async function caricaCacheCorso() {
        if (!STORAGE_CONFIGURATO || !currentCorso) {
            _cacheCorso = {};
            return;
        }
        try {
            _cacheCorso = await remoteStorage.getPrefix('corso_' + currentCorso + '::');
            storageOk = true;
        } catch (e) {
            _diagRegistraErrore('lettura-blocco', 'corso_' + currentCorso + '::*', e);
            storageOk = false;
            _cacheCorso = {}; // in caso di errore, i singoli getRaw faranno comunque da rete/fallback
        }
    }

    // ---- DIAGNOSTICA STORAGE (per capire eventuali problemi di condivisione dati tra corsisti) ----
    let _diagScrittureOk = 0;
    let _diagScrittureFallite = 0;
    let _diagLetture = 0;
    let _diagLettureFallite = 0;
    let _diagUltimoErrore = null; // { ts, tipo, key, msg }
    const _diagLogErrori = []; // ultimi errori di QUESTA sessione (letture + scritture), max 40
    const DIAG_CHIAVE_PERSISTENTE = '__diag_log_dispositivo__';
    function _diagRegistraErrore(tipo, key, e) {
        const voce = {
            ts: Date.now(),
            tipo,
            key,
            msg: String((e && e.message) || e)
        };
        _diagUltimoErrore = voce;
        _diagLogErrori.push(voce);
        if (_diagLogErrori.length > 40)
            _diagLogErrori.shift();
        // Il log diagnostico stesso lo teniamo in localStorage (siamo fuori dagli artifact
        // Claude, quindi localStorage è di nuovo disponibile normalmente) così sopravvive
        // ai refresh senza dipendere a sua volta dal backend che magari sta fallendo.
        try {
            let log = JSON.parse(localStorage.getItem(DIAG_CHIAVE_PERSISTENTE) || '[]');
            log.push(voce);
            if (log.length > 60)
                log = log.slice(-60);
            localStorage.setItem(DIAG_CHIAVE_PERSISTENTE, JSON.stringify(log));
        } catch (e) {}
    }
    async function _diagLeggiPersistente() {
        try {
            return JSON.parse(localStorage.getItem(DIAG_CHIAVE_PERSISTENTE) || '[]');
        }
        catch (e) {
            return [];
        }
    }

    const CHIAVI_CORSO = ['materiali', 'fornitori', 'clienti', 'distinte', 'ordiniVendita', 'ordiniProduzione',
    'lineeProduzione', 'assegnazioni', 'richiesteAcquisto', 'ordiniAcquisto', 'fornitoriMateriale', 'consegne',
    'locazioni', 'movimentazioni'];

    // Campo che identifica univocamente un record di ciascun tipo (serve per applicare le "patch" di stato)
    const CAMPO_CHIAVE = {
        materiali: 'codice',
        fornitori: 'codice',
        clienti: 'codice',
        lineeProduzione: 'codice',
        locazioni: 'codice',
        distinte: 'prodotto',
        ordiniVendita: 'numero',
        ordiniProduzione: 'numero',
        richiesteAcquisto: 'numero',
        ordiniAcquisto: 'numero',
        consegne: 'numero',
        assegnazioni: (r) => r.prodotto + '::' + r.linea,
        fornitoriMateriale: (r) => r.materiale + '::' + r.fornitore,
    };
    function chiaveDiRecord(key, record) {
        const cc = CAMPO_CHIAVE[key];
        return typeof cc === 'function' ? cc(record) : record[cc];
    }

    function corsoKey(key) {
        if (key === 'preferiti' || key === 'corsiRegistrati')
            return key; // dati globali, non legati a un singolo corso
        return 'corso_' + currentCorso + '::' + key;
    }
    function nomeShard() {
        return (currentUser || 'anon').trim().toLowerCase().replace(/[^a-z0-9]+/g, '-');
    }
    function attesa(ms) {
        return new Promise(r => setTimeout(r, ms));
    }

    // ---- Sessione salvata su QUESTO dispositivo (nome + corso), solo per evitare di dover
    // reinserire il nome a ogni refresh. Usa localStorage: personale del dispositivo,
    // non passa dal backend condiviso e non tocca mai i dati del corso.
    const CHIAVE_SESSIONE_DISPOSITIVO = '__sessione_dispositivo__';
    async function _salvaSessioneDispositivo(corso, utente) {
        try {
            localStorage.setItem(CHIAVE_SESSIONE_DISPOSITIVO, JSON.stringify({
                corso,
                utente
            }));
        }
        catch (e) {}
    }
    async function _leggiSessioneDispositivo() {
        try {
            const v = localStorage.getItem(CHIAVE_SESSIONE_DISPOSITIVO);
            return v ? JSON.parse(v) : null;
        } catch (e) {
            return null;
        }
    }
    async function _cancellaSessioneDispositivo() {
        try {
            localStorage.removeItem(CHIAVE_SESSIONE_DISPOSITIVO);
        } catch (e) {}
    }

    async function getRaw(storageKey) {
        _diagLetture++;
        // Se la cache di sessione per questo corso è stata caricata, e la chiave è del tipo
        // "corso_X::...", rispondiamo da lì senza fare una richiesta di rete separata.
        if (_cacheCorso && storageKey.indexOf('corso_' + currentCorso + '::') === 0) {
            const v = _cacheCorso[storageKey];
            return v !== undefined ? JSON.parse(v) : [];
        }
        try {
            if (!STORAGE_CONFIGURATO)
                throw new Error('URL Apps Script non configurato nel codice');
            const res = await remoteStorage.get(storageKey);
            storageOk = true;
            return res ? JSON.parse(res.value) : [];
        } catch (e) {
            _diagLettureFallite++;
            _diagRegistraErrore('lettura', storageKey, e);
            storageOk = false;
            return _localFallback[storageKey] || [];
        }
    }
    async function setRaw(storageKey, arr) {
        _localFallback[storageKey] = arr;
        const MAX_TENTATIVI = 3;
        for (let tentativo = 1; tentativo <= MAX_TENTATIVI; tentativo++) {
            try {
                if (!STORAGE_CONFIGURATO)
                    throw new Error('URL Apps Script non configurato nel codice');
                await remoteStorage.set(storageKey, JSON.stringify(arr));
                storageOk = true;
                _diagScrittureOk++;
                // Aggiorniamo anche la cache di sessione, così la prossima lettura nella stessa
                // sessione vede subito il dato appena scritto senza dover richiamare la rete.
                if (_cacheCorso)
                    _cacheCorso[storageKey] = JSON.stringify(arr);
                return; // successo, esco
            } catch (e) {
                if (tentativo === MAX_TENTATIVI) {
                    // solo dopo aver esaurito i tentativi consideriamo la scrittura davvero fallita
                    storageOk = false;
                    _diagScrittureFallite++;
                    _diagRegistraErrore('scrittura', storageKey, e);
                } else {
                    // possibile blocco temporaneo (es. limite di frequenza): breve attesa e nuovo tentativo
                    await attesa(300 * tentativo + Math.random() * 200);
                }
            }
        }
    }
    async function saveSimple(key, arr) {
        if (key === 'preferiti') {
            try {
                localStorage.setItem('__preferiti_dispositivo__', JSON.stringify(arr));
            } catch (e) {}
            return;

        await setRaw(corsoKey(key), arr);

    // RECUPERO: se per questo corso esistono ancora dati nel VECCHIO formato (una lista unica condivisa,
    // da prima dell'introduzione dei cassetti personali), li importo una tantum in un cassetto dedicato
    // "recupero-dati-precedenti", così tutto quello che era visibile prima resta visibile anche ora.
    async function recuperaDatiVecchioFormatoSeNecessario() {
        const flagKey = corsoKey('__migrazione_cassetti_v1__');
        const gia = await getRaw(flagKey, true);
        if (gia && gia.fatto)
            return;
        for (const key of CHIAVI_CORSO) {
            const vecchia = await getRaw(corsoKey(key), true); // vecchia chiave "piatta", condivisa
            if (vecchia && vecchia.length > 0) {
                const chiaveCassetto = corsoKey(key) + '::u::recupero-dati-precedenti';
                const giaNelCassetto = await getRaw(chiaveCassetto, true);
                if (giaNelCassetto.length === 0)
                    await setRaw(chiaveCassetto, vecchia, true);
            }
        }
        // registro l'utente "sistema" che ha effettuato il recupero, come partecipante, altrimenti il suo cassetto non verrebbe mai letto
        const chiavePart = corsoKey('partecipanti');
        const elencoPart = await getRaw(chiavePart, true);
        if (!elencoPart.some(p => p.shard === 'recupero-dati-precedenti')) {
            elencoPart.push({
                shard: 'recupero-dati-precedenti',
                nome: '(dati recuperati dal formato precedente)',
                primoAccesso: nowStr()
            });
            await setRaw(chiavePart, elencoPart, true);
        }
        await setRaw(flagKey, {
            fatto: true,
            quando: nowStr()
        }, true);
    }

    async function registraPartecipante() {
        const mioShard = nomeShard();
        const chiave = corsoKey('partecipanti');
        // Prima un controllo veloce dalla cache locale, per evitare una chiamata di rete
        // quando siamo già registrati (caso normale, quasi sempre).
        const elencoAttuale = await getRaw(chiave);
        if (elencoAttuale.some(p => p.shard === mioShard))
            return;
        // La scrittura vera e propria è ATOMICA lato server (appendIfAbsent): nessuna finestra
        // di tempo in cui due corsisti che si registrano quasi insieme possano cancellarsi a vicenda.
        const nuovoElenco = await remoteStorage.appendIfAbsent(
        chiave, {
            shard: mioShard,
            nome: currentUser,
            primoAccesso: nowStr()
        }, 'shard', mioShard
        );
        if (_cacheCorso)
            _cacheCorso[chiave] = JSON.stringify(nuovoElenco);
    }
    async function elencoPartecipanti() {
        const elenco = await getRaw(corsoKey('partecipanti'), true);
        const shardCorrente = nomeShard();
        if (!elenco.some(p => p.shard === shardCorrente))
            elenco.push({
                shard: shardCorrente,
                nome: currentUser
            });
        if (!elenco.some(p => p.shard === '_migrazione_'))
            elenco.push({
                shard: '_migrazione_',
                nome: 'Dati precedenti'
            });
        return elenco;
    }

    // Migrazione una tantum per ogni corso: sposta i dati salvati con il vecchio formato a chiave unica
    // (da prima dell'introduzione dei cassetti personali) in un cassetto dedicato "_migrazione_", così
    // restano visibili e non vengono persi nel passaggio al nuovo modello.
    async function migraVecchioFormatoSeNecessario() {
        if (!STORAGE_CONFIGURATO)
            return;
        const flagKey = corsoKey('_migrazione_cassetti_v1_');
        try {
            const fatto = await remoteStorage.get(flagKey);
            if (fatto)
                return;
        } catch (e) {}
        for (const key of CHIAVI_CORSO) {
            try {
                const vecchi = await getRaw(corsoKey(key));
                if (Array.isArray(vecchi) && vecchi.length > 0) {
                    await setRaw(corsoKey(key) + '::u::_migrazione_', vecchi);
                }
            } catch (e) {}
        }
        try {
            await remoteStorage.set(flagKey, 'fatto');
        } catch (e) {}
    }

    // LETTURA: unisce i "cassetti" di tutti i partecipanti in un'unica lista, poi applica sopra le eventuali
    // "patch" di stato (conferme, evasioni, ecc.) e le eliminazioni — ognuna scritta da chi l'ha fatta, nel proprio cassetto.
    async function loadList(key, shared=true) {
        if (key === 'preferiti') {
            // Dato personale del dispositivo, non va condiviso tra corsisti: localStorage, non il backend.
            try {
                return JSON.parse(localStorage.getItem('__preferiti_dispositivo__') || '[]');
            }
            catch (e) {
                return [];
            }
        }
        if (!CHIAVI_CORSO.includes(key)) {
            return await getRaw(corsoKey(key), shared);
        }
        const partecipanti = await elencoPartecipanti();
        const basi = await Promise.all(partecipanti.map(p => getRaw(corsoKey(key) + '::u::' + p.shard, true)));
        let combinata = basi.flat();

        if (key === 'locazioni') {
            const codiciEsistenti = new Set(combinata.map(l => l.codice));
            LOCAZIONI_FISSE.forEach(lf => {
                if (!codiciEsistenti.has(lf.codice))
                    combinata.unshift({
                        codice: lf.codice,
                        descrizione: lf.descrizione,
                        fissa: true,
                        creatoDa: 'sistema',
                        creatoIl: ''
                    });
            });
        }

        const campoChiave = CAMPO_CHIAVE[key];
        if (campoChiave) {
            const patchLists = await Promise.all(partecipanti.map(p => getRaw(corsoKey(key) + '::patch::' + p.shard, true)));
            const tuttePatch = patchLists.flat().sort((a, b) => (a._t || 0) - (b._t || 0));
            tuttePatch.forEach(patch => {
                const bersaglio = combinata.find(r => chiaveDiRecord(key, r) === patch._target);
                if (!bersaglio)
                    return;
                if (patch._arrayField && bersaglio[patch._arrayField] && bersaglio[patch._arrayField][patch._arrayIndex]) {
                    Object.assign(bersaglio[patch._arrayField][patch._arrayIndex], patch.campi);
                } else {
                    Object.assign(bersaglio, patch.campi);
                }
            });
            combinata = combinata.filter(r => !r._eliminato);
        }
        return combinata;
    }

    // SCRITTURA (creazione): il nuovo record va SEMPRE E SOLO nel cassetto dell'utente corrente.
    async function aggiungiRecord(key, record) {
        await registraPartecipante();
        const chiaveCassetto = corsoKey(key) + '::u::' + nomeShard();
        const mio = await getRaw(chiaveCassetto, true);
        mio.push(record);
        await setRaw(chiaveCassetto, mio, true);
        return record;
    }

    // SCRITTURA (modifica di stato su un record esistente, magari creato da un altro utente): patch nel MIO cassetto.
    async function applicaPatch(key, valoreChiave, campiDaAggiornare, opzioni={}) {
        await registraPartecipante();
        const chiaveCassetto = corsoKey(key) + '::patch::' + nomeShard();
        const mie = await getRaw(chiaveCassetto, true);
        mie.push({
            _target: valoreChiave,
            _t: Date.now(),
            _da: currentUser,
            campi: campiDaAggiornare,
            _arrayField: opzioni.arrayField || null,
            _arrayIndex: opzioni.arrayIndex !== undefined ? opzioni.arrayIndex : null
        });
        await setRaw(chiaveCassetto, mie, true);
    }
    async function eliminaRecord(key, valoreChiave) {
        await applicaPatch(key, valoreChiave, {
            _eliminato: true
        });
    }

    // La giacenza NON è un numero salvato: si calcola sempre sommando i movimenti (entrate meno uscite).
    function getGiacenzaLoc(materiale, locazione) {
        let tot = 0;
        movimentazioni.forEach(m => {
            if (m.materiale !== materiale)
                return;
            if (m.locazioneA === locazione)
                tot += m.quantita;
            if (m.locazioneDa === locazione)
                tot -= m.quantita;
        });
        return tot;
    }
    function getGiacenza(codice) {
        let tot = 0;
        movimentazioni.forEach(m => {
            if (m.materiale !== codice)
                return;
            if (m.locazioneA && !m.locazioneDa)
                tot += m.quantita;
            if (m.locazioneDa && !m.locazioneA)
                tot -= m.quantita;
        });
        return tot;
    }
    async function registraMovimento({materiale, locazioneDa, locazioneA, quantita, causale}) {
        const rec = {

            locazioneDa: locazioneDa || null,
            locazioneA: locazioneA || null,
            quantita,
            causale,
            data: nowStr(),
            creatoDa: currentUser,
            creatoIl: nowStr(),
        };
        await aggiungiRecord('movimentazioni', rec);
        movimentazioni.push(rec);
        return rec;
    }

    async function scaricaBackupCorso(corso) {
        const dati = {};
        for (const k of CHIAVI_CORSO) {
            try {
                const res = await remoteStorage.get('corso_' + corso + '::' + k);
                dati[k] = res ? JSON.parse(res.value) : [];
            } catch (e) {
                dati[k] = [];
            }
        }
        const contenuto = JSON.stringify({
            corso,
            esportatoIl: nowStr(),
            dati
        }, null, 2);
        const blob = new Blob([contenuto], {
            type: 'application/json'
        });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'backup_' + corso + '_' + isoDate(new Date()) + '.json';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    }

    async function eliminaCorso(corso) {
        for (const k of CHIAVI_CORSO) {
            try {
                const res = await remoteStorage.get('corso_' + corso + '::' + k);
                if (res)
                    await remoteStorage.delete('corso_' + corso + '::' + k);
            } catch (e) {}
        }
        await rimuoviCorsoRegistrato(corso);
    }

    async function registraCorso(corso) {
        if (!STORAGE_CONFIGURATO)
            return false;
        const elencoPrima = await loadList('corsiRegistrati', true);
        if (elencoPrima.some(c => c.codice === corso))
            return false; // già esistente
        await remoteStorage.appendIfAbsent('corsiRegistrati', {
            codice: corso,
            creatoDa: 'formatore',
            creatoIl: nowStr()
        }, 'codice', corso);
        return true;
    }

    async function rimuoviCorsoRegistrato(corso) {
        if (!STORAGE_CONFIGURATO)
            return;

    // ============ TREE RENDER ============
    function buildTreeHTML(nodes, depth, openState, pathPrefix) {
        return nodes.map((node, i) => {
            const path = pathPrefix + '/' + i;
            const hasChildren = !!node.children;
            const isOpen = openState[path] !== false; // default open at depth 0/1
            const cls = 'tnode ' + (node.active ? 'clickable' : 'inactive');
            const arrow = hasChildren ? (isOpen ? '▾' : '▸') : '';
            const icon = hasChildren ? '📁' : `<span class="leaf-dot" style="background:${node.active ? '#2e5aa8' : '#d8d4c2'}"></span>`;
            const showFav = !hasChildren && node.active && node.screen;
            const isFav = showFav && preferiti.includes(node.screen);
            const favStar = showFav ? `<span class="fav-star" data-screen="${node.screen}" title="${isFav ? 'Rimuovi dai preferiti' : 'Aggiungi ai preferiti'}">${isFav ? '★' : '☆'}</span>` : '';
            let html = `<div class="${cls}" style="padding-left:${10 + depth * 16}px" data-path="${path}" data-screen="${node.screen || ''}" data-haschildren="${hasChildren}">
                  <span class="arrow-ico">${arrow}</span>${hasChildren ? '' : icon} <span class="lbl">${node.label}</span>${favStar}
                </div>`;
            if (hasChildren && isOpen) {
                html += buildTreeHTML(node.children, depth + 1, openState, path);
            }
            return html;
        }).join('');
    }

    let treeOpenState = {};
    let logoutConfirm = false;
    let preferiti = []; // array di screen code preferiti — dato privato per dispositivo, non condiviso tra corsisti

    function findNodeByScreen(nodes, screenCode) {
        for (const n of nodes) {
            if (n.screen === screenCode)
                return n;
            if (n.children) {
                const found = findNodeByScreen(n.children, screenCode);
                if (found)
                    return found;
            }
        }
        return null;
    }

    function buildFavoritesNode() {
        const figli = preferiti.map(scr => {
            const node = findNodeByScreen(MENU, scr);
            return node ? {
                label: node.label,
                active: true,
                screen: scr
            } : null;
        }).filter(Boolean);
        if (figli.length === 0) {
            figli.push({
                label: '(nessun preferito — clicca la ☆ per aggiungerne)',
                active: false
            });
        }
        return {
            label: '★ Preferiti',
            active: true,
            children: figli
        };
    }

    function attachTreeEvents() {
        document.querySelectorAll('.tnode').forEach(el => {
            el.addEventListener('click', (e) => {
                if (e.target.classList.contains('fav-star'))
                    return; // gestito da listener dedicato
                const path = el.getAttribute('data-path');
                const hasChildren = el.getAttribute('data-haschildren') === 'true';
                if (hasChildren) {
                    treeOpenState[path] = treeOpenState[path] === false ? true : false;
                    renderMain();
                } else {
                    const scr = el.getAttribute('data-screen');
                    const isActive = el.classList.contains('clickable');
                    if (scr && isActive) {
                        screen = scr;
                        statusMsg = "";
                        renderMain();
                    }
                }
            });
        });
        document.querySelectorAll('.fav-star').forEach(star => {
            star.addEventListener('click', (e) => {
                e.stopPropagation();
                const scr = star.dataset.screen;
                if (preferiti.includes(scr))
                    preferiti = preferiti.filter(s => s !== scr);
                else
                    preferiti.push(scr);
                saveSimple('preferiti', preferiti, false); // dato privato del dispositivo, non condiviso tra corsisti
                renderMain();
            });
        });
    }

    function isActiveScreenCode(code) {
        function search(nodes) {
            for (const n of nodes) {
                if (n.screen === code && n.active)
                    return true;
                if (n.children && search(n.children))
                    return true;
            }
            return false;
        }
        return search(MENU);
    }

    // ============ MF50 ============
    function demandForProduct(codice) {
        let totale = 0;
        let dataMinima = null;
        ordiniVendita.filter(o => o.stato === 'aperto').forEach(o => {
            o.righe.forEach(r => {
                if (r.prodotto === codice) {
                    totale += r.quantita;
                    if (!dataMinima || r.dataRichiesta < dataMinima)
                        dataMinima = r.dataRichiesta;
                }
            });
        });
        return {
            totale,
            dataMinima
        };
    }

    function pianificatoApertoPer(codice) {
        return ordiniProduzione.filter(o => o.prodotto === codice && o.stato === 'aperto').reduce((s, o) => s + o.quantita, 0);
    }

    // ---- Bucket settimanali (lun-dom), stile matrice SAP MF50 ----
    function mondayOf(date) {
        const d = new Date(date);
        const day = d.getDay(); // 0=dom, 1=lun...
        const diff = day === 0 ? -6 : 1 - day;
        d.setDate(d.getDate() + diff);
        d.setHours(0, 0, 0, 0);
        return d;
    }
    function isoDate(d) {
        return d.toISOString().slice(0, 10);
    }
    function fmtGG_MM(d) {
        return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0');
    }
    function weekNumber(d) {
        const target = new Date(d.getTime());
        target.setHours(0, 0, 0, 0);
        target.setDate(target.getDate() + 3 - ((target.getDay() + 6) % 7));
        const firstThursday = new Date(target.getFullYear(), 0, 4);
        const diff = target - firstThursday;
        return 1 + Math.round(diff / (7 * 24 * 60 * 60 * 1000));
    }
    function generateWeekBuckets(nGiorni=14, nSettimaneDopo=8) {
        const buckets = [];
        const oggi = new Date();
        oggi.setHours(0, 0, 0, 0);
        for (let i = 0; i < nGiorni; i++) {
            const d = new Date(oggi);
            d.setDate(d.getDate() + i);
            buckets.push({
                label: fmtGG_MM(d),
                startISO: isoDate(d),
                endISO: isoDate(d)
            });
        }
        const cursor = new Date(oggi);
        cursor.setDate(cursor.getDate() + nGiorni);
        for (let i = 0; i < nSettimaneDopo; i++) {
            const s = new Date(cursor);
            s.setDate(s.getDate() + i * 7);
            const e = new Date(s);
            e.setDate(e.getDate() + 6);
            buckets.push({
                label: `S${weekNumber(s)} (${fmtGG_MM(s)})`,
                startISO: isoDate(s),
                endISO: isoDate(e)
            });
        }
        return buckets;
    }
    function bucketIndexForDate(dateStr, buckets) {
        if (!dateStr)
            return null;
        for (let i = 0; i < buckets.length; i++) {
            if (dateStr <= buckets[i].endISO)
                return i; // include tutto ciò che è prima/durante il primo bucket, e clamp sull'ultimo sotto
        }
        return buckets.length - 1; // oltre l'orizzonte visibile: accumula sull'ultima colonna
    }

    function mf50Key(codice, linea) {
        return codice + '::' + (linea || '_');
    }

    function renderMF50(el) {
        const prodottiFiniti = materiali.filter(m => m.tipo === 'PF');
        const buckets = generateWeekBuckets(14, 8);

        const righeCalc = prodottiFiniti.map(p => {
            const {totale, dataMinima} = demandForProduct(p.codice);
            const giacenza = getGiacenza(p.codice);
            const pianificatoAperto = pianificatoApertoPer(p.codice);
            const giacenzaTeorica = giacenza + pianificatoAperto;
            const fabbisogno = Math.max(0, totale - giacenzaTeorica);
            const hasBOM = !!getBOM(p.codice);
            const linee = assegnazioni.filter(a => a.prodotto === p.codice).map(a => a.linea);
            return {
                codice: p.codice,
                descrizione: p.descrizione,
                richiesto: totale,
                dataMinima,
                giacenza,
                pianificatoAperto,
                giacenzaTeorica,
                fabbisogno,
                hasBOM,
                linee
            };
        });

        // ---- Recap per linea: produzione totale pianificata, con più codici possibili sulla stessa linea ----
        function recapPerLineaHTML() {
            const lineeChiavi = [...lineeProduzione.map(l => l.codice)];
            const haNonAssegnata = ordiniProduzione.some(o => o.stato === 'aperto' && !o.linea);
            if (haNonAssegnata)
                lineeChiavi.push('(non assegnata)');
            if (lineeChiavi.length === 0) {
                return `
                        <div style="margin:0 10px 14px 10px;">
                          <div style="background:#e5e0cc; border:1px solid #c8c2a8; padding:5px 8px; font-weight:600; font-size:11.5px;">📊 Produzione pianificata per linea</div>
                          <p style="font-size:11px;color:#9a9a8f;padding:8px;">Nessuna linea definita e nessun ordine senza linea. Crea una linea in CR01.</p>
                        </div>`;
            }

            const blocchi = lineeChiavi.map(lineaKey => {
                const ordiniLinea = ordiniProduzione.filter(o => o.stato === 'aperto' && (o.linea || '(non assegnata)') === lineaKey);
                const totalePerBucket = new Array(buckets.length).fill(0);
                const perCodice = {};
                ordiniLinea.forEach(o => {
                    const idx = bucketIndexForDate(o.dataPianificata, buckets);
                    if (idx === null)
                        return;
                    totalePerBucket[idx] += o.quantita;
                    if (!perCodice[o.prodotto])
                        perCodice[o.prodotto] = new Array(buckets.length).fill(0);
                    perCodice[o.prodotto][idx] += o.quantita;
                });
                const infoLinea = lineeProduzione.find(l => l.codice === lineaKey);
                const nomeLinea = lineaKey === '(non assegnata)' ? '(non assegnata)' : (infoLinea ? `${lineaKey} - ${infoLinea.descrizione}` : lineaKey);
                const righeCodici = Object.entries(perCodice).map(([cod, arr]) =>
                `<tr><td style="padding-left:14px; color:#3a5a8c;">↳ ${cod}</td>${arr.map(v => `<td style="text-align:center; font-size:10.5px;">${v || ''}</td>`).join('')}</tr>`
                ).join('');

                return `
                        <div style="margin:0 0 10px 0;">
                          <div class="tablewrap" style="margin:0; overflow-x:auto;">
                            <table style="min-width:${140 + buckets.length * 52}px;">
                              <thead><tr><th style="min-width:150px;">${nomeLinea}</th>${buckets.map(b => `<th style="text-align:center; min-width:48px; font-size:10px;">${b.label}</th>`).join('')}</tr></thead>
                              <tbody>
                                <tr style="background:#f4f4ee; font-weight:600;"><td>Totale linea</td>${totalePerBucket.map(v => `<td style="text-align:center;">${v || 0}</td>`).join('')}</tr>
                                ${righeCodici || '<tr><td colspan="' + (buckets.length + 1) + '" style="text-align:center;color:#9a9a8f;font-size:10.5px;padding:4px;">Nessun ordine pianificato su questa linea.</td></tr>'}
                              </tbody>
                            </table>
                          </div>
                        </div>`;
            }).join('');

            return `
                  <div style="margin:0 10px 14px 10px;">
                    <div style="background:#e5e0cc; border:1px solid #c8c2a8; padding:5px 8px; font-weight:600; font-size:11.5px;">📊 Produzione pianificata per linea (ordini aperti, per giorno/settimana)</div>
                    ${blocchi}
                  </div>`;
        }

        // ---- Matrice settimanale EDITABILE (unico punto di pianificazione) ----
        function existingPlanPerWeek(codice, linea) {
            const arr = new Array(buckets.length).fill(0);
            ordiniProduzione.filter(o => o.prodotto === codice && (o.linea || null) === (linea || null)).forEach(o => {
                const idx = bucketIndexForDate(o.dataPianificata, buckets);
                if (idx !== null)
                    arr[idx] += o.quantita;
            });
            return arr;
        }

        function matriceProdottoHTML(r) {
            if (!r.hasBOM)
                return ''; // senza BOM non si può generare nulla: non ha senso pianificare
            const richiestoWeek = new Array(buckets.length).fill(0);
            ordiniVendita.filter(o => o.stato === 'aperto').forEach(o => {
                o.righe.forEach(riga => {
                    if (riga.prodotto === r.codice) {
                        const idx = bucketIndexForDate(riga.dataRichiesta, buckets);
                        if (idx !== null)
                            richiestoWeek[idx] += riga.quantita;
                    }
                });
            });

            const lineeRiga = r.linee.length > 0 ? r.linee : [null]; // null = "non assegnata a una linea specifica"
            const baselinePerLinea = {};
            lineeRiga.forEach(l => {
                baselinePerLinea[l || '_'] = existingPlanPerWeek(r.codice, l);
            });

            function pianificatoTotWeekCorrente() {
                const tot = new Array(buckets.length).fill(0);
                lineeRiga.forEach(l => {
                    const key = l || '_';
                    for (let i = 0; i < buckets.length; i++) {
                        const cellKey = `${r.codice}::${key}::${i}`;
                        const val = mf50CellDraft[cellKey] !== undefined ? Number(mf50CellDraft[cellKey]) : baselinePerLinea[key][i];
                        tot[i] += (val || 0);
                    }
                });
                return tot;
            }

            const righeLinea = lineeRiga.map(l => {
                const key = l || '_';
                const cells = buckets.map((b, i) => {
                    const cellKey = `${r.codice}::${key}::${i}`;
                    const val = mf50CellDraft[cellKey] !== undefined ? mf50CellDraft[cellKey] : baselinePerLinea[key][i];
                    return `<td style="padding:2px;"><input type="number" min="0" class="mat-cell" data-prodotto="${r.codice}" data-linea="${l || ''}" data-week="${i}" value="${val || ''}" placeholder="0" style="width:52px; font-size:10.5px; padding:2px; border:1px solid #b9c4d6; text-align:center;"></td>`;
                }).join('');
                return `<tr><td style="padding-left:14px; color:#3a5a8c; white-space:nowrap;">↳ Pianificato ${l ? '(' + l + ')' : '(nessuna linea)'}</td>${cells}</tr>`;
            }).join('');

            const pianificatoTot = pianificatoTotWeekCorrente();
            const giacenzaProiettata = [];
            let run = r.giacenza; // parte dalla giacenza fisica; "già pianificato aperto" è incluso via le celle stesse (baseline = ODP esistenti)
            for (let i = 0; i < buckets.length; i++) {
                run = run + pianificatoTot[i] - richiestoWeek[i];
                giacenzaProiettata.push(run);
            }

            return `
                  <div style="margin:0 10px 18px 10px;" data-prodotto-block="${r.codice}">
                    <div style="background:#dfe6f0; border:1px solid #b9c4d6; padding:6px 8px; font-weight:600; font-size:11.5px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;">
                      <span>${r.codice} - ${r.descrizione}</span>
                      <span style="font-weight:400; font-size:10.5px; color:#3a4453;">Giacenza fisica: ${r.giacenza} | Già pianificato: ${r.pianificatoAperto} | Giacenza teorica: <strong>${r.giacenzaTeorica}</strong> | Fabbisogno residuo: <strong style="color:${r.fabbisogno > 0 ? '#a83232' : '#1a6b2e'}">${r.fabbisogno}</strong></span>
                    </div>
                    <div class="tablewrap" style="margin:0; overflow-x:auto;">
                      <table style="min-width:${140 + buckets.length * 60}px;">
                        <thead>
                          <tr><th style="min-width:150px;">Dato</th>${buckets.map(b => `<th style="text-align:center; min-width:56px; font-size:10px;">${b.label}</th>`).join('')}</tr>
                        </thead>
                        <tbody>
                          <tr style="background:#f4f4ee;"><td>Giacenza proiettata</td>${giacenzaProiettata.map(v => `<td class="proiezione-cell" style="text-align:center; font-weight:600; color:${v < 0 ? '#a83232' : '#1a6b2e'};">${v}</td>`).join('')}</tr>
                          <tr><td>Richiesto</td>${richiestoWeek.map(v => `<td style="text-align:center; font-size:10.5px;">${v || ''}</td>`).join('')}</tr>
                          ${righeLinea}
                        </tbody>
                      </table>
                    </div>
                    <div style="display:flex; align-items:center; gap:10px; margin-top:6px;">
                      <button class="actionbtn genera-piano" data-prodotto="${r.codice}" style="padding:5px 10px; font-size:11px;">✔ Genera ordini di produzione da questo piano</button>
                      <span class="piano-confirm" data-prodotto="${r.codice}" style="font-size:10.5px; color:#1a6b2e;"></span>
                    </div>
                  </div>`;
        }

        const matriciHTML = righeCalc.map(matriceProdottoHTML).join('');

        el.innerHTML = `
            <div class="formwrap" style="padding-bottom:0;">
              <p style="font-size:11px;color:#5a6470;margin:0 0 4px 0;">Scrivi direttamente nella matrice le quantità da produrre (giornaliero nei prossimi 14 giorni, poi settimanale), poi conferma: verranno creati gli ordini di produzione necessari. Le pianificazioni non verificano ancora la capacità della linea (gestione futura).</p>
            </div>
            <div style="flex:1; overflow:auto;">
              ${lineeProduzione.length === 0 ? '<p style="font-size:11px;color:#a83232;margin:0 10px 10px 10px;">Nessuna linea di produzione definita: crearle in CR01 per vedere il recap qui sotto.</p>' : ''}
              ${recapPerLineaHTML()}
              <div style="margin:0 10px 6px 10px; border-top:2px solid #b9c4d6; padding-top:10px;">
                <strong style="font-size:13px;">📅 Piano per prodotto — scrivi qui per pianificare</strong>
                <p style="font-size:10.5px; color:#8a8a80; margin:2px 0 10px 0;">Colonne giornaliere per i prossimi 14 giorni, poi settimanali. Ogni cella è la quantità pianificata per quel periodo su quella linea. "Giacenza proiettata" è la giacenza attesa a fine periodo se tutto va come pianificato: se scende sotto zero, la copertura non basta ancora.</p>
                ${matriciHTML || '<p style="font-size:11px;color:#9a9a8f; margin-left:10px;">Nessun prodotto con distinta base da pianificare. Crea prima una BOM in CS01.</p>'}
              </div>
            </div>
          `;

        document.querySelectorAll('.mat-cell').forEach(inp => {
            inp.addEventListener('input', e => {
                const {prodotto, linea, week} = e.target.dataset;
                const cellKey = `${prodotto}::${linea || '_'}::${week}`;
                mf50CellDraft[cellKey] = e.target.value;
                // ricalcola live SOLO la riga "Giacenza proiettata" del blocco di questo prodotto
                const blocco = document.querySelector(`[data-prodotto-block="${prodotto}"]`);
                if (!blocco)
                    return;
                const r = righeCalc.find(x => x.codice === prodotto);
                const richiestoWeek = new Array(buckets.length).fill(0);
                ordiniVendita.filter(o => o.stato === 'aperto').forEach(o => {
                    o.righe.forEach(riga => {
                        if (riga.prodotto === prodotto) {
                            const idx = bucketIndexForDate(riga.dataRichiesta, buckets);
                            if (idx !== null)
                                richiestoWeek[idx] += riga.quantita;
                        }
                    });
                });
                const lineeRiga = r.linee.length > 0 ? r.linee : [null];
                const pianificatoTot = new Array(buckets.length).fill(0);
                lineeRiga.forEach(l => {
                    const key = l || '_';
                    const baseline = existingPlanPerWeek(prodotto, l);
                    for (let i = 0; i < buckets.length; i++) {
                        const ck = `${prodotto}::${key}::${i}`;
                        const val = mf50CellDraft[ck] !== undefined ? Number(mf50CellDraft[ck]) : baseline[i];
                        pianificatoTot[i] += (val || 0);
                    }
                });
                let run = r.giacenza;
                const proiez = [];
                for (let i = 0; i < buckets.length; i++) {
                    run = run + pianificatoTot[i] - richiestoWeek[i];
                    proiez.push(run);
                }
                blocco.querySelectorAll('.proiezione-cell').forEach((td, i) => {
                    td.textContent = proiez[i];
                    td.style.color = proiez[i] < 0 ? '#a83232' : '#1a6b2e';
                });
            });
        });

        document.querySelectorAll('.genera-piano').forEach(btn => {
            btn.addEventListener('click', () => withGuard(async () => {
                const prodotto = btn.dataset.prodotto;
                const r = righeCalc.find(x => x.codice === prodotto);
                const bom = getBOM(prodotto);
                const lineeRiga = r.linee.length > 0 ? r.linee : [null];
                const creati = [];

                // Ricarico la lista più recente prima di calcolare la baseline e generare i numeri ordine,
                // per evitare che due discenti che confermano quasi in contemporanea si cancellino a vicenda.
                const opFreschi = await loadList('ordiniProduzione');
                ordiniProduzione = opFreschi;

                lineeRiga.forEach(l => {
                    const key = l || '_';
                    const baseline = existingPlanPerWeek(prodotto, l);
                    for (let i = 0; i < buckets.length; i++) {
                        const cellKey = `${prodotto}::${key}::${i}`;
                        if (mf50CellDraft[cellKey] === undefined)
                            continue;
                        const current = Number(mf50CellDraft[cellKey]) || 0;
                        const delta = current - baseline[i];
                        if (delta > 0) {
                            const rec = {
                                numero: 'OP-' + String(opFreschi.length + 1 + creati.length).padStart(4, '0'),
                                prodotto,
                                quantita: delta,
                                origine: 'MF50/MRP (piano settimanale)',
                                stato: 'aperto',
                                dataPianificata: buckets[i].startISO,
                                linea: l,
                                componenti: bom.componenti.map(c => ({
                                    codice: c.codice,
                                    qtaUnitaria: Number(c.qta),
                                    qtaTotale: Number(c.qta) * delta
                                })),
                                creatoDa: currentUser,
                                creatoIl: nowStr(),
                                confermatoDa: null,
                                confermatoIl: null,
                            };
                            creati.push(rec);
                        }
                        delete mf50CellDraft[cellKey];
                    }
                });

                if (creati.length === 0) {
                    setStatus('Nessuna nuova quantità pianificata da confermare per questo prodotto.', true);
                    return;
                }
                for (const rec of creati) {
                    await aggiungiRecord('ordiniProduzione', rec);
                    ordiniProduzione.push(rec);
                }
                const riepilogo = creati.map(c => `${c.numero}${c.linea ? ' (' + c.linea + ')' : ''}: ${c.quantita} pz il ${c.dataPianificata}`).join(' — ');
                setStatus(`Generati ${creati.length} ordine/i di produzione per ${prodotto}: ${riepilogo}`);
                renderMain();
            }));
        });
    }

    // ============ CR01 (Linee di produzione) ============
    function renderCR01(el) {
        el.innerHTML = `
            <div class="actionrow"><button class="actionbtn" id="save-cr01">✔ Salva linea di produzione</button></div>
            <div class="formwrap">
              <div class="formgrid">
                <label>Codice linea</label><input id="f-codice" value="${draftLinea.codice}" placeholder="es. LINEA-1">
                <label>Descrizione</label><input id="f-desc" value="${draftLinea.descrizione}" placeholder="es. Linea assemblaggio A">
              </div>
            </div>
            <div class="tablewrap">
              <table>
                <thead><tr><th>Codice</th><th>Descrizione</th><th>Creato da</th><th>Azioni</th></tr></thead>
                <tbody>${lineeProduzione.length === 0 ? '<tr><td colspan="4" style="text-align:center;color:#9a9a8f;padding:16px;">Nessuna linea definita.</td></tr>' : lineeProduzione.map(l => `<tr><td>${l.codice}</td><td>${l.descrizione}</td><td>${l.creatoDa}</td><td>${deleteActionCell('lin-' + l.codice)}</td></tr>`).join('')}
                </tbody>
              </table>
              <p style="font-size:10px; color:#8a8a80; padding:6px 8px;">Eliminando una linea vengono rimosse anche le assegnazioni prodotto→linea collegate.</p>
            </div>
          `;
        attachDeleteBaseListeners();
        document.querySelectorAll('.confirm-delete-yes').forEach(el => {
            el.addEventListener('click', () => withGuard(async () => {
                const codice = el.dataset.key.replace('lin-', '');
                const daRimuovere = assegnazioni.filter(a => a.linea === codice);
                await eliminaRecord('lineeProduzione', codice);
                for (const a of daRimuovere) {
                    await eliminaRecord('assegnazioni', chiaveDiRecord('assegnazioni', a));
                }
                lineeProduzione = lineeProduzione.filter(l => l.codice !== codice);
                assegnazioni = assegnazioni.filter(a => a.linea !== codice);
                confirmDeleteKey = null;
                setStatus(`Linea ${codice} eliminata (${daRimuovere.length} assegnazioni collegate rimosse).`);
                renderMain();
            }));
        });
        document.getElementById('f-codice').addEventListener('input', e => draftLinea.codice = e.target.value);
        document.getElementById('f-desc').addEventListener('input', e => draftLinea.descrizione = e.target.value);
        document.getElementById('save-cr01').addEventListener('click', () => withGuard(async () => {
            if (!draftLinea.codice.trim() || !draftLinea.descrizione.trim()) {
                setStatus('Codice e descrizione sono obbligatori.', true);
                return;
            }
            const codice = draftLinea.codice.trim().toUpperCase();
            lineeProduzione = await loadList('lineeProduzione');
            if (lineeProduzione.some(l => l.codice === codice)) {
                setStatus('Codice linea già esistente.', true);
                return;
            }
            const rec = {
                codice,
                descrizione: draftLinea.descrizione.trim(),
                creatoDa: currentUser,
                creatoIl: nowStr()
            };
            await aggiungiRecord('lineeProduzione', rec);
            lineeProduzione.push(rec);
            draftLinea = {
                codice: "",
                descrizione: ""
            };
            setStatus(`Linea ${rec.codice} creata con successo.`);
            renderMain();
        }));
    }

    // ============ Assegnazione prodotto -> linea ============
    function renderAssegnazione(el) {
        const prodottiFiniti = materiali.filter(m => m.tipo === 'PF');
        const linSelezionate = draftAssegnazione.linee;

        el.innerHTML = `
            <div class="formwrap" style="padding-bottom:0;">
              <p style="font-size:11px;color:#5a6470;margin:0 0 8px 0;">Versione semplificata: in SAP reale questo collegamento fa parte della <strong>Versione di Produzione</strong> (C223), che lega materiale, distinta base e centro di lavoro/ciclo per determinare il processo produttivo da usare.</p>
            </div>
            <div class="actionrow"><button class="actionbtn" id="save-assegna">✔ Salva assegnazione</button></div>
            <div class="formwrap">
              <div class="formgrid">
                <label>Prodotto finito</label>
                <select id="f-prodotto">
                  <option value="">-- seleziona --</option>
                  ${prodottiFiniti.map(p => `<option value="${p.codice}" ${draftAssegnazione.prodotto === p.codice ? 'selected' : ''}>${p.codice} - ${p.descrizione}</option>`).join('')}
                </select>
              </div>
              ${lineeProduzione.length === 0 ? '<p style="font-size:11px;color:#a83232;margin-top:8px;">Nessuna linea di produzione definita: crearle prima in CR01.</p>' :
        `<div style="margin-top:10px;">
                  <span style="font-size:11.5px; display:block; margin-bottom:6px;">Linee assegnate (selezionabili più di una):</span>
                  ${lineeProduzione.map(l => `
                    <label style="display:inline-flex; align-items:center; gap:4px; margin-right:16px; font-size:11.5px; font-weight:400; text-align:left;">
                      <input type="checkbox" class="linea-check" value="${l.codice}" ${linSelezionate.includes(l.codice) ? 'checked' : ''}>
                      ${l.codice} - ${l.descrizione}
                    </label>
                  `).join('')}
                </div>`}
            </div>
            <div class="tablewrap">
              <table>
                <thead><tr><th>Prodotto</th><th>Linea</th><th>Creato da</th><th>Azioni</th></tr></thead>
                <tbody>${assegnazioni.length === 0 ? '<tr><td colspan="4" style="text-align:center;color:#9a9a8f;padding:16px;">Nessuna assegnazione.</td></tr>' : assegnazioni.map((a, i) => `<tr><td>${a.prodotto}</td><td>${a.linea}</td><td>${a.creatoDa || '-'}</td><td>${deleteActionCell('asg-' + i)}</td></tr>`).join('')}
                </tbody>
              </table>
            </div>
          `;

    // ============ MD01 (MRP - vista fabbisogno materiali) ============
    function richiestoApertoPer(codice) {
        return richiesteAcquisto.filter(r => r.materiale === codice && r.stato === 'aperta').reduce((s, r) => s + r.quantita, 0);
    }
    function ordinatoApertoPer(codice) {
        let tot = 0;
        ordiniAcquisto.forEach(o => {
            o.righe.forEach(r => {
                if (r.materiale === codice && !r.ricevuto)
                    tot += r.quantita;
            });
        });
        return tot;
    }

    function renderMD01(el) {
        const materiePrime = materiali.filter(m => m.tipo === 'MP');
        const buckets = generateWeekBuckets(14, 8);
        const aperti = ordiniProduzione.filter(o => o.stato === 'aperto');

        function calcolaBucketMateriale(mp) {
            const lordo = new Array(buckets.length).fill(0);
            aperti.forEach(op => {
                const comp = op.componenti.find(c => c.codice === mp.codice);
                if (!comp)
                    return;
                const idx = bucketIndexForDate(op.dataPianificata, buckets);
                if (idx !== null)
                    lordo[idx] += comp.qtaTotale;
            });
            const giaRichiesto = new Array(buckets.length).fill(0);
            richiesteAcquisto.filter(r => r.materiale === mp.codice && r.stato === 'aperta').forEach(r => {
                const idx = bucketIndexForDate(r.dataRichiesta, buckets);
                if (idx !== null)
                    giaRichiesto[idx] += r.quantita;
            });
            const giaOrdinato = new Array(buckets.length).fill(0);
            ordiniAcquisto.forEach(o => {
                o.righe.forEach(r => {
                    if (r.materiale === mp.codice && !r.ricevuto) {
                        const idx = bucketIndexForDate(r.dataConsegna, buckets);
                        if (idx !== null)
                            giaOrdinato[idx] += r.quantita;
                    }
                });
            });
            return {
                lordo,
                giaRichiesto,
                giaOrdinato
            };
        }

        const materialiConFabbisogno = materiePrime.map(mp => {
            const dati = calcolaBucketMateriale(mp);
            const fabbisognoLordoTot = dati.lordo.reduce((s, v) => s + v, 0);
            return {
                mp,
                dati,
                fabbisognoLordoTot
            };
        }).filter(x => x.fabbisognoLordoTot > 0);

        function draftValRichiesta(codice, i) {
            const key = `${codice}::${i}`;
            return mdCellDraft[key] !== undefined ? mdCellDraft[key] : '';
        }

        function blocchiHTML() {
            return materialiConFabbisogno.map(({mp, dati}) => {
                // giacenza proiettata cumulativa: fisica + già richiesto + già ordinato + bozza corrente - fabbisogno lordo, periodo per periodo
                const proiezione = [];
                let run = getGiacenza(mp.codice);
                for (let i = 0; i < buckets.length; i++) {
                    const bozza = Number(draftValRichiesta(mp.codice, i)) || 0;
                    run = run + dati.giaRichiesto[i] + dati.giaOrdinato[i] + bozza - dati.lordo[i];
                    proiezione.push(run);
                }
                const cellsRichiedi = buckets.map((b, i) => `
                        <td style="padding:2px;"><input type="number" min="0" class="md01-cell" data-materiale="${mp.codice}" data-week="${i}" value="${draftValRichiesta(mp.codice, i)}" placeholder="0" style="width:48px; font-size:10.5px; padding:2px; border:1px solid #b9c4d6; text-align:center;"></td>
                      `).join('');

                return `
                        <div style="margin:0 10px 16px 10px;" data-materiale-block="${mp.codice}">
                          <div style="background:#dfe6f0; border:1px solid #b9c4d6; padding:6px 8px; font-weight:600; font-size:11.5px;">
                            ${mp.codice} - ${mp.descrizione} <span style="font-weight:400; font-size:10.5px; color:#3a4453;">| Giacenza fisica: ${getGiacenza(mp.codice)}</span>
                          </div>
                          <div class="tablewrap" style="margin:0; overflow-x:auto;">
                            <table style="min-width:${140 + buckets.length * 52}px;">
                              <thead><tr><th style="min-width:150px;">Dato</th>${buckets.map(b => `<th style="text-align:center; min-width:48px; font-size:10px;">${b.label}</th>`).join('')}</tr></thead>
                              <tbody>
                                <tr style="background:#f4f4ee;"><td>Giacenza proiettata</td>${proiezione.map(v => `<td class="proiezione-md01-cell" style="text-align:center; font-weight:600; color:${v < 0 ? '#a83232' : '#1a6b2e'};">${v}</td>`).join('')}</tr>
                                <tr><td>Fabbisogno lordo (ODP)</td>${dati.lordo.map(v => `<td style="text-align:center; font-size:10.5px;">${v || ''}</td>`).join('')}</tr>
                                <tr><td style="color:#3a5a8c;">Già richiesto (RA)</td>${dati.giaRichiesto.map(v => `<td style="text-align:center; font-size:10.5px; color:#3a5a8c;">${v || ''}</td>`).join('')}</tr>
                                <tr><td style="color:#3a5a8c;">Già ordinato (OA)</td>${dati.giaOrdinato.map(v => `<td style="text-align:center; font-size:10.5px; color:#3a5a8c;">${v || ''}</td>`).join('')}</tr>
                                <tr><td style="padding-left:14px;">↳ Da richiedere ora</td>${cellsRichiedi}</tr>
                              </tbody>
                            </table>
                          </div>
                          <div style="display:flex; align-items:center; gap:10px; margin-top:6px;">
                            <button class="actionbtn genera-ra-piano" data-materiale="${mp.codice}" style="padding:5px 10px; font-size:11px;">✔ Genera richieste d'acquisto da questo piano</button>
                          </div>
                        </div>`;
            }).join('');
        }

        el.innerHTML = `
            <div class="formwrap" style="padding-bottom:0;">
              <p style="font-size:11px;color:#5a6470;margin:0 0 4px 0;">Fabbisogno di materie prime per periodo (giornaliero nei prossimi 14 giorni, poi settimanale), al netto di giacenza, richieste d'acquisto e ordini d'acquisto già aperti. Scrivi la quantità da richiedere nel periodo giusto, poi conferma.</p>
            </div>
            <div style="flex:1; overflow:auto;">
              ${materialiConFabbisogno.length === 0 ? '<p style="font-size:11px;color:#9a9a8f;margin:0 10px 10px 10px;">Nessun fabbisogno da ordini di produzione aperti al momento.</p>' : blocchiHTML()}
            </div>
          `;

        document.querySelectorAll('.md01-cell').forEach(inp => {
            inp.addEventListener('input', e => {
                const {materiale, week} = e.target.dataset;
                mdCellDraft[`${materiale}::${week}`] = e.target.value;
                // ricalcola live SOLO la riga "Giacenza proiettata" del blocco di questo materiale
                const blocco = document.querySelector(`[data-materiale-block="${materiale}"]`);
                if (!blocco)
                    return;
                const item = materialiConFabbisogno.find(x => x.mp.codice === materiale);
                let run = getGiacenza(item.mp.codice);
                const proiez = [];
                for (let i = 0; i < buckets.length; i++) {
                    const bozza = Number(draftValRichiesta(materiale, i)) || 0;
                    run = run + item.dati.giaRichiesto[i] + item.dati.giaOrdinato[i] + bozza - item.dati.lordo[i];
                    proiez.push(run);
                }
                blocco.querySelectorAll('.proiezione-md01-cell').forEach((td, i) => {
                    td.textContent = proiez[i];
                    td.style.color = proiez[i] < 0 ? '#a83232' : '#1a6b2e';
                });
            });
        });

        document.querySelectorAll('.genera-ra-piano').forEach(btn => {
            btn.addEventListener('click', () => withGuard(async () => {
                const materiale = btn.dataset.materiale;
                richiesteAcquisto = await loadList('richiesteAcquisto');
                const creati = [];
                for (let i = 0; i < buckets.length; i++) {
                    const key = `${materiale}::${i}`;
                    const qta = Number(mdCellDraft[key]) || 0;
                    if (qta > 0) {
                        const rec = {
                            numero: 'RA-' + String(richiesteAcquisto.length + 1 + creati.length).padStart(4, '0'),
                            materiale,
                            quantita: qta,
                            dataRichiesta: buckets[i].startISO,
                            stato: 'aperta',
                            origine: 'MD01/MRP',
                            creatoDa: currentUser,
                            creatoIl: nowStr(),
                        };
                        creati.push(rec);
                    }
                    delete mdCellDraft[key];
                }
                if (creati.length === 0) {
                    setStatus('Nessuna quantità inserita da confermare per questo materiale.', true);
                    return;
                }
                for (const rec of creati) {
                    await aggiungiRecord('richiesteAcquisto', rec);
                    richiesteAcquisto.push(rec);
                }
                const riepilogo = creati.map(c => `${c.numero}: ${c.quantita} il ${c.dataRichiesta}`).join(' — ');
                setStatus(`Generate ${creati.length} richiesta/e d'acquisto per ${materiale}: ${riepilogo}`);
                renderMain();
            }));
        });
    }

    function renderCO15(el) {

        el.innerHTML = `

              <p style="font-size:11px;color:#5a6470;margin:0 0 8px 0;">Conferma un ordine di produzione: scarica i componenti <strong>dall'ubicazione OFFICINA</strong> e carica il prodotto finito in OFFICINA. Se il materiale non è ancora stato spostato in officina, l'evasione viene bloccata.</p>

              <table>
                <thead><tr><th>N. ordine</th><th>Prodotto</th><th>Quantità</th><th>Componenti richiesti (disponibilità in OFFICINA)</th><th>Azione</th></tr></thead>
                <tbody>
                  ${aperti.length === 0 ? '<tr><td colspan="5" style="text-align:center;color:#9a9a8f;padding:16px;">Nessun ordine di produzione aperto da evadere.</td></tr>' : aperti.map(o => `

                </tbody>
              </table>

          `;
        document.querySelectorAll('.conferma-op').forEach(btn => {
            btn.addEventListener('click', () => withGuard(async () => {
                const numero = btn.dataset.numero;
                const op = ordiniProduzione.find(o => o.numero === numero);
                if (!op)
                    return;
                const mancanti = op.componenti.filter(c => getGiacenzaLoc(c.codice, 'OFFICINA') < c.qtaTotale);
                if (mancanti.length > 0) {
                    setStatus(`Evasione bloccata: materiale insufficiente in OFFICINA per ${mancanti.map(m => m.codice).join(', ')}. Sposta il materiale da magazzino a officina.`, true);
                    return;
                }
                for (const c of op.componenti) {
                    await registraMovimento({
                        materiale: c.codice,
                        locazioneDa: 'OFFICINA',
                        locazioneA: null,
                        quantita: c.qtaTotale,
                        causale: 'Consumo produzione CO15 (' + numero + ')'
                    });
                }
                await registraMovimento({
                    materiale: op.prodotto,
                    locazioneDa: null,
                    locazioneA: 'OFFICINA',
                    quantita: op.quantita,
                    causale: 'Produzione PF CO15 (' + numero + ')'
                });
                op.stato = 'confermato';
                op.confermatoDa = currentUser;
                op.confermatoIl = nowStr();

            }));

    // ============ MMBE (vista giacenze) ============
    function esportaCSV(nomeFile, intestazioni, righe) {
        const righeCSV = [intestazioni.join(';')];
        righe.forEach(riga => {
            righeCSV.push(riga.map(campo => '"' + String(campo).replace(/"/g, '""') + '"').join(';'));
        });
        const contenuto = "\uFEFF" + righeCSV.join('\r\n'); // BOM per far riconoscere accenti/UTF-8 a Excel
        const blob = new Blob([contenuto], {
            type: 'text/csv;charset=utf-8;'
        });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = nomeFile;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    }

            return {
                ...m,
                perLocazione,

                inArrivo,

                ${ordineSel.riferimentoCliente ? `<p style="font-size:11px; margin-top:8px;"><strong>Riferimento cliente:</strong> ${ordineSel.riferimentoCliente}</p>` : '<p style="font-size:10.5px; color:#a83232; margin-top:8px;">Nessun riferimento cliente su questo ordine.</p>'}

                  ${ordineSel.righe.map((r, i) => {const residuo = r.quantita - (r.consegnato || 0);if (residuo <= 0)return '';const giacenzaDisp = getGiacenzaLoc(r.prodotto, 'SPEDIZIONE');const key = i;if (draftVL.righe[key] === undefined)draftVL.righe[key] = residuo <= giacenzaDisp ? residuo : giacenzaDisp;return `

                <tbody>${consegne.length === 0 ? '<tr><td colspan="7" style="text-align:center;color:#9a9a8f;padding:16px;">Nessuna consegna effettuata.</td></tr>' : consegne.map(c => `<tr><td>${c.numero}</td><td>${c.ordineVendita}</td><td>${c.riferimentoCliente || '-'}</td><td>${c.cliente}</td><td style="font-size:10.5px;">${c.righe.map(r => materialeLabel(r.prodotto) + ' x' + r.quantita).join(', ')}</td><td>${c.creatoDa}</td><td><span class="print-btn stampa-ddt" data-numero="${c.numero}">🖶 stampa</span></td></tr>`).join('')}

            });
        });

            draftVL.righe = {};
            renderScreenContent();
        });
        document.querySelectorAll('.vl-qta').forEach(inp => {
            inp.addEventListener('input', e => {
                draftVL.righe[e.target.dataset.riga] = e.target.value;
            });
        });
        document.querySelectorAll('.stampa-ddt').forEach(elx => {
            elx.addEventListener('click', () => stampaDDT(elx.dataset.numero));
        });

            if (!draftVL.ordineVendita) {
                setStatus('Seleziona un ordine di vendita.', true);
                return;
            }
            const ordine = ordiniVendita.find(o => o.numero === draftVL.ordineVendita);
            if (!ordine) {
                setStatus('Ordine non trovato.', true);
                return;
            }

            const righeDaConsegnare = [];
            for (const [idxStr, val] of Object.entries(draftVL.righe)) {
                const idx = Number(idxStr);
                const qta = Number(val) || 0;
                if (qta <= 0)
                    continue;
                const riga = ordine.righe[idx];
                const residuo = riga.quantita - (riga.consegnato || 0);
                if (qta > residuo) {
                    setStatus(`Quantità per ${riga.prodotto} superiore al residuo ordinato.`, true);
                    return;
                }
                const dispSpedizione = getGiacenzaLoc(riga.prodotto, 'SPEDIZIONE');
                if (qta > dispSpedizione) {
                    setStatus(`Merce insufficiente in SPEDIZIONE per ${riga.prodotto}: disponibili ${dispSpedizione}.`, true);
                    return;
                }
                righeDaConsegnare.push({
                    idx,
                    prodotto: riga.prodotto,
                    quantita: qta
                });
            }
            if (righeDaConsegnare.length === 0) {
                setStatus('Inserisci almeno una quantità da consegnare.', true);
                return;
            }

            for (const rc of righeDaConsegnare) {
                ordine.righe[rc.idx].consegnato = (ordine.righe[rc.idx].consegnato || 0) + rc.quantita;
                await registraMovimento({
                    materiale: rc.prodotto,
                    locazioneDa: 'SPEDIZIONE',
                    locazioneA: null,
                    quantita: rc.quantita,
                    causale: 'Spedizione DDT VL01N (' + ordine.numero + ')'
                });
                await applicaPatch('ordiniVendita', ordine.numero, {
                    consegnato: ordine.righe[rc.idx].consegnato
                }, {
                    arrayField: 'righe',
                    arrayIndex: rc.idx
                });
            }
            if (ordine.righe.every(r => (r.consegnato || 0) >= r.quantita)) {
                ordine.stato = 'evaso';
                await applicaPatch('ordiniVendita', ordine.numero, {
                    stato: 'evaso'
                });
            }

            const ddt = {
                numero: nextDDTNumber(),
                ordineVendita: ordine.numero,
                cliente: ordine.cliente,
                riferimentoCliente: ordine.riferimentoCliente || '',
                righe: righeDaConsegnare.map(rc => ({
                    prodotto: rc.prodotto,
                    quantita: rc.quantita
                })),
                creatoDa: currentUser,
                creatoIl: nowStr(),
            };
            await aggiungiRecord('consegne', ddt);
            consegne.push(ddt);
            draftVL = {
                ordineVendita: "",
                righe: {}
            };
            setStatus(`Consegna registrata: DDT ${ddt.numero} generato per l'ordine ${ordine.numero}.`);
            renderMain();
        }));
    }

    function renderCruscotto(el) {

            o.righe.forEach(r => {
                if (r.dataRichiesta && r.dataRichiesta < oggiISO && (r.quantita - (r.consegnato || 0)) > 0)
                    righeVenditaRitardo++;
            });
        });

        const materialiCritici = materiali.filter(m => {
            const inArrivoAcq = ordinatoApertoPer(m.codice);
            const inArrivoProd = m.tipo === 'PF' ? pianificatoApertoPer(m.codice) : 0;
            return (getGiacenza(m.codice) + inArrivoAcq + inArrivoProd) < 0;
        }).length;

        const odpAperti = ordiniProduzione.filter(o => o.stato === 'aperto').length;

        let righeAcquistoRitardo = 0;
        ordiniAcquisto.forEach(o => o.righe.forEach(r => {
            if (!r.ricevuto && r.dataConsegna && r.dataConsegna < oggiISO)
                righeAcquistoRitardo++;
        }));

        const kpis = [
        {
            label: "Righe ordine vendita in ritardo",
            valore: righeVenditaRitardo,
            screen: 'VL01N'
        },
        {
            label: "Materiali con copertura critica",

            screen: 'MMBE'
        },
        {
            label: "Ordini di produzione aperti da evadere",
            valore: odpAperti,
            screen: 'CO15'
        },
        {
            label: "Righe d'ordine fornitore in ritardo",
            valore: righeAcquistoRitardo,
            screen: 'MIGO'
        },
        ];

        function coloreKpi(v) {
            return v === 0 ? 'verde' : (v <= 2 ? 'giallo' : 'rosso');
        }

        el.innerHTML = `
            <div style="padding:16px; overflow-y:auto; width:100%;">
              <h3 style="margin:0 0 4px 0; font-size:13px;">Cruscotto — Corso ${currentCorso}</h3>
              <p style="font-size:11px; color:#5a6470; margin:0 0 14px 0;">Semaforo riassuntivo della situazione attuale. Clicca una scheda per andare direttamente alla transazione. Seleziona una voce dal menu a sinistra per operare (es. MM01, XK01, XD01, CS01).</p>
              <div style="display:grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap:10px; max-width:800px;">
                ${kpis.map(k => `
                  <div class="kpi-card" data-screen="${k.screen}" style="cursor:pointer; border:1px solid #c8c2a8; background:white; padding:12px 14px; display:flex; align-items:center; gap:12px;">
                    <span class="semaforo semaforo-${coloreKpi(k.valore)}" style="width:16px; height:16px; margin:0;"></span>
                    <div>
                      <div style="font-size:22px; font-weight:700; line-height:1;">${k.valore}</div>
                      <div style="font-size:10.5px; color:#5a6470; margin-top:2px;">${k.label}</div>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          `;
