    draftPR = { materiale:"", quantita:"1", dataRichiesta:"" };
    setStatus(`Richiesta d'acquisto ${rec.numero} creata con successo.`);
    renderMain();
  }));
}

// ============ ME21N (converte richieste aperte in ordine d'acquisto) ============
function renderME21N(el) {
  const aperte = richiesteAcquisto.filter(r => r.stato === 'aperta');
  aperte.forEach(r => {
    if (!draftPO.selezionate[r.numero]) draftPO.selezionate[r.numero] = { checked: false, prezzo: '', dataConsegna: r.dataRichiesta };
  });

  function fornitoriAbitualiDi(materiale) {
    return fornitoriMateriale.filter(a => a.materiale === materiale).map(a => a.fornitore);
  }
  // Quante unità di questo materiale sono già in un ordine d'acquisto aperto (non ancora ricevuto)?
  // Serve a evitare doppi ordini involontari per lo stesso materiale da richieste diverse.
  function quantitaGiaOrdinata(materiale) {
    let tot = 0;
    ordiniAcquisto.forEach(o => o.righe.forEach(r => { if (r.materiale === materiale && !r._rimossa && !rigaCompleta(r)) tot += (Number(r.quantita) - rigaQtaRicevuta(r)); }));
    return tot;
  }

  function rigaPRHTML(r) {
    const abituali = fornitoriAbitualiDi(r.materiale);
    const giaOrdinata = quantitaGiaOrdinata(r.materiale);
    return `
      <div style="display:flex; align-items:center; gap:8px; margin-bottom:6px; padding:4px; border:1px solid #e0ddce; flex-wrap:wrap;">
        <input type="checkbox" class="pr-check" data-numero="${r.numero}" ${draftPO.selezionate[r.numero].checked?'checked':''}>
        <span style="font-size:11px; width:220px;">${r.numero} — ${materialeLabel(r.materiale)} x ${r.quantita} (necessità ${r.dataRichiesta})</span>
        <label style="font-size:10.5px; color:#5a6470;">Prezzo unit.</label>
        <input type="number" min="0" step="0.01" class="pr-prezzo" data-numero="${r.numero}" value="${draftPO.selezionate[r.numero].prezzo}" placeholder="€" style="width:70px; font-size:11px; padding:2px; border:1px solid #7f9db9;">
        <label style="font-size:10.5px; color:#5a6470;">Data consegna</label>
        <input type="date" class="pr-consegna" data-numero="${r.numero}" value="${draftPO.selezionate[r.numero].dataConsegna}" style="font-size:11px; padding:2px; border:1px solid #7f9db9;">
        ${abituali.length>0 ? `<span style="font-size:10px; color:#8a8a80;">(fornitori abituali: ${abituali.join(', ')})</span>` : ''}
        ${giaOrdinata>0 ? `<span style="font-size:10px; color:#a86a1a; font-weight:bold;">⚠ già ${giaOrdinata} in ordine aperto</span>` : `<span style="font-size:10px; color:#1a6b2e;">nessun ordine aperto su questo materiale</span>`}
      </div>`;
  }

  let listaHTML;
  if (aperte.length === 0) {
    listaHTML = '<p style="font-size:11px;color:#9a9a8f;">Nessuna richiesta d\'acquisto aperta. Generane una da MD01 o ME51N.</p>';
  } else if (!draftPO.fornitore) {
    listaHTML = `<p style="font-size:11px;color:#9a9a8f;margin-bottom:8px;">Seleziona un fornitore per vedere quali richieste gli competono.</p>` + aperte.map(rigaPRHTML).join('');
  } else {
    const compatibili = aperte.filter(r => { const ab = fornitoriAbitualiDi(r.materiale); return ab.length === 0 || ab.includes(draftPO.fornitore); });
    const nonCompatibili = aperte.filter(r => { const ab = fornitoriAbitualiDi(r.materiale); return ab.length > 0 && !ab.includes(draftPO.fornitore); });
    listaHTML = `
      <div style="margin-bottom:10px;">
        <strong style="font-size:11px; color:#1a6b2e;">✔ Richieste compatibili con questo fornitore</strong>
        <div style="margin-top:4px;">${compatibili.length===0 ? '<p style="font-size:10.5px;color:#9a9a8f;">Nessuna.</p>' : compatibili.map(rigaPRHTML).join('')}</div>
      </div>
      ${nonCompatibili.length > 0 ? `
      <div>
        <strong style="font-size:11px; color:#a83232;">⚠️ Altre richieste (materiale associato ad altri fornitori)</strong>
        <div style="margin-top:4px; opacity:0.75;">${nonCompatibili.map(rigaPRHTML).join('')}</div>
      </div>` : ''}
    `;
  }

  const tabsME21N = [
    { key: 'testata', label: '① Dati testata' },
    { key: 'posizioni', label: '② Posizioni' },
  ];
  el.innerHTML = `
    <div class="actionrow"><button class="actionbtn" id="save-po">✔ Crea ordine d'acquisto</button></div>
    <div class="formwrap" style="padding-bottom:0;">
      ${renderSapTabsHTML(tabsME21N, me21nTabAttivo)}
    </div>
    ${me21nTabAttivo === 'testata' ? `
    <div class="formwrap">
      <div class="formgrid">
        <label>Fornitore</label>
        ${campoF4HTML('f-fornitore', draftPO.fornitore ? fornitoreLabel(draftPO.fornitore) : '', '-- cerca fornitore (F4) --')}
      </div>
      ${fornitori.length===0 ? '<p style="font-size:11px;color:#a83232;margin-top:8px;">Nessun fornitore in anagrafica: crealo prima in XK01.</p>' : ''}
      <p style="font-size:10.5px; color:#8a8a80; margin-top:8px;">Scegli il fornitore, poi passa alla scheda "② Posizioni" per selezionare le richieste d'acquisto da includere.</p>
    </div>
    ` : `
    <div class="formwrap" style="padding-top:0;">
      <p style="font-size:11px;color:#5a6470;margin:0 0 8px 0;">Seleziona una o più richieste d'acquisto aperte da includere in questo ordine (diventerà un ordine multi-riga):</p>
      ${listaHTML}
    </div>
    `}
    <div class="tablewrap">
      <table>
        <thead><tr><th>N. ordine</th><th>Fornitore</th><th>Materiale</th><th>Quantità</th><th>Prezzo unit.</th><th>Data consegna</th><th>Stato</th><th>Creato da</th><th>Stampa</th><th>Azioni</th></tr></thead>
        <tbody>${ordiniAcquisto.filter(o => o.righe.some(r => !r._rimossa)).length===0 ? '<tr><td colspan="10" style="text-align:center;color:#9a9a8f;padding:16px;">Nessun ordine d\'acquisto.</td></tr>' :
          ordiniAcquisto.filter(o => o.righe.some(r => !r._rimossa)).flatMap(o => {
            const righeAttive = o.righe.map((r,i) => ({ r, i })).filter(x => !x.r._rimossa);
            return righeAttive.map(({ r, i }, pos) => {
              const stato = rigaCompleta(r) ? 'ricevuto' : (rigaHaRicezioni(r) ? `parziale (${rigaQtaRicevuta(r)}/${r.quantita})` : 'aperto');
              const azione = rigaHaRicezioni(r) ? deleteActionCell('oariga::'+o.numero+'::'+i, 'già ricevuta, non annullabile') : deleteActionCell('oariga::'+o.numero+'::'+i);
              return `<tr><td>${o.numero}</td><td>${fornitoreLabel(o.fornitore)}</td><td>${materialeLabel(r.materiale)}</td><td>${r.quantita}</td><td>${r.prezzoUnitario}</td><td>${r.dataConsegna}</td><td>${semaforoStatoOrdine(rigaCompleta(r)?'ricevuto':(rigaHaRicezioni(r)?'parziale':'aperto'))} ${rigaHaRicezioni(r)&&!rigaCompleta(r)?`<span style="font-size:9.5px;color:#a86a1a;">${stato}</span>`:''}</td><td>${o.creatoDa}</td><td>${pos===0 ? `<span class="print-btn stampa-oa" data-numero="${o.numero}">🖶 stampa</span>` : ''}</td><td>${azione}</td></tr>`;
            });
          }).join('')}
        </tbody>
      </table>
      <p style="font-size:10px; color:#8a8a80; padding:6px 8px;">Annullando una riga d'ordine, la richiesta d'acquisto (RA) che l'aveva generata torna disponibile per essere riordinata o eliminata. Una riga già ricevuta (anche solo in parte, da MIGO) non può essere annullata; le altre righe dello stesso ordine restano annullabili singolarmente. Se annulli l'ultima riga attiva, l'intero ordine viene rimosso.</p>
    </div>
  `;
  attachSapTabsListeners(tab => { me21nTabAttivo = tab; renderScreenContent(); });
  collegaF4('f-fornitore', 'Cerca fornitore', fornitori.map(f => ({ value: f.codice, label: fornitoreLabel(f.codice) })), (valore) => {
    draftPO.fornitore = valore;
    renderScreenContent();
  });
  document.querySelectorAll('.stampa-oa').forEach(el => {
    el.addEventListener('click', () => stampaOrdineAcquisto(el.dataset.numero));
  });
  attachDeleteBaseListeners();
  document.querySelectorAll('.confirm-delete-yes').forEach(elx => {
    elx.addEventListener('click', () => withGuard(async () => {
      const chiave = elx.dataset.key;
      if (!chiave.startsWith('oariga::')) { confirmDeleteKey = null; renderScreenContent(); return; }
      const [, numero, indiceStr] = chiave.split('::');
      const indice = Number(indiceStr);
      const duplicatiOa = ordiniAcquisto.filter(x => x.numero === numero);
      const o = duplicatiOa[0];
      if (!o) { setStatus(`Impossibile annullare: ordine ${numero} non trovato (potrebbe essere stato già rimosso).`, true); confirmDeleteKey = null; renderScreenContent(); return; }
      const riga = o.righe[indice];
      if (!riga) {
        const suggerimento = duplicatiOa.length > 1 ? ` Esistono più ordini con numero ${numero} (dato storico duplicato): probabile causa.` : '';
        setStatus(`Impossibile annullare: la riga non è più nella posizione attesa (dati cambiati nel frattempo).${suggerimento} Aggiorna la pagina e riprova.`, true);
        confirmDeleteKey = null; renderScreenContent(); return;
      }
      if (rigaHaRicezioni(riga)) { setStatus('Impossibile annullare: questa riga è già stata (almeno in parte) ricevuta.', true); confirmDeleteKey = null; renderScreenContent(); return; }
      riga._rimossa = true;
      await applicaPatch('ordiniAcquisto', numero, { _rimossa: true }, { arrayField: 'righe', arrayIndex: indice });
      const raNum = riga.richiestaRif;
      if (raNum) {
        await applicaPatch('richiesteAcquisto', raNum, { stato: 'aperta' });
        const ra = richiesteAcquisto.find(r => r.numero === raNum);
        if (ra) ra.stato = 'aperta';
      }
      const restanoAttive = o.righe.some(r => !r._rimossa);
      confirmDeleteKey = null;
      if (!restanoAttive) {
        await eliminaRecord('ordiniAcquisto', numero);
        ordiniAcquisto = ordiniAcquisto.filter(x => x.numero !== numero);
        if (!storageOk) {
          setStatus(`⚠️ Riga rimossa solo su questo dispositivo: il salvataggio sul server condiviso è fallito. Aggiornando la pagina l'ordine ${numero} potrebbe ricomparire. Riprova quando la connessione torna disponibile.`, true);
        } else {
          setStatus(`Riga annullata. Era l'ultima riga attiva: l'ordine d'acquisto ${numero} è stato rimosso. Richiesta d'acquisto tornata disponibile in ME51N.`);
        }
      } else {
        if (!storageOk) {
          setStatus(`⚠️ Riga rimossa solo su questo dispositivo: il salvataggio sul server condiviso è fallito. Aggiornando la pagina la riga potrebbe ricomparire. Riprova quando la connessione torna disponibile.`, true);
        } else {
          setStatus(`Riga di ${materialeLabel(riga.materiale)} annullata dall'ordine ${numero}. Richiesta d'acquisto tornata disponibile in ME51N.`);
        }
      }
      renderMain();
    }));
  });
  document.querySelectorAll('.pr-check').forEach(cb => {
    cb.addEventListener('change', e => { draftPO.selezionate[e.target.dataset.numero].checked = e.target.checked; });
  });
  document.querySelectorAll('.pr-prezzo').forEach(inp => {
    inp.addEventListener('input', e => { draftPO.selezionate[e.target.dataset.numero].prezzo = e.target.value; });
  });
  document.querySelectorAll('.pr-consegna').forEach(inp => {
    inp.addEventListener('input', e => { draftPO.selezionate[e.target.dataset.numero].dataConsegna = e.target.value; });
  });
  document.getElementById('save-po').addEventListener('click', () => withGuard(async () => {
    if (!draftPO.fornitore) { setStatus('Seleziona un fornitore.', true); return; }
    const selezionati = aperte.filter(r => draftPO.selezionate[r.numero].checked);
    if (selezionati.length === 0) { setStatus('Seleziona almeno una richiesta d\'acquisto.', true); return; }
    const mancaPrezzo = selezionati.some(r => !draftPO.selezionate[r.numero].prezzo || Number(draftPO.selezionate[r.numero].prezzo) <= 0);
    if (mancaPrezzo) { setStatus('Inserisci un prezzo unitario valido per ogni riga selezionata.', true); return; }
    const mancaData = selezionati.some(r => !draftPO.selezionate[r.numero].dataConsegna);
    if (mancaData) { setStatus('Inserisci la data di consegna per ogni riga selezionata.', true); return; }

    const righe = selezionati.map(r => ({
      materiale: r.materiale, quantita: r.quantita,
      prezzoUnitario: Number(draftPO.selezionate[r.numero].prezzo),
      dataConsegna: draftPO.selezionate[r.numero].dataConsegna,
      richiestaRif: r.numero, ricevuto: false, quantitaRicevuta: 0,
    }));
    const ordiniFreschi = await loadList('ordiniAcquisto');
    const rec = { numero: await prossimoNumero('OA'), fornitore: draftPO.fornitore, righe, stato: 'aperto', creatoDa: currentUser, creatoIl: nowStr() };
    await aggiungiRecord('ordiniAcquisto', rec);
    ordiniAcquisto.push(rec);
    for (const r of selezionati) { await applicaPatch('richiesteAcquisto', r.numero, { stato: 'convertita' }); r.stato = 'convertita'; }
    draftPO = { fornitore:"", selezionate:{} };
    me21nTabAttivo = 'testata';
    setStatus(`Ordine d'acquisto ${rec.numero} creato con ${righe.length} riga/e per il fornitore ${rec.fornitore}.`);
    renderMain();
  }));
}

// ============ MIGO (ricevimento merce) ============
let draftDDT = {}; // { "numeroOrdine::indice": numeroDDTinserito }

let sortMIGO = { campo: null, asc: true };
let draftQtaMIGO = {}; // { "ordine::indice": quantità inserita per il ricevimento parziale }
// Ultimo ricevimento confermato in QUESTA sessione MIGO: permette di stampare subito il documento
// di ingresso senza dover andare fino a MB51 a cercare la riga giusta.
let ultimoRicevimentoMIGO = null; // { movimento, testo } oppure { ricezione, testo } oppure null
// Ricevimento di un DDT completo: tutte le righe (anche di ordini diversi dello stesso fornitore) in un'unica registrazione.
// Ogni movimento porta lo stesso `ricezioneDocumento`, così c'è un solo documento e una sola stampa.
// Non si usa il campo `documento` di MB1x: MBST li tratterebbe come documenti stornabili.
let draftRicDDT = { fornitore: '', ddt: '', righe: {} }; // righe: { "ordine::indice": { sel:false se esclusa, qta } }
function stampaRicezioneDDT(ric) {
  const mov = movimentazioni.filter(m => m.ricezioneDocumento === ric).sort((a, b) => (a.ricezioneRiga || 0) - (b.ricezioneRiga || 0));
  if (!mov.length) { setStatus('Impossibile stampare: ricevimento non trovato nello storico.', true); return; }
  const t = mov[0];
  const forn = fornitori.find(f => f.codice === t.fornitore);
  const tot = mov.reduce((s, m) => s + Number(m.quantita), 0);
  stampaDocumento(`
    <h2 style="margin:0 0 4px 0;">Verbale di Ricevimento Merce — DDT ${t.ddtFornitore || '-'}</h2>
    <p style="margin:0 0 12px 0; color:#666; font-size:12px;">Registrazione ${ric}</p>
    <p style="margin:2px 0;"><strong>Fornitore:</strong> ${forn ? forn.codice + ' - ' + forn.ragioneSociale : (t.fornitore || '-')}</p>
    <p style="margin:2px 0;"><strong>N. DDT fornitore:</strong> ${t.ddtFornitore || '-'}</p>
    <p style="margin:2px 0;"><strong>Data ricevimento:</strong> ${t.creatoIl || t.data || '-'} · <strong>Ricevuto da:</strong> ${t.ricevutoDa || t.creatoDa || '-'}</p>
    <table style="width:100%; border-collapse:collapse; font-size:12px; margin-top:10px;">
      <thead><tr><th style="text-align:left; border-bottom:1px solid #999; padding:4px;">Riga</th><th style="text-align:left; border-bottom:1px solid #999; padding:4px;">Ordine d'acquisto</th><th style="text-align:left; border-bottom:1px solid #999; padding:4px;">Materiale</th><th style="text-align:right; border-bottom:1px solid #999; padding:4px;">Quantità ricevuta</th></tr></thead>
      <tbody>${mov.map((m, i) => `<tr><td style="padding:4px; border-bottom:1px solid #ddd;">${m.ricezioneRiga || i + 1}</td><td style="padding:4px; border-bottom:1px solid #ddd;">${m.numeroOrdineRif || '-'}</td><td style="padding:4px; border-bottom:1px solid #ddd;">${materialeLabel(m.materiale)}</td><td style="padding:4px; border-bottom:1px solid #ddd; text-align:right;">${m.quantita}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td colspan="3" style="padding:4px; text-align:right;"><strong>Totale pezzi</strong></td><td style="padding:4px; text-align:right;"><strong>${tot}</strong></td></tr></tfoot>
    </table>
  `);
}
function renderMIGO(el) {
  const righeAperte = [];
  ordiniAcquisto.forEach(o => {
    o.righe.forEach((r, i) => {
      if (!r._rimossa && !rigaCompleta(r)) righeAperte.push({ ordine: o.numero, fornitore: o.fornitore, indice: i, ...r, residuo: Number(r.quantita) - rigaQtaRicevuta(r) });
    });
  });

  const colonne = [
    { campo:'ordine', label:'N. ordine' },
    { campo:'fornitore', label:'Fornitore', get:r=>fornitoreLabel(r.fornitore) },
    { campo:'materiale', label:'Materiale', get:r=>materialeLabel(r.materiale) },
    { campo:'quantita', label:'Quantità ordinata' },
    { campo:'residuo', label:'Ancora da ricevere' },
    { campo:'dataConsegna', label:'Data consegna prevista' },
  ];
  if (sortMIGO.campo) {
    const col = colonne.find(c => c.campo === sortMIGO.campo);
    righeAperte.sort((a,b) => {
      let va = col.get ? col.get(a) : a[sortMIGO.campo];
      let vb = col.get ? col.get(b) : b[sortMIGO.campo];
      if (sortMIGO.campo === 'quantita' || sortMIGO.campo === 'residuo') { va = Number(va)||0; vb = Number(vb)||0; return sortMIGO.asc ? va-vb : vb-va; }
      va = String(va==null?'':va); vb = String(vb==null?'':vb);
      return sortMIGO.asc ? va.localeCompare(vb) : vb.localeCompare(va);
    });
  }

  // ---- Pannello "Ricevi DDT completo" ----
  const fornitoriAperti = [...new Set(righeAperte.map(r => r.fornitore))].sort();
  if (draftRicDDT.fornitore && !fornitoriAperti.includes(draftRicDDT.fornitore)) draftRicDDT = { fornitore: '', ddt: '', righe: {} };
  const righeForn = righeAperte.filter(r => r.fornitore === draftRicDDT.fornitore).sort((a, b) => a.ordine.localeCompare(b.ordine) || a.indice - b.indice);
  const stRiga = r => draftRicDDT.righe[`${r.ordine}::${r.indice}`] || {};
  const pannelloDDT = `
    <div style="border:1px solid #b8c4d8; background:#f3f6fb; padding:8px; margin:0 0 12px 0;">
      <strong style="font-size:11.5px;">Ricevi DDT completo</strong>
      <span style="font-size:10.5px; color:#5a6470;"> — registra in una volta tutte le righe di un DDT del fornitore, con un solo documento e una sola stampa.</span>
      <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:6px;">
        <label style="font-size:11px;">Fornitore</label>
        <select id="ric-forn" style="font-size:11px; padding:3px;"><option value="">-- scegli --</option>${fornitoriAperti.map(f => `<option value="${f}" ${f === draftRicDDT.fornitore ? 'selected' : ''}>${fornitoreLabel(f)}</option>`).join('')}</select>
        <label style="font-size:11px;">N. DDT fornitore</label>
        <input type="text" id="ric-ddt" value="${draftRicDDT.ddt}" placeholder="es. DDT-4521" style="width:120px; font-size:11px; padding:3px; border:1px solid #7f9db9;">
        ${draftRicDDT.fornitore ? `<button class="actionbtn" id="ric-salva" style="padding:3px 10px; font-size:11px;">✔ Registra DDT completo</button>` : ''}
      </div>
      ${draftRicDDT.fornitore ? `
      <div class="tablewrap" style="margin:8px 0 0 0;"><table>
        <thead><tr><th>Incl.</th><th>N. ordine</th><th>Materiale</th><th>Ancora da ricevere</th><th>Qtà in questo DDT</th><th>Data consegna prevista</th></tr></thead>
        <tbody>${righeForn.map(r => { const key = `${r.ordine}::${r.indice}`; const s = stRiga(r); return `
          <tr><td><input type="checkbox" class="ric-sel" data-key="${key}" ${s.sel === false ? '' : 'checked'}></td>
          <td>${r.ordine}</td><td>${materialeLabel(r.materiale)}</td><td style="font-weight:600;">${r.residuo}</td>
          <td><input type="number" min="1" max="${r.residuo}" step="1" class="ric-qta" data-key="${key}" value="${s.qta !== undefined ? s.qta : r.residuo}" style="width:65px; font-size:11px; padding:3px; border:1px solid #7f9db9;"></td>
          <td>${r.dataConsegna || ''}</td></tr>`; }).join('')}</tbody>
      </table></div>
      <p style="font-size:10.5px; color:#8a8a80; margin:4px 0 0 0;">Togli la spunta alle righe che non sono in questo DDT; riduci la quantità se è arrivato meno (la riga resta aperta per il resto).</p>` : ''}
    </div>`;
  el.innerHTML = `
    <div class="formwrap" style="padding-bottom:0;">
      ${pannelloDDT}
      <p style="font-size:11px;color:#5a6470;margin:0 0 8px 0;">Righe d'ordine d'acquisto ancora da ricevere, anche solo in parte. Puoi ricevere meno della quantità residua: la riga resta aperta per il resto. Inserisci il numero del DDT del fornitore prima di confermare, per tracciabilità: la giacenza viene aggiornata al conferma. Clicca su un'intestazione di colonna per ordinare. Lo storico dei ricevimenti già fatti si consulta in MB51.</p>
      ${ultimoRicevimentoMIGO ? `
        <div style="background:#eaf3ea; border:1px solid #b8d8b8; padding:6px 8px; margin:0 0 10px 0; font-size:11px; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;">
          <span>✔ ${ultimoRicevimentoMIGO.testo}</span>
          <span class="print-btn stampa-ultimo-migo" style="white-space:nowrap;">🖶 Stampa documento di ingresso</span>
        </div>` : ''}
    </div>
    <div class="tablewrap" style="margin-top:0;">
      <table>
        <thead><tr><th>Stato</th>${colonne.map(c => `<th class="migo-sort-th" data-campo="${c.campo}" style="cursor:pointer; user-select:none;" title="Clicca per ordinare">${c.label}${sortMIGO.campo===c.campo ? (sortMIGO.asc?' ▲':' ▼') : ''}</th>`).join('')}<th>Qtà da ricevere ora</th><th>N. DDT fornitore</th><th>Azione</th></tr></thead>
        <tbody>${righeAperte.length===0 ? '<tr><td colspan="10" style="text-align:center;color:#9a9a8f;padding:16px;">Nessuna riga da ricevere.</td></tr>' :
          righeAperte.map(r => {
            const key = `${r.ordine}::${r.indice}`;
            const scaduto = r.dataConsegna && r.dataConsegna < isoDate(new Date());
            const parziale = rigaQtaRicevuta(r) > 0;
            return `
            <tr>
              <td>${semaforo(scaduto ? 'rosso' : 'giallo', scaduto ? 'in ritardo' : (parziale ? 'parziale' : 'in attesa'))}</td>
              <td>${r.ordine}</td><td>${fornitoreLabel(r.fornitore)}</td><td>${materialeLabel(r.materiale)}</td><td>${r.quantita}</td>
              <td style="font-weight:600;">${r.residuo}${parziale ? ` <span style="font-size:9.5px;color:#8a8a80;font-weight:400;">(già ricevuto ${rigaQtaRicevuta(r)})</span>` : ''}</td>
              <td>${r.dataConsegna}</td>
              <td><input type="number" min="1" max="${r.residuo}" step="1" class="qta-migo-input" data-key="${key}" value="${draftQtaMIGO[key] !== undefined ? draftQtaMIGO[key] : r.residuo}" style="width:65px; font-size:11px; padding:3px; border:1px solid #7f9db9;"></td>
              <td><input type="text" class="ddt-input" data-key="${key}" value="${draftDDT[key]||''}" placeholder="es. DDT-4521" style="width:100px; font-size:11px; padding:3px; border:1px solid #7f9db9;"></td>
              <td><button class="actionbtn ricevi-riga" data-ordine="${r.ordine}" data-indice="${r.indice}" data-residuo="${r.residuo}" style="padding:3px 8px; font-size:10.5px;">✔ Ricevi (MIGO)</button></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
  document.querySelectorAll('.migo-sort-th').forEach(th => {
    th.addEventListener('click', () => {
      if (sortMIGO.campo === th.dataset.campo) sortMIGO.asc = !sortMIGO.asc;
      else { sortMIGO.campo = th.dataset.campo; sortMIGO.asc = true; }
      renderScreenContent();
    });
  });
  document.querySelectorAll('.ddt-input').forEach(inp => {
    inp.addEventListener('input', e => { draftDDT[e.target.dataset.key] = e.target.value; });
  });
  document.querySelectorAll('.qta-migo-input').forEach(inp => {
    inp.addEventListener('input', e => { draftQtaMIGO[e.target.dataset.key] = e.target.value; });
  });
  document.querySelectorAll('.ricevi-riga').forEach(btn => {
    btn.addEventListener('click', () => withGuard(async () => {
      const numeroOrdine = btn.dataset.ordine;
      const indice = Number(btn.dataset.indice);
      const residuo = Number(btn.dataset.residuo);
      const key = `${numeroOrdine}::${indice}`;
      const ddt = (draftDDT[key] || '').trim();
      if (!ddt) { setStatus('Inserisci il numero del DDT del fornitore prima di confermare il ricevimento.', true); return; }
      const qtaInserita = draftQtaMIGO[key] !== undefined ? Number(draftQtaMIGO[key]) : residuo;
      if (!qtaInserita || qtaInserita <= 0) { setStatus('Inserisci una quantità da ricevere maggiore di zero.', true); return; }
      if (qtaInserita > residuo) { setStatus(`Non puoi ricevere più della quantità residua (${residuo}).`, true); return; }
      const ordine = ordiniAcquisto.find(o => o.numero === numeroOrdine);
      if (!ordine) return;
      const riga = ordine.righe[indice];
      const dataRicevimento = nowStr();
      const nuovaQtaRicevuta = rigaQtaRicevuta(riga) + qtaInserita;
      const completo = nuovaQtaRicevuta >= Number(riga.quantita);
      riga.quantitaRicevuta = nuovaQtaRicevuta;
      riga.ricevuto = completo;
      riga.ddtFornitore = ddt;
      riga.dataRicevimento = dataRicevimento;
      riga.ricevutoDa = currentUser;
      const causaleParziale = !completo ? `Ricevimento MIGO parziale (${numeroOrdine}, DDT ${ddt})` : 'Ricevimento MIGO (' + numeroOrdine + ', DDT ' + ddt + ')';
      const movimento = await registraMovimento({ materiale: riga.materiale, locazioneDa: null, locazioneA: 'RICEZIONE', quantita: qtaInserita, causale: causaleParziale, extra: {
        numeroOrdineRif: numeroOrdine, fornitore: ordine.fornitore, ddtFornitore: ddt, ricevutoDa: currentUser,
      } });
      await applicaPatch('ordiniAcquisto', numeroOrdine, { quantitaRicevuta: nuovaQtaRicevuta, ricevuto: completo, ddtFornitore: ddt, dataRicevimento, ricevutoDa: currentUser }, { arrayField: 'righe', arrayIndex: indice });
      if (ordine.righe.every(r => r._rimossa || rigaCompleta(r))) {
        ordine.stato = 'ricevuto';
        await applicaPatch('ordiniAcquisto', numeroOrdine, { stato: 'ricevuto' });
      }
      delete draftDDT[key];
      delete draftQtaMIGO[key];
      ultimoRicevimentoMIGO = { movimento: movimento.numero, testo: `Ricevimento registrato: ${materialeLabel(riga.materiale)} x ${qtaInserita} da ${numeroOrdine} (DDT ${ddt}).` };
      setStatus(`Ricevimento registrato: ${riga.materiale} x ${qtaInserita} da ${numeroOrdine} (DDT ${ddt}) in RICEZIONE.${completo ? '' : ` Ancora da ricevere: ${Number(riga.quantita) - nuovaQtaRicevuta}.`} Sposta il materiale prima di poterlo usare in produzione.`);
      renderMain();
    }));
  });
  const btnStampaUltimo = document.querySelector('.stampa-ultimo-migo');
  if (btnStampaUltimo) btnStampaUltimo.addEventListener('click', () => {
    if (!ultimoRicevimentoMIGO) return;
    if (ultimoRicevimentoMIGO.ricezione) stampaRicezioneDDT(ultimoRicevimentoMIGO.ricezione);
    else stampaMovimentoRicevimento(ultimoRicevimentoMIGO.movimento);
  });

  // ---- Ricevi DDT completo ----
  const selF = document.getElementById('ric-forn');
  selF.addEventListener('change', e => { draftRicDDT = { fornitore: e.target.value, ddt: draftRicDDT.ddt, righe: {} }; renderScreenContent(); });
  document.getElementById('ric-ddt').addEventListener('input', e => { draftRicDDT.ddt = e.target.value; });
  document.querySelectorAll('.ric-sel').forEach(cb => cb.addEventListener('change', e => {
    const k = e.target.dataset.key; draftRicDDT.righe[k] = { ...(draftRicDDT.righe[k] || {}), sel: e.target.checked };
  }));
  document.querySelectorAll('.ric-qta').forEach(inp => inp.addEventListener('input', e => {
    const k = e.target.dataset.key; draftRicDDT.righe[k] = { ...(draftRicDDT.righe[k] || {}), qta: e.target.value };
  }));
  const btnRic = document.getElementById('ric-salva');
  if (btnRic) btnRic.addEventListener('click', () => withGuard(async () => {
    const d = draftRicDDT;
    const ddt = (d.ddt || '').trim();
    if (!d.fornitore) { setStatus('Scegli il fornitore del DDT.', true); return; }
    if (!ddt) { setStatus('Inserisci il numero del DDT del fornitore prima di confermare il ricevimento.', true); return; }
    // dati freschi: un'altra sessione potrebbe aver già ricevuto qualche riga
    ordiniAcquisto = await loadList('ordiniAcquisto');
    movimentazioni = await movimentiFreschi();
    const scelte = [];
    for (const o of ordiniAcquisto) {
      if (o.fornitore !== d.fornitore) continue;
      for (let i = 0; i < (o.righe || []).length; i++) {
        const r = o.righe[i];
        if (r._rimossa || rigaCompleta(r)) continue;
        const key = `${o.numero}::${i}`; const s = d.righe[key] || {};
        if (s.sel === false) continue;
        const residuo = Number(r.quantita) - rigaQtaRicevuta(r);
        const qta = s.qta !== undefined && s.qta !== '' ? Number(s.qta) : residuo;
        if (!qta || qta <= 0 || !Number.isInteger(qta)) { setStatus(`${o.numero} / ${materialeLabel(r.materiale)}: la quantità deve essere un intero maggiore di zero.`, true); return; }
        if (qta > residuo) { setStatus(`${o.numero} / ${materialeLabel(r.materiale)}: non puoi ricevere più della quantità residua (${residuo}).`, true); return; }
        scelte.push({ o, i, r, qta });
      }
    }
    if (!scelte.length) { setStatus('Nessuna riga selezionata da ricevere per questo fornitore.', true); return; }
    const ric = 'RIC-' + Date.now().toString(36).toUpperCase();
    const dataRicevimento = nowStr();
    let fatte = 0;
    for (const s of scelte) {
      const nuova = rigaQtaRicevuta(s.r) + s.qta;
      const completo = nuova >= Number(s.r.quantita);
      // prima l'aggiornamento condiviso dell'ordine: se fallisce non si registra nessun movimento per questa riga
      const ok = await applicaPatch('ordiniAcquisto', s.o.numero, { quantitaRicevuta: nuova, ricevuto: completo, ddtFornitore: ddt, dataRicevimento, ricevutoDa: currentUser }, { arrayField: 'righe', arrayIndex: s.i });
      if (!ok) {
        setStatus(`⚠️ Ricevimento interrotto alla riga ${s.o.numero} / ${materialeLabel(s.r.materiale)}: salvataggio sul server condiviso fallito. Righe già registrate: ${fatte} su ${scelte.length}. Controlla in MIGO cosa resta da ricevere e riprova con le righe rimaste.`, true);
        if (fatte) ultimoRicevimentoMIGO = { ricezione: ric, testo: `Ricevimento DDT ${ddt} PARZIALE: ${fatte} righe su ${scelte.length}.` };
        renderMain(); return;
      }
      s.r.quantitaRicevuta = nuova; s.r.ricevuto = completo; s.r.ddtFornitore = ddt; s.r.dataRicevimento = dataRicevimento; s.r.ricevutoDa = currentUser;
      await registraMovimento({ materiale: s.r.materiale, locazioneDa: null, locazioneA: 'RICEZIONE', quantita: s.qta,
        causale: (completo ? 'Ricevimento MIGO (' : 'Ricevimento MIGO parziale (') + s.o.numero + ', DDT ' + ddt + ')',
        extra: { numeroOrdineRif: s.o.numero, fornitore: s.o.fornitore, ddtFornitore: ddt, ricevutoDa: currentUser, ricezioneDocumento: ric, ricezioneRiga: fatte + 1 } });
      fatte++;
    }
    for (const num of [...new Set(scelte.map(s => s.o.numero))]) {
      const o = ordiniAcquisto.find(x => x.numero === num);
      if (o && o.righe.every(r => r._rimossa || rigaCompleta(r))) { o.stato = 'ricevuto'; await applicaPatch('ordiniAcquisto', num, { stato: 'ricevuto' }); }
    }
    const pezzi = scelte.reduce((t, s) => t + s.qta, 0);
    draftRicDDT = { fornitore: '', ddt: '', righe: {} };
    ultimoRicevimentoMIGO = { ricezione: ric, testo: `DDT ${ddt} ricevuto: ${scelte.length} righe, ${pezzi} pezzi (registrazione ${ric}).` };
    setStatus(`DDT ${ddt} registrato: ${scelte.length} righe, ${pezzi} pezzi in RICEZIONE. Stampa il verbale con il pulsante in alto. Sposta il materiale prima di usarlo in produzione.`);
    renderMain();
  }));
}

// ============ MMBE (vista giacenze) ============
function esportaCSV(nomeFile, intestazioni, righe) {
  const righeCSV = [intestazioni.join(';')];
  righe.forEach(riga => {
    righeCSV.push(riga.map(campo => '"' + String(campo).replace(/"/g, '""') + '"').join(';'));
  });
  const contenuto = "\uFEFF" + righeCSV.join('\r\n'); // BOM per far riconoscere accenti/UTF-8 a Excel
  const blob = new Blob([contenuto], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = nomeFile;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
}

let filtroMMBE = { ricerca: "" };
let sortMMBE = { campo: null, asc: true };
function renderMMBE(el) {
  let righe = materiali.map(m => {
    const inArrivoAcquisti = ordinatoApertoPer(m.codice);
    const inArrivoProduzione = m.tipo === 'PF' ? pianificatoApertoPer(m.codice) : 0;
    const inArrivo = inArrivoAcquisti + inArrivoProduzione;
    const inUscitaProduzione = consumoProduzioneApertoPer(m.codice);
    const inUscitaVendite = m.tipo === 'PF' ? venditeAperteApertoPer(m.codice) : 0;
    const inUscita = inUscitaProduzione + inUscitaVendite;
    const perLocazione = locazioni.map(l => getGiacenzaLoc(m.codice, l.codice));
    const totale = getGiacenza(m.codice);
    return { ...m, perLocazione, totale, inArrivoAcquisti, inArrivoProduzione, inArrivo, inUscitaProduzione, inUscitaVendite, inUscita, teorica: totale + inArrivo - inUscita };
  });

  if (filtroMMBE.ricerca) {
    const q = filtroMMBE.ricerca.trim().toLowerCase();
    righe = righe.filter(r => r.codice.toLowerCase().includes(q) || r.descrizione.toLowerCase().includes(q));
  }

  const colonne = [
    { campo:'codice', label:'Codice' },
    { campo:'descrizione', label:'Descrizione' },
    { campo:'tipo', label:'Tipo', get:r=>r.tipo==='MP'?'Materia Prima':'Prodotto Finito' },
    { campo:'um', label:'UM' },
    { campo:'totale', label:'Effettiva' },
    { campo:'inArrivoAcquisti', label:'In entrata (acquisti)' },
    { campo:'inArrivoProduzione', label:'In entrata (produzione)' },
    { campo:'inUscitaProduzione', label:'In uscita (produzione)' },
    { campo:'inUscitaVendite', label:'In uscita (vendite)' },
    { campo:'teorica', label:'Giacenza proiettata' },
  ];
  const campiNumerici = ['totale','inArrivoAcquisti','inArrivoProduzione','inUscitaProduzione','inUscitaVendite','teorica'];
  if (sortMMBE.campo) {
    const col = colonne.find(c => c.campo === sortMMBE.campo);
    righe.sort((a,b) => {
      let va = col.get ? col.get(a) : a[sortMMBE.campo];
      let vb = col.get ? col.get(b) : b[sortMMBE.campo];
      if (campiNumerici.includes(sortMMBE.campo)) { va = Number(va)||0; vb = Number(vb)||0; return sortMMBE.asc ? va-vb : vb-va; }
      va = String(va==null?'':va); vb = String(vb==null?'':vb);
      return sortMMBE.asc ? va.localeCompare(vb) : vb.localeCompare(va);
    });
  }

  const etichette = { codice:'', descrizione:'', tipo:'', um:'', totale:'text-align:center;', inArrivoAcquisti:'text-align:center;', inArrivoProduzione:'text-align:center;', inUscitaProduzione:'text-align:center;', inUscitaVendite:'text-align:center;', teorica:'text-align:center;' };

  el.innerHTML = `
    <div class="actionrow"><button class="actionbtn" id="export-mmbe">📥 Scarica report (Excel/CSV)</button></div>
    <div class="formwrap" style="padding-bottom:0;">
      <div class="formgrid" style="max-width:420px;">
        <label>Ricerca codice/descrizione</label>
        <input id="f-mmbe-ricerca" type="text" value="${filtroMMBE.ricerca}" placeholder="es. MP001 oppure parte della descrizione">
      </div>
    </div>
    <p style="font-size:10.5px; color:#5a6470; margin:0 10px 4px 10px;">
      <strong>Giacenza effettiva</strong> = quello fisicamente presente ora · <strong>In entrata</strong> = acquisti/produzione ancora da ricevere/confermare ·
      <strong>In uscita</strong> = già impegnato per produzione o vendite non ancora consegnate · <strong>Giacenza proiettata</strong> = effettiva + entrata − uscita.
      Clicca un'intestazione di colonna per ordinare. Per il dettaglio per singola ubicazione di magazzino usa <strong>LS24</strong>.
    </p>
    <div class="tablewrap" style="margin-top:0;">
      <table>
        <thead><tr>
          <th>Stato</th>
          ${colonne.map(c => `<th class="mmbe-sort-th" data-campo="${c.campo}" style="cursor:pointer; user-select:none; ${etichette[c.campo]}" title="Clicca per ordinare">${c.label}${sortMMBE.campo===c.campo ? (sortMMBE.asc?' ▲':' ▼') : ''}</th>`).join('')}
        </tr></thead>
        <tbody>${righe.length===0 ? `<tr><td colspan="11" style="text-align:center;color:#9a9a8f;padding:16px;">Nessun materiale trovato.</td></tr>` :
          righe.map(r => {
            const coloreStato = r.teorica < 0 ? 'rosso' : (r.totale === 0 ? 'giallo' : 'verde');
            return `<tr>
            <td>${semaforo(coloreStato, '')}</td>
            <td>${r.codice}</td><td>${r.descrizione}</td><td>${r.tipo==='MP'?'Materia Prima':'Prodotto Finito'}</td><td>${r.um}</td>
            <td style="text-align:center; font-weight:600; color:${r.totale<0?'#a83232':'#1a1a1a'};">${r.totale}</td>
            <td style="text-align:center; color:${r.inArrivoAcquisti>0?'#3a5a8c':'#9a9a8f'};">${r.inArrivoAcquisti||''}</td>
            <td style="text-align:center; color:${r.inArrivoProduzione>0?'#3a5a8c':'#9a9a8f'};">${r.inArrivoProduzione||''}</td>
            <td style="text-align:center; color:${r.inUscitaProduzione>0?'#a86a1a':'#9a9a8f'};">${r.inUscitaProduzione||''}</td>
            <td style="text-align:center; color:${r.inUscitaVendite>0?'#a86a1a':'#9a9a8f'};">${r.inUscitaVendite||''}</td>
            <td style="text-align:center; font-weight:600; color:${r.teorica<0?'#a83232':'#1a1a1a'};">${r.teorica}</td>
          </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
  document.getElementById('f-mmbe-ricerca').addEventListener('input', e => {
    filtroMMBE.ricerca = e.target.value;
    const cursorPos = e.target.selectionStart;
    renderScreenContent();
    const newInput = document.getElementById('f-mmbe-ricerca');
    if (newInput) { newInput.focus(); newInput.setSelectionRange(cursorPos, cursorPos); }
  });
  document.querySelectorAll('.mmbe-sort-th').forEach(th => {
    th.addEventListener('click', () => {
      if (sortMMBE.campo === th.dataset.campo) sortMMBE.asc = !sortMMBE.asc;
      else { sortMMBE.campo = th.dataset.campo; sortMMBE.asc = true; }
      renderScreenContent();
    });
  });
  document.getElementById('export-mmbe').addEventListener('click', () => {
    const intestazioni = ['Stato','Codice','Descrizione','Tipo','UM','Effettiva','In entrata (acquisti)','In entrata (produzione)','In uscita (produzione)','In uscita (vendite)','Giacenza proiettata'];
    const righeCSV = righe.map(r => {
      const statoTxt = r.teorica < 0 ? 'Critico' : (r.totale === 0 ? 'Attenzione' : 'OK');
      return [statoTxt, r.codice, r.descrizione, r.tipo==='MP'?'Materia Prima':'Prodotto Finito', r.um, r.totale, r.inArrivoAcquisti, r.inArrivoProduzione, r.inUscitaProduzione, r.inUscitaVendite, r.teorica];
    });
    esportaCSV('MMBE_giacenze_' + isoDate(new Date()) + '.csv', intestazioni, righeCSV);
  });
}

// ============ LS24 (Giacenza per ubicazione di magazzino) ============
let filtroLS24 = { materiale: "", locazione: "", soloConGiacenza: true };
let ls24Dettaglio = null; // codice materiale attualmente aperto in dettaglio, o null
let sortLS24 = { campo: null, asc: true };
function renderLS24(el) {
  let righe = [];
  const ubicazioniLS24 = ubicazioniConMovimenti();
  materiali.forEach(m => {
    ubicazioniLS24.forEach(l => {
      const q = getGiacenzaLoc(m.codice, l.codice);
      righe.push({ materiale: m.codice, descrizione: m.descrizione, tipo: m.tipo, um: m.um, locazione: l.codice, locDescrizione: l.descrizione, quantita: q });
    });
  });
  if (filtroLS24.materiale) righe = righe.filter(r => r.materiale === filtroLS24.materiale);
  if (filtroLS24.locazione) righe = righe.filter(r => r.locazione === filtroLS24.locazione);
  if (filtroLS24.soloConGiacenza) righe = righe.filter(r => r.quantita !== 0);

  const colonneLS24 = [
    { campo:'locazione', label:'Ubicazione' },
    { campo:'locDescrizione', label:'Descrizione ubicazione' },
    { campo:'materiale', label:'Materiale' },
    { campo:'descrizione', label:'Descrizione materiale' },
    { campo:'tipo', label:'Tipo', get:r=>r.tipo==='MP'?'Materia Prima':'Prodotto Finito' },
    { campo:'quantita', label:'Giacenza' },
    { campo:'um', label:'UM' },
  ];
  if (sortLS24.campo) {
    const col = colonneLS24.find(c => c.campo === sortLS24.campo);
    righe.sort((a,b) => {
      let va = col.get ? col.get(a) : a[sortLS24.campo];
      let vb = col.get ? col.get(b) : b[sortLS24.campo];
      if (sortLS24.campo === 'quantita') { va = Number(va)||0; vb = Number(vb)||0; return sortLS24.asc ? va-vb : vb-va; }
      va = String(va==null?'':va); vb = String(vb==null?'':vb);
      return sortLS24.asc ? va.localeCompare(vb) : vb.localeCompare(va);
    });
  } else {
    righe.sort((a,b) => a.locazione.localeCompare(b.locazione) || a.materiale.localeCompare(b.materiale));
  }

  const matDettaglio = ls24Dettaglio ? materiali.find(m => m.codice === ls24Dettaglio) : null;
  let dettaglioHTML = '';
  if (matDettaglio) {
    const perLoc = ubicazioniLS24.map(l => ({ codice: l.codice, descrizione: l.descrizione, q: getGiacenzaLoc(matDettaglio.codice, l.codice) })).filter(x => x.q !== 0);
    const totale = getGiacenza(matDettaglio.codice);
    const inArrivoAcquisti = ordinatoApertoPer(matDettaglio.codice);
    const inArrivoProduzione = matDettaglio.tipo === 'PF' ? pianificatoApertoPer(matDettaglio.codice) : 0;
    const inUscitaProduzione = consumoProduzioneApertoPer(matDettaglio.codice);
    const inUscitaVendite = matDettaglio.tipo === 'PF' ? venditeAperteApertoPer(matDettaglio.codice) : 0;

// ============ Documenti materiale (MB1A / MB1B / MB1C / MBST) — stile SAP ============
// Ogni registrazione crea un DOCUMENTO MATERIALE (numero DM-xxxx) con testata (tipo movimento, data documento,
// data di registrazione, testo di testata, riferimento) e una o più righe. La giacenza resta calcolata dai movimenti.
const MOVIMENTI_SAP = {
  '311': { desc:'Trasferimento tra ubicazioni', trans:'MB1B', da:true, a:true },
  '309': { desc:'Trasferimento da materiale a materiale', trans:'MB1B', da:true, a:true, mat2:true },
  '551': { desc:'Uscita per rottamazione', trans:'MB1A', da:true, a:false },
  '122': { desc:'Reso a fornitore', trans:'MB1A', da:true, a:false },
  '702': { desc:'Differenza inventariale in meno', trans:'MB1A', da:true, a:false },
  '501': { desc:'Entrata merci senza ordine', trans:'MB1C', da:false, a:true },
  '561': { desc:'Carico iniziale giacenza', trans:'MB1C', da:false, a:true },
  '701': { desc:'Differenza inventariale in più', trans:'MB1C', da:false, a:true },
  // movimenti di storno (si generano solo da MBST)
  '312': { desc:'Storno trasferimento tra ubicazioni', trans:null }, '310': { desc:'Storno trasferimento materiale a materiale', trans:null },
  '552': { desc:'Storno uscita per rottamazione', trans:null }, '123': { desc:'Storno reso a fornitore', trans:null },
  '502': { desc:'Storno entrata merci senza ordine', trans:null }, '562': { desc:'Storno carico iniziale', trans:null },
};
const STORNO_DI = { '311':'312', '309':'310', '551':'552', '122':'123', '702':'701', '501':'502', '561':'562', '701':'702' };
const TITOLO_TRANS_MB = { MB1A: 'MB1A: Uscita merci', MB1B: 'MB1B: Trasferimento merci', MB1C: 'MB1C: Altre entrate merci' };

let draftMB = {};
let ultimoDocumentoMB = null; // { trans, doc }
// ordine esplicito (le chiavi numeriche di un oggetto verrebbero riordinate: 309 prima di 311)
const ORDINE_MOV_SAP = ['311','309','551','122','702','501','561','701'];
function tipiMB(trans) { return ORDINE_MOV_SAP.filter(k => MOVIMENTI_SAP[k].trans === trans); }
function nuovaRigaMB() { return { materiale:'', materiale2:'', locDa:'', locA:'', qta:'1', testo:'' }; }
function datiMB(trans) {
  if (!draftMB[trans]) {
    const primo = tipiMB(trans)[0];
    draftMB[trans] = { tipoMov: primo, dataDoc: oggiISO(), dataReg: oggiISO(), testo: '', rif: '', righe: [nuovaRigaMB()] };
  }
  return draftMB[trans];
}
// Ritorna l'elenco delle carenze (materiale/ubicazione dove il prelievo supera il disponibile)
function carenzeMB(tipoMov, righe) {
  const def = MOVIMENTI_SAP[tipoMov];
  if (!def.da) return [];
  const richiesto = {};
  righe.forEach(r => { const k = r.materiale + '::' + r.locDa; richiesto[k] = (richiesto[k] || 0) + Number(r.qta); });
  const out = [];
  for (const k of Object.keys(richiesto)) {
    const [mat, loc] = k.split('::');
    const disp = getGiacenzaLoc(mat, loc);
    if (richiesto[k] > disp) out.push({ mat, loc, disp, rich: richiesto[k] });
  }
  return out;
}
// Tra le carenze, quelle che BLOCCANO (materiale senza flag di giacenza negativa o interruttore spento)
async function carenzeBloccanti(carenze) {
  const out = [];
  for (const c of carenze) if (!(await negativoAmmesso(c.mat))) out.push(c);
  return out;
}
function msgCarenza(c) { return `Quantità insufficiente: ${c.mat} nell'ubicazione ${c.loc} — disponibile ${c.disp}, richiesto ${c.rich}. Il documento non è stato registrato.`; }
async function registraDocumentoMateriale(tipoMov, head, righe, trans, extraDoc) {
  const doc = await prossimoNumero('DM');
  const def = MOVIMENTI_SAP[tipoMov];
  const base = { documento: doc, tipoMov, trans, dataDocumento: head.dataDoc, dataRegistrazione: head.dataReg, testoTestata: head.testo || '', riferimento: head.rif || '', ...(extraDoc || {}) };
  const causale = `${tipoMov} ${def.desc}`;
  let n = 0;
  for (const r of righe) {
    n++;
    if (tipoMov === '309') {
      await registraMovimento({ materiale: r.materiale, locazioneDa: r.locDa, locazioneA: null, quantita: Number(r.qta), causale: causale + ' [−]', extra: { ...base, riga: n, testoRiga: r.testo || '', materialeControparte: r.materiale2 } });
      await registraMovimento({ materiale: r.materiale2, locazioneDa: null, locazioneA: r.locA, quantita: Number(r.qta), causale: causale + ' [+]', extra: { ...base, riga: n, testoRiga: r.testo || '', materialeControparte: r.materiale } });
    } else {
      await registraMovimento({ materiale: r.materiale, locazioneDa: def.da ? r.locDa : null, locazioneA: def.a ? r.locA : null, quantita: Number(r.qta), causale, extra: { ...base, riga: n, testoRiga: r.testo || '' } });
    }
  }
  return doc;
}

  d.righe.forEach((r, i) => {

      const r = d.righe[i]; const n = i + 1; const qta = Number(r.qta);
      if (!r.materiale) { setStatus(`Riga ${n}: seleziona il materiale.`, true); return; }
      if (def.mat2 && !r.materiale2) { setStatus(`Riga ${n}: seleziona il materiale di destinazione.`, true); return; }
      if (def.da && !r.locDa) { setStatus(`Riga ${n}: seleziona l'ubicazione di prelievo.`, true); return; }
      if (def.a && !r.locA) { setStatus(`Riga ${n}: seleziona l'ubicazione di ricezione.`, true); return; }
      if (!qta || qta <= 0 || !Number.isInteger(qta)) { setStatus(`Riga ${n}: la quantità deve essere un numero intero maggiore di zero.`, true); return; }
      if (d.tipoMov === '311' && r.locDa === r.locA) { setStatus(`Riga ${n}: nel movimento 311 le ubicazioni di prelievo e di ricezione devono essere diverse.`, true); return; }
      if (d.tipoMov === '309' && r.materiale === r.materiale2 && r.locDa === r.locA) { setStatus(`Riga ${n}: nel movimento 309 materiale e ubicazione di partenza e destinazione coincidono.`, true); return; }
    }
    movimentazioni = await movimentiFreschi();
    const carenze = carenzeMB(d.tipoMov, d.righe);
    const bloccanti = await carenzeBloccanti(carenze);
    if (bloccanti.length) { setStatus(msgCarenza(bloccanti[0]), true); renderScreenContent(); return; }
    const errore = carenze.length > 0;
    const doc = await registraDocumentoMateriale(d.tipoMov, d, d.righe, trans);
    ultimoDocumentoMB = { trans, doc };
    setStatus(errore ? `⚠️ Documento materiale ${doc} registrato con giacenza NEGATIVA (consentita dal formatore): verifica in LS24/MMBE.` : `Documento materiale ${doc} registrato (movimento ${d.tipoMov}, ${d.righe.length} riga/e).`);
    draftMB[trans] = { tipoMov: d.tipoMov, dataDoc: oggiISO(), dataReg: oggiISO(), testo: '', rif: '', righe: [nuovaRigaMB()] };
    renderMain();
  }));
}

function documentiMateriale() {
  const per = {};
  movimentazioni.forEach(m => { if (m.documento) { (per[m.documento] = per[m.documento] || []).push(m); } });
  const stornati = new Set(movimentazioni.filter(m => m.stornoDi).map(m => m.stornoDi));
  return Object.keys(per).map(numero => {
    const righe = per[numero]; const t = righe[0];
    return { numero, tipoMov: t.tipoMov, trans: t.trans, dataReg: t.dataRegistrazione, dataDoc: t.dataDocumento, testo: t.testoTestata, rif: t.riferimento, creatoDa: t.creatoDa, righe,
      stornoDi: t.stornoDi || null, stornato: stornati.has(numero) };
  }).sort((a,b) => a.numero < b.numero ? 1 : -1);
}
function stampaDocumentoMateriale(numero) {
  const doc = documentiMateriale().find(x => x.numero === numero);
  if (!doc) { setStatus('Documento materiale non trovato.', true); return; }

      ${doc ? `

          <tbody>${doc.righe.map(r => `<tr><td>${r.riga || ''}</td><td>${materialeLabel(r.materiale)}</td><td>${r.locazioneDa || '-'}</td><td>${r.locazioneA || '-'}</td><td>${r.quantita}</td></tr>`).join('')}</tbody>
        </table></div>
        <p style="margin-top:6px;"><span class="rowaction mbst-stampa" data-doc="${doc.numero}">🖶 stampa documento</span></p>` : ''}
    </div>
  `;
  collegaF4('mbst-doc', 'Cerca documento materiale', tutti.map(x => ({ value: x.numero, label: `${x.numero} — ${x.tipoMov} ${(MOVIMENTI_SAP[x.tipoMov] || {}).desc || ''} (${x.dataReg || '-'})${x.stornato ? ' [stornato]' : ''}${x.stornoDi ? ' [storno]' : ''}` })), v => { draftMBST.documento = v; renderScreenContent(); });
  document.getElementById('mbst-data').addEventListener('input', e => { draftMBST.dataReg = e.target.value; });
  const st = document.querySelector('.mbst-stampa'); if (st) st.addEventListener('click', () => stampaDocumentoMateriale(st.dataset.doc));
  document.getElementById('mbst-storna').addEventListener('click', () => withGuard(async () => {
    if (!draftMBST.documento) { setStatus('Seleziona il documento materiale da stornare.', true); return; }
    movimentazioni = await movimentiFreschi();
    const d = documentiMateriale().find(x => x.numero === draftMBST.documento);
    if (!d) { setStatus('Documento materiale non trovato.', true); return; }
    if (d.stornoDi) { setStatus(`Il documento ${d.numero} è già uno storno e non si può stornare.`, true); return; }
    if (d.stornato) { setStatus(`Il documento ${d.numero} è già stato stornato.`, true); return; }
    const tipoRev = STORNO_DI[d.tipoMov];
    if (!tipoRev) { setStatus(`Il movimento ${d.tipoMov} non è stornabile da MBST.`, true); return; }
    // disponibilità: ciò che il documento ha messo in un'ubicazione deve poterne essere tolto
    const richiesto = {};
    d.righe.forEach(r => { if (r.locazioneA) { const k = r.materiale + '::' + r.locazioneA; richiesto[k] = (richiesto[k] || 0) + Number(r.quantita); } });
    for (const k of Object.keys(richiesto)) {
      const [mat, loc] = k.split('::'); const disp = getGiacenzaLoc(mat, loc);
      if (richiesto[k] > disp && !(await negativoAmmesso(mat))) { setStatus(`Storno impossibile: ${mat} nell'ubicazione ${loc} — disponibile ${disp}, da stornare ${richiesto[k]} (la merce è già stata spostata o consumata).`, true); return; }
    }
    const head = { dataDoc: draftMBST.dataReg || oggiISO(), dataReg: draftMBST.dataReg || oggiISO(), testo: 'Storno ' + d.numero, rif: d.numero };
    const doc = await prossimoNumero('DM');
    let n = 0;
    for (const r of d.righe) {
      n++;
      await registraMovimento({ materiale: r.materiale, locazioneDa: r.locazioneA || null, locazioneA: r.locazioneDa || null, quantita: Number(r.quantita),
        causale: `${tipoRev} ${MOVIMENTI_SAP[tipoRev].desc} (doc. ${d.numero})`,
        extra: { documento: doc, tipoMov: tipoRev, trans: 'MBST', dataDocumento: head.dataDoc, dataRegistrazione: head.dataReg, testoTestata: head.testo, riferimento: head.rif, riga: r.riga || n, stornoDi: d.numero } });
    }
    ultimoDocumentoMB = null; draftMBST = { documento: '', dataReg: '' };
    setStatus(`Documento ${d.numero} stornato con il documento ${doc} (movimento ${tipoRev}).`);
    renderMain();
  }));
}



// ============ Elenco movimentazioni (MB51) ============
function tipoMovimento(m) {
  if (/CO15/.test(m.causale||'')) return 'Produzione';
  if ((m.locazioneDa===null||m.locazioneDa===undefined) && m.locazioneA) return 'Ingresso';
  if ((m.locazioneA===null||m.locazioneA===undefined) && m.locazioneDa) return 'Uscita';
  return 'Interna';
}
function contropartemovimento(m) {
  // Preferisci il fornitore/cliente salvato DIRETTAMENTE sul movimento (campo "fornitore" aggiunto
  // in extra da registraMovimento): resta corretto anche se l'ordine originale viene poi modificato
  // o cancellato. Solo per i movimenti storici senza questo campo si ripiega sulla vecchia ricerca
  // per numero-ordine dentro la causale (che invece SPARISCE se l'ordine non c'è più).
  if (m.fornitore) return fornitoreLabel(m.fornitore);
  if (m.cliente) return clienteLabel(m.cliente);
  const match = (m.causale||'').match(/\(([A-Za-z0-9\-]+)/);
  if (!match) return null;
  const rif = match[1];
  const oa = ordiniAcquisto.find(o => o.numero === rif);
  if (oa) return fornitoreLabel(oa.fornitore);
  const ov = ordiniVendita.find(o => o.numero === rif);
  if (ov) return clienteLabel(ov.cliente);
  return null;
}

      <div class="formgrid">
        <label>Ordine di vendita</label>
        ${campoF4HTML('f-ordine', draftVL.ordineVendita ? `${draftVL.ordineVendita} — cliente ${(aperti.find(o=>o.numero===draftVL.ordineVendita)||{}).cliente||''}` : '', '-- cerca ordine di vendita (F4) --')}
      </div>
      ${aperti.length===0 ? '<p style="font-size:11px;color:#9a9a8f;margin-top:8px;">Nessun ordine di vendita con righe ancora da consegnare.</p>' : ''}
      ${ordineSel ? `
        ${ordineSel.riferimentoCliente ? `<p style="font-size:11px; margin-top:8px;"><strong>Riferimento cliente:</strong> ${ordineSel.riferimentoCliente}</p>` : '<p style="font-size:10.5px; color:#a83232; margin-top:8px;">Nessun riferimento cliente su questo ordine.</p>'}
        <div style="margin-top:10px;">

    tr.addEventListener('click', () => {
      draftVL.ordineVendita = tr.dataset.ordine;
      draftVL.righe = {};
      renderScreenContent();
    });
  });
  collegaF4('f-ordine', 'Cerca ordine di vendita', aperti.map(o => ({ value: o.numero, label: `${o.numero} — cliente ${o.cliente}` })), (valore) => {
    draftVL.ordineVendita = valore;
    draftVL.righe = {};
    renderScreenContent();
  });
  document.querySelectorAll('.vl-qta').forEach(inp => {
    inp.addEventListener('input', e => { draftVL.righe[e.target.dataset.riga] = e.target.value; });
  });
  document.querySelectorAll('.stampa-ddt').forEach(elx => {
    elx.addEventListener('click', () => stampaDDT(elx.dataset.numero));
  });
  document.getElementById('save-vl01').addEventListener('click', () => withGuard(async () => {
    if (!draftVL.ordineVendita) { setStatus('Seleziona un ordine di vendita.', true); return; }
    const ordine = ordiniVendita.find(o => o.numero === draftVL.ordineVendita);
    if (!ordine) { setStatus('Ordine non trovato.', true); return; }
    movimentazioni = await movimentiFreschi();

    const righeDaConsegnare = [];
    for (const [idxStr, val] of Object.entries(draftVL.righe)) {
      const idx = Number(idxStr);
      const qta = Number(val) || 0;
      if (qta <= 0) continue;
      const riga = ordine.righe[idx];
      const residuo = riga.quantita - (riga.consegnato||0);
      if (qta > residuo) { setStatus(`Quantità per ${riga.prodotto} superiore al residuo ordinato.`, true); return; }
      const dispSpedizione = getGiacenzaLoc(riga.prodotto, 'SPEDIZIONE');
      if (qta > dispSpedizione && !(await negativoAmmesso(riga.prodotto))) { setStatus(`Merce insufficiente in SPEDIZIONE per ${riga.prodotto}: disponibili ${dispSpedizione}.`, true); return; }
      righeDaConsegnare.push({ idx, prodotto: riga.prodotto, quantita: qta });
    }
    if (righeDaConsegnare.length === 0) { setStatus('Inserisci almeno una quantità da consegnare.', true); return; }

    // Ordine delle operazioni: PRIMA si salva l'avanzamento della consegna (e si controlla che sia davvero salvato sul
    // server condiviso), POI si registra il movimento di magazzino: se il salvataggio fallisce non resta una spedizione
    // "a metà" (merce uscita ma ordine ancora aperto, che porterebbe a spedire due volte).
    const attesi = {}; // idx -> consegnato atteso dopo l'operazione
    for (const rc of righeDaConsegnare) {
      const prima = ordine.righe[rc.idx].consegnato || 0;
      const nuovo = prima + rc.quantita;
      const okP = await applicaPatch('ordiniVendita', ordine.numero, { consegnato: nuovo }, { arrayField: 'righe', arrayIndex: rc.idx });
      if (!okP) { setStatus(`⚠️ Spedizione NON registrata: il salvataggio sul server condiviso è fallito (connessione instabile). Nessun movimento è stato fatto. Riprova tra poco.`, true); renderMain(); return; }
      ordine.righe[rc.idx].consegnato = nuovo; attesi[rc.idx] = nuovo;
      await registraMovimento({ materiale: rc.prodotto, locazioneDa: 'SPEDIZIONE', locazioneA: null, quantita: rc.quantita, causale: 'Spedizione DDT VL01N (' + ordine.numero + ')' });
    }
    if (ordine.righe.every(r => (r.consegnato||0) >= r.quantita)) {
      ordine.stato = 'evaso';
      await applicaPatch('ordiniVendita', ordine.numero, { stato: 'evaso' });
    }

    const ddt = {
      numero: await prossimoNumero('DDT'), ordineVendita: ordine.numero, cliente: ordine.cliente, riferimentoCliente: ordine.riferimentoCliente || '',
      righe: righeDaConsegnare.map(rc => ({ prodotto: rc.prodotto, quantita: rc.quantita })),
      creatoDa: currentUser, creatoIl: nowStr(),
    };
    await aggiungiRecord('consegne', ddt);
    consegne.push(ddt);
    // Verifica dal server: rilegge tutto il corso e controlla che la consegna risulti davvero salvata per tutti.
    let avvisoVerifica = '';
    try {
      await caricaCacheCorso();
      const fresche = await loadList('ordiniVendita');
      const o2 = fresche.find(o => o.numero === ordine.numero);
      const ok = o2 && Object.entries(attesi).every(([i, v]) => ((o2.righe[i] || {}).consegnato || 0) >= v);
      if (!ok) avvisoVerifica = ' ⚠️ ATTENZIONE: la consegna NON risulta salvata sul server condiviso (l\'ordine potrebbe ricomparire come aperto). Non rifare la spedizione: avvisa il formatore.';
      else { normalizzaOrdiniVendita(fresche); ordiniVendita = fresche; }
    } catch (e) { /* verifica non possibile: si lascia il messaggio normale */ }
    draftVL = { ordineVendita:"", righe:{} };
    setStatus(`Consegna registrata: DDT ${ddt.numero} generato per l'ordine ${ordine.numero}.${avvisoVerifica}`, !!avvisoVerifica);
    renderMain();
  }));
}

function renderCruscotto(el) {
  const oggiISO = isoDate(new Date());

  let righeVenditaRitardo = 0;
  ordiniVendita.filter(o => o.stato === 'aperto').forEach(o => {
    o.righe.forEach(r => {
      if (r.dataRichiesta && r.dataRichiesta < oggiISO && (r.quantita - (r.consegnato||0)) > 0) righeVenditaRitardo++;
    });
  });

  const materialiCritici = materiali.filter(m => {
    const inArrivoAcq = ordinatoApertoPer(m.codice);
    const inArrivoProd = m.tipo === 'PF' ? pianificatoApertoPer(m.codice) : 0;
    return (getGiacenza(m.codice) + inArrivoAcq + inArrivoProd) < 0;
  }).length;

  const odpAperti = ordiniProduzione.filter(o => o.stato === 'aperto').length;

  let righeAcquistoRitardo = 0;
  ordiniAcquisto.forEach(o => o.righe.forEach(r => {
    if (!r._rimossa && !rigaCompleta(r) && r.dataConsegna && r.dataConsegna < oggiISO) righeAcquistoRitardo++;
  }));

  const kpis = [
    { label: "Righe ordine vendita in ritardo", valore: righeVenditaRitardo, screen: 'VL01N' },
    { label: "Materiali con copertura critica", valore: materialiCritici, screen: 'MMBE' },
    { label: "Ordini di produzione aperti da evadere", valore: odpAperti, screen: 'CO15' },
    { label: "Righe d'ordine fornitore in ritardo", valore: righeAcquistoRitardo, screen: 'MIGO' },
  ];

  function coloreKpi(v) { return v === 0 ? 'verde' : (v <= 2 ? 'giallo' : 'rosso'); }

  el.innerHTML = `
    <div style="padding:16px; overflow-y:auto; width:100%;">
      <h3 style="margin:0 0 4px 0; font-size:13px;">Cruscotto — Corso ${currentCorso}</h3>
      <p style="font-size:11px; color:#5a6470; margin:0 0 14px 0;">Semaforo riassuntivo della situazione attuale. Clicca una scheda per andare direttamente alla transazione. Seleziona una voce dal menu a sinistra per operare (es. MM01, XK01, XD01, CS01).</p>
      <div style="display:grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap:10px; max-width:800px;">
        ${kpis.map(k => `
          <div class="kpi-card" data-screen="${k.screen}" style="cursor:pointer; border:1px solid #c8c2a8; background:white; padding:12px 14px; display:flex; align-items:center; gap:12px;">
            <span class="semaforo semaforo-${coloreKpi(k.valore)}" style="width:16px; height:16px; margin:0;"></span>
            <div>
              <div style="font-size:22px; font-weight:700; line-height:1;">${k.valore}</div>
              <div style="font-size:10.5px; color:#5a6470; margin-top:2px;">${k.label}</div>
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
  document.querySelectorAll('.kpi-card').forEach(card => {
    card.addEventListener('click', () => { cambiaSchermata(card.dataset.screen); });
  });
}

// magazzino/pianificazione, invece di un unico form lunghissimo). Persiste tra un render e l'altro

// ============ MM03 (list) ============
let sortMM03 = { campo: null, asc: true };
function renderMM03(el) {
  const colonne = [
    { campo:'codice', label:'Codice' },
    { campo:'descrizione', label:'Descrizione' },
    { campo:'tipo', label:'Tipo', get:m=>m.tipo==='MP'?'Materia Prima':'Prodotto Finito' },
    { campo:'um', label:'UM' },
    { campo:'giacenza', label:'Giacenza', get:m=>getGiacenza(m.codice) },
    { campo:'gruppoProdotti', label:'Gruppo prodotti', get:m=>m.gruppoProdotti||'-' },
    { campo:'pianificatore', label:'Pianificatore', get:m=>m.tipo==='MP'?(m.pianificatore||'-'):'-' },
    { campo:'tipoMRP', label:'Tipo MRP', get:m=>m.tipo==='MP'?(m.tipoMRP||'PD'):'-' },
    { campo:'politicaLotto', label:'Politica lotto', get:m=>m.tipo==='MP'?(m.politicaLotto||'EX'):'-' },
    { campo:'creatoDa', label:'Creato da' },
    { campo:'creatoIl', label:'Data' },
  ];
  let elenco = materiali.slice();
  if (sortMM03.campo) {
    const col = colonne.find(c => c.campo === sortMM03.campo);
    elenco.sort((a,b) => {
      let va = col.get ? col.get(a) : a[sortMM03.campo];
      let vb = col.get ? col.get(b) : b[sortMM03.campo];
      if (sortMM03.campo === 'giacenza') { va = Number(va)||0; vb = Number(vb)||0; return sortMM03.asc ? va-vb : vb-va; }
      va = String(va==null?'':va); vb = String(vb==null?'':vb);
      return sortMM03.asc ? va.localeCompare(vb) : vb.localeCompare(va);
    });
  }
  el.innerHTML = `
    <div class="tablewrap" style="margin-top:8px;">
      <table>
        <thead><tr>${colonne.map(c => `<th class="mm03-sort-th" data-campo="${c.campo}" style="cursor:pointer; user-select:none;" title="Clicca per ordinare">${c.label}${sortMM03.campo===c.campo ? (sortMM03.asc?' ▲':' ▼') : ''}</th>`).join('')}<th>Azioni</th></tr></thead>
        <tbody>
          ${elenco.length === 0 ? `<tr><td colspan="${colonne.length+1}" style="text-align:center; color:#9a9a8f; padding:16px;">Nessun materiale in anagrafica. Usa MM01 per crearne uno.</td></tr>` :
            elenco.map(m => `<tr><td>${m.codice}</td><td>${m.descrizione}</td><td>${m.tipo==='MP'?'Materia Prima':'Prodotto Finito'}</td><td>${m.um}</td><td>${getGiacenza(m.codice)}</td><td>${m.gruppoProdotti||'-'}</td><td>${m.tipo==='MP'?(m.pianificatore||'-'):'-'}</td><td>${m.tipo==='MP'?(m.tipoMRP||'PD'):'-'}</td><td>${m.tipo==='MP'?(m.politicaLotto||'EX'):'-'}</td><td>${m.creatoDa}</td><td>${m.creatoIl}</td><td>${deleteActionCell('mat-'+m.codice, materialeInUso(m.codice) ? 'in uso, non eliminabile' : null)}</td></tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;
  document.querySelectorAll('.mm03-sort-th').forEach(th => {
    th.addEventListener('click', () => {
      if (sortMM03.campo === th.dataset.campo) sortMM03.asc = !sortMM03.asc;
      else { sortMM03.campo = th.dataset.campo; sortMM03.asc = true; }
      renderScreenContent();
    });
  });
  attachDeleteBaseListeners();
  document.querySelectorAll('.confirm-delete-yes').forEach(el => {
    el.addEventListener('click', () => withGuard(async () => {
      const codice = el.dataset.key.replace('mat-', '');
      await eliminaRecord('materiali', codice);
      materiali = materiali.filter(m => m.codice !== codice);
      confirmDeleteKey = null;
      setStatus(`Materiale ${codice} eliminato.`);
      renderMain();
    }));
  });
}

              <div style="flex:2;">${campoF4HTML('f-comp-cs02-'+i, c.codice ? materialeLabel(c.codice) : '', '-- cerca componente (F4) --')}</div>
              <input class="comp-qta-cs02" data-i="${i}" type="number" min="0" step="0.01" value="${c.qta}" style="width:80px; font-size:11.5px; padding:3px; border:1px solid #7f9db9;" placeholder="Qtà">
              ${draftDistintaModifica.componenti.length > 1 ? `<span class="rowaction danger remove-comp-cs02" data-i="${i}" style="cursor:pointer;">rimuovi</span>` : ''}
            </div>
          </div>
        `).join('')}
      </div>
      `}
      `}
    </div>
  `;

  collegaF4('f-prodotto-cs02', 'Cerca distinta esistente', distinte.map(d => ({ value: d.prodotto, label: materialeLabel(d.prodotto) })), (valore) => {
    const d = distinte.find(x => x.prodotto === valore);
    if (!d) return;
    draftDistintaModifica = {
      prodotto: d.prodotto,
      componenti: d.componenti.map(c => ({ codice: c.codice, qta: String(c.qta) })),
      _originale: d.prodotto,
    };
    cs02TabAttivo = 'componenti';
    renderScreenContent();
  });
  const btnAnnullaCs02 = document.getElementById('annulla-cs02');
  if (btnAnnullaCs02) btnAnnullaCs02.addEventListener('click', () => {
    draftDistintaModifica = { prodotto:"", componenti:[], _originale: null };
    cs02TabAttivo = 'testata';
    renderScreenContent();
  });
  const btnAddCompCs02 = document.getElementById('add-comp-cs02');
  if (btnAddCompCs02) btnAddCompCs02.addEventListener('click', () => {
    draftDistintaModifica.componenti.push({codice:"", qta:"1"});
    renderScreenContent();
  });
  document.querySelectorAll('.remove-comp-cs02').forEach(sp => {
    sp.addEventListener('click', () => {
      draftDistintaModifica.componenti.splice(Number(sp.dataset.i), 1);
      renderScreenContent();
    });
  });
  attachSapTabsListeners(tab => { cs02TabAttivo = tab; renderScreenContent(); });
  draftDistintaModifica.componenti.forEach((c, i) => {
    collegaF4('f-comp-cs02-'+i, 'Cerca componente (materia prima o semilavorato)', componenteDistintaOpzioni(draftDistintaModifica.prodotto), (valore) => {
      draftDistintaModifica.componenti[i].codice = valore;
      renderScreenContent();
    });
  });
  document.querySelectorAll('.comp-qta-cs02').forEach(inp => {
    inp.addEventListener('input', (e) => { draftDistintaModifica.componenti[Number(e.target.dataset.i)].qta = e.target.value; });
  });
  const btnSaveCs02 = document.getElementById('save-cs02');
  if (btnSaveCs02) btnSaveCs02.addEventListener('click', () => withGuard(async () => {
    const prodotto = draftDistintaModifica._originale;
    if (!prodotto) { setStatus('Seleziona prima una distinta base.', true); return; }
    const compValide = draftDistintaModifica.componenti.filter(c => c.codice && Number(c.qta) > 0);
    if (compValide.length === 0) { setStatus('Aggiungi almeno un componente valido.', true); return; }
    distinte = await loadList('distinte');
    if (!distinte.some(d => d.prodotto === prodotto)) {
      setStatus('Questa distinta base non esiste più (forse eliminata da un altro corsista).', true);
      draftDistintaModifica = { prodotto:"", componenti:[], _originale: null };
      renderMain();
      return;
    }
    if (distintaCreaCiclo(prodotto, compValide)) { setStatus('Distinta non valida: un componente contiene già questo prodotto nella sua distinta (riferimento circolare).', true); return; }
    await applicaPatch('distinte', prodotto, { componenti: compValide });
    const d = distinte.find(x => x.prodotto === prodotto);
    if (d) d.componenti = compValide;
    draftDistintaModifica = { prodotto:"", componenti:[], _originale: null };
    cs02TabAttivo = 'testata';
    setStatus(`Distinta base per ${prodotto} aggiornata con successo.`);
    renderMain();
  }));
}


// ============ CS03 (visualizza distinta base, anche multilivello) e CS15 (lista di impiego) ============
let draftCS03 = { prodotto: '', vista: 'livelli', quantita: '1' };
function renderCS03(el) {

  const tipoDi = c => { const m = materiali.find(x => x.codice === c); return m ? (m.tipo === 'PF' ? 'Semilavorato' : 'Materia prima') : '-'; };
  let corpo = '';
  if (draftCS03.prodotto) {
    const b = getBOM(draftCS03.prodotto);
    if (!b) corpo = '<p style="font-size:11px;color:#a83232;">Questo prodotto non ha una distinta base.</p>';
    else if (draftCS03.vista === 'riepilogo') {
      // CS13: riepilogo dei soli componenti foglia (materie prime), quantità totali
      const tot = {};
      righe.filter(r => !getBOM(r.codice)).forEach(r => { tot[r.codice] = (tot[r.codice] || 0) + r.qtaTot; });
      corpo = `<table><thead><tr><th>Componente</th><th>Tipo</th><th>Quantità totale per ${q} pz</th><th>Giacenza</th></tr></thead><tbody>${Object.entries(tot).map(([c, v]) => `<tr><td>${materialeLabel(c)}</td><td>${tipoDi(c)}</td><td style="font-weight:600;">${v}</td><td>${getGiacenza(c)}</td></tr>`).join('')}</tbody></table>`;

        + (draftCS03.vista === 'livelli' && righe.some(r => r.livello > 1) ? '<p style="font-size:10.5px;color:#3a5a8c;margin-top:6px;">Ci sono semilavorati con una propria distinta: scegli "Esplosa multilivello" per vedere tutti i livelli.</p>' : '');

  el.innerHTML = `
    <div class="formwrap">

      <div class="formgrid">
        <label>Prodotto</label>${campoF4HTML('cs03-prod', draftCS03.prodotto ? materialeLabel(draftCS03.prodotto) : '', '-- cerca distinta (F4) --')}
        <label>Quantità del prodotto</label><input id="cs03-qta" type="number" min="1" value="${draftCS03.quantita}" style="width:90px;">
        <label>Vista</label>
        <select id="cs03-vista">
          <option value="livelli" ${draftCS03.vista === 'livelli' ? 'selected' : ''}>Livello per livello (solo primo livello)</option>
          <option value="esplosa" ${draftCS03.vista === 'esplosa' ? 'selected' : ''}>Esplosa multilivello</option>
          <option value="riepilogo" ${draftCS03.vista === 'riepilogo' ? 'selected' : ''}>Riepilogata (solo materie prime, totali)</option>
        </select>
      </div>
    </div>
    <div class="tablewrap" style="margin-top:6px;">${corpo}</div>`;
  collegaF4('cs03-prod', 'Cerca distinta', conBOM, v => { draftCS03.prodotto = v; renderScreenContent(); });
  document.getElementById('cs03-qta').addEventListener('change', e => { draftCS03.quantita = e.target.value; renderScreenContent(); });
  document.getElementById('cs03-vista').addEventListener('change', e => { draftCS03.vista = e.target.value; renderScreenContent(); });
}

// Migra ordini di vendita salvati con il vecchio formato mono-riga (prima dell'introduzione delle righe multiple)
function normalizzaOrdiniVendita(list) {
  let migrati = 0;
  const out = list.map(o => {
    if (!Array.isArray(o.righe)) {
      migrati++;
      o = {
        numero: o.numero, cliente: o.cliente, stato: o.stato || 'aperto',
        creatoDa: o.creatoDa, creatoIl: o.creatoIl,
        righe: [{ prodotto: o.prodotto, quantita: o.quantita, dataRichiesta: o.dataRichiesta }],
      };
    }
    o.righe.forEach(r => { if (r.consegnato === undefined) { r.consegnato = 0; migrati++; } });
    return o;
  });
  return { out, migrati };
}

// ============ CANCELLO D'ACCESSO AL SITO ============
// Password unica condivisa con i corsisti. Dopo averla inserita, QUESTO browser la ricorda per ACCESSO_SITO_ORE ore
// (così aprire il programma in una nuova scheda non riporta alla richiesta della password); poi, o se la password
// cambia, viene richiesta di nuovo. Cambiala qui per cambiare la password.
const SITE_ACCESS_PASSWORD = 'grs2026';

const ACCESSO_SITO_ORE = 12;
const CHIAVE_ACCESSO_SITO = '__accesso_sito__';
function _impronta(testo) { let h = 5381; for (let i = 0; i < testo.length; i++) h = ((h << 5) + h + testo.charCodeAt(i)) | 0; return String(h >>> 0); }
function _accessoSitoValido() {
  try {
    const v = JSON.parse(localStorage.getItem(CHIAVE_ACCESSO_SITO) || 'null');
    return !!(v && v.h === _impronta(SITE_ACCESS_PASSWORD) && Date.now() < v.scade);
  } catch (e) { return false; }
}
function _ricordaAccessoSito() {
  try { localStorage.setItem(CHIAVE_ACCESSO_SITO, JSON.stringify({ h: _impronta(SITE_ACCESS_PASSWORD), scade: Date.now() + ACCESSO_SITO_ORE * 3600000 })); } catch (e) {}
}
function renderAccessGate(onOk) {
  if (_accessoSitoValido()) { onOk(); return; }
  document.getElementById('app').innerHTML = `
    <div class="login-overlay"><div class="login-box">
      <div style="display:flex; align-items:center; gap:8px; margin-bottom:4px;">
        <div class="logo" style="width:28px; height:28px; font-size:15px;">S</div>
        <h2 style="margin:0;">GRS Solutions ERP Full</h2>
      </div>
      <p>Accesso riservato ai corsisti. Inserisci la password fornita dal formatore.</p>
      <input type="password" id="access-pw-input" placeholder="Password" autocomplete="off" style="width:100%; padding:8px; font-size:12px; border:1px solid #7f9db9; margin-bottom:10px; font-family:inherit; box-sizing:border-box;">
      <button id="access-pw-btn">Entra</button>
      <div id="access-pw-err" style="color:#a83232; font-size:11px; margin-top:8px; display:none;">Password errata, riprova.</div>
    </div></div>
  `;
  const input = document.getElementById('access-pw-input');
  const err = document.getElementById('access-pw-err');
  const tentaAccesso = () => {
    if (input.value === SITE_ACCESS_PASSWORD) {
      _ricordaAccessoSito();
      onOk();
    } else {
      err.style.display = 'block';
      input.style.borderColor = '#a83232';
      input.value = '';
      input.focus();
    }
  };
  document.getElementById('access-pw-btn').addEventListener('click', tentaAccesso);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') tentaAccesso(); });
  input.focus();
}
