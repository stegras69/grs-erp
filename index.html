    // ============ MD01 (MRP - vista fabbisogno materiali) ============
    function richiestoApertoPer(codice) {
        return richiesteAcquisto.filter(r => r.materiale === codice && r.stato === 'aperta').reduce((s, r) => s + r.quantita, 0);
    }
    function ordinatoApertoPer(codice) {
        let tot = 0;
        ordiniAcquisto.forEach(o => {
            o.righe.forEach(r => {
                if (r.materiale === codice && !r._rimossa && !rigaCompleta(r))
                    tot += (Number(r.quantita) - rigaQtaRicevuta(r));
            });
        });
        return tot;
    }

    function renderMD01(el) {
        const materiePrime = materiali.filter(m => m.tipo === 'MP');
        const buckets = generateWeekBuckets(14, 8);
        const aperti = ordiniProduzione.filter(o => o.stato === 'aperto');

        function calcolaBucketMateriale(mp) {
            const lordo = new Array(buckets.length).fill(0);
            aperti.forEach(op => {
                const comp = op.componenti.find(c => c.codice === mp.codice);
                if (!comp)
                    return;
                const idx = bucketIndexForDate(op.dataPianificata, buckets);
                if (idx !== null)
                    lordo[idx] += comp.qtaTotale;
            });
            const giaRichiesto = new Array(buckets.length).fill(0);
            richiesteAcquisto.filter(r => r.materiale === mp.codice && r.stato === 'aperta').forEach(r => {
                const idx = bucketIndexForDate(r.dataRichiesta, buckets);
                if (idx !== null)
                    giaRichiesto[idx] += r.quantita;
            });
            const giaOrdinato = new Array(buckets.length).fill(0);
            ordiniAcquisto.forEach(o => {
                o.righe.forEach(r => {
                    if (r.materiale === mp.codice && !r._rimossa && !rigaCompleta(r)) {
                        const idx = bucketIndexForDate(r.dataConsegna, buckets);
                        if (idx !== null)
                            giaOrdinato[idx] += (Number(r.quantita) - rigaQtaRicevuta(r));
                    }
                });
            });
            return {
                lordo,
                giaRichiesto,
                giaOrdinato
            };
        }

        const materialiConFabbisogno = materiePrime.map(mp => {
            const dati = calcolaBucketMateriale(mp);
            const fabbisognoLordoTot = dati.lordo.reduce((s, v) => s + v, 0);
            return {
                mp,
                dati,
                fabbisognoLordoTot
            };
        }).filter(x => x.fabbisognoLordoTot > 0);

        function draftValRichiesta(codice, i) {
            const key = `${codice}::${i}`;
            return mdCellDraft[key] !== undefined ? mdCellDraft[key] : '';
        }

        function blocchiHTML() {
            return materialiConFabbisogno.map(({mp, dati}) => {
                // giacenza proiettata cumulativa: fisica + già richiesto + già ordinato + bozza corrente - fabbisogno lordo, periodo per periodo
                const proiezione = [];
                let run = getGiacenza(mp.codice);
                for (let i = 0; i < buckets.length; i++) {
                    const bozza = Number(draftValRichiesta(mp.codice, i)) || 0;
                    run = run + dati.giaRichiesto[i] + dati.giaOrdinato[i] + bozza - dati.lordo[i];
                    proiezione.push(run);
                }
                const cellsRichiedi = buckets.map((b, i) => `
                        <td style="padding:2px;"><input type="number" min="0" class="md01-cell" data-materiale="${mp.codice}" data-week="${i}" value="${draftValRichiesta(mp.codice, i)}" placeholder="0" style="width:48px; font-size:10.5px; padding:2px; border:1px solid #b9c4d6; text-align:center;"></td>
                      `).join('');

                return `
                        <div style="margin:0 10px 16px 10px;" data-materiale-block="${mp.codice}">
                          <div style="background:#dfe6f0; border:1px solid #b9c4d6; padding:6px 8px; font-weight:600; font-size:11.5px;">
                            ${mp.codice} - ${mp.descrizione} <span style="font-weight:400; font-size:10.5px; color:#3a4453;">| Giacenza fisica: ${getGiacenza(mp.codice)}</span>
                          </div>
                          <div class="tablewrap" style="margin:0;">
                            <table style="min-width:${140 + buckets.length * 52}px;">
                              <thead><tr><th style="min-width:150px;">Dato</th>${buckets.map(b => `<th style="text-align:center; min-width:48px; font-size:10px; ${b.speciale ? 'color:#a83232; background:#fbeaea;' : ''} ${b.oggi ? 'text-decoration:underline;' : ''}">${b.label}</th>`).join('')}</tr></thead>
                              <tbody>
                                <tr style="background:#f4f4ee;"><td>Giacenza proiettata</td>${proiezione.map(v => `<td class="proiezione-md01-cell" style="text-align:center; font-weight:600; color:${v < 0 ? '#a83232' : '#1a6b2e'};">${v}</td>`).join('')}</tr>
                                <tr><td>Fabbisogno lordo (ODP)</td>${dati.lordo.map(v => `<td style="text-align:center; font-size:10.5px;">${v || ''}</td>`).join('')}</tr>
                                <tr><td style="color:#3a5a8c;">Già richiesto (RA)</td>${dati.giaRichiesto.map(v => `<td style="text-align:center; font-size:10.5px; color:#3a5a8c;">${v || ''}</td>`).join('')}</tr>
                                <tr><td style="color:#3a5a8c;">Già ordinato (OA)</td>${dati.giaOrdinato.map(v => `<td style="text-align:center; font-size:10.5px; color:#3a5a8c;">${v || ''}</td>`).join('')}</tr>
                                <tr><td style="padding-left:14px;">↳ Da richiedere ora</td>${cellsRichiedi}</tr>
                              </tbody>
                            </table>
                          </div>
                          <div style="display:flex; align-items:center; gap:10px; margin-top:6px;">
                            <button class="actionbtn genera-ra-piano" data-materiale="${mp.codice}" style="padding:5px 10px; font-size:11px;">✔ Genera richieste d'acquisto da questo piano</button>
                          </div>
                        </div>`;
            }).join('');
        }

        el.innerHTML = `
            <div class="formwrap" style="padding-bottom:0;">
              <p style="font-size:11px;color:#5a6470;margin:0 0 4px 0;">Fabbisogno di materie prime per periodo (giornaliero nei prossimi 14 giorni, poi settimanale), al netto di giacenza, richieste d'acquisto e ordini d'acquisto già aperti. Scrivi la quantità da richiedere nel periodo giusto, poi conferma.</p>
            </div>
            <div style="flex:1; overflow:auto;">
              ${materialiConFabbisogno.length === 0 ? '<p style="font-size:11px;color:#9a9a8f;margin:0 10px 10px 10px;">Nessun fabbisogno da ordini di produzione aperti al momento.</p>' : blocchiHTML()}
            </div>
          `;

        document.querySelectorAll('.md01-cell').forEach(inp => {
            inp.addEventListener('input', e => {
                const {materiale, week} = e.target.dataset;
                mdCellDraft[`${materiale}::${week}`] = e.target.value;
                // ricalcola live SOLO la riga "Giacenza proiettata" del blocco di questo materiale
                const blocco = document.querySelector(`[data-materiale-block="${materiale}"]`);
                if (!blocco)
                    return;
                const item = materialiConFabbisogno.find(x => x.mp.codice === materiale);
                let run = getGiacenza(item.mp.codice);
                const proiez = [];
                for (let i = 0; i < buckets.length; i++) {
                    const bozza = Number(draftValRichiesta(materiale, i)) || 0;
                    run = run + item.dati.giaRichiesto[i] + item.dati.giaOrdinato[i] + bozza - item.dati.lordo[i];
                    proiez.push(run);
                }
                blocco.querySelectorAll('.proiezione-md01-cell').forEach((td, i) => {
                    td.textContent = proiez[i];
                    td.style.color = proiez[i] < 0 ? '#a83232' : '#1a6b2e';
                });
            });
        });

        document.querySelectorAll('.genera-ra-piano').forEach(btn => {
            btn.addEventListener('click', () => withGuard(async () => {
                const materiale = btn.dataset.materiale;
                richiesteAcquisto = await loadList('richiesteAcquisto');
                const creati = [];
                for (let i = 0; i < buckets.length; i++) {
                    const key = `${materiale}::${i}`;
                    const qta = Number(mdCellDraft[key]) || 0;
                    if (qta > 0) {
                        const rec = {
                            numero: await prossimoNumero('RA'),
                            materiale,
                            quantita: qta,
                            dataRichiesta: buckets[i].startISO,
                            stato: 'aperta',
                            origine: 'MD01/MRP',
                            creatoDa: currentUser,
                            creatoIl: nowStr(),
                        };
                        creati.push(rec);
                    }
                    delete mdCellDraft[key];
                }
                if (creati.length === 0) {
                    setStatus('Nessuna quantità inserita da confermare per questo materiale.', true);
                    return;
                }
                for (const rec of creati) {
                    await aggiungiRecord('richiesteAcquisto', rec);
                    richiesteAcquisto.push(rec);
                }
                const riepilogo = creati.map(c => `${c.numero}: ${c.quantita} il ${c.dataRichiesta}`).join(' — ');
                setStatus(`Generate ${creati.length} richiesta/e d'acquisto per ${materiale}: ${riepilogo}`);
                renderMain();
            }));
        });
    }

    // ============ ME21N (converte richieste aperte in ordine d'acquisto) ============
    function renderME21N(el) {
        const aperte = richiesteAcquisto.filter(r => r.stato === 'aperta');
        aperte.forEach(r => {
            if (!draftPO.selezionate[r.numero])
                draftPO.selezionate[r.numero] = {
                    checked: false,
                    prezzo: '',
                    dataConsegna: r.dataRichiesta
                };
        });

        function fornitoriAbitualiDi(materiale) {
            return fornitoriMateriale.filter(a => a.materiale === materiale).map(a => a.fornitore);
        }
        // Quante unità di questo materiale sono già in un ordine d'acquisto aperto (non ancora ricevuto)?
        // Serve a evitare doppi ordini involontari per lo stesso materiale da richieste diverse.
        function quantitaGiaOrdinata(materiale) {
            let tot = 0;
            ordiniAcquisto.forEach(o => o.righe.forEach(r => {
                if (r.materiale === materiale && !r._rimossa && !rigaCompleta(r))
                    tot += (Number(r.quantita) - rigaQtaRicevuta(r));
            }));
            return tot;
        }

        function rigaPRHTML(r) {
            const abituali = fornitoriAbitualiDi(r.materiale);
            const giaOrdinata = quantitaGiaOrdinata(r.materiale);
            return `

    // ============ MIGO (ricevimento merce) ============
    let draftDDT = {}; // { "numeroOrdine::indice": numeroDDTinserito }

    let sortMIGO = {
        campo: null,
        asc: true
    };
    let draftQtaMIGO = {}; // { "ordine::indice": quantità inserita per il ricevimento parziale }
    function renderMIGO(el) {
        const righeAperte = [];
        ordiniAcquisto.forEach(o => {
            o.righe.forEach((r, i) => {
                if (!r._rimossa && !rigaCompleta(r))
                    righeAperte.push({
                        ordine: o.numero,
                        fornitore: o.fornitore,
                        indice: i,
                        ...r,
                        residuo: Number(r.quantita) - rigaQtaRicevuta(r)
                    });
            });
        });

        const colonne = [
        {
            campo: 'ordine',
            label: 'N. ordine'
        },
        {
            campo: 'fornitore',
            label: 'Fornitore',
            get: r => fornitoreLabel(r.fornitore)
        },
        {
            campo: 'materiale',
            label: 'Materiale',
            get: r => materialeLabel(r.materiale)
        },
        {
            campo: 'quantita',
            label: 'Quantità ordinata'
        },
        {
            campo: 'residuo',
            label: 'Ancora da ricevere'
        },
        {
            campo: 'dataConsegna',
            label: 'Data consegna prevista'
        },
        ];
        if (sortMIGO.campo) {
            const col = colonne.find(c => c.campo === sortMIGO.campo);
            righeAperte.sort((a, b) => {
                let va = col.get ? col.get(a) : a[sortMIGO.campo];
                let vb = col.get ? col.get(b) : b[sortMIGO.campo];
                if (sortMIGO.campo === 'quantita' || sortMIGO.campo === 'residuo') {
                    va = Number(va) || 0;
                    vb = Number(vb) || 0;
                    return sortMIGO.asc ? va - vb : vb - va;
                }
                va = String(va == null ? '' : va);
                vb = String(vb == null ? '' : vb);
                return sortMIGO.asc ? va.localeCompare(vb) : vb.localeCompare(va);
            });
        }

        el.innerHTML = `
            <div class="formwrap" style="padding-bottom:0;">
              <p style="font-size:11px;color:#5a6470;margin:0 0 8px 0;">Righe d'ordine d'acquisto ancora da ricevere, anche solo in parte. Puoi ricevere meno della quantità residua: la riga resta aperta per il resto. Inserisci il numero del DDT del fornitore prima di confermare, per tracciabilità: la giacenza viene aggiornata al conferma. Clicca su un'intestazione di colonna per ordinare. Lo storico dei ricevimenti già fatti si consulta in MB51.</p>

                        <tr>
                          <td>${semaforo(scaduto ? 'rosso' : 'giallo', scaduto ? 'in ritardo' : (parziale ? 'parziale' : 'in attesa'))}</td>
                          <td>${r.ordine}</td><td>${fornitoreLabel(r.fornitore)}</td><td>${materialeLabel(r.materiale)}</td><td>${r.quantita}</td>
                          <td style="font-weight:600;">${r.residuo}${parziale ? ` <span style="font-size:9.5px;color:#8a8a80;font-weight:400;">(già ricevuto ${rigaQtaRicevuta(r)})</span>` : ''}</td>
                          <td>${r.dataConsegna}</td>
                          <td><input type="number" min="1" max="${r.residuo}" step="1" class="qta-migo-input" data-key="${key}" value="${draftQtaMIGO[key] !== undefined ? draftQtaMIGO[key] : r.residuo}" style="width:65px; font-size:11px; padding:3px; border:1px solid #7f9db9;"></td>
                          <td><input type="text" class="ddt-input" data-key="${key}" value="${draftDDT[key] || ''}" placeholder="es. DDT-4521" style="width:100px; font-size:11px; padding:3px; border:1px solid #7f9db9;"></td>
                          <td><button class="actionbtn ricevi-riga" data-ordine="${r.ordine}" data-indice="${r.indice}" data-residuo="${r.residuo}" style="padding:3px 8px; font-size:10.5px;">✔ Ricevi (MIGO)</button></td>

        document.querySelectorAll('.migo-sort-th').forEach(th => {

                if (sortMIGO.campo === th.dataset.campo)
                    sortMIGO.asc = !sortMIGO.asc;
                else {
                    sortMIGO.campo = th.dataset.campo;
                    sortMIGO.asc = true;

                renderScreenContent();
            });
        });
        document.querySelectorAll('.ddt-input').forEach(inp => {
            inp.addEventListener('input', e => {
                draftDDT[e.target.dataset.key] = e.target.value;
            });
        });
        document.querySelectorAll('.qta-migo-input').forEach(inp => {
            inp.addEventListener('input', e => {
                draftQtaMIGO[e.target.dataset.key] = e.target.value;
            });
        });
        document.querySelectorAll('.ricevi-riga').forEach(btn => {
            btn.addEventListener('click', () => withGuard(async () => {
                const numeroOrdine = btn.dataset.ordine;
                const indice = Number(btn.dataset.indice);
                const residuo = Number(btn.dataset.residuo);
                const key = `${numeroOrdine}::${indice}`;
                const ddt = (draftDDT[key] || '').trim();
                if (!ddt) {
                    setStatus('Inserisci il numero del DDT del fornitore prima di confermare il ricevimento.', true);
                    return;
                }
                const qtaInserita = draftQtaMIGO[key] !== undefined ? Number(draftQtaMIGO[key]) : residuo;
                if (!qtaInserita || qtaInserita <= 0) {
                    setStatus('Inserisci una quantità da ricevere maggiore di zero.', true);
                    return;
                }
                if (qtaInserita > residuo) {

                    return;

                const ordine = ordiniAcquisto.find(o => o.numero === numeroOrdine);

                await applicaPatch('ordiniAcquisto', numeroOrdine, {
                    quantitaRicevuta: nuovaQtaRicevuta,

                    ddtFornitore: ddt,
                    dataRicevimento,

                if (ordine.righe.every(r => r._rimossa || rigaCompleta(r))) {

                renderMain();
            }));
        });

    // ============ MMBE (vista giacenze) ============
    function esportaCSV(nomeFile, intestazioni, righe) {
        const righeCSV = [intestazioni.join(';')];
        righe.forEach(riga => {
            righeCSV.push(riga.map(campo => '"' + String(campo).replace(/"/g, '""') + '"').join(';'));
        });
        const contenuto = "\uFEFF" + righeCSV.join('\r\n'); // BOM per far riconoscere accenti/UTF-8 a Excel
        const blob = new Blob([contenuto], {
            type: 'text/csv;charset=utf-8;'
        });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = nomeFile;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    }

    let filtroMMBE = {
        ricerca: ""
    };
    let sortMMBE = {
        campo: null,
        asc: true
    };
    function renderMMBE(el) {
        let righe = materiali.map(m => {
            const inArrivoAcquisti = ordinatoApertoPer(m.codice);
            const inArrivoProduzione = m.tipo === 'PF' ? pianificatoApertoPer(m.codice) : 0;
            const inArrivo = inArrivoAcquisti + inArrivoProduzione;
            const inUscitaProduzione = consumoProduzioneApertoPer(m.codice);
            const inUscitaVendite = m.tipo === 'PF' ? venditeAperteApertoPer(m.codice) : 0;
            const inUscita = inUscitaProduzione + inUscitaVendite;
            const perLocazione = locazioni.map(l => getGiacenzaLoc(m.codice, l.codice));
            const totale = getGiacenza(m.codice);
            return {
                ...m,
                perLocazione,
                totale,
                inArrivoAcquisti,
                inArrivoProduzione,
                inArrivo,
                inUscitaProduzione,
                inUscitaVendite,
                inUscita,
                teorica: totale + inArrivo - inUscita
            };
        });

        if (filtroMMBE.ricerca) {
            const q = filtroMMBE.ricerca.trim().toLowerCase();
            righe = righe.filter(r => r.codice.toLowerCase().includes(q) || r.descrizione.toLowerCase().includes(q));
        }

                <tbody>${righe.length === 0 ? `<tr><td colspan="11" style="text-align:center;color:#9a9a8f;padding:16px;">Nessun materiale trovato.</td></tr>` : righe.map(r => {const coloreStato = r.teorica < 0 ? 'rosso' : (r.totale === 0 ? 'giallo' : 'verde');return `<tr>
                        <td>${semaforo(coloreStato, '')}</td>

                        <td style="text-align:center; color:${r.inUscitaVendite > 0 ? '#a86a1a' : '#9a9a8f'};">${r.inUscitaVendite || ''}</td>
                        <td style="text-align:center; font-weight:600; color:${r.teorica < 0 ? '#a83232' : '#1a1a1a'};">${r.teorica}</td>
                      </tr>`;}).join('')}
                </tbody>
              </table>
            </div>
          `;
        document.getElementById('f-mmbe-ricerca').addEventListener('input', e => {
            filtroMMBE.ricerca = e.target.value;
            const cursorPos = e.target.selectionStart;

    // ============ LS24 (Giacenza per ubicazione di magazzino) ============
    let filtroLS24 = {

    function renderLS24(el) {
        let righe = [];
        materiali.forEach(m => {
            locazioni.forEach(l => {

            campo: 'materiale',
            label: 'Materiale'
        },
        {
            campo: 'descrizione',
            label: 'Descrizione materiale'
        },
        {
            campo: 'tipo',
            label: 'Tipo',
            get: r => r.tipo === 'MP' ? 'Materia Prima' : 'Prodotto Finito'

        {
            campo: 'quantita',
            label: 'Giacenza'
        },
        {
            campo: 'um',
            label: 'UM'

                    va = Number(va) || 0;
                    vb = Number(vb) || 0;

                vb = String(vb == null ? '' : vb);
                return sortLS24.asc ? va.localeCompare(vb) : vb.localeCompare(va);
            });
        } else {
            righe.sort((a, b) => a.locazione.localeCompare(b.locazione) || a.materiale.localeCompare(b.materiale));

                    <p style="font-size:10.5px; margin:6px 0 2px 0;"><strong>Giacenza effettiva totale: ${totale}</strong> · In entrata (acquisti): ${inArrivoAcquisti} · In entrata (produzione): ${inArrivoProduzione} · In uscita (produzione): ${inUscitaProduzione} · In uscita (vendite): ${inUscitaVendite} · Giacenza proiettata: <strong style="color:${teorica < 0 ? '#a83232' : '#1a1a1a'};">${teorica}</strong></p>
                    <p style="font-size:10.5px; margin:6px 0 2px 0;"><strong>Per ubicazione:</strong> ${perLoc.length === 0 ? 'nessuna giacenza in nessuna ubicazione.' : perLoc.map(x => `${x.codice}: <strong>${x.q}</strong>`).join(' · ')}</p>
                    <span class="rowaction ls24-vai-mb51" data-codice="${matDettaglio.codice}" style="margin-top:4px; display:inline-block;">📄 vedi movimenti di questo materiale (MB51)</span>
                  </div>`;
        }

        el.innerHTML = `
            <div class="formwrap" style="padding-bottom:0;">
              <p style="font-size:11px;color:#5a6470;margin:0 0 8px 0;">Giacenza di ogni materiale per singola ubicazione di magazzino (bin) — il dettaglio "fisico" di dove si trova la merce. Clicca su un codice materiale per vedere il dettaglio completo. Per la panoramica aggregata per materiale (entrate/uscite previste, giacenza proiettata) usa MMBE.</p>
            </div>
            <div class="actionrow"><button class="actionbtn" id="export-ls24">📥 Scarica report (Excel/CSV)</button></div>
            <div class="formwrap">
              <div class="formgrid">
                <label>Materiale</label>
                <select id="f-ls24-materiale">
                  <option value="">-- tutti --</option>
                  ${materiali.map(m => `<option value="${m.codice}" ${filtroLS24.materiale === m.codice ? 'selected' : ''}>${m.codice} - ${m.descrizione}</option>`).join('')}
                </select>
                <label>Ubicazione</label>
                <select id="f-ls24-locazione">
                  <option value="">-- tutte --</option>
                  ${locazioni.map(l => `<option value="${l.codice}" ${filtroLS24.locazione === l.codice ? 'selected' : ''}>${l.codice} - ${l.descrizione}</option>`).join('')}
                </select>
                <label>Mostra</label>
                <select id="f-ls24-solocongiacenza">
                  <option value="si" ${filtroLS24.soloConGiacenza ? 'selected' : ''}>Solo con giacenza diversa da zero</option>
                  <option value="no" ${!filtroLS24.soloConGiacenza ? 'selected' : ''}>Tutte le combinazioni (anche a zero)</option>
                </select>
              </div>
            </div>
            ${dettaglioHTML}
            <div class="tablewrap">
              <table>
                <thead><tr>${colonneLS24.map(c => `<th class="ls24-sort-th" data-campo="${c.campo}" style="cursor:pointer; user-select:none;" title="Clicca per ordinare">${c.label}${sortLS24.campo === c.campo ? (sortLS24.asc ? ' ▲' : ' ▼') : ''}</th>`).join('')}</tr></thead>
                <tbody>${righe.length === 0 ? '<tr><td colspan="7" style="text-align:center;color:#9a9a8f;padding:16px;">Nessuna giacenza da mostrare con i filtri correnti.</td></tr>' : righe.map(r => `<tr><td>${r.locazione}</td><td>${r.locDescrizione}</td><td><span class="rowaction ls24-apri-dettaglio" data-codice="${r.materiale}">${r.materiale}</span></td><td>${r.descrizione}</td><td>${r.tipo === 'MP' ? 'Materia Prima' : 'Prodotto Finito'}</td><td style="text-align:center; font-weight:600; color:${r.quantita < 0 ? '#a83232' : '#1a1a1a'};">${r.quantita}</td><td>${r.um}</td></tr>`).join('')}

                if (sortLS24.campo === th.dataset.campo)

                renderScreenContent();

    // ============ Locazioni di magazzino ============
    function renderLocazioni(el) {
        el.innerHTML = `
            <div class="actionrow"><button class="actionbtn" id="save-locazione">✔ Crea ubicazione</button></div>
            <div class="formwrap">
              <div class="formgrid">
                <label>Codice ubicazione</label><input id="f-codice" value="${draftLocazione.codice}" placeholder="es. 1A1">
                <label>Descrizione</label><input id="f-desc" value="${draftLocazione.descrizione}" placeholder="es. Scaffale 1 posizione A piano 1">
              </div>
              <p style="font-size:10.5px; color:#8a8a80; margin-top:8px;">RICEZIONE, OFFICINA e SPEDIZIONE sono ubicazioni fisse del sistema e non possono essere eliminate. Aggiungi qui altre ubicazioni (scaffali, aree, magazzini generici) a piacere.</p>
            </div>
            <div class="tablewrap">
              <table>
                <thead><tr><th>Codice</th><th>Descrizione</th><th>Tipo</th><th>Creato da</th><th>Azioni</th></tr></thead>
                <tbody>${locazioni.length === 0 ? '<tr><td colspan="5" style="text-align:center;color:#9a9a8f;padding:16px;">Nessuna ubicazione.</td></tr>' : locazioni.map(l => `<tr><td>${l.codice}</td><td>${l.descrizione}</td><td>${l.fissa ? 'Fissa (sistema)' : 'Personalizzata'}</td><td>${l.creatoDa}</td><td>${deleteActionCell('loc-' + l.codice, l.fissa ? 'ubicazione fissa, non eliminabile' : (materiali.some(m => getGiacenzaLoc(m.codice, l.codice) > 0) ? 'contiene giacenza, non eliminabile' : null))}</td></tr>`).join('')}
                </tbody>
              </table>
            </div>
          `;
        attachDeleteBaseListeners();
        document.querySelectorAll('.confirm-delete-yes').forEach(elx => {
            elx.addEventListener('click', () => withGuard(async () => {
                const codice = elx.dataset.key.replace('loc-', '');
                await eliminaRecord('locazioni', codice);
                locazioni = locazioni.filter(l => l.codice !== codice);
                confirmDeleteKey = null;
                setStatus(`Ubicazione ${codice} eliminata.`);
                renderMain();
            }));
        });
        document.getElementById('f-codice').addEventListener('input', e => draftLocazione.codice = e.target.value);
        document.getElementById('f-desc').addEventListener('input', e => draftLocazione.descrizione = e.target.value);
        document.getElementById('save-locazione').addEventListener('click', () => withGuard(async () => {
            if (!draftLocazione.codice.trim() || !draftLocazione.descrizione.trim()) {
                setStatus('Codice e descrizione sono obbligatori.', true);
                return;
            }
            const codice = draftLocazione.codice.trim().toUpperCase();
            locazioni = await loadList('locazioni');
            if (locazioni.some(l => l.codice === codice)) {
                setStatus('Codice ubicazione già esistente.', true);
                return;
            }
            const rec = {
                codice,
                descrizione: draftLocazione.descrizione.trim(),
                fissa: false,
                creatoDa: currentUser,
                creatoIl: nowStr()
            };
            await aggiungiRecord('locazioni', rec);
            locazioni.push(rec);
            draftLocazione = {
                codice: "",
                descrizione: ""
            };
            setStatus(`Ubicazione ${codice} creata con successo.`);
            renderMain();
        }));
    }

            renderScreenContent();

        document.getElementById('f-locda').addEventListener('change', e => {
            draftMov.locazioneDa = e.target.value;
            renderScreenContent();
        });
        document.getElementById('f-loca').addEventListener('change', e => draftMov.locazioneA = e.target.value);
        document.getElementById('f-qta').addEventListener('input', e => draftMov.quantita = e.target.value);
        document.getElementById('f-causale').addEventListener('change', e => draftMov.causale = e.target.value);
        document.getElementById('save-mov').addEventListener('click', () => withGuard(async () => {
            if (!draftMov.materiale || !draftMov.locazioneDa || !draftMov.locazioneA) {
                setStatus('Seleziona materiale, ubicazione di partenza e di arrivo.', true);
                return;
            }
            if (draftMov.locazioneDa === draftMov.locazioneA) {
                setStatus('Ubicazione di partenza e arrivo devono essere diverse.', true);
                return;
            }
            const qta = Number(draftMov.quantita);
            if (!qta || qta <= 0) {
                setStatus('Inserisci una quantità maggiore di zero.', true);
                return;
            }
            const disponibile = getGiacenzaLoc(draftMov.materiale, draftMov.locazioneDa);
            const risultatoNegativo = qta > disponibile;
            await registraMovimento({
                materiale: draftMov.materiale,
                locazioneDa: draftMov.locazioneDa,
                locazioneA: draftMov.locazioneA,
                quantita: qta,
                causale: draftMov.causale
            });
            if (risultatoNegativo) {
                setStatus(`⚠️ Movimento registrato, ma in ${draftMov.locazioneDa} erano disponibili solo ${disponibile}: la giacenza di ${draftMov.materiale} in quella ubicazione è ora NEGATIVA (${disponibile - qta}). Verificala in LS24/MMBE.`, true);
            } else {
                setStatus(`Spostati ${qta} ${draftMov.materiale} da ${draftMov.locazioneDa} a ${draftMov.locazioneA}.`);
            }
            draftMov.quantita = '1';
            renderMain();
        }));
    }

    // ============ Elenco movimentazioni (MB51) ============
    function tipoMovimento(m) {
        if (/CO15/.test(m.causale || ''))
            return 'Produzione';
        if ((m.locazioneDa === null || m.locazioneDa === undefined) && m.locazioneA)
            return 'Ingresso';
        if ((m.locazioneA === null || m.locazioneA === undefined) && m.locazioneDa)
            return 'Uscita';
        return 'Interna';
    }
    function contropartemovimento(m) {
        const match = (m.causale || '').match(/\(([A-Za-z0-9\-]+)/);
        if (!match)
            return null;
        const rif = match[1];
        const oa = ordiniAcquisto.find(o => o.numero === rif);
        if (oa)
            return fornitoreLabel(oa.fornitore);
        const ov = ordiniVendita.find(o => o.numero === rif);
        if (ov)
            return clienteLabel(ov.cliente);
        return null;
    }
    let sortMov = {
        campo: null,
        asc: true
    };

            ...m,

        }));

            label: 'Creato da'

            elenco.sort((a, b) => {

                return sortMov.asc ? va.localeCompare(vb) : vb.localeCompare(va);
            });

        el.innerHTML = `

                <label>Filtra per materiale</label>
                <select id="f-filtro-materiale">
                  <option value="">-- tutti --</option>
                  ${materiali.map(m => `<option value="${m.codice}" ${filtroMov.materiale === m.codice ? 'selected' : ''}>${m.codice} - ${m.descrizione}</option>`).join('')}

                <select id="f-filtro-tipo">

                <tbody>${elenco.length === 0 ? `<tr><td colspan="${colonne.length + 1}" style="text-align:center;color:#9a9a8f;padding:16px;">Nessuna movimentazione.</td></tr>` : elenco.map(m => {const matchRic = (m.causale || '').match(/^Ricevimento MIGO(?: parziale)? \(([^,]+)/);const stampaCell = matchRic ? `<span class="print-btn stampa-ric-mb51" data-ordine="${matchRic[1]}" data-materiale="${m.materiale}">🖶 stampa</span>` : '';return `<tr><td>${m.numero}</td><td>${materialeLabel(m.materiale)}</td><td>${m.tipo}</td><td>${m.locazioneDa || '-'}</td><td>${m.locazioneA || '-'}</td><td>${m.quantita}</td><td>${m.controparte || '-'}</td><td>${m.causale}</td><td>${m.creatoIl}</td><td>${m.creatoDa}</td><td>${stampaCell}</td></tr>`;}).join('')}
                </tbody>
              </table>

        document.querySelectorAll('.stampa-ric-mb51').forEach(elx => {

        document.getElementById('f-filtro-materiale').addEventListener('change', e => {

            renderScreenContent();

        document.getElementById('f-filtro-controparte').addEventListener('change', e => {

        document.getElementById('f-filtro-a').addEventListener('input', e => {
            filtroMov.dataA = e.target.value;
            renderScreenContent();
        });
        document.getElementById('export-mov').addEventListener('click', () => {
            const intestazioni = ['N. movimento', 'Materiale', 'Tipo', 'Da', 'A', 'Quantità', 'Fornitore/Cliente', 'Causale', 'Data', 'Creato da'];
            const righeCSV = elenco.map(m => [m.numero, materialeLabel(m.materiale), m.tipo, m.locazioneDa || '-', m.locazioneA || '-', m.quantita, m.controparte || '-', m.causale, m.creatoIl, m.creatoDa]);
            esportaCSV('Movimentazioni_' + isoDate(new Date()) + '.csv', intestazioni, righeCSV);

    // ============ VL01N (Consegna cliente + DDT) ============
    function stampaDDT(numeroDDT) {

    function renderVL01N(el) {
        const aperti = ordiniVendita.filter(o => o.stato === 'aperto' && o.righe.some(r => r.quantita - (r.consegnato || 0) > 0));

        if (draftVL.ordineVendita) {
            const ordine = ordiniVendita.find(o => o.numero === draftVL.ordineVendita);
            if (!ordine || ordine.stato !== 'aperto')
                draftVL = {
                    ordineVendita: "",
                    righe: {}
                };
        }

        const ordineSel = draftVL.ordineVendita ? ordiniVendita.find(o => o.numero === draftVL.ordineVendita) : null;

        // Elenco righe ancora da consegnare, di tutti gli ordini, ordinate per data richiesta (le più urgenti in cima)
        const oggiISO = isoDate(new Date());
        const righeDaSpedire = [];
        aperti.forEach(o => {
            o.righe.forEach((r, i) => {
                const residuo = r.quantita - (r.consegnato || 0);
                if (residuo > 0)
                    righeDaSpedire.push({
                        ordine: o.numero,
                        cliente: o.cliente,
                        prodotto: r.prodotto,
                        residuo,
                        dataRichiesta: r.dataRichiesta,
                        giacenzaDisp: getGiacenzaLoc(r.prodotto, 'SPEDIZIONE')
                    });
            });
        });
        righeDaSpedire.sort((a, b) => (a.dataRichiesta || '9999').localeCompare(b.dataRichiesta || '9999'));

        el.innerHTML = `
            <div class="formwrap" style="padding-bottom:0;">
              <p style="font-size:11px;color:#5a6470;margin:0 0 6px 0;">Righe ancora da consegnare, ordinate per data richiesta (le più urgenti in cima). La spedizione preleva solo dall'ubicazione SPEDIZIONE: sposta prima il prodotto finito lì con una movimentazione. Clicca su un ordine per elaborarne la consegna.</p>
            </div>
            <div class="tablewrap" style="margin:0 10px 14px 10px;">
              <table>
                <thead><tr><th>Stato</th><th>Data richiesta</th><th>N. ordine</th><th>Cliente</th><th>Prodotto</th><th>Residuo</th><th>Disp. in SPEDIZIONE</th></tr></thead>
                <tbody>${righeDaSpedire.length === 0 ? '<tr><td colspan="7" style="text-align:center;color:#9a9a8f;padding:10px;">Nessuna riga da consegnare.</td></tr>' : righeDaSpedire.map(r => {const scaduto = r.dataRichiesta && r.dataRichiesta < oggiISO;const copertura = r.giacenzaDisp >= r.residuo;const coloreStato = scaduto ? 'rosso' : (copertura ? 'verde' : 'giallo');return `<tr class="riga-vl-select" data-ordine="${r.ordine}" style="cursor:pointer;">
                          <td>${semaforo(coloreStato, '')}</td>
                          <td style="color:${scaduto ? '#a83232' : '#1a1a1a'}; font-weight:${scaduto ? '600' : '400'};">${r.dataRichiesta || '-'}${scaduto ? ' ⚠️' : ''}</td>
                          <td>${r.ordine}</td><td>${clienteLabel(r.cliente)}</td><td>${materialeLabel(r.prodotto)}</td>
                          <td>${r.residuo}</td>
                          <td style="color:${r.giacenzaDisp < r.residuo ? '#a83232' : '#1a6b2e'};">${r.giacenzaDisp}</td>
                        </tr>`;}).join('')}
                </tbody>

            </div>
            <div class="actionrow"><button class="actionbtn" id="save-vl01">✔ Conferma consegna e genera DDT</button></div>
            <div class="formwrap">
              <div class="formgrid">
                <label>Ordine di vendita</label>
                <select id="f-ordine">
                  <option value="">-- seleziona --</option>
                  ${aperti.map(o => `<option value="${o.numero}" ${draftVL.ordineVendita === o.numero ? 'selected' : ''}>${o.numero} — cliente ${o.cliente}</option>`).join('')}
                </select>
              </div>
              ${aperti.length === 0 ? '<p style="font-size:11px;color:#9a9a8f;margin-top:8px;">Nessun ordine di vendita con righe ancora da consegnare.</p>' : ''}
              ${ordineSel ? `
                ${ordineSel.riferimentoCliente ? `<p style="font-size:11px; margin-top:8px;"><strong>Riferimento cliente:</strong> ${ordineSel.riferimentoCliente}</p>` : '<p style="font-size:10.5px; color:#a83232; margin-top:8px;">Nessun riferimento cliente su questo ordine.</p>'}
                <div style="margin-top:10px;">
                  <p style="font-size:11px; color:#5a6470; margin-bottom:6px;">Righe residue da consegnare (puoi consegnare parzialmente):</p>
                  ${ordineSel.righe.map((r, i) => {const residuo = r.quantita - (r.consegnato || 0);if (residuo <= 0)return '';const giacenzaDisp = getGiacenzaLoc(r.prodotto, 'SPEDIZIONE');const key = i;if (draftVL.righe[key] === undefined)draftVL.righe[key] = residuo <= giacenzaDisp ? residuo : giacenzaDisp;return `
                          <div style="display:flex; align-items:center; gap:10px; margin-bottom:6px; padding:4px; border:1px solid #e0ddce;">
                            <span style="font-size:11px; width:260px;">${materialeLabel(r.prodotto)} — residuo ${residuo} (in SPEDIZIONE: ${giacenzaDisp})</span>
                            <span style="font-size:10px; color:#8a8a80;">(richiesta ${r.dataRichiesta})</span>
                            <label style="font-size:10.5px; color:#5a6470;">Qtà da consegnare</label>
                            <input type="number" min="0" max="${Math.min(residuo, giacenzaDisp)}" class="vl-qta" data-riga="${key}" value="${draftVL.righe[key]}" style="width:70px; font-size:11px; padding:3px; border:1px solid #7f9db9;">
                            ${giacenzaDisp < residuo ? `<span style="font-size:10px; color:#a83232;">manca merce in SPEDIZIONE per coprire il residuo totale</span>` : ''}

                <tbody>${consegne.length === 0 ? '<tr><td colspan="7" style="text-align:center;color:#9a9a8f;padding:16px;">Nessuna consegna effettuata.</td></tr>' : consegne.map(c => `<tr><td>${c.numero}</td><td>${c.ordineVendita}</td><td>${c.riferimentoCliente || '-'}</td><td>${clienteLabel(c.cliente)}</td><td style="font-size:10.5px;">${c.righe.map(r => materialeLabel(r.prodotto) + ' x' + r.quantita).join(', ')}</td><td>${c.creatoDa}</td><td><span class="print-btn stampa-ddt" data-numero="${c.numero}">🖶 stampa</span></td></tr>`).join('')}
                </tbody>
              </table>
            </div>
          `;
        document.querySelectorAll('.riga-vl-select').forEach(tr => {
            tr.addEventListener('click', () => {
                draftVL.ordineVendita = tr.dataset.ordine;
                draftVL.righe = {};
                renderScreenContent();
            });
        });
        document.getElementById('f-ordine').addEventListener('change', e => {
            draftVL.ordineVendita = e.target.value;
            draftVL.righe = {};
            renderScreenContent();
        });
        document.querySelectorAll('.vl-qta').forEach(inp => {
            inp.addEventListener('input', e => {
                draftVL.righe[e.target.dataset.riga] = e.target.value;
            });
        });
        document.querySelectorAll('.stampa-ddt').forEach(elx => {

            if (!draftVL.ordineVendita) {
                setStatus('Seleziona un ordine di vendita.', true);
                return;
            }
            const ordine = ordiniVendita.find(o => o.numero === draftVL.ordineVendita);
            if (!ordine) {
                setStatus('Ordine non trovato.', true);
                return;
            }

            const righeDaConsegnare = [];
            for (const [idxStr, val] of Object.entries(draftVL.righe)) {
                const idx = Number(idxStr);
                const qta = Number(val) || 0;
                if (qta <= 0)
                    continue;
                const riga = ordine.righe[idx];
                const residuo = riga.quantita - (riga.consegnato || 0);
                if (qta > residuo) {
                    setStatus(`Quantità per ${riga.prodotto} superiore al residuo ordinato.`, true);
                    return;
                }
                const dispSpedizione = getGiacenzaLoc(riga.prodotto, 'SPEDIZIONE');
                if (qta > dispSpedizione) {
                    setStatus(`Merce insufficiente in SPEDIZIONE per ${riga.prodotto}: disponibili ${dispSpedizione}.`, true);
                    return;
                }
                righeDaConsegnare.push({
                    idx,
                    prodotto: riga.prodotto,
                    quantita: qta
                });
            }
            if (righeDaConsegnare.length === 0) {
                setStatus('Inserisci almeno una quantità da consegnare.', true);
                return;
            }

            for (const rc of righeDaConsegnare) {
                ordine.righe[rc.idx].consegnato = (ordine.righe[rc.idx].consegnato || 0) + rc.quantita;
                await registraMovimento({
                    materiale: rc.prodotto,
                    locazioneDa: 'SPEDIZIONE',
                    locazioneA: null,
                    quantita: rc.quantita,
                    causale: 'Spedizione DDT VL01N (' + ordine.numero + ')'
                });
                await applicaPatch('ordiniVendita', ordine.numero, {
                    consegnato: ordine.righe[rc.idx].consegnato
                }, {
                    arrayField: 'righe',
                    arrayIndex: rc.idx
                });
            }
            if (ordine.righe.every(r => (r.consegnato || 0) >= r.quantita)) {
                ordine.stato = 'evaso';
                await applicaPatch('ordiniVendita', ordine.numero, {
                    stato: 'evaso'
                });
            }

            const ddt = {
                numero: await prossimoNumero('DDT'),
                ordineVendita: ordine.numero,
                cliente: ordine.cliente,
                riferimentoCliente: ordine.riferimentoCliente || '',
                righe: righeDaConsegnare.map(rc => ({
                    prodotto: rc.prodotto,
                    quantita: rc.quantita
                })),
                creatoDa: currentUser,
                creatoIl: nowStr(),
            };
            await aggiungiRecord('consegne', ddt);
            consegne.push(ddt);
            draftVL = {
                ordineVendita: "",
                righe: {}
            };
            setStatus(`Consegna registrata: DDT ${ddt.numero} generato per l'ordine ${ordine.numero}.`);
            renderMain();

    // ============ MM01 ============
    // ============ CRUSCOTTO (home page con semafori riassuntivi) ============
    function renderCruscotto(el) {
        const oggiISO = isoDate(new Date());

        let righeVenditaRitardo = 0;
        ordiniVendita.filter(o => o.stato === 'aperto').forEach(o => {
            o.righe.forEach(r => {
                if (r.dataRichiesta && r.dataRichiesta < oggiISO && (r.quantita - (r.consegnato || 0)) > 0)
                    righeVenditaRitardo++;
            });
        });

        const materialiCritici = materiali.filter(m => {
            const inArrivoAcq = ordinatoApertoPer(m.codice);
            const inArrivoProd = m.tipo === 'PF' ? pianificatoApertoPer(m.codice) : 0;
            return (getGiacenza(m.codice) + inArrivoAcq + inArrivoProd) < 0;
        }).length;

        const odpAperti = ordiniProduzione.filter(o => o.stato === 'aperto').length;

        let righeAcquistoRitardo = 0;
        ordiniAcquisto.forEach(o => o.righe.forEach(r => {
            if (!r._rimossa && !rigaCompleta(r) && r.dataConsegna && r.dataConsegna < oggiISO)
                righeAcquistoRitardo++;
        }));

        const kpis = [
        {
            label: "Righe ordine vendita in ritardo",
            valore: righeVenditaRitardo,
            screen: 'VL01N'
        },
        {
            label: "Materiali con copertura critica",
            valore: materialiCritici,
            screen: 'MMBE'
        },
        {
            label: "Ordini di produzione aperti da evadere",
            valore: odpAperti,
            screen: 'CO15'
        },
        {
            label: "Righe d'ordine fornitore in ritardo",
            valore: righeAcquistoRitardo,
            screen: 'MIGO'
        },
        ];

        function coloreKpi(v) {
            return v === 0 ? 'verde' : (v <= 2 ? 'giallo' : 'rosso');
        }

        el.innerHTML = `
            <div style="padding:16px; overflow-y:auto; width:100%;">
              <h3 style="margin:0 0 4px 0; font-size:13px;">Cruscotto — Corso ${currentCorso}</h3>
              <p style="font-size:11px; color:#5a6470; margin:0 0 14px 0;">Semaforo riassuntivo della situazione attuale. Clicca una scheda per andare direttamente alla transazione. Seleziona una voce dal menu a sinistra per operare (es. MM01, XK01, XD01, CS01).</p>
              <div style="display:grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap:10px; max-width:800px;">
                ${kpis.map(k => `
                  <div class="kpi-card" data-screen="${k.screen}" style="cursor:pointer; border:1px solid #c8c2a8; background:white; padding:12px 14px; display:flex; align-items:center; gap:12px;">
                    <span class="semaforo semaforo-${coloreKpi(k.valore)}" style="width:16px; height:16px; margin:0;"></span>
                    <div>
                      <div style="font-size:22px; font-weight:700; line-height:1;">${k.valore}</div>
                      <div style="font-size:10.5px; color:#5a6470; margin-top:2px;">${k.label}</div>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          `;
        document.querySelectorAll('.kpi-card').forEach(card => {
            card.addEventListener('click', () => {
                screen = card.dataset.screen;
                statusMsg = '';
                renderMain();
            });
        });
    }

          `;

        attachDeleteBaseListeners();
        document.querySelectorAll('.confirm-delete-yes').forEach(el => {
            el.addEventListener('click', () => withGuard(async () => {
                const prodotto = el.dataset.key.replace('bom-', '');
                await eliminaRecord('distinte', prodotto);
                distinte = distinte.filter(d => d.prodotto !== prodotto);
                confirmDeleteKey = null;
                setStatus(`Distinta base per ${prodotto} eliminata.`);
                renderMain();
            }));
        });
        document.getElementById('f-prodotto').addEventListener('change', (e) => {
            draftDistinta.prodotto = e.target.value;
        });
        document.getElementById('add-comp').addEventListener('click', () => {
            draftDistinta.componenti.push({
                codice: "",
                qta: "1"
            });
            renderScreenContent();
        });
        document.querySelectorAll('.comp-codice').forEach(sel => {
            sel.addEventListener('change', (e) => {
                draftDistinta.componenti[Number(e.target.dataset.i)].codice = e.target.value;
            });
        });
        document.querySelectorAll('.comp-qta').forEach(inp => {
            inp.addEventListener('input', (e) => {
                draftDistinta.componenti[Number(e.target.dataset.i)].qta = e.target.value;
            });
        });
        document.getElementById('save-cs01').addEventListener('click', () => withGuard(async () => {
            if (!draftDistinta.prodotto) {
                setStatus('Seleziona un prodotto finito.', true);
                return;
            }
            const compValide = draftDistinta.componenti.filter(c => c.codice && Number(c.qta) > 0);
            if (compValide.length === 0) {
                setStatus('Aggiungi almeno un componente valido.', true);
                return;
            }
            distinte = await loadList('distinte');
            if (distinte.some(d => d.prodotto === draftDistinta.prodotto)) {
                setStatus('Esiste già una distinta base per questo prodotto.', true);
                return;
            }
            const rec = {
                prodotto: draftDistinta.prodotto,
                componenti: compValide,
                creatoDa: currentUser,
                creatoIl: nowStr()
            };
            await aggiungiRecord('distinte', rec);
            distinte.push(rec);
            draftDistinta = {
                prodotto: "",
                componenti: [{
                    codice: "",
                    qta: "1"
                }]
            };
            setStatus(`Distinta base per ${rec.prodotto} creata con successo.`);
            renderMain();
        }));
    }

    // ============ BOOT ============
    // Migra ordini di vendita salvati con il vecchio formato mono-riga (prima dell'introduzione delle righe multiple)
    function normalizzaOrdiniVendita(list) {
        let migrati = 0;
        const out = list.map(o => {
            if (!Array.isArray(o.righe)) {
                migrati++;
                o = {
                    numero: o.numero,
                    cliente: o.cliente,
                    stato: o.stato || 'aperto',
                    creatoDa: o.creatoDa,
                    creatoIl: o.creatoIl,
                    righe: [{
                        prodotto: o.prodotto,
                        quantita: o.quantita,
                        dataRichiesta: o.dataRichiesta
                    }],
                };
            }
            o.righe.forEach(r => {
                if (r.consegnato === undefined) {
                    r.consegnato = 0;
                    migrati++;
                }
            });
            return o;
        });
        return {
            out,
            migrati
        };
    }

    async function boot() {
        await caricaCacheCorso(); // un solo viaggio di rete per tutti i dati di questo corso
        await migraVecchioFormatoSeNecessario();

        materiali = await loadList('materiali');
        fornitori = await loadList('fornitori');
        clienti = await loadList('clienti');
        distinte = await loadList('distinte');
        ordiniVendita = await loadList('ordiniVendita');
        ordiniProduzione = await loadList('ordiniProduzione');
        lineeProduzione = await loadList('lineeProduzione');
        assegnazioni = await loadList('assegnazioni');
        richiesteAcquisto = await loadList('richiesteAcquisto');
        ordiniAcquisto = await loadList('ordiniAcquisto');
        fornitoriMateriale = await loadList('fornitoriMateriale');
        consegne = await loadList('consegne');
        locazioni = await loadList('locazioni');
        movimentazioni = await loadList('movimentazioni');
        preferiti = await loadList('preferiti', false);

        const {out} = normalizzaOrdiniVendita(ordiniVendita);
        ordiniVendita = out; // normalizzazione solo in memoria: i vecchi formati restano leggibili senza riscrivere lo storage

        screen = 'easy';
        renderMain();
    }

    function render() {
        renderMain();
    }

    }

    (async () => {
        if (!STORAGE_CONFIGURATO) {
            console.warn('FIREBASE_URL non configurato: i dati non saranno condivisi finché non viene impostato correttamente nel codice.');
        }
        const ban = await dispositivoBannato();
        if (ban) {
            renderDispositivoBannato(ban);
            return;
        }
        await migraDatiLegacySeNecessario();
        const sessione = await _leggiSessioneDispositivo();
        if (sessione && sessione.corso && sessione.utente) {
            currentCorso = sessione.corso;
            currentUser = sessione.utente;
            boot();
        } else {
            renderCorsoSelect();
        }
    })();
