  /* L'intestazione "fissa" durante lo scroll deve valere SOLO per la prima tabella di una schermata
     (quella principale). Applicarla a "th" in generale rompe le schermate con più tabelle piccole in

<script>
// ============ STORAGE HELPERS ============
// Backend: Firebase Realtime Database (sostituisce Google Sheets/Apps Script, troppo lento
// per un uso con più corsisti insieme). Stesso account Google, gratuito per questo volume.
//
// >>> URL del Realtime Database <<<
const FIREBASE_URL = 'https://grs-erp-e023d-default-rtdb.firebaseio.com';
// >>> Database alternativo: Supabase <<<
// Se SUPABASE_URL e SUPABASE_KEY sono compilati, il programma usa Supabase al posto di Firebase.
// Se restano vuoti ('') il programma usa Firebase come sempre. Tutto il resto del codice è identico:
// la stessa pagina può quindi funzionare con l'uno o con l'altro cambiando solo queste due righe.
const SUPABASE_URL = 'https://zpnwqybvsowzqycesnlc.supabase.co';   // es. 'https://abcdxyz.supabase.co'
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpwbndxeWJ2c293enF5Y2VzbmxjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4MjQxMDksImV4cCI6MjEwNzQwMDEwOX0.6wbHPOfAYiaffC0NeAVCXaCtItpHRg_67v3_SM14YrI';   // chiave "anon public" del progetto (Project Settings -> API)
const USA_SUPABASE = !!(SUPABASE_URL && SUPABASE_KEY);
const STORAGE_CONFIGURATO = USA_SUPABASE || !FIREBASE_URL.startsWith('INSERISCI_QUI');

let storageOk = true; // true = backend condiviso raggiungibile, false = fallback locale (solo in memoria, non condiviso)
const _localFallback = {};
let currentCorso = null;

// Tutti i dati vivono sotto il nodo "storage/" del database, con la stessa chiave piatta
// usata prima (es. "corso_X::materiali::u::mario"). I due punti ":" sono ammessi nei percorsi
// Firebase, quindi non serve altra codifica oltre a quella standard dell'URL.
function _firebasePath(key) {
  return FIREBASE_URL + '/storage/' + encodeURIComponent(key) + '.json';
}

// IMPORTANTE: fetch() NON lancia un errore per risposte HTTP di errore (401/403/500/...),
// lo fa solo per fallimenti di rete veri e propri (DNS, connessione assente). Se non controlliamo
// esplicitamente res.ok, una scrittura rifiutata da Firebase (es. regole di sicurezza, chiave
// non valida) sembra "riuscita" qui, il chiamante la considera andata a buon fine, la cache di
// sessione viene aggiornata come se il dato fosse salvato — ma sul server non è cambiato nulla.
// Risultato: l'azione sembra funzionare (es. un ordine sparisce dalla lista), ma al refresh
// della pagina, che ricarica i dati veri dal server, quel dato torna come prima. Per questo
// ogni chiamata qui controlla res.ok e lancia un errore se la richiesta non è realmente riuscita,
// così il meccanismo di retry/fallback/diagnostica già presente in getRaw/setRaw entra in azione
// davvero invece di essere bypassato in silenzio.
async function _verificaRisposta(res, azione, key) {
  if (!res.ok) {
    let corpo = '';
    try { corpo = await res.text(); } catch (e) {}
    throw new Error(`Firebase ha rifiutato la ${azione} su "${key}": HTTP ${res.status} ${res.statusText}${corpo ? ' — ' + corpo.slice(0,200) : ''}`);
  }
}
const remoteStorageFirebase = {
  async get(key) {
    // "&_=" con timestamp: impedisce al browser di servire una risposta vecchia dalla cache.
    const res = await fetch(_firebasePath(key) + '?_=' + Date.now(), { cache: 'no-store' });
    await _verificaRisposta(res, 'lettura', key);
    const dato = await res.json(); // null se la chiave non esiste
    if (dato === null || dato === undefined) return null;
    return { value: JSON.stringify(dato) }; // stessa "forma" di prima: una stringa JSON
  },
  // Legge in UN SOLO viaggio di rete tutte le chiavi che iniziano con "prefix".
  // Ritorna una mappa { chiave: valoreStringaJSON }. Usato per caricare tutto un corso in un colpo solo.
  async getPrefix(prefix) {
    // Per risparmiare traffico (la quota di download di Firebase si esaurisce) chiede al database SOLO le chiavi
    // che iniziano con il prefisso (query su $key, che non richiede indici). Se la query non va a buon fine, o
    // restituisce vuoto per un prefisso di corso, ripiega sul vecchio metodo: scarica tutto e filtra qui.
    try {
      const q = '?orderBy=' + encodeURIComponent('"$key"') + '&startAt=' + encodeURIComponent('"' + prefix + '"')
        + '&endAt=' + encodeURIComponent('"' + prefix + '\uf8ff"') + '&_=' + Date.now();
      const r = await fetch(FIREBASE_URL + '/storage.json' + q, { cache: 'no-store' });
      if (r.ok) {
        const parziale = await r.json();
        if (parziale === null || (typeof parziale === 'object' && !parziale.error)) {
          const m = {};
          for (const kc in (parziale || {})) { const k = decodeURIComponent(kc); if (k.indexOf(prefix) === 0) m[k] = JSON.stringify(parziale[kc]); }
          if (Object.keys(m).length > 0 || prefix.indexOf('corso_') !== 0) return m;
        }

// All'apertura del corso (e a ogni 🔄 aggiorna) scarichiamo TUTTE le chiavi del corso
// in una volta sola e le teniamo qui; getRaw le legge da qui invece che dalla rete.
let _cacheCorso = null; // null = non ancora caricata; altrimenti { chiave: valoreStringa }

// scarica di nuovo SOLO le chiavi cambiate, invece di tutto il corso. Con prefisso parziale (es. solo i movimenti)
// serve ai controlli di disponibilità, che devono vedere anche ciò che hanno registrato gli altri un attimo prima.
async function aggiornaCacheIncrementale(prefisso) {
  const elenco = await remoteStorage.chiavi(prefisso);

  const daScaricare = elenco.filter(x => _cacheCorso[x.key] === undefined || _aggChiave[x.key] !== _msAgg(x.agg)).map(x => x.key);
  if (daScaricare.length) Object.assign(_cacheCorso, await remoteStorage.getChiavi(daScaricare));

  }

async function caricaCacheCorso() {

  if (USA_SUPABASE && _cacheCorso && _cacheCorsoDi === currentCorso && Object.keys(_cacheCorso).length) {
    try {
      await aggiornaCacheIncrementale('corso_' + currentCorso + '::');
      _ultimoScaricoCache = new Date(); storageOk = true;
      return;
    } catch (e) { /* ripiego sul download completo */ }
  }
  const MAX_TENTATIVI = 3;
  for (let tentativo = 1; tentativo <= MAX_TENTATIVI; tentativo++) {
    try {
      _cacheCorso = await remoteStorage.getPrefix('corso_' + currentCorso + '::');
      _cacheCorsoDi = currentCorso;
      _ultimoScaricoCache = new Date();
      storageOk = true;
      return;
    } catch (e) {
      if (tentativo === MAX_TENTATIVI) {
        _diagRegistraErrore('lettura-blocco', 'corso_' + currentCorso + '::*', e);
        storageOk = false;

        if (!_cacheCorso || Object.keys(_cacheCorso).length === 0) _cacheCorso = null;
      } else {
        await attesa(250 * tentativo + Math.random() * 150);

    }
  }

const CHIAVI_CORSO = ['materiali','fornitori','clienti','distinte','ordiniVendita','ordiniProduzione',
  'lineeProduzione','assegnazioni','richiesteAcquisto','ordiniAcquisto','fornitoriMateriale','consegne',
  'locazioni','movimentazioni','erroriMovimenti'];

// Campo che identifica univocamente un record di ciascun tipo (serve per applicare le "patch" di stato)
const CAMPO_CHIAVE = {
  materiali: 'codice', fornitori: 'codice', clienti: 'codice', lineeProduzione: 'codice', locazioni: 'codice',
  distinte: 'prodotto', ordiniVendita: 'numero', ordiniProduzione: 'numero',

  assegnazioni: (r) => r.prodotto + '::' + r.linea,
  fornitoriMateriale: (r) => r.materiale + '::' + r.fornitore,
  erroriMovimenti: 'numero',
};
function chiaveDiRecord(key, record) {
  const cc = CAMPO_CHIAVE[key];
  return typeof cc === 'function' ? cc(record) : record[cc];
}
// Data di creazione "gg/mm/aaaa hh:mm" → millisecondi (null se assente o illeggibile).
function _msCreatoIl(s) {
  const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2}))?/.exec(String(s || ''));
  return m ? new Date(+m[3], +m[2] - 1, +m[1], +(m[4] || 0), +(m[5] || 0)).getTime() : null;
}
// Applica le patch (in ordine di tempo) a un elenco di record. Se più record hanno la stessa chiave
// (es. una distinta creata due volte, o eliminata e poi ricreata con CS01), la patch va al primo record
// ANCORA VALIDO che esisteva già quando la patch è stata fatta — cioè quello che l'utente vedeva.
// Prima andava sempre al primo record in assoluto, anche se già eliminato: le modifiche "sparivano"
// su una copia invisibile (CS02 che non aggiorna la distinta).
// La regola vale solo per le patch fatte da questa data in poi: quelle precedenti sono state fatte vedendo lo
// schermo con la regola vecchia, e rileggerle con la nuova cambierebbe dati che oggi tutti vedono in un altro modo
// (es. eliminazioni ripetute che finirebbero su copie di altri corsisti).
const PATCH_REGOLA_COPIA_VALIDA_DAL = Date.UTC(2026, 9, 13, 8, 55, 30); // 13/10/2026 10:55:30 ora italiana (dopo le ultime eliminazioni di LA001 fatte con la regola vecchia)
function applicaPatchAElenco(key, elenco, patches, rec = (x) => x) {
  const perChiave = new Map();
  elenco.forEach(x => {
    const k = chiaveDiRecord(key, rec(x));
    if (!perChiave.has(k)) perChiave.set(k, []);
    perChiave.get(k).push(x);
  });
  patches.slice().sort((a, b) => (a._t || 0) - (b._t || 0)).forEach(patch => {
    const stessi = perChiave.get(patch._target);
    if (!stessi) return;
    let bersaglio = stessi[0];
    if ((patch._t || 0) >= PATCH_REGOLA_COPIA_VALIDA_DAL) {
      // Solo record che esistevano già quando la patch è stata fatta (15 minuti di tolleranza per orologi
      // dei dispositivi non allineati): un'eliminazione vecchia non deve colpire un record ricreato dopo con lo
      // stesso codice. Tra questi si preferisce quello ancora valido; se non ce n'è nessuno la patch si ignora.
      const esistenti = stessi.filter(x => { const t = _msCreatoIl(rec(x).creatoIl); return t === null || t <= patch._t + 15 * 60000; });
      bersaglio = esistenti.find(x => !rec(x)._eliminato) || esistenti[0];
      if (!bersaglio) return;
    }
    const r = rec(bersaglio);
    if (patch._arrayField && r[patch._arrayField] && r[patch._arrayField][patch._arrayIndex]) {
      Object.assign(r[patch._arrayField][patch._arrayIndex], patch.campi);
    } else {
      Object.assign(r, patch.campi);
    }
  });
}

// ---- UN NOME, UN DISPOSITIVO: lo stesso nome (cassetto) usato da due browser/dispositivi/schede insieme
// può far perdere dati (uno dei due riscrive il cassetto senza i record dell'altro). Ogni nome ha quindi un
// "blocco" corso_X::sessione::<nome> che indica quale dispositivo/scheda lo sta usando. Un altro dispositivo
// resta fermo finché il formatore non sblocca il nome dal Pannello docente (o il primo esce con "Esci",
// o resta inattivo per più di SESSIONE_SCADE_MS). Più schede dello stesso browser lavorano insieme senza
// problemi (stesso dispositivo; ogni salvataggio rilegge il cassetto dal server). I dispositivi del formatore sono esenti.

let _ultimoControlloNome = 0;
let _esenteBloccoNome = null; // null = non ancora verificato
function _idScheda() {
  try {

    return id;

}
function _chiaveBloccoNome() { return 'corso_' + currentCorso + '::sessione::' + nomeShard(); }
async function _leggiBloccoNome() {
  const r = await remoteStorage.get(_chiaveBloccoNome());

  try { return JSON.parse(r.value); } catch (e) { return null; }

async function _scriviBloccoNome() {

    browser: _descriviBrowser(), ultimoAccesso: nowStr(), ts: Date.now() }));

function _bloccoMio(b) { return b && !b.libero && b.dispositivo === getDeviceId(); }
function _bloccoAttivo(b) { return b && !b.libero && (Date.now() - (Number(b.ts) || 0)) < SESSIONE_SCADE_MS; }

// All'accesso: prende il nome se è libero (o già suo, o scaduto). Ritorna true se si può proseguire.
async function acquisisciNome() {
  _sessioneBloccata = false;
  if (await _esenteDaBloccoNome()) { _nomeAcquisito = false; return true; }
  let b = null;
  try { b = await _leggiBloccoNome(); } catch (e) { return true; } // rete assente: non si blocca il lavoro
  if (!_bloccoMio(b) && _bloccoAttivo(b)) {

}
// Durante il lavoro: se il nome è passato a un altro dispositivo/scheda (o il formatore lo ha sbloccato per

async function getRaw(storageKey) {
  _diagLetture++;
  // Se la cache di sessione per questo corso è stata caricata, e la chiave è del tipo
  // "corso_X::...", rispondiamo da lì senza fare una richiesta di rete separata.
  if (_cacheCorso && storageKey.indexOf('corso_' + currentCorso + '::') === 0) {
    const v = _cacheCorso[storageKey];
    return v !== undefined ? JSON.parse(v) : [];
  }
  const MAX_TENTATIVI = 3;
  let ultimoErrore = null;
  for (let tentativo = 1; tentativo <= MAX_TENTATIVI; tentativo++) {
    try {
      if (!STORAGE_CONFIGURATO) throw new Error('URL Apps Script non configurato nel codice');
      const res = await remoteStorage.get(storageKey);
      storageOk = true;
      return res ? JSON.parse(res.value) : [];
    } catch (e) {
      ultimoErrore = e;
      if (tentativo < MAX_TENTATIVI) await attesa(250 * tentativo + Math.random() * 150);
    }
  }
  // Tutti i tentativi falliti: registriamo l'errore e usiamo il fallback locale.
  _diagLettureFallite++;
  _diagRegistraErrore('lettura', storageKey, ultimoErrore);
  storageOk = false;
  return _localFallback[storageKey] || [];
}
async function setRaw(storageKey, arr) {
  _localFallback[storageKey] = arr;
  const MAX_TENTATIVI = 3;
  for (let tentativo = 1; tentativo <= MAX_TENTATIVI; tentativo++) {
    try {
      if (!STORAGE_CONFIGURATO) throw new Error('URL Apps Script non configurato nel codice');
      await remoteStorage.set(storageKey, JSON.stringify(arr));
      storageOk = true;
      _diagScrittureOk++;
      // Aggiorniamo anche la cache di sessione, così la prossima lettura nella stessa
      // sessione vede subito il dato appena scritto senza dover richiamare la rete.
      if (_cacheCorso) _cacheCorso[storageKey] = JSON.stringify(arr);
      return true; // successo, esco
    } catch (e) {
      if (tentativo === MAX_TENTATIVI) {
        // solo dopo aver esaurito i tentativi consideriamo la scrittura davvero fallita
        storageOk = false;
        _diagScrittureFallite++;
        _diagRegistraErrore('scrittura', storageKey, e);
        return false;
      } else {
        // possibile blocco temporaneo (es. limite di frequenza): breve attesa e nuovo tentativo
        await attesa(300 * tentativo + Math.random() * 200);
      }
    }
  }
  return false;
}
async function saveSimple(key, arr) {
  if (key === 'preferiti') {
    try { localStorage.setItem('__preferiti_dispositivo__', JSON.stringify(arr)); } catch (e) {}
    return;

// RECUPERO: se per questo corso esistono ancora dati nel VECCHIO formato (una lista unica condivisa,
// da prima dell'introduzione dei cassetti personali), li importo una tantum in un cassetto dedicato
// "recupero-dati-precedenti", così tutto quello che era visibile prima resta visibile anche ora.
async function recuperaDatiVecchioFormatoSeNecessario() {
  const flagKey = corsoKey('__migrazione_cassetti_v1__');
  const gia = await getRaw(flagKey, true);
  if (gia && gia.fatto) return;
  for (const key of CHIAVI_CORSO) {
    const vecchia = await getRaw(corsoKey(key), true); // vecchia chiave "piatta", condivisa
    if (vecchia && vecchia.length > 0) {
      const chiaveCassetto = corsoKey(key) + '::u::recupero-dati-precedenti';
      const giaNelCassetto = await getRaw(chiaveCassetto, true);
      if (giaNelCassetto.length === 0) await setRaw(chiaveCassetto, vecchia, true);
    }
  }
  // registro l'utente "sistema" che ha effettuato il recupero, come partecipante, altrimenti il suo cassetto non verrebbe mai letto
  const chiavePart = corsoKey('partecipanti');
  const elencoPart = await getRaw(chiavePart, true);
  if (!elencoPart.some(p => p.shard === 'recupero-dati-precedenti')) {
    elencoPart.push({ shard: 'recupero-dati-precedenti', nome: '(dati recuperati dal formato precedente)', primoAccesso: nowStr() });
    await setRaw(chiavePart, elencoPart, true);
  }
  await setRaw(flagKey, { fatto: true, quando: nowStr() }, true);
}

async function registraPartecipante() {
  const mioShard = nomeShard();
  const chiave = corsoKey('partecipanti') + '::' + mioShard; // es. "corso_X::partecipanti::mario"
  // Con una chiave tutta sua per ogni partecipante, non c'è più nessuna lista condivisa da
  // leggere-modificare-riscrivere: registrarsi è solo scrivere il proprio record, in totale
  // sicurezza anche se altri corsisti si registrano nello stesso istante.
  if (_cacheCorso && _cacheCorso[chiave] !== undefined) return; // già registrato, niente da fare
  const esistente = await remoteStorage.get(chiave);
  if (esistente) { if (_cacheCorso) _cacheCorso[chiave] = esistente.value; return; }
  await setRaw(chiave, { shard: mioShard, nome: currentUser, primoAccesso: nowStr() });
}
async function elencoPartecipanti() {
  const prefissoPartecipanti = corsoKey('partecipanti') + '::';
  let elenco = [];
  if (_cacheCorso) {
    for (const k in _cacheCorso) {
      if (k.indexOf(prefissoPartecipanti) === 0) {
        try { elenco.push(JSON.parse(_cacheCorso[k])); } catch (e) { /* voce corrotta, ignorata */ }
      }
    }
  } else {
    const mappa = await remoteStorage.getPrefix(prefissoPartecipanti);
    elenco = Object.values(mappa).map(v => JSON.parse(v));
  }
  const shardCorrente = nomeShard();
  if (!elenco.some(p => p.shard === shardCorrente)) elenco.push({ shard: shardCorrente, nome: currentUser });
  if (!elenco.some(p => p.shard === '_migrazione_')) elenco.push({ shard: '_migrazione_', nome: 'Dati precedenti' });
  return elenco;
}

// Migrazione una tantum per ogni corso: sposta i dati salvati con il vecchio formato a chiave unica
// (da prima dell'introduzione dei cassetti personali) in un cassetto dedicato "_migrazione_", così
// restano visibili e non vengono persi nel passaggio al nuovo modello.
async function migraVecchioFormatoSeNecessario() {
  if (!STORAGE_CONFIGURATO) return;
  const flagKey = corsoKey('_migrazione_cassetti_v1_');
  try {
    const fatto = await remoteStorage.get(flagKey);
    if (fatto) return;
  } catch (e) { /* non ancora fatta, procedo */ }
  for (const key of CHIAVI_CORSO) {
    try {
      const vecchi = await getRaw(corsoKey(key));
      if (Array.isArray(vecchi) && vecchi.length > 0) {
        await setRaw(corsoKey(key) + '::u::_migrazione_', vecchi);
      }
    } catch (e) { /* chiave inesistente, nulla da migrare */ }
  }
  try { await remoteStorage.set(flagKey, 'fatto'); } catch (e) {}
}

// LETTURA: unisce i "cassetti" di tutti i partecipanti in un'unica lista, poi applica sopra le eventuali
// "patch" di stato (conferme, evasioni, ecc.) e le eliminazioni — ognuna scritta da chi l'ha fatta, nel proprio cassetto.
async function loadList(key, shared = true) {
  if (key === 'preferiti') {
    // Dato personale del dispositivo, non va condiviso tra corsisti: localStorage, non il backend.
    try { return JSON.parse(localStorage.getItem('__preferiti_dispositivo__') || '[]'); }
    catch (e) { return []; }
  }
  if (key === 'corsiRegistrati') return await caricaElencoCorsi();
  if (!CHIAVI_CORSO.includes(key)) {
    return await getRaw(corsoKey(key), shared);
  }
  const partecipanti = await elencoPartecipanti();
  const basi = await Promise.all(partecipanti.map(p => getRaw(corsoKey(key) + '::u::' + p.shard, true)));
  let combinata = basi.flat();

  if (key === 'locazioni') {
    const codiciEsistenti = new Set(combinata.map(l => l.codice));
    LOCAZIONI_FISSE.forEach(lf => {
      if (!codiciEsistenti.has(lf.codice)) combinata.unshift({ codice: lf.codice, descrizione: lf.descrizione, fissa: true, creatoDa: 'sistema', creatoIl: '' });
    });
  }

  const campoChiave = CAMPO_CHIAVE[key];
  if (campoChiave) {
    const patchLists = await Promise.all(partecipanti.map(p => getRaw(corsoKey(key) + '::patch::' + p.shard, true)));
    applicaPatchAElenco(key, combinata, patchLists.flat());
    combinata = combinata.filter(r => !r._eliminato);
  }
  return combinata;
}

// SCRITTURA (creazione): il nuovo record va SEMPRE E SOLO nel cassetto dell'utente corrente.
// Legge un cassetto DAL SERVER (non dalla cache di sessione) subito prima di modificarlo: se lo stesso utente è
// collegato da due schede/dispositivi, o un tool di manutenzione ha riscritto il cassetto, la cache locale è vecchia
// e riscriverla per intero cancellerebbe in silenzio quanto scritto dall'altra sessione (es. conferme di spedizione
// perse: l'ordine "ricompare" come aperto).
async function leggiCassettoFresco(chiave) {
  if (STORAGE_CONFIGURATO) {
    try {
      const res = await remoteStorage.get(chiave);
      const v = res ? JSON.parse(res.value) : [];
      const arr = Array.isArray(v) ? v : [];
      if (_cacheCorso) _cacheCorso[chiave] = JSON.stringify(arr);
      return arr;
    } catch (e) { /* ripiego sulla lettura normale (con retry/cache) */ }
  }
  return await getRaw(chiave, true);
}
// Salvataggio "leggero" (Supabase): il server aggiunge il record in coda al cassetto, si invia solo il record nuovo.
// La copia locale (cache) si aggiorna aggiungendo lo stesso record; se la lunghezza non torna con quella del server
// (es. un'altra scheda ha aggiunto qualcosa nel frattempo) si rilegge quel cassetto. Ritorna false se non disponibile:
// in quel caso il chiamante usa il metodo classico (rilettura + riscrittura del cassetto).
let _appendiDisponibile = true;
async function _appendiAlCassetto(chiave, record) {
  if (!USA_SUPABASE || !_appendiDisponibile || !remoteStorage.appendi) return false;
  let esito = null;
  for (let tentativo = 1; tentativo <= 3 && !esito; tentativo++) {
    try { esito = await remoteStorage.appendi(chiave, record); }
    catch (e) {
      if (/aggiungi_record|Could not find|PGRST202|404/.test(String(e && e.message))) { _appendiDisponibile = false; return false; }
      if (tentativo === 3) { _diagScrittureFallite++; _diagRegistraErrore('scrittura', chiave, e); throw new Error('Salvataggio NON riuscito (connessione o server non raggiungibile). Il dato non è stato registrato: riprova tra poco.'); }
      await attesa(500 * tentativo);
    }
  }
  _diagScrittureOk++; storageOk = true;
  if (_cacheCorso) {
    let locale = null;
    if (_cacheCorso[chiave] !== undefined) { try { locale = JSON.parse(_cacheCorso[chiave]); } catch (e) {} }
    if (Array.isArray(locale) && locale.length + 1 === esito.n) { locale.push(record); _cacheCorso[chiave] = JSON.stringify(locale); }
    else if (!Array.isArray(locale) && esito.n === 1) { _cacheCorso[chiave] = JSON.stringify([record]); }
    else { try { Object.assign(_cacheCorso, await remoteStorage.getChiavi([chiave])); } catch (e) { delete _cacheCorso[chiave]; } }
  }
  return true;
}
function _erroreSessioneFermata() {
  const e = new Error('Sessione fermata: il nome è in uso su un altro dispositivo.'); e.sessioneFermata = true; return e;
}
async function aggiungiRecord(key, record) {
  if (!(await verificaNomeAncoraMio())) throw _erroreSessioneFermata();
  await registraPartecipante();
  const chiaveCassetto = corsoKey(key) + '::u::' + nomeShard();
  if (await _appendiAlCassetto(chiaveCassetto, record)) return record;
  // Rilettura dal server + scrittura, ripetute se la scrittura non riesce: il record non va mai perso in silenzio.
  for (let tentativo = 1; tentativo <= 3; tentativo++) {
    const mio = await leggiCassettoFresco(chiaveCassetto);
    mio.push(record);
    if (await setRaw(chiaveCassetto, mio, true)) return record;
    await attesa(500 * tentativo);
  }
  throw new Error('Salvataggio NON riuscito (connessione o server non raggiungibile). Il dato non è stato registrato: riprova tra poco.');
}

// SCRITTURA (modifica di stato su un record esistente, magari creato da un altro utente): patch nel MIO cassetto.
// Ritorna true/false: se false, la patch NON è stata salvata condivisa (solo in locale) — il
// chiamante deve trattarla come fallita, non come riuscita, altrimenti il record resta "a metà"
// (es. un ordine che sembra confermato su questo dispositivo ma torna aperto per tutti gli altri,
// portando a elaborarlo più volte).
async function applicaPatch(key, valoreChiave, campiDaAggiornare, opzioni = {}) {
  if (!(await verificaNomeAncoraMio())) throw _erroreSessioneFermata();
  await registraPartecipante();
  const chiaveCassetto = corsoKey(key) + '::patch::' + nomeShard();
  const patch = { _target: valoreChiave, _t: Date.now(), _da: currentUser, campi: campiDaAggiornare, _arrayField: opzioni.arrayField || null, _arrayIndex: opzioni.arrayIndex !== undefined ? opzioni.arrayIndex : null };
  if (await _appendiAlCassetto(chiaveCassetto, patch)) return true;
  for (let tentativo = 1; tentativo <= 3; tentativo++) {
    const mie = await leggiCassettoFresco(chiaveCassetto);
    mie.push(patch);
    if (await setRaw(chiaveCassetto, mie, true)) return true;
    await attesa(500 * tentativo);
  }
  return false;
}
async function eliminaRecord(key, valoreChiave) {
  if (!(await applicaPatch(key, valoreChiave, { _eliminato: true }))) {
    throw new Error('Eliminazione NON riuscita (connessione o server non raggiungibile): riprova tra poco.');
  }
}

// La giacenza NON è un numero salvato: si calcola sempre sommando i movimenti (entrate meno uscite).
// Indice delle giacenze, ricalcolato solo quando cambiano i movimenti (nuovo elenco o movimenti aggiunti):
// prima ogni cella di MMBE/LS24 riscorreva tutti i movimenti (decine di milioni di passaggi nei corsi grandi).
let _indiceGiac = null;
function _indiceGiacenze() {
  if (_indiceGiac && _indiceGiac.ref === movimentazioni && _indiceGiac.len === movimentazioni.length) return _indiceGiac;
  const perLoc = new Map(), totale = new Map();
  const add = (mappa, k, q) => mappa.set(k, (mappa.get(k) || 0) + q);
  movimentazioni.forEach(m => {
    const q = m.quantita;
    if (m.locazioneA) add(perLoc, m.materiale + '\u0001' + m.locazioneA, q);
    if (m.locazioneDa) add(perLoc, m.materiale + '\u0001' + m.locazioneDa, -q);
    if (m.locazioneA && !m.locazioneDa) add(totale, m.materiale, q);
    if (m.locazioneDa && !m.locazioneA) add(totale, m.materiale, -q);
  });
  _indiceGiac = { ref: movimentazioni, len: movimentazioni.length, perLoc, totale };
  return _indiceGiac;
}
function getGiacenzaLoc(materiale, locazione) {
  return _indiceGiacenze().perLoc.get(materiale + '\u0001' + locazione) || 0;
}
// Ubicazioni in anagrafica + quelle che compaiono nei movimenti ma non sono (più) in anagrafica (es. eliminate
// dopo averci messo merce): senza queste, LS24 non mostrerebbe quella merce mentre MMBE la conta nel totale.
function ubicazioniConMovimenti() {
  const note = new Set(locazioni.map(l => l.codice));
  const extra = new Set();
  movimentazioni.forEach(m => { [m.locazioneA, m.locazioneDa].forEach(c => { if (c && !note.has(c)) extra.add(c); }); });
  return locazioni.concat([...extra].sort().map(c => ({ codice: c, descrizione: '⚠ ubicazione non in anagrafica', fantasma: true })));
}
function getGiacenza(codice) {
  return _indiceGiacenze().totale.get(codice) || 0;
}
// `extra` porta campi opzionali che rendono il movimento AUTOSUFFICIENTE per una stampa futura
// (numeroOrdineRif, fornitore, ddtFornitore, ricevutoDa, ecc.), così la stampa del verbale di
// ricevimento (vedi stampaMovimentoRicevimento) non dipende più dal fatto che l'ordine d'acquisto
// originale esista ancora invariato: il movimento, una volta registrato, non viene mai toccato o
// cancellato da nessuna altra funzione (annullo ordine, pulizia massiva, ecc.).
async function registraMovimento({ materiale, locazioneDa, locazioneA, quantita, causale, extra }) {
  const rec = {
    numero: 'MOV-' + Date.now().toString(36).toUpperCase() + '-' + Math.random().toString(36).slice(2,6).toUpperCase(),
    materiale, locazioneDa: locazioneDa || null, locazioneA: locazioneA || null,
    quantita, causale, data: nowStr(), creatoDa: currentUser, creatoIl: nowStr(),
    ...(extra || {}),
  };
  await aggiungiRecord('movimentazioni', rec);
  movimentazioni.push(rec);
  return rec;
}

// Righe d'ordine d'acquisto: gestione ricevimento parziale + annullamento per singola riga.
function rigaQtaRicevuta(r) { return r.ricevuto ? Number(r.quantita) : Number(r.quantitaRicevuta || 0); }
function rigaCompleta(r) { return rigaQtaRicevuta(r) >= Number(r.quantita); }
function rigaHaRicezioni(r) { return rigaQtaRicevuta(r) > 0; }

function materialeInUso(codice) {
  const inOV = ordiniVendita.some(o => o.righe.some(r => r.prodotto === codice));
  const inOP = ordiniProduzione.some(o => o.prodotto === codice || o.componenti.some(c => c.codice === codice));
  const inBOM = distinte.some(d => d.prodotto === codice || d.componenti.some(c => c.codice === codice));
  const inPR = richiesteAcquisto.some(r => r.materiale === codice);
  const inPO = ordiniAcquisto.some(o => o.righe.some(r => r.materiale === codice));
  return inOV || inOP || inBOM || inPR || inPO;
}
function clienteInUso(codice) {
  return ordiniVendita.some(o => o.cliente === codice);
}
function fornitoreInUso(codice) {
  return ordiniAcquisto.some(o => o.fornitore === codice);
}

// I PIN del Pannello docente NON sono scritti qui: con Supabase li verifica il server (funzione docente_accesso,
// vedi supabase/sicurezza.sql) e si cambiano dal pannello. Solo per il vecchio backend Firebase resta un controllo
// locale, su un'impronta SHA-256 di "PIN1:PIN2" (non sui PIN in chiaro).
const ADMIN_PIN_HASH_FIREBASE = '6313082177df2de0051dd94d6aa9beb2092cdf1266a6f8b51bdc10398d1f19ae';
async function _sha256Hex(testo) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(testo));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}
let _pin1Inserito = '';
let _adminPinFase = 1; // 1 = primo PIN, 2 = secondo PIN
function renderAdminPin() {
  _adminPinFase = 1;
  _renderAdminPinInterno();
}
function _renderAdminPinInterno() {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="login-overlay">
      <div class="login-box">
        <h2 style="margin:0 0 4px 0;">🎓 Pannello docente</h2>
        <p>Inserisci il ${_adminPinFase === 1 ? 'primo' : 'secondo'} PIN (${_adminPinFase}/2).</p>
        <input type="password" id="admin-pin" placeholder="PIN" autocomplete="off">
        <button id="admin-pin-btn">Entra</button>
        <div class="login-note"><span id="admin-back" style="text-decoration:underline; cursor:pointer;">← torna al login</span></div>
      </div>
    </div>
  `;
  document.getElementById('admin-back').addEventListener('click', () => renderCorsoSelect());
  const btn = document.getElementById('admin-pin-btn');
  const input = document.getElementById('admin-pin');
  const check = async () => {
    if (_adminPinFase === 1) { _pin1Inserito = input.value; _adminPinFase = 2; _renderAdminPinInterno(); return; }
    const pin1 = _pin1Inserito; _pin1Inserito = '';
    btn.disabled = true; btn.textContent = 'Verifica…';
    if (USA_SUPABASE) {
      let r;
      try { r = await _sbRpc('docente_accesso', { p_pin1: pin1, p_pin2: input.value, p_dispositivo: getDeviceId() }); }
      catch (e) { r = { ok: false, errore: String(e && e.message || e) }; }
      if (r && r.ok) { _tokenDocente = r.token; renderAdminPanel(); return; }
      if (r && r.bannato) { renderDispositivoBannato(await dispositivoBannato()); return; }
      _adminPinFase = 1; _renderAdminPinInterno();
      const nuovoInput = document.getElementById('admin-pin');
      nuovoInput.style.borderColor = '#a83232';
      nuovoInput.placeholder = r && r.troppiTentativi ? 'Troppi tentativi: riprova tra 15 minuti' : r && r.errore ? 'Errore di collegamento, riprova' : 'PIN errati, ricomincia dal primo';
      return;
    }
    if (await _sha256Hex(pin1 + ':' + input.value) === ADMIN_PIN_HASH_FIREBASE) {
      await segnaDispositivoFidato(); renderAdminPanel();
    } else if (await dispositivoFidato()) {
      // Dispositivo già autenticato con successo in passato: solo respinto, niente ban
      // (protegge il formatore da un ban per un semplice errore di battitura).
      _adminPinFase = 1; _renderAdminPinInterno();
      const nuovoInput = document.getElementById('admin-pin');
      nuovoInput.style.borderColor = '#a83232'; nuovoInput.placeholder = 'PIN errati, ricomincia dal primo';
    } else {
      // Dispositivo mai autenticato con successo prima d'ora: PIN sbagliato → ban immediato.
      await bannaDispositivoCorrente('PIN Pannello docente errato');
      const ban = await dispositivoBannato();
      renderDispositivoBannato(ban);
    }
  };
  btn.addEventListener('click', check);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') check(); });
  input.focus();
}

  const chiave = 'corsiRegistrati::' + corso; // ogni corso ha una chiave tutta sua: zero rischio

}

// ============ PULIZIA MASSIVA DATI VECCHI (RA aperte / OA non ricevuti / OP non confermati, prima di oggi) ============
// Lavora sui dati grezzi per-partecipante (non tramite il sistema di patch): ogni record candidato
// alla cancellazione porta con sé "dove vive fisicamente" (quale cassetto, quale indice nell'array),
// così la rimozione è precisa anche quando esistono numeri duplicati (dato storico), caso in cui
// l'eliminazione tramite patch-per-numero può colpire il gemello sbagliato o non risolversi affatto.
function _parseDataCreatoIl(s) {
  if (!s) return null;
  const parte = String(s).split(' ')[0];
  const bits = parte.split('/').map(Number);
  if (bits.length !== 3 || bits.some(isNaN)) return null;
  const [gg, mm, aaaa] = bits;
  return new Date(aaaa, mm - 1, gg);
}
async function _elencoConProvenienza(key, corso) {
  const mappaBasi = await remoteStorage.getPrefix('corso_' + corso + '::' + key + '::u::');
  const conProvenienza = [];
  for (const fullKey in mappaBasi) {
    let arr = [];
    try { arr = JSON.parse(mappaBasi[fullKey]) || []; } catch (e) { arr = []; }
    arr.forEach((rec, idx) => conProvenienza.push({ rec, fullKey, idx }));
  }
  const campoChiave = CAMPO_CHIAVE[key];
  if (campoChiave) {
    const mappaPatch = await remoteStorage.getPrefix('corso_' + corso + '::' + key + '::patch::');
    let tuttePatch = [];
    for (const fk in mappaPatch) {
      try { tuttePatch = tuttePatch.concat(JSON.parse(mappaPatch[fk]) || []); } catch (e) {}
    }
    applicaPatchAElenco(key, conProvenienza, tuttePatch, x => x.rec);
  }
  return conProvenienza.filter(x => !x.rec._eliminato);
}
async function _eliminaRawPerProvenienza(items) {
  const perChiaveFisica = {};
  items.forEach(it => { (perChiaveFisica[it.fullKey] = perChiaveFisica[it.fullKey] || []).push(it.idx); });
  for (const fullKey in perChiaveFisica) {
    const indiciDaRimuovere = new Set(perChiaveFisica[fullKey]);
    const raw = await remoteStorage.get(fullKey);
    let arr = raw ? JSON.parse(raw.value) : [];
    arr = arr.filter((_, i) => !indiciDaRimuovere.has(i));
    await remoteStorage.set(fullKey, JSON.stringify(arr));
  }
}
async function analizzaPuliziaCorso(corso) {
  const oggi = new Date(); oggi.setHours(0, 0, 0, 0);
  const primaDOggi = (rec) => { const d = _parseDataCreatoIl(rec.creatoIl); return d && d < oggi; };

  const raConProv = await _elencoConProvenienza('richiesteAcquisto', corso);
  const raDaEliminare = raConProv.filter(x => x.rec.stato === 'aperta' && primaDOggi(x.rec));

  const oaConProv = await _elencoConProvenienza('ordiniAcquisto', corso);
  const oaDaEliminare = oaConProv.filter(x => primaDOggi(x.rec) && (x.rec.righe || []).every(r => !rigaHaRicezioni(r)));

  const opConProv = await _elencoConProvenienza('ordiniProduzione', corso);
  const opDaEliminare = opConProv.filter(x => x.rec.stato === 'aperto' && primaDOggi(x.rec));

  // Ordini di vendita "non elaborati": ancora aperti, creati prima di oggi, e con NESSUNA riga
  // già consegnata (nemmeno parzialmente) — se anche solo una riga ha del consegnato, l'ordine
  // ha già generato movimenti/DDT reali e non va toccato da una pulizia di massa.
  const ovConProv = await _elencoConProvenienza('ordiniVendita', corso);
  const ovDaEliminare = ovConProv.filter(x => x.rec.stato === 'aperto' && primaDOggi(x.rec) && (x.rec.righe || []).every(r => !(Number(r.consegnato) > 0)));

  return { ra: raDaEliminare, oa: oaDaEliminare, op: opDaEliminare, ov: ovDaEliminare };
}
async function eseguiPuliziaCorso(analisi) {
  await _eliminaRawPerProvenienza(analisi.ra.map(x => ({ fullKey: x.fullKey, idx: x.idx })));
  await _eliminaRawPerProvenienza(analisi.oa.map(x => ({ fullKey: x.fullKey, idx: x.idx })));
  await _eliminaRawPerProvenienza(analisi.op.map(x => ({ fullKey: x.fullKey, idx: x.idx })));
  await _eliminaRawPerProvenienza((analisi.ov || []).map(x => ({ fullKey: x.fullKey, idx: x.idx })));
}

// ============ PANNELLO DOCENTE ============
// Area del formatore (dopo i due PIN): schede Corsi, Dispositivi, Backup e ripristino, Pulizia dati, Diagnostica.
// Lavora direttamente sulle chiavi del database (stessa tabella/nodo "storage" usato dal programma), quindi vale
// sia con Supabase sia con Firebase. Le statistiche usano remoteStorage.chiavi(): solo i nomi delle chiavi, senza
// scaricare i dati dei corsi.
const doc = {
  tab: 'corsi',
  msg: '', msgErr: false,
  nuovoCorso: '',
  azioneCorso: null,        // { tipo: 'elimina' | 'duplica', corso }
  partecipantiAperti: {},   // { CORSO: [ {nome, shard, primoAccesso} ] } elenco caricato su richiesta
  filtroDispositivi: '',    // codice corso, '' = tutti
  bannaId: null,            // dispositivo per cui è aperto il modulo "blocca"
  ripristino: null,         // { nomeFile, backup, destinazione, svuota }
  rimozione: { corso: '', partecipanti: null, shard: '', chiavi: null },
  svuota: { corso: '' },
  filtroStorico: '',        // filtro sulle chiavi nello storico versioni
  progresso: '',            // testo di avanzamento delle operazioni lunghe
  occupato: false,
};
function _h(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function _normCodiceCorso(v) { return String(v || '').trim().toUpperCase().replace(/[^A-Z0-9\-_]/g, '-'); }
function _docMsg(testo, errore) { doc.msg = testo; doc.msgErr = !!errore; }
function _fmtTempo(ts) {
  if (!ts) return '—';
  const diff = Date.now() - ts;
  if (diff < 60000) return 'adesso';
  if (diff < 3600000) return Math.round(diff / 60000) + ' min fa';
  if (diff < 86400000) return Math.round(diff / 3600000) + ' h fa';
  const d = new Date(ts);
  return d.toLocaleDateString('it-IT') + ' ' + d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
}
// Esegue fn su tutti gli elementi con al massimo "n" richieste contemporanee (evita di saturare il backend).
async function _inParallelo(elementi, n, fn) {
  let i = 0;
  const lavoratori = Array.from({ length: Math.min(n, elementi.length) }, async () => {
    while (i < elementi.length) { const idx = i++; await fn(elementi[idx], idx); }
  });
  await Promise.all(lavoratori);
}
async function _eliminaChiavi(chiavi, etichetta) {
  let fatte = 0, errori = 0;
  if (_tokenDocente && remoteStorage.deleteMolti) {
    for (let i = 0; i < chiavi.length; i += 200) {
      const gruppo = chiavi.slice(i, i + 200);
      try { await remoteStorage.deleteMolti(gruppo); }
      catch (e) {
        if (/Sessione docente/.test(e.message)) throw e;
        errori += gruppo.length; _diagRegistraErrore('eliminazione', gruppo[0] + '…', e);
      }
      _docProgresso(`${etichetta}: ${Math.min(i + 200, chiavi.length)}/${chiavi.length}`);
    }
    return errori;
  }
  await _inParallelo(chiavi, 6, async (k) => {
    try { await remoteStorage.delete(k); } catch (e) { errori++; _diagRegistraErrore('eliminazione', k, e); }
    fatte++;
    if (fatte % 10 === 0 || fatte === chiavi.length) _docProgresso(`${etichetta}: ${fatte}/${chiavi.length}`);
  });
  return errori;
}
async function _scriviChiavi(coppie, etichetta) {
  let fatte = 0, errori = 0;
  if (remoteStorage.setMolti) {
    // Gruppi da ~1 MB al massimo per richiesta.
    const gruppi = []; let corrente = [], peso = 0;
    coppie.forEach(c => {
      if (corrente.length && (peso + c[1].length > 1000000 || corrente.length >= 200)) { gruppi.push(corrente); corrente = []; peso = 0; }
      corrente.push(c); peso += c[1].length;
    });
    if (corrente.length) gruppi.push(corrente);
    for (const g of gruppi) {
      try { await remoteStorage.setMolti(g); }
      catch (e) {
        // ripiego chiave per chiave, così un singolo valore problematico non blocca tutto il gruppo
        for (const [k, v] of g) { try { await remoteStorage.set(k, v); } catch (e2) { errori++; _diagRegistraErrore('scrittura', k, e2); } }
      }
      fatte += g.length;
      _docProgresso(`${etichetta}: ${fatte}/${coppie.length}`);
    }
    return errori;
  }
  await _inParallelo(coppie, 6, async ([k, v]) => {
    try { await remoteStorage.set(k, v); } catch (e) { errori++; _diagRegistraErrore('scrittura', k, e); }
    fatte++;
    if (fatte % 10 === 0 || fatte === coppie.length) _docProgresso(`${etichetta}: ${fatte}/${coppie.length}`);
  });
  return errori;
}
function _docProgresso(testo) {
  doc.progresso = testo;
  const el = document.getElementById('doc-progresso');
  if (el) el.textContent = testo;
}
function _scaricaFileJson(nomeFile, oggetto) {
  const blob = new Blob([JSON.stringify(oggetto, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url; link.download = nomeFile;
  document.body.appendChild(link); link.click(); document.body.removeChild(link);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// ---- Formato dei backup ----
// "dati" contiene i valori già decodificati (leggibili aprendo il file); le chiavi il cui valore non è JSON
// (es. flag salvati come testo semplice) o è una stringa JSON finiscono in "chiaviGrezze" e vengono ripristinate
// tali e quali. I backup del vecchio formato (senza "chiaviGrezze") restano ripristinabili.
function _mappaInBackup(mappa) {
  const dati = {}, chiaviGrezze = [];
  for (const k in mappa) {
    let v;
    try { v = JSON.parse(mappa[k]); } catch (e) { v = undefined; }
    if (v === undefined || typeof v === 'string') { dati[k] = mappa[k]; chiaviGrezze.push(k); }
    else dati[k] = v;
  }
  return { dati, chiaviGrezze };
}
function _backupInCoppie(backup) {
  const grezze = new Set(backup.chiaviGrezze || []);
  const vecchioFormato = !Array.isArray(backup.chiaviGrezze);
  return Object.keys(backup.dati || {}).map(k => {
    const v = backup.dati[k];
    if (grezze.has(k) || (vecchioFormato && typeof v === 'string')) return [k, String(v)];
    return [k, JSON.stringify(v)];
  });
}
async function scaricaBackupCorso(corso) {
  // Prende TUTTE le chiavi del corso in un colpo solo (cassetti e patch di ogni partecipante inclusi).
  const mappa = await remoteStorage.getPrefix('corso_' + corso + '::');
  const { dati, chiaviGrezze } = _mappaInBackup(mappa);
  _scaricaFileJson('backup_' + corso + '_' + isoDate(new Date()) + '.json',
    { tipo: 'corso', formato: 2, corso, esportatoIl: nowStr(), numeroChiavi: Object.keys(dati).length, dati, chiaviGrezze });
  return Object.keys(dati).length;
}
async function scaricaBackupCompleto() {
  const mappa = await remoteStorage.getPrefix('');
  const { dati, chiaviGrezze } = _mappaInBackup(mappa);
  _scaricaFileJson('backup_COMPLETO_' + isoDate(new Date()) + '.json',
    { tipo: 'completo', formato: 2, esportatoIl: nowStr(), numeroChiavi: Object.keys(dati).length, dati, chiaviGrezze });
  return Object.keys(dati).length;
}
async function eliminaCorso(corso) {
  const chiavi = (await remoteStorage.chiavi('corso_' + corso + '::')).map(x => x.key);
  await _eliminaChiavi(chiavi, 'Eliminazione ' + corso);
  await rimuoviCorsoRegistrato(corso);
}
async function duplicaCorso(origine, destinazione) {
  const mappa = await remoteStorage.getPrefix('corso_' + origine + '::');
  const pre = 'corso_' + origine + '::', nuovo = 'corso_' + destinazione + '::';
  const coppie = Object.keys(mappa).map(k => [nuovo + k.slice(pre.length), mappa[k]]);
  const errori = await _scriviChiavi(coppie, 'Copia ' + origine + ' → ' + destinazione);
  await registraCorso(destinazione);
  return { chiavi: coppie.length, errori };
}

// ---- Caricamento dati per le schede ----
async function _datiSchedaCorsi() {
  const corsiRegistrati = await caricaElencoCorsi();
  const chiavi = await remoteStorage.chiavi('corso_');
  const presenze = await _leggiPresenze();
  const stat = {};
  const s = (c) => (stat[c] = stat[c] || { chiavi: 0, partecipanti: 0, agg: null, attivi: 0, attivi24: 0 });
  chiavi.forEach(({ key, agg }) => {
    const m = /^corso_([^:]+)::/.exec(key); if (!m) return;
    const st = s(m[1]); st.chiavi++;
    if (key.indexOf('::partecipanti::') > 0) st.partecipanti++;
    if (agg && (!st.agg || agg > st.agg)) st.agg = agg;
  });
  presenze.forEach(p => {
    if (!p.corso) return;
    const st = s(p.corso);
    if (Date.now() - p.ts < 15 * 60000) st.attivi++;
    if (Date.now() - p.ts < 86400000) st.attivi24++;
  });
  const impostazioni = {};
  await _inParallelo(corsiRegistrati, 4, async c => { impostazioni[c.codice] = await leggiImpostazioniCorso(c.codice); });
  const registrati = new Set(corsiRegistrati.map(c => c.codice));
  // Corsi con dati ma non presenti nell'elenco (es. codice inserito a mano dai corsisti)
  const nonRegistrati = Object.keys(stat).filter(c => !registrati.has(c) && stat[c].chiavi > 0);
  return { corsiRegistrati, stat, impostazioni, nonRegistrati };
}
async function _leggiPresenze() {
  const mappa = await remoteStorage.getPrefix('dispositiviAttivi::');
  return Object.keys(mappa).map(k => {
    let v = {}; try { v = JSON.parse(mappa[k]) || {}; } catch (e) {}
    return { id: k.slice('dispositiviAttivi::'.length), ...v, ts: Number(v.ts) || 0 };
  }).sort((a, b) => b.ts - a.ts);
}
async function _datiSchedaDispositivi() {
  const [presenze, bannati, fidatiMappa, corsi] = await Promise.all([
    _leggiPresenze(), elencoDispositiviBannati(), remoteStorage.getPrefix('dispositiviFidati::'), caricaElencoCorsi()]);
  const fidati = Object.keys(fidatiMappa).map(k => { let v = {}; try { v = JSON.parse(fidatiMappa[k]) || {}; } catch (e) {} return { id: k.slice('dispositiviFidati::'.length), ...v }; });
  const nomiInUso = [];
  await _inParallelo(corsi, 4, async c => {
    const m = await remoteStorage.getPrefix('corso_' + c.codice + '::sessione::');
    Object.keys(m).forEach(k => { let v = {}; try { v = JSON.parse(m[k]) || {}; } catch (e) {} nomiInUso.push({ chiave: k, corso: c.codice, shard: k.split('::').pop(), ...v }); });
  });
  const mm = await remoteStorage.getPrefix('messaggi::');
  const messaggi = {};
  Object.keys(mm).forEach(k => { try { messaggi[k.slice('messaggi::'.length)] = JSON.parse(mm[k]); } catch (e) {} });
  const mc = await remoteStorage.getPrefix('messaggiCorso::');
  const messaggiCorso = Object.keys(mc).map(k => { let v = {}; try { v = JSON.parse(mc[k]) || {}; } catch (e) {} return { corso: k.slice('messaggiCorso::'.length), ...v }; })
    .filter(m => !m.scade || Date.now() < m.scade);
  return { presenze, bannati, fidati, corsi, nomiInUso, messaggi, messaggiCorso };
}

      <span class="doc-tab" id="doc-ricarica" title="Ricarica i dati dal database" style="margin-left:auto;">🔄 aggiorna</span></div>`;
  app.innerHTML = `<div class="doc-wrap">${intestazione}<div class="doc-body"><p style="color:#8a8a80;">Caricamento…</p></div></div>`;

    else corpo = await _htmlDiagnostica();

    corpo = `<div class="doc-card"><p style="color:#a83232;">Impossibile leggere il database: ${_h(e && e.message || e)}</p></div>`;
  }
  const messaggio = doc.msg ? `<div class="doc-msg ${doc.msgErr ? 'err' : ''}">${_h(doc.msg)}</div>` : '';
  const progresso = `<div id="doc-progresso" class="doc-progresso" style="${doc.occupato ? '' : 'display:none;'}">${_h(doc.progresso)}</div>`;

// Esegue un'operazione lunga mostrando l'avanzamento e impedendo doppi clic; al termine ridisegna il pannello.
async function _docEsegui(fn) {
  if (doc.occupato) return;
  doc.occupato = true; doc.progresso = 'Operazione in corso…'; doc.msg = '';
  document.querySelectorAll('.doc-body button').forEach(b => b.disabled = true);
  const el = document.getElementById('doc-progresso'); if (el) { el.style.display = ''; el.textContent = doc.progresso; }
  try { await fn(); }
  catch (e) { _docMsg('Errore: ' + (e && e.message || e), true); }
  doc.occupato = false; doc.progresso = '';
  if (/Sessione docente non valida/.test(doc.msg)) { _tokenDocente = null; _inPannelloDocente = false; renderAdminPin(); return; }
  renderPannelloDocente();
}

        <button id="doc-backup-corso-btn" class="doc-btn">📥 Backup del corso</button></div>

}

function _htmlPulizia(corsi) {
  const opzCorsi = (sel) => corsi.map(c => `<option value="${_h(c.codice)}" ${sel === c.codice ? 'selected' : ''}>${_h(c.codice)}</option>`).join('');
  const rm = doc.rimozione;
  const a = adminPulizia.analisi;

  if (a) {
    const ov = a.ov || [];
    const totale = a.ra.length + a.oa.length + a.op.length + ov.length;
    const elenco = (arr) => arr.slice(0, 8).map(x => _h(x.rec.numero)).join(', ') + (arr.length > 8 ? '…' : '');
    analisiHtml = totale === 0 ? `<p style="color:#1a6b2e;">Nessun elemento da eliminare per ${_h(adminPulizia.corso)}.</p>` : `

        <p>Trovati <strong>${totale}</strong> elementi da eliminare in <strong>${_h(adminPulizia.corso)}</strong>:</p>
        <ul>
          <li>${a.ra.length} richiesta/e d'acquisto aperta/e: ${elenco(a.ra)}</li>
          <li>${a.oa.length} ordine/i d'acquisto senza ricezioni: ${elenco(a.oa)}</li>
          <li>${a.op.length} ordine/i di produzione non confermato/i: ${elenco(a.op)}</li>

    <div class="doc-avviso">Prima di ogni pulizia viene scaricato automaticamente un backup del corso interessato.</div>

      <p class="doc-sub">Elimina in blocco: richieste d'acquisto ancora aperte, ordini d'acquisto senza nessuna riga ricevuta, ordini di produzione non confermati e ordini di vendita senza nessuna riga consegnata. Lavora sui dati grezzi, quindi risolve anche i casi con numero documento duplicato.</p>
      <div class="doc-riga"><select id="doc-pulizia-corso"><option value="">-- seleziona corso --</option>${opzCorsi(adminPulizia.corso)}</select>
        <button id="doc-pulizia-analizza" class="doc-btn" ${adminPulizia.corso ? '' : 'disabled'}>🔍 Analizza</button></div>

    <div class="doc-card">
      <h3>Rimuovi un partecipante</h3>
      <p class="doc-sub">Cancella tutto ciò che un partecipante ha registrato nel corso (es. un nome scritto male o un accesso di prova). Attenzione: spariscono anche le modifiche che ha fatto su documenti di altri (conferme, ricezioni…), che tornano allo stato precedente.</p>
      <div class="doc-riga"><select id="doc-rm-corso"><option value="">-- seleziona corso --</option>${opzCorsi(rm.corso)}</select>
        ${rm.partecipanti ? `<select id="doc-rm-shard"><option value="">-- seleziona partecipante --</option>${rm.partecipanti.map(p => `<option value="${_h(p.shard)}" ${rm.shard === p.shard ? 'selected' : ''}>${_h(p.nome)} (${p.nChiavi} chiavi)</option>`).join('')}</select>` : ''}</div>
      ${rm.shard && rm.chiavi ? `<div class="doc-conferma">
        <p>Verranno eliminate <strong>${rm.chiavi.length}</strong> chiavi di <strong>${_h((rm.partecipanti.find(p => p.shard === rm.shard) || {}).nome || rm.shard)}</strong> nel corso ${_h(rm.corso)}.</p>
        <input type="text" id="doc-rm-conferma" placeholder="Scrivi ELIMINA per confermare" autocomplete="off" style="text-transform:uppercase;">
        <button id="doc-rm-ok" class="doc-btn rosso">Rimuovi partecipante</button></div>` : ''}
    </div>
    <div class="doc-card">
      <h3>Svuota un corso (ripartire da zero)</h3>
      <p class="doc-sub">Cancella tutti i dati del corso (anagrafiche, documenti, movimenti, partecipanti, numerazioni) ma lo lascia nell'elenco con le sue impostazioni: pronto per una nuova classe. Funziona anche sui corsi non in elenco.</p>
      <div class="doc-riga"><input type="text" id="doc-svuota-corso" value="${_h(doc.svuota.corso)}" placeholder="Codice corso" autocomplete="off" style="text-transform:uppercase;">
        <input type="text" id="doc-svuota-conferma" placeholder="Ridigita il codice" autocomplete="off" style="text-transform:uppercase;">
        <button id="doc-svuota-ok" class="doc-btn rosso">Svuota corso</button></div>
    </div>
    <div class="doc-card">
      <h3>Dispositivi inattivi</h3>
      <p class="doc-sub">Toglie dall'elenco della scheda Dispositivi quelli che non si collegano da più di 30 giorni (non tocca blocchi né dispositivi del formatore).</p>
      <button id="doc-presenze-pulisci" class="doc-btn">Pulisci elenco dispositivi</button>
    </div>`;
}

      <ul style="margin:4px 0 4px 18px; padding:0;">

        <input type="password" id="doc-pin2" placeholder="Nuovo secondo PIN" autocomplete="new-password" style="padding:6px; border:1px solid #7f9db9;">
        <input type="password" id="doc-pin2b" placeholder="Ripeti secondo PIN" autocomplete="new-password" style="padding:6px; border:1px solid #7f9db9;">

      </div>
    </div>
    <div class="doc-card">
      <h3>🕘 Versioni precedenti (ultimi 30 giorni)</h3>
      <p class="doc-sub">Copia di ogni dato prima che venisse cancellato o accorciato. "Ripristina" rimette quella versione al posto di quella attuale: se non sei sicuro, scarica prima il backup del corso.</p>
      <div class="doc-riga"><input type="text" id="doc-storico-filtro" value="${_h(doc.filtroStorico)}" placeholder="Filtra (es. PRATOMAG, ordiniAcquisto, mario)" autocomplete="off">
        <button id="doc-storico-cerca" class="doc-btn">Cerca</button></div>
      ${!righe.length ? '<p class="doc-sub">Nessuna versione salvata.</p>' : `<div class="doc-scroll" style="max-height:420px;"><table class="doc-table">
        <tr><th>Quando</th><th>Operazione</th><th>Chiave</th><th class="num">Dimensione</th><th></th></tr>
        ${righe.map(r => `<tr><td>${_fmtTempo(Date.parse(r.ts))}</td><td>${r.operazione === 'eliminata' ? '<span class="doc-pill rosso">eliminata</span>' : '<span class="doc-pill giallo">ridotta</span>'}</td>
          <td style="word-break:break-all;">${_h(r.key)}</td><td class="num">${(r.lunghezza / 1024).toFixed(1)} KB</td>
          <td class="doc-azioni"><span class="print-btn doc-ver-scarica" data-id="${r.id}">📥 scarica</span><span class="print-btn doc-ver-ripr" data-id="${r.id}" style="color:#a83232;">↩ ripristina</span></td></tr>`).join('')}
      </table></div>`}
    </div>`;
}

async function _htmlDiagnostica() {
  const logPersistente = (await _diagLeggiPersistente()).slice(-15).reverse();
  let riepilogo = '';
  try {
    const chiavi = await remoteStorage.chiavi('');
    const gruppi = {};
    chiavi.forEach(({ key, agg }) => {
      const g = key.split('::')[0];
      const x = (gruppi[g] = gruppi[g] || { n: 0, agg: null }); x.n++;
      if (agg && (!x.agg || agg > x.agg)) x.agg = agg;
    });
    riepilogo = `<table class="doc-table"><tr><th>Gruppo di chiavi</th><th class="num">Chiavi</th><th>Ultima modifica</th></tr>
      ${Object.keys(gruppi).sort().map(g => `<tr><td>${_h(g)}</td><td class="num">${gruppi[g].n}</td><td>${gruppi[g].agg ? _fmtTempo(Date.parse(gruppi[g].agg)) : '—'}</td></tr>`).join('')}
      <tr><td><strong>Totale</strong></td><td class="num"><strong>${chiavi.length}</strong></td><td></td></tr></table>`;
  } catch (e) { riepilogo = `<p style="color:#a83232;">Lettura non riuscita: ${_h(e.message || e)}</p>`; }
  return `
    <div class="doc-card">
      <h3>Database</h3>
      <p>Backend: <strong>${USA_SUPABASE ? 'Supabase' : 'Firebase'}</strong> — ${_h(USA_SUPABASE ? SUPABASE_URL : FIREBASE_URL)} — configurato: <strong style="color:${STORAGE_CONFIGURATO ? '#1a6b2e' : '#a83232'};">${STORAGE_CONFIGURATO ? 'sì' : 'NO'}</strong></p>
      ${riepilogo}
    </div>
    <div class="doc-card">
      <h3>Questa sessione / questo dispositivo</h3>
      <p>Scritture riuscite: <strong>${_diagScrittureOk}</strong> · fallite: <strong style="color:${_diagScrittureFallite ? '#a83232' : 'inherit'};">${_diagScrittureFallite}</strong> · Letture: <strong>${_diagLetture}</strong> · non riuscite: <strong>${_diagLettureFallite}</strong> <span class="doc-sub">(normale per chiavi non ancora create)</span></p>
      ${_diagUltimoErrore ? `<p style="color:#a83232;">Ultimo errore (${_h(_diagUltimoErrore.tipo)}, ${new Date(_diagUltimoErrore.ts).toLocaleTimeString()}): chiave "${_h(_diagUltimoErrore.key)}" — ${_h(_diagUltimoErrore.msg)}</p>` : '<p class="doc-sub">Nessun errore in questa sessione.</p>'}
      <p><span id="doc-diag-copia" class="print-btn">📋 Copia log sessione (${_diagLogErrori.length})</span> &nbsp; <span id="doc-diag-copia-disp" class="print-btn">📋 Copia log dispositivo (${logPersistente.length})</span></p>
      ${logPersistente.length ? `<div class="doc-scroll" style="max-height:160px;">${logPersistente.map(v => `<div class="doc-sub" style="color:#a83232;">[${new Date(v.ts).toLocaleString()}] ${_h(v.tipo)} chiave="${_h(v.key)}" — ${_h(v.msg)}</div>`).join('')}</div>` : ''}
      <p class="doc-sub">ID di questo dispositivo: ${_h(getDeviceId())}</p>
    </div>`;
}

// ---- Eventi ----
function _collegaPannelloDocente() {
  const $ = (id) => document.getElementById(id);
  const su = (id, ev, fn) => { const el = $(id); if (el) el.addEventListener(ev, fn); };
  const tutti = (sel, fn) => document.querySelectorAll(sel).forEach(el => el.addEventListener('click', () => fn(el)));

  su('doc-esci', 'click', () => {
    if (_tokenDocente) { _sbRpc('docente_esci', { p_token: _tokenDocente }).catch(() => {}); _tokenDocente = null; }
    _inPannelloDocente = false; doc.msg = ''; doc.azioneCorso = null; doc.ripristino = null;
    renderCorsoSelect();
  });
  document.querySelectorAll('.doc-tab[data-tab]').forEach(el => el.addEventListener('click', () => {
    doc.tab = el.dataset.tab; doc.msg = ''; doc.azioneCorso = null; doc.bannaId = null; renderPannelloDocente();
  }));
  su('doc-ricarica', 'click', () => { doc.msg = ''; doc.partecipantiAperti = {}; renderPannelloDocente(); });
  su('doc-annulla', 'click', () => { doc.azioneCorso = null; doc.bannaId = null; doc.msgId = null; doc.msgCorsoAperto = false; renderPannelloDocente(); });

  // --- Corsi ---
  su('doc-nuovo-corso', 'input', e => { doc.nuovoCorso = e.target.value; });
  su('doc-nuovo-corso', 'keydown', e => { if (e.key === 'Enter') $('doc-crea').click(); });
  su('doc-crea', 'click', () => _docEsegui(async () => {
    const corso = _normCodiceCorso(doc.nuovoCorso);
    if (!corso) { _docMsg('Inserisci un codice corso.', true); return; }
    const creato = await registraCorso(corso);
    _docMsg(creato ? `Corso ${corso} creato: ora i corsisti possono selezionarlo.` : `Il corso ${corso} esiste già.`, !creato);
    if (creato) doc.nuovoCorso = '';
  }));
  tutti('.doc-giacneg', el => _docEsegui(async () => {
    const cod = el.dataset.corso;
    const imp = { ...(await leggiImpostazioniCorso(cod)) };
    imp.giacenzaNegativa = !imp.giacenzaNegativa;
    await setRaw('corso_' + cod + '::impostazioni', imp);
    _docMsg(`Corso ${cod}: giacenza negativa ${imp.giacenzaNegativa ? 'CONSENTITA' : 'bloccata'}.`);
  }));
  tutti('.doc-part', el => _docEsegui(async () => {
    const cod = el.dataset.corso;
    if (doc.partecipantiAperti[cod]) { delete doc.partecipantiAperti[cod]; return; }
    doc.partecipantiAperti[cod] = await _partecipantiCorso(cod);
  }));
  tutti('.doc-backup', el => _docEsegui(async () => {
    const n = await scaricaBackupCorso(el.dataset.corso);
    _docMsg(`Backup di ${el.dataset.corso} scaricato (${n} chiavi).`);
  }));
  tutti('.doc-duplica', el => { doc.azioneCorso = { tipo: 'duplica', corso: el.dataset.corso }; renderPannelloDocente(); });
  tutti('.doc-elimina', el => { doc.azioneCorso = { tipo: 'elimina', corso: el.dataset.corso }; renderPannelloDocente(); });
  tutti('.doc-registra', el => _docEsegui(async () => {
    await registraCorso(el.dataset.corso);
    _docMsg(`Corso ${el.dataset.corso} aggiunto all'elenco.`);
  }));
  su('doc-elimina-ok', 'click', () => _docEsegui(async () => {
    const corso = doc.azioneCorso.corso;
    if (_normCodiceCorso($('doc-conferma-elimina').value) !== corso) { _docMsg('Il codice digitato non corrisponde. Nulla è stato eliminato.', true); return; }
    await eliminaCorso(corso);
    doc.azioneCorso = null; delete doc.partecipantiAperti[corso];
    _docMsg(`Corso ${corso} eliminato completamente e rimosso dall'elenco.`);
  }));
  su('doc-duplica-ok', 'click', () => _docEsegui(async () => {
    const origine = doc.azioneCorso.corso;
    const dest = _normCodiceCorso($('doc-duplica-dest').value);
    if (!dest || dest === origine) { _docMsg('Inserisci un codice diverso da quello di origine.', true); return; }
    if ((await remoteStorage.chiavi('corso_' + dest + '::')).length || await remoteStorage.get('corsiRegistrati::' + dest)) {
      _docMsg(`Il corso ${dest} esiste già (o contiene dati): scegli un altro codice.`, true); return;
    }
    const { chiavi, errori } = await duplicaCorso(origine, dest);
    doc.azioneCorso = null;
    _docMsg(errori ? `Copia di ${origine} in ${dest} completata con ${errori} errori su ${chiavi} chiavi: controlla la Diagnostica.` : `Corso ${dest} creato come copia di ${origine} (${chiavi} chiavi).`, !!errori);
  }));

  // --- Dispositivi ---
  su('doc-filtro-disp', 'change', e => { doc.filtroDispositivi = e.target.value; renderPannelloDocente(); });
  tutti('.doc-banna', el => { doc.bannaId = el.dataset.id; doc.msgId = null; renderPannelloDocente(); });
  tutti('.doc-msg-apri', el => { doc.msgId = el.dataset.id; doc.bannaId = null; renderPannelloDocente(); });
  su('doc-msg-corso-apri', 'click', () => { doc.msgCorsoAperto = true; renderPannelloDocente(); });
  tutti('.doc-msg-invia', el => _docEsegui(async () => {
    const idx = el.dataset.idx;
    const testo = ($('doc-msg-testo-' + idx).value || '').trim();
    if (!testo) { _docMsg('Scrivi il testo del messaggio.', true); return; }
    const m = { id: 'm' + Date.now().toString(36), testo: testo.slice(0, 300), stile: $('doc-msg-stile-' + idx).value, firma: $('doc-msg-firma-' + idx).checked, inviato: nowStr() };
    if (idx === 'corso') {
      const corso = $('doc-msg-corso').value;
      await remoteStorage.set('messaggiCorso::' + corso, JSON.stringify({ ...m, scade: Date.now() + 2 * 3600000 }));
      doc.msgCorsoAperto = false;
      _docMsg(`Messaggio inviato a tutto il corso ${corso}: compare entro 30 secondi.`);
    } else {
      const dest = (await _leggiPresenze()).find(x => x.id === doc.msgId) || {};
      const chiave = dest.utente && dest.corso ? _chiaveMsgNome(dest.corso, dest.utente) : 'messaggi::' + doc.msgId;
      await remoteStorage.set(chiave, JSON.stringify({ ...m, scade: Date.now() + 24 * 3600000 }));
      doc.msgId = null;
      _docMsg(`Messaggio inviato${dest.utente ? ' a ' + dest.utente : ''}: compare entro 30 secondi sullo schermo, su qualunque dispositivo lavori con questo nome (se ha ricaricato la versione nuova: vedi "versione vecchia").`);
    }
  }));
  tutti('.doc-msg-ritira', el => _docEsegui(async () => { await remoteStorage.delete(el.dataset.chiave); _docMsg('Messaggio ritirato.'); }));
  su('doc-banna-ok', 'click', () => _docEsegui(async () => {
    await bannaDispositivo(doc.bannaId, ($('doc-banna-motivo').value || '').trim() || 'bloccato dal formatore');
    doc.bannaId = null;
    _docMsg('Dispositivo bloccato: il programma su quel dispositivo si chiuderà entro pochi minuti.');
  }));
  tutti('.doc-sblocca-nome', el => _docEsegui(async () => {
    await remoteStorage.set(el.dataset.chiave, JSON.stringify({ libero: true, da: 'formatore', ultimoAccesso: nowStr(), ts: Date.now() }));
    _docMsg('Nome sbloccato: il dispositivo in attesa può premere "Riprova"; quello precedente si fermerà da solo.');
  }));
  tutti('.doc-sblocca', el => _docEsegui(async () => { await sbloccaDispositivo(el.dataset.id); _docMsg('Dispositivo sbloccato.'); }));
  tutti('.doc-revoca', el => _docEsegui(async () => { await revocaDispositivoFidato(el.dataset.id); _docMsg('Dispositivo rimosso dai dispositivi del formatore.'); }));

  // --- Backup ---
  su('doc-backup-corso-btn', 'click', () => _docEsegui(async () => {
    const c = $('doc-backup-corso').value;
    if (!c) { _docMsg('Seleziona un corso.', true); return; }
    const n = await scaricaBackupCorso(c);
    _docMsg(`Backup di ${c} scaricato (${n} chiavi).`);
  }));
  su('doc-backup-tutti-btn', 'click', () => _docEsegui(async () => {

// Partecipanti di un corso con il numero di chiavi (cassetti + patch) che possiedono.
async function _partecipantiCorso(corso) {
  const [mappa, chiavi] = await Promise.all([remoteStorage.getPrefix('corso_' + corso + '::partecipanti::'), remoteStorage.chiavi('corso_' + corso + '::')]);
  const conta = {};
  chiavi.forEach(({ key }) => { const m = /::(?:u|patch)::(.+)$/.exec(key); if (m) conta[m[1]] = (conta[m[1]] || 0) + 1; });
  const elenco = Object.keys(mappa).map(k => { let v = {}; try { v = JSON.parse(mappa[k]) || {}; } catch (e) {} return { shard: v.shard || k.split('::').pop(), nome: v.nome || k.split('::').pop(), primoAccesso: v.primoAccesso || '' }; });
  // cassetti con dati ma senza scheda partecipante (es. dati migrati dal vecchio formato)
  Object.keys(conta).forEach(sh => { if (!elenco.some(p => p.shard === sh)) elenco.push({ shard: sh, nome: sh + ' (senza scheda)', primoAccesso: '' }); });
  elenco.forEach(p => { p.nChiavi = conta[p.shard] || 0; });
  return elenco.sort((a, b) => String(a.nome).localeCompare(String(b.nome)));
}
async function _chiaviPartecipante(corso, shard) {
  const chiavi = await remoteStorage.chiavi('corso_' + corso + '::');
  return chiavi.map(x => x.key).filter(k => k.endsWith('::u::' + shard) || k.endsWith('::patch::' + shard) || k === 'corso_' + corso + '::partecipanti::' + shard);
}

// ============ TREE RENDER ============
function buildTreeHTML(nodes, depth, openState, pathPrefix) {
  return nodes.map((node, i) => {
    const path = pathPrefix + '/' + i;
    const hasChildren = !!node.children;
    const isOpen = openState[path] !== false; // default open at depth 0/1
    const cls = 'tnode ' + (node.active ? 'clickable' : 'inactive');
    const arrow = hasChildren ? (isOpen ? '▾' : '▸') : '';
    const icon = hasChildren ? '📁' : `<span class="leaf-dot" style="background:${node.active?'#2e5aa8':'#d8d4c2'}"></span>`;
    const showFav = !hasChildren && node.active && node.screen;
    const isFav = showFav && preferiti.includes(node.screen);
    const favStar = showFav ? `<span class="fav-star" data-screen="${node.screen}" title="${isFav?'Rimuovi dai preferiti':'Aggiungi ai preferiti'}">${isFav?'★':'☆'}</span>` : '';
    let html = `<div class="${cls}" style="padding-left:${10+depth*16}px" data-path="${path}" data-screen="${node.screen||''}" data-haschildren="${hasChildren}">
      <span class="arrow-ico">${arrow}</span>${hasChildren?'':icon} <span class="lbl">${node.label}</span>${favStar}
    </div>`;
    if (hasChildren && isOpen) {
      html += buildTreeHTML(node.children, depth+1, openState, path);
    }
    return html;
  }).join('');
}

let treeOpenState = {};
let logoutConfirm = false;
let preferiti = []; // array di screen code preferiti — dato privato per dispositivo, non condiviso tra corsisti

function findNodeByScreen(nodes, screenCode) {
  for (const n of nodes) {
    if (n.screen === screenCode) return n;
    if (n.children) { const found = findNodeByScreen(n.children, screenCode); if (found) return found; }
  }
  return null;
}

function buildFavoritesNode() {
  const figli = preferiti.map(scr => {
    const node = findNodeByScreen(MENU, scr);
    return node ? { label: node.label, active: true, screen: scr } : null;
  }).filter(Boolean);
  if (figli.length === 0) {
    figli.push({ label: '(nessun preferito — clicca la ☆ per aggiungerne)', active: false });
  }
  return { label: '★ Preferiti', active: true, children: figli };
}

function attachTreeEvents() {
  document.querySelectorAll('.tnode').forEach(el => {
    el.addEventListener('click', (e) => {
      if (e.target.classList.contains('fav-star')) return; // gestito da listener dedicato
      const path = el.getAttribute('data-path');
      const hasChildren = el.getAttribute('data-haschildren') === 'true';
      if (hasChildren) {
        treeOpenState[path] = treeOpenState[path] === false ? true : false;
        renderMain();
      } else {
        const scr = el.getAttribute('data-screen');
        const isActive = el.classList.contains('clickable');
        if (scr && isActive) { cambiaSchermata(scr); }
      }
    });
  });
  document.querySelectorAll('.fav-star').forEach(star => {
    star.addEventListener('click', (e) => {
      e.stopPropagation();
      const scr = star.dataset.screen;
      if (preferiti.includes(scr)) preferiti = preferiti.filter(s => s !== scr);
      else preferiti.push(scr);
      saveSimple('preferiti', preferiti, false); // dato privato del dispositivo, non condiviso tra corsisti
      renderMain();
    });
  });
}

function isActiveScreenCode(code) {
  function search(nodes) {
    for (const n of nodes) {
      if (n.screen === code && n.active) return true;
      if (n.children && search(n.children)) return true;
    }
    return false;
  }
  return search(MENU);
}
