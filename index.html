      setStatus('Associazione rimossa.');
      renderMain();
    }));
  });
  collegaF4('f-materiale', 'Cerca materia prima', materiePrime.map(m => ({ value: m.codice, label: materialeLabel(m.codice) })), (valore) => {
    draftAssocMatFor.materiale = valore;
    draftAssocMatFor.fornitori = fornitoriMateriale.filter(a => a.materiale === valore).map(a => a.fornitore);
    renderScreenContent();
  });
  document.querySelectorAll('.f-fornitore-check').forEach(cb => {
    cb.addEventListener('change', () => {
      draftAssocMatFor.fornitori = [...document.querySelectorAll('.f-fornitore-check:checked')].map(c => c.value);
      const contatore = document.querySelector('#f-fornitori-lista')?.previousElementSibling?.querySelector('span');
      if (contatore) contatore.textContent = `${draftAssocMatFor.fornitori.length} selezionato/i`;
    });
  });
  const campoCerca = document.getElementById('f-fornitori-cerca');
  if (campoCerca) campoCerca.addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll('#f-fornitori-lista .selectlist-sap-row').forEach(row => {
      row.style.display = row.dataset.cerca.includes(q) ? '' : 'none';
    });
  });
  document.getElementById('save-assocmf').addEventListener('click', () => withGuard(async () => {
    if (!draftAssocMatFor.materiale) { setStatus('Seleziona un materiale.', true); return; }
    fornitoriMateriale = await loadList('fornitoriMateriale');
    const esistenti = fornitoriMateriale.filter(a => a.materiale === draftAssocMatFor.materiale);
    for (const vecchia of esistenti) {
      if (!draftAssocMatFor.fornitori.includes(vecchia.fornitore)) await eliminaRecord('fornitoriMateriale', chiaveDiRecord('fornitoriMateriale', vecchia));
    }
    for (const fornitore of draftAssocMatFor.fornitori) {
      if (!esistenti.some(e => e.fornitore === fornitore)) await aggiungiRecord('fornitoriMateriale', { materiale: draftAssocMatFor.materiale, fornitore, creatoDa: currentUser, creatoIl: nowStr() });
    }
    fornitoriMateriale = await loadList('fornitoriMateriale');
    setStatus(`Associazione per ${draftAssocMatFor.materiale} aggiornata (${draftAssocMatFor.fornitori.length} fornitore/i).`);
    renderMain();
  }));
}

// ============ MRP (stile SAP): motore di calcolo + MD01 / MD03 / MD04 ============
function richiestoApertoPer(codice) {
  return richiesteAcquisto.filter(r => r.materiale === codice && r.stato === 'aperta').reduce((s,r) => s + r.quantita, 0);
}
function ordinatoApertoPer(codice) {
  let tot = 0;
  ordiniAcquisto.forEach(o => { o.righe.forEach(r => { if (r.materiale === codice && !r._rimossa && !rigaCompleta(r)) tot += (Number(r.quantita) - rigaQtaRicevuta(r)); }); });
  return tot;
}

// ---- Date: calendario di calendario e calendario lavorativo (weekend e festivi italiani esclusi) ----
function oggiISO() { const d = new Date(); d.setHours(0,0,0,0); return isoDate(d); }
function dataDaISO(s) { const p = String(s).split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
function addGiorniCal(iso, n) { const d = dataDaISO(iso); d.setDate(d.getDate() + n); return isoDate(d); }
function addGiorniLav(iso, n) {
  const d = dataDaISO(iso); const passo = n < 0 ? -1 : 1; let resto = Math.abs(n);
  while (resto > 0) { d.setDate(d.getDate() + passo); if (!isWeekendOFestivo(d)) resto--; }
  return isoDate(d);
}
function aGiornoLavPrec(iso) { const d = dataDaISO(iso); while (isWeekendOFestivo(d)) d.setDate(d.getDate() - 1); return isoDate(d); }
function aGiornoLavSucc(iso) { const d = dataDaISO(iso); while (isWeekendOFestivo(d)) d.setDate(d.getDate() + 1); return isoDate(d); }

// ---- Parametri MRP del materiale (vuoto/0 = parametro non attivo, come nel vero SAP) ----
function mrpParam(m) {
  const n = v => Number(v) || 0;
  return {
    tipo: m.tipoMRP || 'PD', politica: m.politicaLotto || 'EX',
    lottoFisso: n(m.lottoFisso), lottoMin: n(m.lottoMin), lottoMax: n(m.lottoMax), livelloMax: n(m.livelloMax),
    arrot: n(m.arrotondamento), tConsegna: n(m.tempoConsegna), tEntrata: n(m.tempoEntrataMerci),
    scortaSic: n(m.scortaSicurezza), puntoRiord: n(m.puntoRiordino),
  };
}

// Elementi MRP di un materiale: fabbisogni dipendenti (ODP aperti) ed entrate (RA aperte, OA non ricevuti).
// Tutto ciò che è datato nel passato viene pianificato "da oggi" (dataEff).
function eventiMRP(mp, esclusiRA, extra) {
  const oggi = oggiISO(); const ev = [];
  const eff = d => (!d || d < oggi) ? oggi : d;
  ordiniProduzione.filter(o => o.stato === 'aperto').forEach(o => {
    const comp = (o.componenti || []).find(c => c.codice === mp.codice);
    if (comp && Number(comp.qtaTotale) > 0) ev.push({ tipo:'fabbisogno', fonte:'ODP', rif:o.numero, data:o.dataPianificata || oggi, dataEff:eff(o.dataPianificata), qta:Number(comp.qtaTotale) });
  });
  richiesteAcquisto.filter(r => r.materiale === mp.codice && r.stato === 'aperta' && !(esclusiRA && esclusiRA.has(r.numero))).forEach(r => {
    ev.push({ tipo:'entrata', fonte:'RA', rif:r.numero, data:r.dataRichiesta || oggi, dataEff:eff(r.dataRichiesta), qta:Number(r.quantita) });
  });
  ordiniAcquisto.forEach(o => { (o.righe || []).forEach(r => {
    if (r.materiale === mp.codice && !r._rimossa && !rigaCompleta(r)) {
      ev.push({ tipo:'entrata', fonte:'OA', rif:o.numero, data:r.dataConsegna || oggi, dataEff:eff(r.dataConsegna), qta:Number(r.quantita) - rigaQtaRicevuta(r) });
    }
  }); });
  (extra || []).forEach(x => { if (x.codice === mp.codice && x.qta > 0) ev.push({ tipo:'fabbisogno', fonte:'PIAN', rif:x.rif, data:x.data, dataEff:eff(x.data), qta:x.qta }); });
  // stesso giorno: prima le entrate, poi i fabbisogni (come in SAP)
  ev.sort((a,b) => a.dataEff < b.dataEff ? -1 : a.dataEff > b.dataEff ? 1 : (a.tipo === b.tipo ? 0 : (a.tipo === 'entrata' ? -1 : 1)));
  return ev;
}

function fineePeriodoMRP(iso, politica) {
  if (politica === 'WB') { const d = dataDaISO(iso); const dow = d.getDay(); d.setDate(d.getDate() + (dow === 0 ? 0 : 7 - dow)); return isoDate(d); }
  if (politica === 'MB') { const d = dataDaISO(iso); return isoDate(new Date(d.getFullYear(), d.getMonth() + 1, 0)); }
  return iso; // EX, FX, HB, TB: solo il giorno
}

// Dimensionamento del lotto, nell'ordine SAP: politica di lotto -> lotto minimo -> arrotondamento -> lotto massimo (spezza).
// Ritorna l'elenco delle quantità degli ordini (più di uno se si supera il lotto massimo o con lotto fisso).
function dimensionaLottoMRP(netto, disp, p) {
  if (netto <= 0) return [];
  if (p.politica === 'FX' && p.lottoFisso > 0) {
    const k = Math.ceil(netto / p.lottoFisso); const out = [];
    for (let i = 0; i < k; i++) out.push(p.lottoFisso);
    return out;
  }
  let q = netto;
  if (p.politica === 'HB' && p.livelloMax > 0) q = Math.max(netto, p.livelloMax - disp);
  if (p.lottoMin > 0 && q < p.lottoMin) q = p.lottoMin;
  if (p.arrot > 0) q = Math.ceil(q / p.arrot) * p.arrot;
  const pezzi = [];
  if (p.lottoMax > 0 && q > p.lottoMax) {
    let max = p.lottoMax;
    if (p.arrot > 0) max = Math.max(p.arrot, Math.floor(max / p.arrot) * p.arrot);
    while (q > max) { pezzi.push(max); q -= max; }
  }
  if (q > 0) pezzi.push(q);
  return pezzi;
}

// Schedulazione di un ordine: all'indietro dalla data di fabbisogno (tempo entrata merci in gg lavorativi, tempo di
// consegna previsto in gg di calendario). Se la data di rilascio cadrebbe nel passato, si schedula in avanti da oggi
// e l'ordine arriva dopo il fabbisogno (ritardo = true), come il messaggio SAP "date non rispettabili".
function schedulaPropostaMRP(p, dataDisp, oggi) {
  let consegna = p.tEntrata > 0 ? addGiorniLav(dataDisp, -p.tEntrata) : dataDisp;
  let rilascio = aGiornoLavPrec(addGiorniCal(consegna, -p.tConsegna));
  let ritardo = false;
  if (rilascio < oggi) {
    rilascio = aGiornoLavSucc(oggi);
    consegna = aGiornoLavSucc(addGiorniCal(rilascio, p.tConsegna));
    const disponibile = p.tEntrata > 0 ? addGiorniLav(consegna, p.tEntrata) : consegna;
    ritardo = disponibile > dataDisp;
  }
  return { dataRilascio: rilascio, dataConsegna: consegna, ritardo };
}

// Pianificazione di un materiale. PD = deterministica (fabbisogni reali + scorta di sicurezza);
// VB = a punto di riordino (giacenza + ordini in arrivo <= punto di riordino); ND = non pianificato.
function pianificaMRP(mp, esclusiRA, extra) {
  const p = mrpParam(mp); const oggi = oggiISO(); const stock = getGiacenza(mp.codice);
  const ev = eventiMRP(mp, esclusiRA, extra); const proposte = [];
  if (p.tipo === 'ND') return { mp, p, stock, eventi: ev, proposte };
  if (p.tipo === 'VB') {
    const disp = stock + ev.filter(e => e.tipo === 'entrata').reduce((s,e) => s + e.qta, 0);
    if (p.puntoRiord > 0 && disp <= p.puntoRiord) {
      let corrente = disp;
      dimensionaLottoMRP(p.puntoRiord - disp + 1, disp, p).forEach(q => {
        const s = schedulaPropostaMRP(p, oggi, oggi);
        proposte.push({ qta: q, dataFabbisogno: oggi, dataRilascio: s.dataRilascio, dataConsegna: s.dataConsegna, ritardo: false });
        corrente += q;
      });
    }
    return { mp, p, stock, eventi: ev, proposte };
  }
  // PD
  const date = [...new Set(ev.map(e => e.dataEff))];
  if (!date.length) date.push(oggi);
  let disp = stock;
  for (const d of date) {
    ev.filter(e => e.dataEff === d).forEach(e => { disp += e.tipo === 'entrata' ? e.qta : -e.qta; });
    let giri = 0;
    while (disp < p.scortaSic && giri++ < 500) {
      const fine = fineePeriodoMRP(d, p.politica);
      let run = disp, minimo = disp;
      ev.filter(e => e.dataEff > d && e.dataEff <= fine).forEach(e => { run += e.tipo === 'entrata' ? e.qta : -e.qta; if (run < minimo) minimo = run; });
      const pezzi = dimensionaLottoMRP(p.scortaSic - minimo, disp, p);
      if (!pezzi.length) break;
      pezzi.forEach(q => {
        const s = schedulaPropostaMRP(p, d, oggi);
        proposte.push({ qta: q, dataFabbisogno: d, dataRilascio: s.dataRilascio, dataConsegna: s.dataConsegna, ritardo: s.ritardo });
        disp += q;
      });
    }
  }
  return { mp, p, stock, eventi: ev, proposte };
}

// Messaggi di eccezione (come in MD04 reale): 10 anticipare, 15 posticipare, 20 annullare, 96 scorta di sicurezza violata.
// Restituisce una mappa "FONTE|riferimento" -> {codice, testo}.
function eccezioniMRP(mp) {
  const p = mrpParam(mp); const out = {};
  if (p.tipo !== 'PD') return out;
  const stock = getGiacenza(mp.codice); const ev = eventiMRP(mp);
  function primoFabbisogno(lista) {
    const date = [...new Set(lista.map(e => e.dataEff))]; let disp = stock;
    for (const d of date) {
      const gruppo = lista.filter(e => e.dataEff === d);
      gruppo.forEach(e => { disp += e.tipo === 'entrata' ? e.qta : -e.qta; });
      if (disp < p.scortaSic) return { data: d, disp, gruppo };
    }
    return null;
  }
  const carenza = primoFabbisogno(ev);
  if (carenza) {
    const f = carenza.gruppo.find(e => e.tipo === 'fabbisogno');
    const chiave = f ? 'ODP|' + f.rif : 'SS|-';
    out[chiave] = carenza.disp >= 0 && p.scortaSic > 0
      ? { codice: '96', testo: 'Scorta di sicurezza violata' }
      : { codice: '—', testo: 'Fabbisogno non coperto' };
  }
  ev.filter(e => e.tipo === 'entrata').forEach(r => {
    const senza = ev.filter(e => e !== r);
    const need = primoFabbisogno(senza);
    const chiave = r.fonte + '|' + r.rif;
    if (!need) { out[chiave] = { codice: '20', testo: 'Annullare: non necessario' }; return; }
    const attesa = p.tEntrata > 0 ? addGiorniLav(need.data, -p.tEntrata) : need.data;
    if (r.dataEff > attesa) out[chiave] = { codice: '10', testo: 'Anticipare al ' + attesa };
    else if (r.dataEff < attesa) out[chiave] = { codice: '15', testo: 'Posticipare al ' + attesa };
  });
  return out;
}

// ---- Esecuzione: calcolo (anteprima) e salvataggio ----
// Filtro per pianificatore (funzione di comodo del simulatore, in SAP si fa con il perimetro di pianificazione):
// elenco vuoto = tutti; PIAN_SENZA = materiali senza pianificatore assegnato.
const PIAN_SENZA = '(senza)';
function passaPianificatore(m, filtro) {
  if (!filtro || !filtro.length) return true;
  return m.pianificatore ? filtro.includes(m.pianificatore) : filtro.includes(PIAN_SENZA);
}
function pianificatoriInUso() { return [...new Set(materiali.filter(m => m.tipo === 'MP').map(m => m.pianificatore).filter(Boolean))].sort(); }
function pianificatoreFiltroHTML(draft) {
  const sel = draft.pianificatori || [];
  const chk = (v) => `<label style="display:inline-block;margin:2px 14px 2px 0;font-size:11.5px;"><input type="checkbox" class="md-pian" value="${v}" ${sel.includes(v) ? 'checked' : ''}> ${v}</label>`;
  const elenco = pianificatoriInUso();
  return `<label>Pianificatore MRP (vuoto = tutti)</label><div>${elenco.length ? elenco.map(chk).join('') + chk(PIAN_SENZA) : '<span style="font-size:11px;color:#9a9a8f;">Nessun pianificatore assegnato: impostalo ai materiali in MM01/MM02.</span>'}</div>`;
}
function collegaPianificatoreFiltro(draft, dopo) {
  document.querySelectorAll('.md-pian').forEach(cb => cb.addEventListener('change', () => {
    draft.pianificatori = [...document.querySelectorAll('.md-pian:checked')].map(x => x.value);
    if (dopo) dopo(); else renderScreenContent();
  }));
}
function materialiInScopoMRP(codice, pianificatori) {
  const mps = materiali.filter(m => m.tipo === 'MP');
  return codice ? mps.filter(m => m.codice === codice) : mps.filter(m => mrpParam(m).tipo !== 'ND' && passaPianificatore(m, pianificatori));
}
async function calcolaRisultatiMRP(codice, modalita, pianificatori) {
  [materiali, richiesteAcquisto, ordiniAcquisto, ordiniProduzione, movimentazioni] = await Promise.all(
    ['materiali','richiesteAcquisto','ordiniAcquisto','ordiniProduzione','movimentazioni'].map(k => loadList(k)));
  const scope = materialiInScopoMRP(codice, pianificatori);
  const codici = new Set(scope.map(m => m.codice));
  // Modalità 3 (cancella e ricrea): toglie dal calcolo (e, al salvataggio, elimina) le RA aperte generate dall'MRP
  // dall'utente corrente per i materiali in scopo. Le RA di altri partecipanti non vengono mai toccate.
  const esclusi = (modalita === '3')
    ? richiesteAcquisto.filter(r => r.stato === 'aperta' && r.origine === 'MD01/MRP' && r.creatoDa === currentUser && codici.has(r.materiale)).map(r => r.numero)
    : [];
  const set = new Set(esclusi);
  // Materie prime NON pianificate (tipo MRP ND): senza un materiale scelto vengono escluse dal calcolo, ma si elencano
  // comunque nel risultato per mostrare che l'esclusione è voluta e non una dimenticanza.
  const nonPianificati = codice ? [] : materiali.filter(m => m.tipo === 'MP' && mrpParam(m).tipo === 'ND' && passaPianificatore(m, pianificatori)).map(m => m.codice);
  return { codice, modalita, esclusi, pianificatori: codice ? [] : (pianificatori || []), risultati: scope.map(mp => pianificaMRP(mp, set)), nonPianificati, salvato: false };
}
// MD02: MRP multilivello su un prodotto finito. Livello 1: il fabbisogno del prodotto (ordini di vendita residui, al netto di
// giacenza e ordini di produzione aperti) genera ordini di produzione PIANIFICATI (non salvati: gli ordini veri si creano in MF50).
// Livello 2: i loro componenti (distinta base) diventano fabbisogno dipendente delle materie prime, pianificate come in MD01.
async function calcolaRisultatiMD02(pfCodice, modalita) {
  [materiali, richiesteAcquisto, ordiniAcquisto, ordiniProduzione, movimentazioni, ordiniVendita, distinte] = await Promise.all(
    ['materiali','richiesteAcquisto','ordiniAcquisto','ordiniProduzione','movimentazioni','ordiniVendita','distinte'].map(k => loadList(k)));
  const bom = getBOM(pfCodice);
  const righe = [];
  ordiniVendita.filter(o => o.stato !== 'evaso').forEach(o => (o.righe || []).forEach(r => {
    if (r.prodotto !== pfCodice) return;
    const residuo = Number(r.quantita) - Number(r.consegnato || 0);
    if (residuo > 0) righe.push({ ov: o.numero, data: r.dataRichiesta || oggiISO(), qta: residuo });
  }));
  righe.sort((a,b) => a.data < b.data ? -1 : a.data > b.data ? 1 : 0);
  let coperto = getGiacenza(pfCodice) + pianificatoApertoPer(pfCodice);
  const pianificati = []; const extra = []; const codiciMP = new Set();
  const copertoSL = {}; // semilavorati: disponibilità residua (giacenza + ODP aperti) consumata man mano
  // Fabbisogno dipendente: i componenti di un ordine pianificato diventano fabbisogno. Un componente che è un
  // semilavorato (tipo PF) viene prima netto di giacenza/ordini aperti; il mancante genera un ordine pianificato
  // di livello successivo, e così via fino alle materie prime. Stessa data del fabbisogno (nessun lead time di produzione).
  const esplodiFabbisogno = (codice, qta, data, rifPadre, livello, percorso) => {
    const b = getBOM(codice);
    (b ? b.componenti : []).forEach(c => {
      if (percorso.includes(c.codice)) return;
      const need = Number(c.qta) * qta;
      const m = materiali.find(x => x.codice === c.codice);
      if (m && m.tipo === 'PF') {
        if (copertoSL[c.codice] === undefined) copertoSL[c.codice] = getGiacenza(c.codice) + pianificatoApertoPer(c.codice);
        const usa = Math.min(copertoSL[c.codice], need); copertoSL[c.codice] -= usa;
        const mancSL = need - usa;
        if (mancSL > 0) {
          const rif = 'PIAN-' + (pianificati.length + 1);
          pianificati.push({ rif, prodotto: c.codice, qta: mancSL, data, ov: '(da ' + rifPadre + ')', livello });
          esplodiFabbisogno(c.codice, mancSL, data, rif, livello + 1, [...percorso, c.codice]);
        }
      } else {
        codiciMP.add(c.codice);
        extra.push({ codice: c.codice, qta: need, data, rif: rifPadre });
      }
    });
  };
  righe.forEach(r => {
    const usa = Math.min(coperto, r.qta); coperto -= usa;
    const mancante = r.qta - usa;
    if (mancante > 0) {
      const rif = 'PIAN-' + (pianificati.length + 1);
      pianificati.push({ rif, prodotto: pfCodice, qta: mancante, data: r.data, ov: r.ov, livello: 1 });
      esplodiFabbisogno(pfCodice, mancante, r.data, rif, 2, [pfCodice]);
    }
  });
  const scope = materiali.filter(m => m.tipo === 'MP' && codiciMP.has(m.codice) && mrpParam(m).tipo !== 'ND');
  const codici = new Set(scope.map(m => m.codice));
  const esclusi = (modalita === '3')
    ? richiesteAcquisto.filter(r => r.stato === 'aperta' && r.origine === 'MD01/MRP' && r.creatoDa === currentUser && codici.has(r.materiale)).map(r => r.numero)
    : [];
  const set = new Set(esclusi);
  return { codice: pfCodice, modalita, esclusi, pianificati, senzaDistinta: !bom, risultati: scope.map(mp => pianificaMRP(mp, set, extra)), salvato: false };
}
// Quantità effettiva di una proposta: quella calcolata dall'MRP, o quella scelta a mano nella colonna "Quantità da creare".
function qtaEffettivaProposta(pr) {
  if (pr.qtaMod === undefined || pr.qtaMod === '') return pr.qta;
  return Number(pr.qtaMod);
}
async function salvaRisultatiMRP(ris) {
  for (const x of ris.risultati) for (const pr of x.proposte) {
    const q = qtaEffettivaProposta(pr);
    if (!Number.isInteger(q) || q < 0) return { errore: `${x.mp.codice}: la quantità da creare deve essere un numero intero, zero o maggiore.` };
  }
  richiesteAcquisto = await loadList('richiesteAcquisto');
  let eliminate = 0, create = 0;
  for (const num of ris.esclusi) {
    const r = richiesteAcquisto.find(x => x.numero === num && x.stato === 'aperta');
    if (r) { await eliminaRecord('richiesteAcquisto', chiaveDiRecord('richiesteAcquisto', r)); eliminate++; }
  }
  richiesteAcquisto = richiesteAcquisto.filter(r => !ris.esclusi.includes(r.numero));
  for (const x of ris.risultati) {
    for (const pr of x.proposte) {
      const q = qtaEffettivaProposta(pr);
      if (q === 0) continue; // quantità azzerata a mano: la RA non viene creata
      const rec = {
        numero: await prossimoNumero('RA'), materiale: x.mp.codice, quantita: q,
        dataRichiesta: pr.dataConsegna, dataRilascio: pr.dataRilascio, dataFabbisogno: pr.dataFabbisogno,
        stato: 'aperta', origine: 'MD01/MRP', creatoDa: currentUser, creatoIl: nowStr(),
        ...(q !== pr.qta ? { qtaModificata: true, qtaProposta: pr.qta } : {}),
      };
      await aggiungiRecord('richiesteAcquisto', rec);
      richiesteAcquisto.push(rec); create++;
    }
  }
  return { create, eliminate };
}

// Per ogni materiale mostra da dove arriva il fabbisogno (ordini di produzione aperti) e cosa lo copre già.
function tabellaTuttiMaterialiMRP(ris) {
  const stati = ris.risultati.map(x => {
    const fabb = x.eventi.filter(e => e.tipo === 'fabbisogno');
    const entr = x.eventi.filter(e => e.tipo === 'entrata');
    const totFabb = fabb.reduce((s, e) => s + e.qta, 0);
    const totEntr = entr.reduce((s, e) => s + e.qta, 0);
    const rif = [...new Set(fabb.map(e => e.rif))];
    let stato, ordine;
    if (x.proposte.length) { stato = `<span style="color:#a83232;font-weight:600;">RA proposta (${x.proposte.length})</span>`; ordine = 0; }
    else if (totFabb > 0) { stato = `<span style="color:#1a6b2e;">Coperto da giacenza/ordini</span>`; ordine = 1; }
    else if (x.p.tipo === 'VB') { stato = `<span style="color:#1a6b2e;">Sopra il punto di riordino</span>`; ordine = 2; }
    else { stato = `<span style="color:#8a8a80;">Nessun fabbisogno</span>`; ordine = 3; }
    return { x, totFabb, totEntr, rif, stato, ordine };
  }).sort((a, b) => a.ordine - b.ordine || a.x.mp.codice.localeCompare(b.x.mp.codice));
  const nd = (ris.nonPianificati || []);
  const origine = rif => rif.length === 0 ? '-' : rif.slice(0, 6).join(', ') + (rif.length > 6 ? ` +${rif.length - 6}` : '');
  const righeHTML = stati.map(s => `<tr><td>${materialeLabel(s.x.mp.codice)}</td><td>${s.x.mp.pianificatore || '-'}</td><td>${s.x.p.tipo}</td><td>${s.x.stock}</td><td>${s.x.p.scortaSic || 0}</td><td>${s.totFabb}</td><td>${s.totEntr}</td><td style="font-size:10px;">${origine(s.rif)}</td><td>${s.stato}</td></tr>`).join('')
    + nd.map(c => `<tr><td>${materialeLabel(c)}</td><td>${(materiali.find(m => m.codice === c) || {}).pianificatore || '-'}</td><td>ND</td><td>${getGiacenza(c)}</td><td>-</td><td>-</td><td>-</td><td>-</td><td><span style="color:#8a8a80;">ND, non pianificato</span></td></tr>`).join('');
  return `
      <p style="font-size:11px; margin:12px 0 4px 0;"><strong>Tutti i materiali valutati (${stati.length + nd.length})</strong> — anche quelli per cui non è nata nessuna RA. Fabbisogno = componenti degli ordini di produzione aperti${stati.some(s => s.x.eventi.some(e => e.fonte === 'PIAN')) ? ' e pianificati' : ''}; entrate = RA aperte e ordini d'acquisto non ancora ricevuti.</p>
      <div class="tablewrap" style="margin:0;">
        <table>
          <thead><tr><th>Materiale</th><th>Pianificatore</th><th>Tipo MRP</th><th>Giacenza</th><th>Scorta sic.</th><th>Fabbisogno</th><th>Entrate</th><th>Origine fabbisogno</th><th>Esito</th></tr></thead>
          <tbody>${righeHTML || '<tr><td colspan="9" style="text-align:center; color:#9a9a8f; padding:14px;">Nessun materiale in scopo.</td></tr>'}</tbody>
        </table>
      </div>`;
}

async function eseguiMRPDaSchermata(draft) {
  // I dati letti sono una copia scaricata al login o con 🔄: prima di calcolare l'MRP la riscarico, così tutti
  // i dispositivi lavorano sugli stessi ordini di vendita, distinte e giacenze appena inseriti dagli altri.
  await caricaCacheCorso();
  const ris = draft === draftMD02 ? await calcolaRisultatiMD02(draft.materiale, draft.modalita) : await calcolaRisultatiMRP(draft.materiale, draft.modalita, draft.pianificatori);
  if (draft.mostra) { draft.risultato = ris; renderScreenContent(); return; }
  const out = await salvaRisultatiMRP(ris);
  if (out.errore) { setStatus(out.errore, true); return; }
  ris.salvato = true; draft.risultato = ris;
  setStatus(`MRP eseguito: create ${out.create} richieste d'acquisto${out.eliminate ? `, eliminate ${out.eliminate} RA MRP precedenti` : ''}.`);
  renderMain();
}
function collegaAzioniMRP(draft) {
  const esegui = document.getElementById('mrp-esegui');
  if (esegui) esegui.addEventListener('click', () => withGuard(async () => {
    if ((draft === draftMD03 || draft === draftMD02) && !draft.materiale) { setStatus('Seleziona un materiale.', true); return; }
    await eseguiMRPDaSchermata(draft);
  }));
  const salva = document.getElementById('mrp-salva');
  if (salva) salva.addEventListener('click', () => withGuard(async () => {
    const out = await salvaRisultatiMRP(draft.risultato);
    if (out.errore) { setStatus(out.errore, true); return; }
    draft.risultato.salvato = true;
    setStatus(`Salvate ${out.create} richieste d'acquisto${out.eliminate ? `, eliminate ${out.eliminate} RA MRP precedenti` : ''}.`);
    renderMain();
  }));
  document.querySelectorAll('.mrp-qta-edit').forEach(inp => inp.addEventListener('input', e => {
    const pr = draft.risultato.risultati[Number(e.target.dataset.xi)].proposte[Number(e.target.dataset.pi)];
    pr.qtaMod = e.target.value === '' ? '' : Number(e.target.value);
    e.target.style.background = String(pr.qtaMod) !== String(e.target.dataset.prop) ? '#fff1d6' : '';
  }));
  const scarta = document.getElementById('mrp-scarta');
  if (scarta) scarta.addEventListener('click', () => { draft.risultato = null; renderScreenContent(); });
  const modalita = document.getElementById('f-modalita-mrp');
  if (modalita) modalita.addEventListener('change', e => { draft.modalita = e.target.value; });
  const mostra = document.getElementById('f-mostra-mrp');
  if (mostra) mostra.addEventListener('change', e => { draft.mostra = e.target.checked; });
}

function elementiMD04(mat, proposte) {
  const oggiISO_ = oggiISO();
  const elementi = [];
  elementi.push({ data: oggiISO_, tipo: 'Giacenza iniziale', riferimento: '-', quantita: getGiacenza(mat.codice), ordine: -2, chiave: 'GI|-' });
  const scortaSic = Number(mat.scortaSicurezza) || 0;
  if (scortaSic > 0) {
    elementi.push({ data: oggiISO_, tipo: 'Scorta di sicurezza', riferimento: '-', quantita: -scortaSic, ordine: -1, chiave: 'SS|-' });
  }
  if (mat.tipo === 'MP') {
    ordiniProduzione.filter(o => o.stato === 'aperto').forEach(o => {
      const comp = (o.componenti || []).find(c => c.codice === mat.codice);
      if (comp) elementi.push({ data: o.dataPianificata || oggiISO_, tipo: 'Fabbisogno dipendente (ODP)', riferimento: o.numero, quantita: -comp.qtaTotale, ordine: 0, chiave: 'ODP|' + o.numero });
    });
    richiesteAcquisto.filter(r => r.materiale === mat.codice && r.stato === 'aperta').forEach(r => {
      elementi.push({ data: r.dataRichiesta || oggiISO_, tipo: "Richiesta d'acquisto", riferimento: r.numero, quantita: r.quantita, ordine: 0, chiave: 'RA|' + r.numero });
    });
    ordiniAcquisto.forEach(o => { o.righe.forEach(r => {
      if (r.materiale === mat.codice && !r._rimossa && !rigaCompleta(r)) {
        elementi.push({ data: r.dataConsegna || oggiISO_, tipo: "Ordine d'acquisto", riferimento: o.numero, quantita: Number(r.quantita) - rigaQtaRicevuta(r), ordine: 0, chiave: 'OA|' + o.numero });
      }
    }); });
    (proposte || []).forEach((pr, i) => {
      elementi.push({ data: pr.dataConsegna, tipo: "RA proposta (MRP, non salvata)", riferimento: 'MRP-' + (i+1), quantita: pr.qta, ordine: 0, chiave: 'PR|' + i, proposta: true });
    });
  } else if (mat.tipo === 'PF') {
    ordiniVendita.forEach(o => {
      if (o.stato === 'evaso') return;
      (o.righe || []).forEach(r => {
        if (r.prodotto !== mat.codice) return;
        const residuo = Number(r.quantita) - Number(r.consegnato||0);
        if (residuo > 0) elementi.push({ data: r.dataRichiesta || oggiISO_, tipo: 'Ordine di vendita', riferimento: o.numero, quantita: -residuo, ordine: 0, chiave: 'OV|' + o.numero });
      });
    });
    ordiniProduzione.filter(o => o.stato === 'aperto' && o.prodotto === mat.codice).forEach(o => {
      elementi.push({ data: o.dataPianificata || oggiISO_, tipo: 'Ordine di produzione', riferimento: o.numero, quantita: o.quantita, ordine: 0, chiave: 'OP|' + o.numero });
    });
  }
  elementi.sort((a,b) => (a.data === b.data ? a.ordine - b.ordine : (a.data < b.data ? -1 : 1)));
  let run = 0;
  elementi.forEach(e => { run += e.quantita; e.disponibilitaCumulata = run; });
  return elementi;
}

      setStatus(`Ordine di produzione ${numero} corretto: segnato come evaso senza generare nuovi movimenti.`);
      renderMain();

  attachDeleteBaseListeners();
  document.querySelectorAll('.confirm-delete-yes').forEach(el => {

// ============ CO15 (conferma/evasione ODP) ============
function renderCO15(el) {
  const aperti = ordiniProduzione.filter(o => o.stato === 'aperto');
  const oggiISO = isoDate(new Date());
  el.innerHTML = `
    <div class="formwrap" style="padding-bottom:0;">
      <p style="font-size:11px;color:#5a6470;margin:0 0 8px 0;">Conferma un ordine di produzione: scarica i componenti <strong>dall'ubicazione OFFICINA</strong> e carica il prodotto finito in OFFICINA. Se il materiale non è ancora stato spostato in officina, l'evasione viene bloccata.</p>
    </div>
    <div class="tablewrap" style="margin-top:0;">
      <table>
        <thead><tr><th>N. ordine</th><th>Prodotto</th><th>Quantità</th><th>Componenti richiesti (disponibilità in OFFICINA)</th><th>Data scadenza</th><th>Azione</th></tr></thead>
        <tbody>
          ${aperti.length===0 ? '<tr><td colspan="6" style="text-align:center;color:#9a9a8f;padding:16px;">Nessun ordine di produzione aperto da evadere.</td></tr>' :
            aperti.map(o => {
              const scaduto = o.dataPianificata && o.dataPianificata < oggiISO;
              return `
              <tr>
                <td>${o.numero}</td><td>${materialeLabel(o.prodotto)}</td><td>${o.quantita}</td>
                <td style="font-size:10.5px;">${o.componenti.map(c => c.codice+' x'+c.qtaTotale+' (in OFFICINA: '+getGiacenzaLoc(c.codice,'OFFICINA')+')').join(', ')}</td>
                <td style="color:${scaduto?'#a83232':'#1a1a1a'}; font-weight:${scaduto?'600':'400'};">${o.dataPianificata || '-'}${scaduto?' ⚠️':''}</td>
                <td><button class="actionbtn conferma-op" data-numero="${o.numero}" style="padding:3px 8px; font-size:10.5px;">✔ Conferma (CO15)</button></td>
              </tr>
            `;
            }).join('')}
        </tbody>
      </table>
    </div>
  `;
  document.querySelectorAll('.conferma-op').forEach(btn => {
    btn.addEventListener('click', () => withGuard(async () => {
      const numero = btn.dataset.numero;
      const op = ordiniProduzione.find(o => o.numero === numero);
      if (!op) return;
      movimentazioni = await movimentiFreschi();
      // Carenze: come in SAP (backflush), se manca materiale la conferma viene salvata ma i movimenti
      // merci NON si registrano e finiscono in COGI (movimenti merci errati), da riprocessare dopo aver
      // caricato il materiale. Fa eccezione il materiale con giacenza negativa ammessa (flag + interruttore).
      const carenzeOP = [];
      for (const c of op.componenti) {
        const disp = getGiacenzaLoc(c.codice, 'OFFICINA');
        if (disp < c.qtaTotale && !(await negativoAmmesso(c.codice))) carenzeOP.push({ materiale: c.codice, richiesto: c.qtaTotale, disponibile: disp, mancante: c.qtaTotale - Math.max(disp, 0) });
      }
      const negativiOP = op.componenti.filter(c => getGiacenzaLoc(c.codice, 'OFFICINA') < c.qtaTotale && !carenzeOP.some(x => x.materiale === c.codice)).map(c => c.codice);
      if (carenzeOP.length > 0) {
        const numCogi = await prossimoNumero('COGI');
        const recCogi = {
          numero: numCogi, ordine: numero, prodotto: op.prodotto, quantitaPF: op.quantita, stato: 'aperto',
          righe: [...op.componenti.map(c => ({ tipo: 'consumo', materiale: c.codice, quantita: c.qtaTotale })), { tipo: 'carico', materiale: op.prodotto, quantita: op.quantita }],
          mancanti: carenzeOP, messaggio: 'Quantità insufficiente in OFFICINA per ' + carenzeOP.map(x => x.materiale).join(', '),
          creatoDa: currentUser, creatoIl: nowStr(),
        };
        await aggiungiRecord('erroriMovimenti', recCogi);
        erroriMovimenti.push(recCogi);
        const confermaCogi = nowStr();
        const okCogi = await applicaPatch('ordiniProduzione', numero, { stato: 'confermato', confermatoDa: currentUser, confermatoIl: confermaCogi, dataEvasione: oggiISO, cogi: numCogi });
        if (!okCogi) {
          await eliminaRecord('erroriMovimenti', numCogi); erroriMovimenti = erroriMovimenti.filter(x => x.numero !== numCogi);
          setStatus(`⚠️ Conferma di ${numero} NON salvata: connessione al server condiviso fallita. Riprova quando è più stabile.`, true);
          renderMain(); return;
        }
        op.stato = 'confermato'; op.confermatoDa = currentUser; op.confermatoIl = confermaCogi; op.dataEvasione = oggiISO; op.cogi = numCogi;
        setStatus(`Ordine ${numero} confermato, ma i movimenti merci NON sono stati registrati: materiale insufficiente in OFFICINA (${carenzeOP.map(x => `${x.materiale}: manca ${x.mancante}`).join('; ')}). Inseriti in COGI come ${numCogi}: carica il materiale e riprocessa.`, true);
        renderMain(); return;
      }
      const dataEvasione = oggiISO;
      for (const c of op.componenti) {
        await registraMovimento({ materiale: c.codice, locazioneDa: 'OFFICINA', locazioneA: null, quantita: c.qtaTotale, causale: 'Consumo produzione CO15 (' + numero + ')' });
      }
      await registraMovimento({ materiale: op.prodotto, locazioneDa: null, locazioneA: 'OFFICINA', quantita: op.quantita, causale: 'Produzione PF CO15 (' + numero + ')' });
      const confermaIl = nowStr();
      const patchOk = await applicaPatch('ordiniProduzione', numero, { stato: 'confermato', confermatoDa: currentUser, confermatoIl: confermaIl, dataEvasione: dataEvasione });
      if (!patchOk) {
        // La patch di stato non è stata salvata in modo condiviso (connessione instabile): i
        // movimenti qui sopra SONO già stati scritti, quindi se lasciassimo l'ordine "aperto"
        // la prossima conferma scaricherebbe/caricherebbe il materiale una seconda volta. Per
        // evitare la doppia elaborazione, annulliamo subito i movimenti appena fatti (storno
        // automatico) e lasciamo l'ordine davvero aperto, pronto per un nuovo tentativo.
        for (const c of op.componenti) {
          await registraMovimento({ materiale: c.codice, locazioneDa: null, locazioneA: 'OFFICINA', quantita: c.qtaTotale, causale: 'Storno automatico (salvataggio conferma non riuscito) CO15 (' + numero + ')' });
        }
        await registraMovimento({ materiale: op.prodotto, locazioneDa: 'OFFICINA', locazioneA: null, quantita: op.quantita, causale: 'Storno automatico (salvataggio conferma non riuscito) CO15 (' + numero + ')' });
        setStatus(`⚠️ Conferma di ${numero} NON salvata: la connessione al server condiviso è fallita. I movimenti sono stati annullati automaticamente per evitare di elaborare l'ordine due volte. Riprova quando la connessione è più stabile.`, true);
        renderMain();
        return;
      }
      op.stato = 'confermato';
      op.confermatoDa = currentUser;
      op.confermatoIl = confermaIl;
      op.dataEvasione = dataEvasione;
      setStatus(negativiOP.length ? `⚠️ Ordine ${numero} confermato con giacenza NEGATIVA in OFFICINA per ${negativiOP.join(', ')} (ammessa): verifica in ZMB01.` : `Ordine di produzione ${numero} confermato (evaso il ${dataEvasione}): prodotto finito creato in OFFICINA.`);
      renderMain();
    }));
  });
}


// ============ COGI (movimenti merci errati della produzione) ============
// Come in SAP: se alla conferma (CO15) manca materiale, l'ordine risulta confermato ma i movimenti merci
// (scarico componenti + carico prodotto finito) non vengono registrati e restano qui in attesa.
// Dopo aver caricato il materiale (MIGO / MB1C) si riprocessa la voce.
let filtroCOGI = { mostraElaborati: false };
let cogiDaEliminare = null; // conferma in pagina (niente confirm() nativo)
async function riprocessaCOGI(numero) {
  movimentazioni = await movimentiFreschi();
  const c = erroriMovimenti.find(x => x.numero === numero);
  if (!c || c.stato !== 'aperto') return { ok: false, msg: `${numero}: voce non trovata o già elaborata.` };
  const carenze = [];
  for (const r of c.righe.filter(x => x.tipo === 'consumo')) {
    const disp = getGiacenzaLoc(r.materiale, 'OFFICINA');
    if (disp < r.quantita && !(await negativoAmmesso(r.materiale))) carenze.push(`${r.materiale} (disponibile ${disp}, richiesto ${r.quantita})`);
  }
  if (carenze.length) return { ok: false, msg: `${numero}: quantità ancora insufficiente in OFFICINA — ${carenze.join('; ')}.` };
  for (const r of c.righe) {
    if (r.tipo === 'consumo') await registraMovimento({ materiale: r.materiale, locazioneDa: 'OFFICINA', locazioneA: null, quantita: r.quantita, causale: `Consumo produzione CO15 (${c.ordine}) [COGI ${c.numero}]` });
    else await registraMovimento({ materiale: r.materiale, locazioneDa: null, locazioneA: 'OFFICINA', quantita: r.quantita, causale: `Produzione PF CO15 (${c.ordine}) [COGI ${c.numero}]` });
  }
  const ok = await applicaPatch('erroriMovimenti', numero, { stato: 'elaborato', elaboratoDa: currentUser, elaboratoIl: nowStr() });
  c.stato = 'elaborato'; c.elaboratoDa = currentUser; c.elaboratoIl = nowStr();
  return { ok: true, msg: `${numero} riprocessata: movimenti registrati per l'ordine ${c.ordine}.` + (ok ? '' : ' ⚠️ stato non salvato sul server condiviso.') };
}
function renderCOGI(el) {
  const tutte = erroriMovimenti.slice().reverse();
  const elenco = filtroCOGI.mostraElaborati ? tutte : tutte.filter(x => x.stato === 'aperto');

  el.innerHTML = `

    </div>`;
  document.getElementById('cogi-elab').addEventListener('change', e => { filtroCOGI.mostraElaborati = e.target.checked; renderScreenContent(); });
  document.querySelectorAll('.cogi-ripr').forEach(b => b.addEventListener('click', () => withGuard(async () => {

  document.getElementById('cogi-tutti').addEventListener('click', () => withGuard(async () => {
    let ok = 0, ko = 0;
    for (const c of erroriMovimenti.filter(x => x.stato === 'aperto')) { const r = await riprocessaCOGI(c.numero); if (r.ok) ok++; else ko++; }

  document.querySelectorAll('.cogi-del').forEach(b => b.addEventListener('click', () => withGuard(async () => {

    await eliminaRecord('erroriMovimenti', c.numero);
    erroriMovimenti = erroriMovimenti.filter(x => x.numero !== c.numero);
    setStatus(`Voce ${c.numero} eliminata.`); renderMain();
  })));
}

// ============ ZMB01 (custom: anomalie giacenze negative) ============
function calcolaNegativi() {
  const mov = movimentazioni; const stato = {}; const out = [];
  mov.forEach((m, i) => {
    [[m.locazioneA, m.quantita], [m.locazioneDa, -m.quantita]].forEach(([loc, q]) => {
      if (!loc) return;
      const k = m.materiale + '::' + loc; const e = stato[k] || (stato[k] = { materiale: m.materiale, loc, tot: 0, primo: null, ultimo: null });
      const prima = e.tot; e.tot += q; e.ultimo = m;
      if (prima >= 0 && e.tot < 0) e.primo = m;
    });
  });
  Object.values(stato).forEach(e => { if (e.tot < 0) out.push(e); });
  return out.sort((a, b) => a.tot - b.tot);
}

  const aperteCogi = erroriMovimenti.filter(x => x.stato === 'aperto').length;
  el.innerHTML = `

      <p id="zmb01-sw" style="font-size:11px;margin:0 0 6px 0;"></p>

        <tbody>${neg.length === 0 ? '<tr><td colspan="6" style="text-align:center;color:#1a6b2e;padding:16px;">Nessuna giacenza negativa.</td></tr>' :
          neg.map(e => `<tr><td>${materialeLabel(e.materiale)}</td><td>${e.loc}</td><td style="color:#a83232;font-weight:600;">${e.tot}</td><td>${getGiacenza(e.materiale)}</td><td style="font-size:10.5px;">${descr(e.primo)}</td><td style="font-size:10.5px;">${descr(e.ultimo)}</td></tr>`).join('')}

  giacenzaNegativaConsentita().then(v => { const x = document.getElementById('zmb01-sw'); if (x) x.innerHTML = `Interruttore generale del formatore: <strong style="color:${v ? '#a83232' : '#1a6b2e'};">${v ? 'giacenza negativa CONSENTITA' : 'giacenza negativa bloccata'}</strong>`; });
  document.getElementById('zmb01-csv').addEventListener('click', () => {

      neg.map(e => [materialeLabel(e.materiale), e.loc, e.tot, getGiacenza(e.materiale), descr(e.primo), descr(e.ultimo)]));

// ============ ZMR01 (custom: fabbisogno materiale da trasferire in officina) ============
// Non è un T-code SAP standard: è un report aggregato "fatto in casa" (da qui il prefisso Z,
// come da convenzione SAP per gli sviluppi custom del cliente), che riassume — per tutti gli
// ordini di produzione ancora APERTI — quanto materiale serve complessivamente in OFFICINA e
// quanto manca ancora da trasferire lì, per evadere gli ODP con CO15 senza blocchi.
function calcolaFabbisognoOfficina(dataLimite) {
  const aperti = ordiniProduzione.filter(o => o.stato === 'aperto' && (!dataLimite || !o.dataPianificata || o.dataPianificata <= dataLimite));
  const perMateriale = {}; // { codice: { fabbisogno, ordini:Set } }
  aperti.forEach(op => {
    op.componenti.forEach(c => {
      if (!perMateriale[c.codice]) perMateriale[c.codice] = { fabbisogno: 0, ordini: [] };
      perMateriale[c.codice].fabbisogno += c.qtaTotale;
      perMateriale[c.codice].ordini.push(op.numero);
    });
  });
  return Object.keys(perMateriale).map(codice => {
    const { fabbisogno, ordini } = perMateriale[codice];
    const inOfficina = getGiacenzaLoc(codice, 'OFFICINA');
    const totale = getGiacenza(codice);
    const disponibileAltrove = Math.max(0, totale - inOfficina);
    const daTrasferire = Math.max(0, fabbisogno - inOfficina);
    const trasferibileOra = Math.min(daTrasferire, disponibileAltrove);
    const mancanteAssoluto = Math.max(0, daTrasferire - disponibileAltrove);
    return { codice, fabbisogno, inOfficina, disponibileAltrove, daTrasferire, trasferibileOra, mancanteAssoluto, ordini: [...new Set(ordini)] };
  }).filter(r => r.fabbisogno > 0).sort((a, b) => b.mancanteAssoluto - a.mancanteAssoluto || b.daTrasferire - a.daTrasferire);
}

      ['Materiale', 'Descrizione', 'Fabbisogno totale', 'Già in OFFICINA', 'Disponibile altrove', 'Da trasferire', 'Mancante da acquistare', 'Ordini coinvolti'],
      righe.map(r => {
        const mat = materiali.find(m => m.codice === r.codice);
