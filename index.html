<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRS Solutions ERP Full</title>
    <style>
        * {
            box-sizing: border-box;
        }

        :root {

        }

        /* Lista a selezione multipla in stile SAP (sostituisce il

             alternate, evidenziazione al passaggio del mouse. */
          .selectlist-sap { border:1px solid #7f9db9; background:white; overflow-y:auto; }
          .selectlist-sap-row { display:flex; align-items:center; gap:6px; padding:3px 8px; font-size:11px; cursor:pointer; border-bottom:1px solid #eee; }
          .selectlist-sap-row:nth-child(even) { background:#f7f7f2; }
          .selectlist-sap-row:hover { background:#dfe6f0; }
          .selectlist-sap-row input[type="checkbox"] { margin:0; cursor:pointer; }

          .tablewrap { background:white; margin:8px 10px 10px 10px; border:1px solid #8f8f8f; }
          table { width:100%; border-collapse:collapse; font-size:11px; }
          th { background:#e5e0cc; text-align:left; padding:5px 8px; border-bottom:1px solid #c8c2a8; border-right:1px solid #c8c2a8; font-weight:600; white-space:nowrap; position:sticky; top: calc(var(--header-h) + var(--screen-top-h)); z-index:50; }

          .statusbar .right { display:flex; gap:12px; }

          .msg-err { color:#a83232; font-weight:600; }

          /* Login overlay */
          .login-overlay { position:fixed; inset:0; background:#1f3a5f; display:flex; align-items:center; justify-content:center; z-index:999; }
          .login-box { background:#ece9d8; border:2px solid #7f9db9; padding:24px 28px; width:320px; box-shadow:0 8px 24px rgba(0,0,0,.3); }
          .login-box h2 { margin:0 0 4px 0; font-size:15px; color:#1a1a1a; }
          .login-box p { margin:0 0 16px 0; font-size:11px; color:#5a6470; }
          .login-box input { width:100%; padding:8px; font-size:12px; border:1px solid #7f9db9; margin-bottom:12px; font-family:inherit; }
          .login-box button { width:100%; padding:9px; font-size:12px; font-weight:600; background:#2e5aa8; color:white; border:1px solid #1f3a5f; cursor:pointer; }
          .login-box button:hover { background:#3a6ac0; }
          .login-note { margin-top:14px; font-size:10px; color:#8a8a80; line-height:1.4; }

          .storage-warning { background:#fff3cd; color:#7a5a00; border-bottom:1px solid #e0c060; padding:5px 10px; font-size:10.5px; text-align:center; }
          .semaforo { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px; vertical-align:middle; border:1px solid rgba(0,0,0,.35); box-shadow: inset 0 0 1px rgba(255,255,255,.6); }
          .semaforo-verde { background: radial-gradient(circle at 30% 30%, #7fe08a, #1a8a2e); }
          .semaforo-giallo { background: radial-gradient(circle at 30% 30%, #ffe58a, #d9a300); }
          .semaforo-rosso { background: radial-gradient(circle at 30% 30%, #ff8a8a, #b0201f); }
          .stato-badge { display:inline-flex; align-items:center; font-weight:600; }
          .print-btn { color:#2e5aa8; cursor:pointer; text-decoration:underline; font-size:10.5px; }

            #print-area, #print-area * { visibility: visible; }
            #print-area { display:block !important; position: absolute; top:0; left:0; width:100%; background:white; }
            .print-toolbar { display:none !important; }

</head>
<body>
    <div id="app"></div>
    <div id="print-area" style="display:none;"></div>

    <script>
    // ============ STORAGE HELPERS ============
    // Backend: Firebase Realtime Database (sostituisce Google Sheets/Apps Script, troppo lento
    // per un uso con più corsisti insieme). Stesso account Google, gratuito per questo volume.
    //
    // >>> URL del Realtime Database <<<
    const FIREBASE_URL = 'https://grs-erp-e023d-default-rtdb.firebaseio.com';
    const STORAGE_CONFIGURATO = !FIREBASE_URL.startsWith('INSERISCI_QUI');

    let storageOk = true; // true = backend condiviso raggiungibile, false = fallback locale (solo in memoria, non condiviso)
    const _localFallback = {};
    let currentCorso = null;

    // Tutti i dati vivono sotto il nodo "storage/" del database, con la stessa chiave piatta
    // usata prima (es. "corso_X::materiali::u::mario"). I due punti ":" sono ammessi nei percorsi
    // Firebase, quindi non serve altra codifica oltre a quella standard dell'URL.
    function _firebasePath(key) {
        return FIREBASE_URL + '/storage/' + encodeURIComponent(key) + '.json';
    }

    // IMPORTANTE: fetch() NON lancia un errore per risposte HTTP di errore (401/403/500/...),
    // lo fa solo per fallimenti di rete veri e propri (DNS, connessione assente). Se non controlliamo
    // esplicitamente res.ok, una scrittura rifiutata da Firebase (es. regole di sicurezza, chiave
    // non valida) sembra "riuscita" qui, il chiamante la considera andata a buon fine, la cache di
    // sessione viene aggiornata come se il dato fosse salvato — ma sul server non è cambiato nulla.
    // Risultato: l'azione sembra funzionare (es. un ordine sparisce dalla lista), ma al refresh
    // della pagina, che ricarica i dati veri dal server, quel dato torna come prima. Per questo
    // ogni chiamata qui controlla res.ok e lancia un errore se la richiesta non è realmente riuscita,
    // così il meccanismo di retry/fallback/diagnostica già presente in getRaw/setRaw entra in azione
    // davvero invece di essere bypassato in silenzio.
    async function _verificaRisposta(res, azione, key) {
        if (!res.ok) {
            let corpo = '';
            try {
                corpo = await res.text();
            } catch (e) {}
            throw new Error(`Firebase ha rifiutato la ${azione} su "${key}": HTTP ${res.status} ${res.statusText}${corpo ? ' — ' + corpo.slice(0, 200) : ''}`);
        }
    }
    const remoteStorage = {
        async get(key) {
            // "&_=" con timestamp: impedisce al browser di servire una risposta vecchia dalla cache.
            const res = await fetch(_firebasePath(key) + '?_=' + Date.now(), {
                cache: 'no-store'
            });
            await _verificaRisposta(res, 'lettura', key);
            const dato = await res.json(); // null se la chiave non esiste
            if (dato === null || dato === undefined)
                return null;
            return {
                value: JSON.stringify(dato)
            }; // stessa "forma" di prima: una stringa JSON
        },
        // Legge in UN SOLO viaggio di rete tutte le chiavi che iniziano con "prefix".
        // Ritorna una mappa { chiave: valoreStringaJSON }. Usato per caricare tutto un corso in un colpo solo.
        async getPrefix(prefix) {
            const res = await fetch(FIREBASE_URL + '/storage.json?_=' + Date.now(), {
                cache: 'no-store'
            });
            await _verificaRisposta(res, 'lettura elenco', prefix);
            const tutto = (await res.json()) || {};
            const mappa = {};
            for (const chiaveCodificata in tutto) {
                const chiave = decodeURIComponent(chiaveCodificata);
                if (chiave.indexOf(prefix) === 0)
                    mappa[chiave] = JSON.stringify(tutto[chiaveCodificata]);
            }
            return mappa;
        },
        async set(key, value) {
            // "value" arriva già come stringa JSON valida (es. "[]" o "[{...}]"): è esattamente
            // il corpo che Firebase si aspetta per un PUT, nessuna ulteriore conversione necessaria.
            const res = await fetch(_firebasePath(key), {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: value
            });
            await _verificaRisposta(res, 'scrittura', key);
        },
        async delete(key) {
            const res = await fetch(_firebasePath(key), {
                method: 'DELETE'
            });
            await _verificaRisposta(res, 'eliminazione', key);
        }
    };

    // ---- CACHE DI SESSIONE: evita decine di richieste separate per ogni schermata.
    // All'apertura del corso (e a ogni 🔄 aggiorna) scarichiamo TUTTE le chiavi del corso
    // in una volta sola e le teniamo qui; getRaw le legge da qui invece che dalla rete.
    let _cacheCorso = null; // null = non ancora caricata; altrimenti { chiave: valoreStringa }
    async function caricaCacheCorso() {
        if (!STORAGE_CONFIGURATO || !currentCorso) {
            _cacheCorso = {};
            return;
        }
        const MAX_TENTATIVI = 3;
        for (let tentativo = 1; tentativo <= MAX_TENTATIVI; tentativo++) {
            try {
                _cacheCorso = await remoteStorage.getPrefix('corso_' + currentCorso + '::');
                storageOk = true;
                return;
            } catch (e) {
                if (tentativo === MAX_TENTATIVI) {
                    _diagRegistraErrore('lettura-blocco', 'corso_' + currentCorso + '::*', e);
                    storageOk = false;
                    _cacheCorso = {}; // in caso di errore, i singoli getRaw faranno comunque da rete/fallback
                } else {
                    await attesa(250 * tentativo + Math.random() * 150);
                }
            }
        }
    }

    // ---- DIAGNOSTICA STORAGE (per capire eventuali problemi di condivisione dati tra corsisti) ----
    let _diagScrittureOk = 0;
    let _diagScrittureFallite = 0;
    let _diagLetture = 0;
    let _diagLettureFallite = 0;
    let _diagUltimoErrore = null; // { ts, tipo, key, msg }
    const _diagLogErrori = []; // ultimi errori di QUESTA sessione (letture + scritture), max 40
    const DIAG_CHIAVE_PERSISTENTE = '__diag_log_dispositivo__';
    function _diagRegistraErrore(tipo, key, e) {
        const voce = {
            ts: Date.now(),
            tipo,
            key,
            msg: String((e && e.message) || e)
        };
        _diagUltimoErrore = voce;
        _diagLogErrori.push(voce);
        if (_diagLogErrori.length > 40)
            _diagLogErrori.shift();
        // Il log diagnostico stesso lo teniamo in localStorage (siamo fuori dagli artifact
        // Claude, quindi localStorage è di nuovo disponibile normalmente) così sopravvive
        // ai refresh senza dipendere a sua volta dal backend che magari sta fallendo.
        try {
            let log = JSON.parse(localStorage.getItem(DIAG_CHIAVE_PERSISTENTE) || '[]');
            log.push(voce);
            if (log.length > 60)
                log = log.slice(-60);
            localStorage.setItem(DIAG_CHIAVE_PERSISTENTE, JSON.stringify(log));
        } catch (e) {}
    }
    async function _diagLeggiPersistente() {
        try {
            return JSON.parse(localStorage.getItem(DIAG_CHIAVE_PERSISTENTE) || '[]');
        }
        catch (e) {
            return [];
        }
    }

    const CHIAVI_CORSO = ['materiali', 'fornitori', 'clienti', 'distinte', 'ordiniVendita', 'ordiniProduzione',
    'lineeProduzione', 'assegnazioni', 'richiesteAcquisto', 'ordiniAcquisto', 'fornitoriMateriale', 'consegne',
    'locazioni', 'movimentazioni'];

    // Campo che identifica univocamente un record di ciascun tipo (serve per applicare le "patch" di stato)
    const CAMPO_CHIAVE = {
        materiali: 'codice',
        fornitori: 'codice',
        clienti: 'codice',
        lineeProduzione: 'codice',
        locazioni: 'codice',
        distinte: 'prodotto',
        ordiniVendita: 'numero',
        ordiniProduzione: 'numero',
        richiesteAcquisto: 'numero',
        ordiniAcquisto: 'numero',
        consegne: 'numero',
        assegnazioni: (r) => r.prodotto + '::' + r.linea,
        fornitoriMateriale: (r) => r.materiale + '::' + r.fornitore,
    };
    function chiaveDiRecord(key, record) {
        const cc = CAMPO_CHIAVE[key];
        return typeof cc === 'function' ? cc(record) : record[cc];
    }

    function corsoKey(key) {
        if (key === 'preferiti' || key === 'corsiRegistrati')
            return key; // dati globali, non legati a un singolo corso
        return 'corso_' + currentCorso + '::' + key;
    }
    function nomeShard() {
        return (currentUser || 'anon').trim().toLowerCase().replace(/[^a-z0-9]+/g, '-');
    }
    function attesa(ms) {
        return new Promise(r => setTimeout(r, ms));
    }

    // ---- Sessione salvata su QUESTO dispositivo (nome + corso), solo per evitare di dover
    // reinserire il nome a ogni refresh. Usa localStorage: personale del dispositivo,
    // non passa dal backend condiviso e non tocca mai i dati del corso.
    const CHIAVE_SESSIONE_DISPOSITIVO = '__sessione_dispositivo__';
    async function _salvaSessioneDispositivo(corso, utente) {
        try {
            localStorage.setItem(CHIAVE_SESSIONE_DISPOSITIVO, JSON.stringify({
                corso,
                utente
            }));
        }
        catch (e) {}
    }
    async function _leggiSessioneDispositivo() {
        try {
            const v = localStorage.getItem(CHIAVE_SESSIONE_DISPOSITIVO);
            return v ? JSON.parse(v) : null;
        } catch (e) {
            return null;
        }
    }
    async function _cancellaSessioneDispositivo() {
        try {
            localStorage.removeItem(CHIAVE_SESSIONE_DISPOSITIVO);
        } catch (e) {}
    }

    // ---- ID DISPOSITIVO e BAN: un identificativo persistito nel browser (non l'IP, perché
    // un'aula condivide spesso lo stesso WiFi/IP pubblico — bannare per IP rischierebbe di
    // bloccare tutti i corsisti insieme invece del singolo dispositivo). Sopravvive ai refresh
    // e al cambio nome/corso; sparisce solo cancellando i dati del browser o usando un altro browser/dispositivo.
    const CHIAVE_DEVICE_ID = '__device_id_dispositivo__';
    function getDeviceId() {
        try {
            let id = localStorage.getItem(CHIAVE_DEVICE_ID);
            if (!id) {
                id = 'dev-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
                localStorage.setItem(CHIAVE_DEVICE_ID, id);
            }
            return id;
        } catch (e) {
            return 'dev-sconosciuto';
        }
    }
    async function dispositivoBannato() {
        if (!STORAGE_CONFIGURATO)
            return null;
        try {
            const res = await remoteStorage.get('dispositiviBannati::' + getDeviceId());
            return res ? JSON.parse(res.value) : null;
        } catch (e) {
            return null;
        } // in caso di dubbio (rete assente) non blocchiamo l'accesso
    }
    async function bannaDispositivoCorrente(motivo) {

    async function getRaw(storageKey) {
        _diagLetture++;
        // Se la cache di sessione per questo corso è stata caricata, e la chiave è del tipo
        // "corso_X::...", rispondiamo da lì senza fare una richiesta di rete separata.
        if (_cacheCorso && storageKey.indexOf('corso_' + currentCorso + '::') === 0) {
            const v = _cacheCorso[storageKey];
            return v !== undefined ? JSON.parse(v) : [];
        }
        const MAX_TENTATIVI = 3;
        let ultimoErrore = null;
        for (let tentativo = 1; tentativo <= MAX_TENTATIVI; tentativo++) {
            try {
                if (!STORAGE_CONFIGURATO)
                    throw new Error('URL Apps Script non configurato nel codice');
                const res = await remoteStorage.get(storageKey);
                storageOk = true;
                return res ? JSON.parse(res.value) : [];
            } catch (e) {
                ultimoErrore = e;
                if (tentativo < MAX_TENTATIVI)
                    await attesa(250 * tentativo + Math.random() * 150);
            }
        }
        // Tutti i tentativi falliti: registriamo l'errore e usiamo il fallback locale.
        _diagLettureFallite++;
        _diagRegistraErrore('lettura', storageKey, ultimoErrore);
        storageOk = false;
        return _localFallback[storageKey] || [];
    }
    async function setRaw(storageKey, arr) {
        _localFallback[storageKey] = arr;
        const MAX_TENTATIVI = 3;
        for (let tentativo = 1; tentativo <= MAX_TENTATIVI; tentativo++) {
            try {
                if (!STORAGE_CONFIGURATO)
                    throw new Error('URL Apps Script non configurato nel codice');
                await remoteStorage.set(storageKey, JSON.stringify(arr));
                storageOk = true;
                _diagScrittureOk++;
                // Aggiorniamo anche la cache di sessione, così la prossima lettura nella stessa
                // sessione vede subito il dato appena scritto senza dover richiamare la rete.
                if (_cacheCorso)
                    _cacheCorso[storageKey] = JSON.stringify(arr);
                return; // successo, esco
            } catch (e) {
                if (tentativo === MAX_TENTATIVI) {
                    // solo dopo aver esaurito i tentativi consideriamo la scrittura davvero fallita
                    storageOk = false;
                    _diagScrittureFallite++;
                    _diagRegistraErrore('scrittura', storageKey, e);
                } else {
                    // possibile blocco temporaneo (es. limite di frequenza): breve attesa e nuovo tentativo
                    await attesa(300 * tentativo + Math.random() * 200);
                }
            }
        }
    }

    // RECUPERO: se per questo corso esistono ancora dati nel VECCHIO formato (una lista unica condivisa,
    // da prima dell'introduzione dei cassetti personali), li importo una tantum in un cassetto dedicato
    // "recupero-dati-precedenti", così tutto quello che era visibile prima resta visibile anche ora.
    async function recuperaDatiVecchioFormatoSeNecessario() {
        const flagKey = corsoKey('__migrazione_cassetti_v1__');
        const gia = await getRaw(flagKey, true);
        if (gia && gia.fatto)
            return;
        for (const key of CHIAVI_CORSO) {
            const vecchia = await getRaw(corsoKey(key), true); // vecchia chiave "piatta", condivisa
            if (vecchia && vecchia.length > 0) {
                const chiaveCassetto = corsoKey(key) + '::u::recupero-dati-precedenti';
                const giaNelCassetto = await getRaw(chiaveCassetto, true);
                if (giaNelCassetto.length === 0)
                    await setRaw(chiaveCassetto, vecchia, true);
            }
        }
        // registro l'utente "sistema" che ha effettuato il recupero, come partecipante, altrimenti il suo cassetto non verrebbe mai letto
        const chiavePart = corsoKey('partecipanti');
        const elencoPart = await getRaw(chiavePart, true);
        if (!elencoPart.some(p => p.shard === 'recupero-dati-precedenti')) {
            elencoPart.push({
                shard: 'recupero-dati-precedenti',
                nome: '(dati recuperati dal formato precedente)',
                primoAccesso: nowStr()
            });
            await setRaw(chiavePart, elencoPart, true);
        }
        await setRaw(flagKey, {
            fatto: true,
            quando: nowStr()
        }, true);
    }

    async function registraPartecipante() {
        const mioShard = nomeShard();
        const chiave = corsoKey('partecipanti') + '::' + mioShard; // es. "corso_X::partecipanti::mario"
        // Con una chiave tutta sua per ogni partecipante, non c'è più nessuna lista condivisa da
        // leggere-modificare-riscrivere: registrarsi è solo scrivere il proprio record, in totale
        // sicurezza anche se altri corsisti si registrano nello stesso istante.
        if (_cacheCorso && _cacheCorso[chiave] !== undefined)
            return; // già registrato, niente da fare
        const esistente = await remoteStorage.get(chiave);
        if (esistente) {
            if (_cacheCorso)
                _cacheCorso[chiave] = esistente.value;
            return;
        }
        await setRaw(chiave, {
            shard: mioShard,
            nome: currentUser,
            primoAccesso: nowStr()
        });
    }
    async function elencoPartecipanti() {
        const prefissoPartecipanti = corsoKey('partecipanti') + '::';
        let elenco = [];
        if (_cacheCorso) {
            for (const k in _cacheCorso) {
                if (k.indexOf(prefissoPartecipanti) === 0) {
                    try {
                        elenco.push(JSON.parse(_cacheCorso[k]));
                    } catch (e) {}
                }
            }
        } else {
            const mappa = await remoteStorage.getPrefix(prefissoPartecipanti);
            elenco = Object.values(mappa).map(v => JSON.parse(v));
        }
        const shardCorrente = nomeShard();
        if (!elenco.some(p => p.shard === shardCorrente))
            elenco.push({
                shard: shardCorrente,
                nome: currentUser
            });
        if (!elenco.some(p => p.shard === '_migrazione_'))
            elenco.push({
                shard: '_migrazione_',
                nome: 'Dati precedenti'
            });
        return elenco;
    }

    // Migrazione una tantum per ogni corso: sposta i dati salvati con il vecchio formato a chiave unica
    // (da prima dell'introduzione dei cassetti personali) in un cassetto dedicato "_migrazione_", così
    // restano visibili e non vengono persi nel passaggio al nuovo modello.
    async function migraVecchioFormatoSeNecessario() {
        if (!STORAGE_CONFIGURATO)
            return;
        const flagKey = corsoKey('_migrazione_cassetti_v1_');
        try {
            const fatto = await remoteStorage.get(flagKey);
            if (fatto)
                return;
        } catch (e) {}
        for (const key of CHIAVI_CORSO) {
            try {
                const vecchi = await getRaw(corsoKey(key));
                if (Array.isArray(vecchi) && vecchi.length > 0) {
                    await setRaw(corsoKey(key) + '::u::_migrazione_', vecchi);
                }
            } catch (e) {}
        }
        try {
            await remoteStorage.set(flagKey, 'fatto');
        } catch (e) {}
    }

    // LETTURA: unisce i "cassetti" di tutti i partecipanti in un'unica lista, poi applica sopra le eventuali
    // "patch" di stato (conferme, evasioni, ecc.) e le eliminazioni — ognuna scritta da chi l'ha fatta, nel proprio cassetto.
    async function loadList(key, shared=true) {
        if (key === 'preferiti') {
            // Dato personale del dispositivo, non va condiviso tra corsisti: localStorage, non il backend.
            try {
                return JSON.parse(localStorage.getItem('__preferiti_dispositivo__') || '[]');
            }
            catch (e) {
                return [];
            }
        }
        if (key === 'corsiRegistrati')
            return await caricaElencoCorsi();
        if (!CHIAVI_CORSO.includes(key)) {
            return await getRaw(corsoKey(key), shared);
        }
        const partecipanti = await elencoPartecipanti();
        const basi = await Promise.all(partecipanti.map(p => getRaw(corsoKey(key) + '::u::' + p.shard, true)));
        let combinata = basi.flat();

        if (key === 'locazioni') {
            const codiciEsistenti = new Set(combinata.map(l => l.codice));
            LOCAZIONI_FISSE.forEach(lf => {
                if (!codiciEsistenti.has(lf.codice))
                    combinata.unshift({
                        codice: lf.codice,
                        descrizione: lf.descrizione,
                        fissa: true,
                        creatoDa: 'sistema',
                        creatoIl: ''
                    });
            });
        }

        const campoChiave = CAMPO_CHIAVE[key];
        if (campoChiave) {
            const patchLists = await Promise.all(partecipanti.map(p => getRaw(corsoKey(key) + '::patch::' + p.shard, true)));
            const tuttePatch = patchLists.flat().sort((a, b) => (a._t || 0) - (b._t || 0));
            tuttePatch.forEach(patch => {
                const bersaglio = combinata.find(r => chiaveDiRecord(key, r) === patch._target);
                if (!bersaglio)
                    return;
                if (patch._arrayField && bersaglio[patch._arrayField] && bersaglio[patch._arrayField][patch._arrayIndex]) {
                    Object.assign(bersaglio[patch._arrayField][patch._arrayIndex], patch.campi);
                } else {
                    Object.assign(bersaglio, patch.campi);
                }
            });
            combinata = combinata.filter(r => !r._eliminato);
        }
        return combinata;
    }

    // SCRITTURA (creazione): il nuovo record va SEMPRE E SOLO nel cassetto dell'utente corrente.
    async function aggiungiRecord(key, record) {
        await registraPartecipante();
        const chiaveCassetto = corsoKey(key) + '::u::' + nomeShard();
        const mio = await getRaw(chiaveCassetto, true);
        mio.push(record);
        await setRaw(chiaveCassetto, mio, true);
        return record;
    }

    // SCRITTURA (modifica di stato su un record esistente, magari creato da un altro utente): patch nel MIO cassetto.
    async function applicaPatch(key, valoreChiave, campiDaAggiornare, opzioni={}) {
        await registraPartecipante();
        const chiaveCassetto = corsoKey(key) + '::patch::' + nomeShard();
        const mie = await getRaw(chiaveCassetto, true);
        mie.push({
            _target: valoreChiave,
            _t: Date.now(),
            _da: currentUser,
            campi: campiDaAggiornare,
            _arrayField: opzioni.arrayField || null,
            _arrayIndex: opzioni.arrayIndex !== undefined ? opzioni.arrayIndex : null
        });
        await setRaw(chiaveCassetto, mie, true);
    }
    async function eliminaRecord(key, valoreChiave) {
        await applicaPatch(key, valoreChiave, {
            _eliminato: true
        });
    }

    // La giacenza NON è un numero salvato: si calcola sempre sommando i movimenti (entrate meno uscite).
    function getGiacenzaLoc(materiale, locazione) {
        let tot = 0;
        movimentazioni.forEach(m => {
            if (m.materiale !== materiale)
                return;
            if (m.locazioneA === locazione)
                tot += m.quantita;
            if (m.locazioneDa === locazione)
                tot -= m.quantita;
        });
        return tot;
    }
    function getGiacenza(codice) {
        let tot = 0;
        movimentazioni.forEach(m => {
            if (m.materiale !== codice)
                return;
            if (m.locazioneA && !m.locazioneDa)
                tot += m.quantita;
            if (m.locazioneDa && !m.locazioneA)
                tot -= m.quantita;
        });
        return tot;
    }

    async function scaricaBackupCorso(corso) {
        // Prende TUTTE le chiavi del corso in un colpo solo (cassetti e patch di ogni partecipante
        // inclusi), non solo l'eventuale vecchia chiave semplice — quella coi dati veri.
        const mappa = await remoteStorage.getPrefix('corso_' + corso + '::');
        const dati = {};
        for (const chiaveCompleta in mappa) {
            try {
                dati[chiaveCompleta] = JSON.parse(mappa[chiaveCompleta]);
            }
            catch (e) {
                dati[chiaveCompleta] = mappa[chiaveCompleta];
            }
        }
        const contenuto = JSON.stringify({
            corso,
            esportatoIl: nowStr(),
            dati
        }, null, 2);
        const blob = new Blob([contenuto], {
            type: 'application/json'
        });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'backup_' + corso + '_' + isoDate(new Date()) + '.json';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    }

    let adminNuovoCorsoValue = '';

    // ============ PULIZIA MASSIVA DATI VECCHI (RA aperte / OA non ricevuti / OP non confermati, prima di oggi) ============
    // Lavora sui dati grezzi per-partecipante (non tramite il sistema di patch): ogni record candidato
    // alla cancellazione porta con sé "dove vive fisicamente" (quale cassetto, quale indice nell'array),
    // così la rimozione è precisa anche quando esistono numeri duplicati (dato storico), caso in cui
    // l'eliminazione tramite patch-per-numero può colpire il gemello sbagliato o non risolversi affatto.
    function _parseDataCreatoIl(s) {
        if (!s)
            return null;
        const parte = String(s).split(' ')[0];
        const bits = parte.split('/').map(Number);
        if (bits.length !== 3 || bits.some(isNaN))
            return null;
        const [gg, mm, aaaa] = bits;
        return new Date(aaaa, mm - 1, gg);
    }
    async function _elencoConProvenienza(key, corso) {
        const mappaBasi = await remoteStorage.getPrefix('corso_' + corso + '::' + key + '::u::');
        const conProvenienza = [];
        for (const fullKey in mappaBasi) {
            let arr = [];
            try {
                arr = JSON.parse(mappaBasi[fullKey]) || [];
            } catch (e) {
                arr = [];
            }
            arr.forEach((rec, idx) => conProvenienza.push({
                rec,
                fullKey,
                idx
            }));
        }
        const campoChiave = CAMPO_CHIAVE[key];
        if (campoChiave) {
            const mappaPatch = await remoteStorage.getPrefix('corso_' + corso + '::' + key + '::patch::');
            let tuttePatch = [];
            for (const fk in mappaPatch) {
                try {
                    tuttePatch = tuttePatch.concat(JSON.parse(mappaPatch[fk]) || []);
                } catch (e) {}
            }
            tuttePatch.sort((a, b) => (a._t || 0) - (b._t || 0));
            tuttePatch.forEach(patch => {
                const bersaglio = conProvenienza.find(x => chiaveDiRecord(key, x.rec) === patch._target);
                if (!bersaglio)
                    return;
                if (patch._arrayField && bersaglio.rec[patch._arrayField] && bersaglio.rec[patch._arrayField][patch._arrayIndex]) {
                    Object.assign(bersaglio.rec[patch._arrayField][patch._arrayIndex], patch.campi);
                } else {
                    Object.assign(bersaglio.rec, patch.campi);
                }
            });
        }
        return conProvenienza.filter(x => !x.rec._eliminato);
    }
    async function _eliminaRawPerProvenienza(items) {
        const perChiaveFisica = {};
        items.forEach(it => {
            (perChiaveFisica[it.fullKey] = perChiaveFisica[it.fullKey] || []).push(it.idx);
        });
        for (const fullKey in perChiaveFisica) {
            const indiciDaRimuovere = new Set(perChiaveFisica[fullKey]);
            const raw = await remoteStorage.get(fullKey);
            let arr = raw ? JSON.parse(raw.value) : [];
            arr = arr.filter((_, i) => !indiciDaRimuovere.has(i));
            await remoteStorage.set(fullKey, JSON.stringify(arr));
        }
    }
    async function analizzaPuliziaCorso(corso) {
        const oggi = new Date();
        oggi.setHours(0, 0, 0, 0);
        const primaDOggi = (rec) => {
            const d = _parseDataCreatoIl(rec.creatoIl);
            return d && d < oggi;
        };

        const raConProv = await _elencoConProvenienza('richiesteAcquisto', corso);
        const raDaEliminare = raConProv.filter(x => x.rec.stato === 'aperta' && primaDOggi(x.rec));

        const oaConProv = await _elencoConProvenienza('ordiniAcquisto', corso);
        const oaDaEliminare = oaConProv.filter(x => primaDOggi(x.rec) && (x.rec.righe || []).every(r => !rigaHaRicezioni(r)));

        const opConProv = await _elencoConProvenienza('ordiniProduzione', corso);
        const opDaEliminare = opConProv.filter(x => x.rec.stato === 'aperto' && primaDOggi(x.rec));

        return {
            ra: raDaEliminare,
            oa: oaDaEliminare,
            op: opDaEliminare
        };
    }
    async function eseguiPuliziaCorso(analisi) {
        await _eliminaRawPerProvenienza(analisi.ra.map(x => ({
            fullKey: x.fullKey,
            idx: x.idx
        })));
        await _eliminaRawPerProvenienza(analisi.oa.map(x => ({
            fullKey: x.fullKey,
            idx: x.idx
        })));
        await _eliminaRawPerProvenienza(analisi.op.map(x => ({
            fullKey: x.fullKey,
            idx: x.idx
        })));
    }

    // ============ TREE RENDER ============
    function buildTreeHTML(nodes, depth, openState, pathPrefix) {
        return nodes.map((node, i) => {
            const path = pathPrefix + '/' + i;
            const hasChildren = !!node.children;
            const isOpen = openState[path] !== false; // default open at depth 0/1
            const cls = 'tnode ' + (node.active ? 'clickable' : 'inactive');
            const arrow = hasChildren ? (isOpen ? '▾' : '▸') : '';
            const icon = hasChildren ? '📁' : `<span class="leaf-dot" style="background:${node.active ? '#2e5aa8' : '#d8d4c2'}"></span>`;
            const showFav = !hasChildren && node.active && node.screen;
            const isFav = showFav && preferiti.includes(node.screen);
            const favStar = showFav ? `<span class="fav-star" data-screen="${node.screen}" title="${isFav ? 'Rimuovi dai preferiti' : 'Aggiungi ai preferiti'}">${isFav ? '★' : '☆'}</span>` : '';
            let html = `<div class="${cls}" style="padding-left:${10 + depth * 16}px" data-path="${path}" data-screen="${node.screen || ''}" data-haschildren="${hasChildren}">
                  <span class="arrow-ico">${arrow}</span>${hasChildren ? '' : icon} <span class="lbl">${node.label}</span>${favStar}
                </div>`;
            if (hasChildren && isOpen) {
                html += buildTreeHTML(node.children, depth + 1, openState, path);
            }
            return html;
        }).join('');
    }

    let treeOpenState = {};
    let logoutConfirm = false;
    let preferiti = []; // array di screen code preferiti — dato privato per dispositivo, non condiviso tra corsisti

    function findNodeByScreen(nodes, screenCode) {
        for (const n of nodes) {
            if (n.screen === screenCode)
                return n;
            if (n.children) {
                const found = findNodeByScreen(n.children, screenCode);
                if (found)
                    return found;
            }
        }
        return null;
    }

    function buildFavoritesNode() {
        const figli = preferiti.map(scr => {
            const node = findNodeByScreen(MENU, scr);
            return node ? {
                label: node.label,
                active: true,
                screen: scr
            } : null;
        }).filter(Boolean);
        if (figli.length === 0) {
            figli.push({
                label: '(nessun preferito — clicca la ☆ per aggiungerne)',
                active: false
            });
        }
        return {
            label: '★ Preferiti',
            active: true,
            children: figli
        };
    }

    function attachTreeEvents() {
        document.querySelectorAll('.tnode').forEach(el => {
            el.addEventListener('click', (e) => {
                if (e.target.classList.contains('fav-star'))
                    return; // gestito da listener dedicato
                const path = el.getAttribute('data-path');
                const hasChildren = el.getAttribute('data-haschildren') === 'true';
                if (hasChildren) {
                    treeOpenState[path] = treeOpenState[path] === false ? true : false;
                    renderMain();
                } else {
                    const scr = el.getAttribute('data-screen');
                    const isActive = el.classList.contains('clickable');
                    if (scr && isActive) {
                        screen = scr;
                        statusMsg = "";
                        renderMain();
                    }
                }
            });
        });
        document.querySelectorAll('.fav-star').forEach(star => {
            star.addEventListener('click', (e) => {
                e.stopPropagation();
                const scr = star.dataset.screen;
                if (preferiti.includes(scr))
                    preferiti = preferiti.filter(s => s !== scr);
                else
                    preferiti.push(scr);
                saveSimple('preferiti', preferiti, false); // dato privato del dispositivo, non condiviso tra corsisti
                renderMain();
            });
        });
    }

    function isActiveScreenCode(code) {

            }
            return false;
        }

    }

    // Rende fisse (sticky) durante lo scroll: l'intestazione globale in alto (già gestita via CSS),
    // e — per ogni schermata — tutto ciò che precede la prima tabella (titolo/pulsanti/campi form),
    // più la riga di intestazione della prima tabella stessa. Il resto (righe della tabella) scorre
    // liberamente. Le altezze sono misurate dal vero DOM ad ogni render, quindi si adattano da sole
    // anche quando il contenuto della schermata cambia (form più lungo, banner di avviso, ecc.).
    // Oltre questa altezza, il blocco prima della tabella NON viene reso sticky: su schermate con
    // liste lunghe e variabili (es. ME21N con tante richieste d'acquisto selezionabili) renderlo
    // sticky bloccava lo scroll in modo innaturale (bisognava scorrere a vuoto per tutta la sua
    // altezza prima che la pagina si muovesse davvero).
    const MAX_ALTEZZA_STICKY_TOP = 260;
    function applicaLayoutSticky() {
        const headerEl = document.querySelector('.app-header-sticky');
        if (headerEl)
            document.documentElement.style.setProperty('--header-h', headerEl.offsetHeight + 'px');
        const cont = document.getElementById('screen-content');
        if (!cont)
            return;
        const figli = Array.from(cont.children);
        const idxTabella = figli.findIndex(c => c.classList && c.classList.contains('tablewrap'));
        if (idxTabella > 0) {
            let altezzaBlocco = 0;
            for (let i = 0; i < idxTabella; i++)
                altezzaBlocco += figli[i].offsetHeight;
            if (altezzaBlocco <= MAX_ALTEZZA_STICKY_TOP) {
                const wrapper = document.createElement('div');
                wrapper.className = 'screen-sticky-top';
                cont.insertBefore(wrapper, figli[0]);
                for (let i = 0; i < idxTabella; i++)
                    wrapper.appendChild(figli[i]);
                document.documentElement.style.setProperty('--screen-top-h', wrapper.offsetHeight + 'px');
            } else {
                document.documentElement.style.setProperty('--screen-top-h', '0px');
            }
        } else {
            document.documentElement.style.setProperty('--screen-top-h', '0px');
        }
    }
    window.addEventListener('resize', () => {
        if (document.getElementById('screen-content'))
            applicaLayoutSticky();
    });

    // ============ ORDINAMENTO GENERICO DELLE TABELLE (click su intestazione colonna, stile SAP) ============
    // Si applica a qualunque tabella dentro #screen-content che NON abbia già un ordinamento "su misura"
    // (riconosciuto dalla presenza di intestazioni con classe che finisce per "-sort-th", es. MB51/MIGO/MMBE/LS24).
    // Ordina il DOM direttamente (senza toccare lo stato dell'app): comodo e leggero, ma non sopravvive
    // a un nuovo render della schermata — esattamente come un click su intestazione in SAP GUI.
    function abilitaOrdinamentoGenerico() {
        const cont = document.getElementById('screen-content');
        if (!cont)
            return;
        const COLONNE_NON_ORDINABILI = ['azioni', 'azione', 'stampa'];
        cont.querySelectorAll('table').forEach(tabella => {
            if (tabella.querySelector('th[class$="-sort-th"]'))
                return; // già gestita a mano
            const thead = tabella.querySelector('thead');
            const tbody = tabella.querySelector('tbody');
            if (!thead || !tbody)
                return;
            const ths = Array.from(thead.querySelectorAll('tr:last-child th'));
            if (ths.length === 0)
                return;
            ths.forEach((th, colIdx) => {
                const etichetta = (th.textContent || '').trim().toLowerCase();
                if (COLONNE_NON_ORDINABILI.includes(etichetta))
                    return;
                if (th.dataset.genOrdSetup)
                    return; // evita doppio binding se richiamata più volte
                th.dataset.genOrdSetup = '1';
                if (!th.dataset.genOrdLabel)
                    th.dataset.genOrdLabel = th.textContent;
                th.style.cursor = 'pointer';
                th.style.userSelect = 'none';
                th.title = 'Clicca per ordinare';
                th.addEventListener('click', () => {
                    const righe = Array.from(tbody.querySelectorAll('tr'));
                    // Non ordinare tabelle vuote/segnaposto (riga unica con colspan diverso dal numero di colonne).
                    if (righe.length === 0 || righe.some(r => r.children.length !== ths.length))
                        return;
                    const asc = th.dataset.genOrdAsc !== 'true';
                    ths.forEach(t => {
                        t.dataset.genOrdAsc = '';
                        t.textContent = t.dataset.genOrdLabel || t.textContent;
                    });
                    th.dataset.genOrdAsc = String(asc);
                    th.textContent = (th.dataset.genOrdLabel || th.textContent) + (asc ? ' ▲' : ' ▼');
                    const valoreCella = (tr) => (tr.children[colIdx].textContent || '').trim();
                    const tuttiNumerici = righe.every(tr => {
                        const v = valoreCella(tr).replace(/[€%\s]/g, '').replace(',', '.');
                        return v === '' || !isNaN(Number(v));
                    });
                    righe.sort((a, b) => {
                        let va = valoreCella(a),
                            vb = valoreCella(b);
                        if (tuttiNumerici) {
                            const na = Number(va.replace(/[€%\s]/g, '').replace(',', '.')) || 0;
                            const nb = Number(vb.replace(/[€%\s]/g, '').replace(',', '.')) || 0;
                            return asc ? na - nb : nb - na;
                        }
                        return asc ? va.localeCompare(vb, 'it') : vb.localeCompare(va, 'it');
                    });
                    righe.forEach(tr => tbody.appendChild(tr));
                });
            });
        });
    }

    // ============ HELPERS DI DOMINIO ============
    // Elenco in memoria da controllare per ciascun prefisso di numerazione, per evitare che un
    // numero "nuovo" collida con uno già esistente (es. dati storici migrati da un vecchio schema
    // di numerazione, prima dell'introduzione del contatore atomico). Senza questo controllo, due
    // documenti diversi potrebbero finire con lo stesso "numero", e ogni ricerca/stampa/azione basata
    // su quel numero troverebbe sempre il PRIMO dei due (causa nota di bug tipo "clicco un ordine e
    // me ne mostra un altro").
    function _elencoPerPrefisso(prefisso) {
        if (prefisso === 'OV')
            return ordiniVendita;
        if (prefisso === 'OA')
            return ordiniAcquisto;
        if (prefisso === 'RA')
            return richiesteAcquisto;
        if (prefisso === 'OP')
            return ordiniProduzione;
        if (prefisso === 'DDT')
            return consegne;
        return [];
    }
    // Genera il numero successivo per un tipo di documento (OV, OA, RA, OP, DDT) in modo
    // ATOMICO lato server: Firebase incrementa il contatore e restituisce il nuovo valore in
    // un'unica operazione, quindi due scritture quasi simultanee non possono mai produrre
    // lo stesso numero (il vecchio schema "conta quanti ce ne sono e aggiungi 1" invece sì).
    // In più, se il numero generato risulta già usato da un documento esistente (tipicamente dati
    // storici migrati con un altro schema di numerazione), il contatore viene fatto avanzare finché
    // non si trova un numero davvero libero, così da auto-correggersi senza intervento manuale.
    async function prossimoNumero(prefisso) {
        if (!STORAGE_CONFIGURATO)
            return prefisso + '-' + String(Date.now()).slice(-4);
        const elenco = _elencoPerPrefisso(prefisso);
        try {
            const chiave = corsoKey('contatori::' + prefisso);
            const url = FIREBASE_URL + '/storage/' + encodeURIComponent(chiave) + '.json';
            for (let tentativo = 0; tentativo < 20; tentativo++) {
                const res = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        '.sv': {
                            increment: 1
                        }
                    })
                });
                const nuovoValore = await res.json();
                const candidato = prefisso + '-' + String(nuovoValore).padStart(4, '0');
                if (!elenco.some(r => r.numero === candidato))
                    return candidato;

            }
            // Numero già usato (dato storico): il contatore è già avanzato di 1, si riprova al giro successivo.
            // Non dovrebbe mai arrivare qui salvo un numero enorme di collisioni: ripiego con timestamp.
            return prefisso + '-' + String(Date.now()).slice(-4);
        } catch (e) {
            // Ripiego raro (rete assente): un numero comunque univoco per sessione, meglio di un duplicato certo.
            return prefisso + '-' + String(Date.now()).slice(-4);
        }
    }

    function stampaRicevimentoPerMateriale(numeroOrdine, materiale) {
        const duplicati = ordiniAcquisto.filter(x => x.numero === numeroOrdine);
        const o = duplicati[0];
        if (!o) {
            setStatus(`Impossibile stampare: ordine ${numeroOrdine} non trovato.`, true);
            return;
        }
        const idx = o.righe.findIndex(r => r.materiale === materiale && rigaHaRicezioni(r));
        if (idx === -1) {
            const suggerimento = duplicati.length > 1 ? ` Attenzione: esistono più ordini con numero ${numeroOrdine} (dato storico duplicato) — potrebbe essere questo il motivo.` : '';
            setStatus(`Impossibile stampare: nessuna riga ricevuta per ${materialeLabel(materiale)} trovata nell'ordine ${numeroOrdine}.${suggerimento}`, true);
            return;
        }
        stampaRicevimento(numeroOrdine, idx);
    }

        document.getElementById('f-cliente').addEventListener('change', e => draftOV.cliente = e.target.value);

    // ============ MF50 ============
    function demandForProduct(codice) {
        let totale = 0;
        let dataMinima = null;
        ordiniVendita.filter(o => o.stato === 'aperto').forEach(o => {
            o.righe.forEach(r => {
                if (r.prodotto === codice) {
                    totale += r.quantita;
                    if (!dataMinima || r.dataRichiesta < dataMinima)
                        dataMinima = r.dataRichiesta;
                }
            });
        });
        return {
            totale,
            dataMinima
        };
    }

    function pianificatoApertoPer(codice) {
        return ordiniProduzione.filter(o => o.prodotto === codice && o.stato === 'aperto').reduce((s, o) => s + o.quantita, 0);
    }
    // ---- "In uscita": quanto di questo materiale è già impegnato da ordini aperti, in due forme:
    // come componente di un ordine di produzione non ancora confermato, o come prodotto venduto
    // non ancora consegnato del tutto. Serve per la giacenza proiettata di MMBE.
    function consumoProduzioneApertoPer(codice) {
        let tot = 0;
        ordiniProduzione.forEach(o => {
            if (o.stato !== 'aperto')
                return;
            (o.componenti || []).forEach(c => {
                if (c.codice === codice)
                    tot += Number(c.qtaTotale) || 0;
            });
        });
        return tot;
    }
    function venditeAperteApertoPer(codice) {
        let tot = 0;
        ordiniVendita.forEach(o => {
            if (o.stato === 'evaso')
                return;
            (o.righe || []).forEach(r => {
                if (r.prodotto === codice) {
                    const residuo = Number(r.quantita) - Number(r.consegnato || 0);
                    if (residuo > 0)
                        tot += residuo;
                }
            });
        });
        return tot;
    }

    // ---- Bucket settimanali (lun-dom), stile matrice SAP MF50 ----
    function mondayOf(date) {
        const d = new Date(date);
        const day = d.getDay(); // 0=dom, 1=lun...
        const diff = day === 0 ? -6 : 1 - day;
        d.setDate(d.getDate() + diff);
        d.setHours(0, 0, 0, 0);
        return d;
    }
    function isoDate(d) {
        // NB: NON usare toISOString() qui — converte in UTC, e in Italia (UTC+1/+2) la mezzanotte
        // locale può "scivolare" al giorno prima nella rappresentazione UTC, disallineando di un
        // giorno tutte le date dei bucket rispetto alle date reali (es. dataRichiesta) inserite
        // dagli utenti tramite <input type="date">. Costruiamo la stringa dai campi locali.
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }
    function fmtGG_MM(d) {
        return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0');
    }
    function weekNumber(d) {
        const target = new Date(d.getTime());
        target.setHours(0, 0, 0, 0);
        target.setDate(target.getDate() + 3 - ((target.getDay() + 6) % 7));
        const firstThursday = new Date(target.getFullYear(), 0, 4);
        const diff = target - firstThursday;
        return 1 + Math.round(diff / (7 * 24 * 60 * 60 * 1000));
    }
    // Festività italiane fisse (le mobili, Pasqua e Pasquetta, si calcolano a parte più sotto).
    const FESTIVITA_FISSE_MMGG = ['01-01', '01-06', '04-25', '05-01', '06-02', '08-15', '11-01', '12-08', '12-25', '12-26'];
    function pasquaDiPasquetta(anno) {
        // Algoritmo di Gauss per la domenica di Pasqua; Pasquetta è il giorno dopo.
        const a = anno % 19,
            b = Math.floor(anno / 100),
            c = anno % 100;
        const d = Math.floor(b / 4),
            e = b % 4,
            f = Math.floor((b + 8) / 25),
            g = Math.floor((b - f + 1) / 3);
        const h = (19 * a + b - d - g + 15) % 30,
            i = Math.floor(c / 4),
            k = c % 4;
        const l = (32 + 2 * e + 2 * i - h - k) % 7,
            m = Math.floor((a + 11 * h + 22 * l) / 451);
        const mese = Math.floor((h + l - 7 * m + 114) / 31),
            giorno = ((h + l - 7 * m + 114) % 31) + 1;
        const pasqua = new Date(anno, mese - 1, giorno);
        const pasquetta = new Date(pasqua);
        pasquetta.setDate(pasqua.getDate() + 1);
        return [isoDate(pasqua), isoDate(pasquetta)];
    }
    function isFestivo(d) {
        const mmgg = String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        if (FESTIVITA_FISSE_MMGG.includes(mmgg))
            return true;
        return pasquaDiPasquetta(d.getFullYear()).includes(isoDate(d));
    }
    function isWeekendOFestivo(d) {
        return d.getDay() === 0 || d.getDay() === 6 || isFestivo(d);
    }
    function generateWeekBuckets(nGiorni=14, nSettimaneDopo=8) {
        const buckets = [];
        const oggi = new Date();
        oggi.setHours(0, 0, 0, 0);
        const inizio = mondayOf(oggi); // la vista giornaliera parte SEMPRE dal lunedì della settimana corrente
        for (let i = 0; i < nGiorni; i++) {
            const d = new Date(inizio);
            d.setDate(d.getDate() + i);
            const nomeGiorno = ['dom', 'lun', 'mar', 'mer', 'gio', 'ven', 'sab'][d.getDay()];
            buckets.push({
                label: nomeGiorno + ' ' + fmtGG_MM(d),
                startISO: isoDate(d),
                endISO: isoDate(d),
                speciale: isWeekendOFestivo(d),
                oggi: isoDate(d) === isoDate(oggi)
            });
        }
        const cursor = new Date(inizio);
        cursor.setDate(cursor.getDate() + nGiorni);
        for (let i = 0; i < nSettimaneDopo; i++) {
            const s = new Date(cursor);
            s.setDate(s.getDate() + i * 7);
            const e = new Date(s);
            e.setDate(e.getDate() + 6);
            buckets.push({
                label: `S${weekNumber(s)} (${fmtGG_MM(s)})`,
                startISO: isoDate(s),
                endISO: isoDate(e),
                speciale: false,
                oggi: false
            });
        }
        return buckets;
    }
    function bucketIndexForDate(dateStr, buckets) {
        if (!dateStr)
            return null;
        for (let i = 0; i < buckets.length; i++) {
            if (dateStr <= buckets[i].endISO)
                return i; // include tutto ciò che è prima/durante il primo bucket, e clamp sull'ultimo sotto
        }
        return buckets.length - 1; // oltre l'orizzonte visibile: accumula sull'ultima colonna
    }

    function mf50Key(codice, linea) {
        return codice + '::' + (linea || '_');
    }

    function renderMF50(el) {
        const prodottiFiniti = materiali.filter(m => m.tipo === 'PF');
        const buckets = generateWeekBuckets(14, 8);

        const righeCalc = prodottiFiniti.map(p => {
            const {totale, dataMinima} = demandForProduct(p.codice);
            const giacenza = getGiacenza(p.codice);
            const pianificatoAperto = pianificatoApertoPer(p.codice);
            const giacenzaTeorica = giacenza + pianificatoAperto;
            const fabbisogno = Math.max(0, totale - giacenzaTeorica);
            const hasBOM = !!getBOM(p.codice);
            const linee = assegnazioni.filter(a => a.prodotto === p.codice).map(a => a.linea);
            return {
                codice: p.codice,
                descrizione: p.descrizione,
                richiesto: totale,
                dataMinima,
                giacenza,
                pianificatoAperto,
                giacenzaTeorica,
                fabbisogno,
                hasBOM,
                linee
            };
        });

        // ---- Recap per linea: produzione totale pianificata, con più codici possibili sulla stessa linea ----
        function recapPerLineaHTML() {
            // Set: se per dati storici esistono più record linea con lo stesso codice (possibile con
            // vecchi dati duplicati), evita di renderizzare più blocchi identici sovrapposti per la
            // stessa linea ("si ammucchiano").
            const lineeChiavi = [...new Set(lineeProduzione.map(l => l.codice))];
            const haNonAssegnata = ordiniProduzione.some(o => o.stato === 'aperto' && !o.linea);
            if (haNonAssegnata)
                lineeChiavi.push('(non assegnata)');
            if (lineeChiavi.length === 0) {
                return `
                        <div style="margin:0 10px 14px 10px;">
                          <div style="background:#e5e0cc; border:1px solid #c8c2a8; padding:5px 8px; font-weight:600; font-size:11.5px;">📊 Produzione pianificata per linea</div>
                          <p style="font-size:11px;color:#9a9a8f;padding:8px;">Nessuna linea definita e nessun ordine senza linea. Crea una linea in CR01.</p>
                        </div>`;
            }

            const blocchi = lineeChiavi.map(lineaKey => {
                const ordiniLinea = ordiniProduzione.filter(o => o.stato === 'aperto' && (o.linea || '(non assegnata)') === lineaKey);
                const totalePerBucket = new Array(buckets.length).fill(0);
                const perCodice = {};
                ordiniLinea.forEach(o => {
                    const idx = bucketIndexForDate(o.dataPianificata, buckets);
                    if (idx === null)
                        return;
                    totalePerBucket[idx] += o.quantita;
                    if (!perCodice[o.prodotto])
                        perCodice[o.prodotto] = new Array(buckets.length).fill(0);
                    perCodice[o.prodotto][idx] += o.quantita;
                });
                const infoLinea = lineeProduzione.find(l => l.codice === lineaKey);
                const nomeLinea = lineaKey === '(non assegnata)' ? '(non assegnata)' : (infoLinea ? `${lineaKey} - ${infoLinea.descrizione}` : lineaKey);
                const capacitaMax = infoLinea ? Number(infoLinea.capacitaMax) || 0 : 0;
                const righeCodici = Object.entries(perCodice).map(([cod, arr]) =>
                `<tr><td style="padding-left:14px; color:#3a5a8c;">↳ ${materialeLabel(cod)}</td>${arr.map(v => `<td style="text-align:center; font-size:10.5px;">${v || ''}</td>`).join('')}</tr>`
                ).join('');

                return `
                        <div style="margin:0 0 18px 0; padding-bottom:6px; border-bottom:2px solid #d8d8c8;">
                          <div class="tablewrap" style="margin:0 0 0 0;">
                            <table style="min-width:${140 + buckets.length * 52}px;">
                              <thead><tr><th style="min-width:150px;">${nomeLinea}${capacitaMax > 0 ? ` <span style="font-weight:400; font-size:9.5px; color:#5a6470;">(max ${capacitaMax}/g)</span>` : ''}</th>${buckets.map(b => `<th style="text-align:center; min-width:48px; font-size:10px; ${b.speciale ? 'color:#a83232; background:#fbeaea;' : ''} ${b.oggi ? 'text-decoration:underline;' : ''}">${b.label}</th>`).join('')}</tr></thead>
                              <tbody>
                                <tr style="background:#f4f4ee; font-weight:600;"><td>Totale linea</td>${totalePerBucket.map((v, i) => {const sopraCapacita = capacitaMax > 0 && v > capacitaMax && !buckets[i].label.startsWith('S');return `<td style="text-align:center; ${sopraCapacita ? 'color:#a83232; background:#fbeaea;' : ''}" ${sopraCapacita ? `title="Supera la capacità massima della linea (${capacitaMax}/giorno)"` : ''}>${v || 0}${sopraCapacita ? ' ⚠' : ''}</td>`;}).join('')}</tr>
                                ${righeCodici || '<tr><td colspan="' + (buckets.length + 1) + '" style="text-align:center;color:#9a9a8f;font-size:10.5px;padding:4px;">Nessun ordine pianificato su questa linea.</td></tr>'}
                              </tbody>
                            </table>
                          </div>
                        </div>`;
            }).join('');

            return `
                  <div style="margin:0 10px 14px 10px;">
                    <div style="background:#e5e0cc; border:1px solid #c8c2a8; padding:5px 8px; font-weight:600; font-size:11.5px;">📊 Produzione pianificata per linea (ordini aperti, per giorno/settimana)</div>
                    ${blocchi}
                  </div>`;
        }

        // ---- Matrice settimanale EDITABILE (unico punto di pianificazione) ----
        function existingPlanPerWeek(codice, linea) {
            const arr = new Array(buckets.length).fill(0);
            ordiniProduzione.filter(o => o.prodotto === codice && (o.linea || null) === (linea || null)).forEach(o => {
                const idx = bucketIndexForDate(o.dataPianificata, buckets);
                if (idx !== null)
                    arr[idx] += o.quantita;
            });
            return arr;
        }

        function matriceProdottoHTML(r) {
            if (!r.hasBOM)
                return ''; // senza BOM non si può generare nulla: non ha senso pianificare
            const richiestoWeek = new Array(buckets.length).fill(0);
            ordiniVendita.filter(o => o.stato === 'aperto').forEach(o => {
                o.righe.forEach(riga => {
                    if (riga.prodotto === r.codice) {
                        const idx = bucketIndexForDate(riga.dataRichiesta, buckets);
                        if (idx !== null)
                            richiestoWeek[idx] += riga.quantita;
                    }
                });
            });

            const lineeRiga = r.linee.length > 0 ? r.linee : [null]; // null = "non assegnata a una linea specifica"
            const baselinePerLinea = {};
            lineeRiga.forEach(l => {
                baselinePerLinea[l || '_'] = existingPlanPerWeek(r.codice, l);
            });

            // NB: mf50CellDraft NON è più il "totale" della cella, ma la quantità AGGIUNTIVA da
            // generare ora, sopra a quanto già pianificato (baselinePerLinea, sempre mostrato in
            // chiaro nella riga "Già programmato" qui sotto, mai editabile). Così il già-programmato
            // resta sempre visibile e non può mai sembrare "vuoto", e un secondo click su "Genera"
            // senza aver scritto nulla di nuovo non ricrea nulla (il campo riparte sempre da vuoto).
            function pianificatoTotWeekCorrente() {
                const tot = new Array(buckets.length).fill(0);
                lineeRiga.forEach(l => {
                    const key = l || '_';
                    for (let i = 0; i < buckets.length; i++) {
                        const cellKey = `${r.codice}::${key}::${i}`;
                        const daAggiungere = mf50CellDraft[cellKey] !== undefined ? (Number(mf50CellDraft[cellKey]) || 0) : 0;
                        tot[i] += (baselinePerLinea[key][i] || 0) + daAggiungere;
                    }
                });
                return tot;
            }

            const righeLinea = lineeRiga.map(l => {
                const key = l || '_';
                const cellsGiaProgrammato = buckets.map((b, i) => {
                    const v = baselinePerLinea[key][i];
                    return `<td style="text-align:center; font-size:10.5px; ${v > 0 ? 'font-weight:600; color:#1a6b2e;' : 'color:#9a9a8f;'}">${v || ''}</td>`;
                }).join('');
                const cellsDaAggiungere = buckets.map((b, i) => {
                    const cellKey = `${r.codice}::${key}::${i}`;
                    const val = mf50CellDraft[cellKey] !== undefined ? mf50CellDraft[cellKey] : '';
                    return `<td style="padding:2px;"><input type="number" min="0" class="mat-cell" data-prodotto="${r.codice}" data-linea="${l || ''}" data-week="${i}" value="${val}" placeholder="0" style="width:52px; font-size:10.5px; padding:2px; border:1px solid #b9c4d6; text-align:center;"></td>`;
                }).join('');
                const etichettaLinea = l ? '(' + l + ')' : '(nessuna linea)';
                return `<tr><td style="padding-left:14px; color:#1a6b2e; white-space:nowrap;">✓ Già programmato ${etichettaLinea}</td>${cellsGiaProgrammato}</tr>` +
                `<tr><td style="padding-left:14px; color:#3a5a8c; white-space:nowrap;">↳ Da aggiungere ora ${etichettaLinea}</td>${cellsDaAggiungere}</tr>`;
            }).join('');

            const pianificatoTot = pianificatoTotWeekCorrente();
            const giacenzaProiettata = [];
            let run = r.giacenza; // parte dalla giacenza fisica; "già pianificato aperto" è incluso via le celle stesse (baseline = ODP esistenti)
            for (let i = 0; i < buckets.length; i++) {
                run = run + pianificatoTot[i] - richiestoWeek[i];
                giacenzaProiettata.push(run);
            }

            return `
                  <div style="margin:0 10px 18px 10px;" data-prodotto-block="${r.codice}">
                    <div style="background:#dfe6f0; border:1px solid #b9c4d6; padding:6px 8px; font-weight:600; font-size:11.5px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;">
                      <span>${r.codice} - ${r.descrizione}</span>
                      <span style="font-weight:400; font-size:10.5px; color:#3a4453;">Giacenza fisica: ${r.giacenza} | Già pianificato: ${r.pianificatoAperto} | Giacenza teorica: <strong>${r.giacenzaTeorica}</strong> | Fabbisogno residuo: <strong style="color:${r.fabbisogno > 0 ? '#a83232' : '#1a6b2e'}">${r.fabbisogno}</strong></span>
                    </div>
                    <div class="tablewrap" style="margin:0;">
                      <table style="min-width:${140 + buckets.length * 60}px;">
                        <thead>
                          <tr><th style="min-width:150px;">Dato</th>${buckets.map(b => `<th style="text-align:center; min-width:56px; font-size:10px; ${b.speciale ? 'color:#a83232; background:#fbeaea;' : ''} ${b.oggi ? 'text-decoration:underline;' : ''}">${b.label}</th>`).join('')}</tr>
                        </thead>
                        <tbody>
                          <tr style="background:#f4f4ee;"><td>Giacenza proiettata</td>${giacenzaProiettata.map(v => `<td class="proiezione-cell" style="text-align:center; font-weight:600; color:${v < 0 ? '#a83232' : '#1a6b2e'};">${v}</td>`).join('')}</tr>
                          <tr><td>Richiesto</td>${richiestoWeek.map(v => `<td style="text-align:center; font-size:10.5px;">${v || ''}</td>`).join('')}</tr>
                          ${righeLinea}
                        </tbody>
                      </table>
                    </div>
                    <div style="display:flex; align-items:center; gap:10px; margin-top:6px;">
                      <button class="actionbtn genera-piano" data-prodotto="${r.codice}" style="padding:5px 10px; font-size:11px;">✔ Genera ordini di produzione da questo piano</button>
                      <span class="piano-confirm" data-prodotto="${r.codice}" style="font-size:10.5px; color:#1a6b2e;"></span>
                    </div>
                  </div>`;
        }

        const matriciHTML = righeCalc.map(matriceProdottoHTML).join('');

        el.innerHTML = `
            <div class="formwrap" style="padding-bottom:0;">
              <p style="font-size:11px;color:#5a6470;margin:0 0 4px 0;">Scrivi direttamente nella matrice le quantità da produrre (giornaliero nei prossimi 14 giorni, poi settimanale), poi conferma: verranno creati gli ordini di produzione necessari. Le pianificazioni non verificano ancora la capacità della linea (gestione futura).</p>
            </div>
            <div style="flex:1; overflow:auto;">
              ${lineeProduzione.length === 0 ? '<p style="font-size:11px;color:#a83232;margin:0 10px 10px 10px;">Nessuna linea di produzione definita: crearle in CR01 per vedere il recap qui sotto.</p>' : ''}
              ${recapPerLineaHTML()}
              <div style="margin:0 10px 6px 10px; border-top:2px solid #b9c4d6; padding-top:10px;">
                <strong style="font-size:13px;">📅 Piano per prodotto — scrivi qui per pianificare</strong>
                <p style="font-size:10.5px; color:#8a8a80; margin:2px 0 10px 0;">Colonne giornaliere per i prossimi 14 giorni, poi settimanali. La riga "✓ Già programmato" (sola lettura, sempre visibile) mostra quanto è già stato generato in ordini di produzione per quel giorno/linea. La riga "↳ Da aggiungere ora" è dove scrivi SOLO la quantità aggiuntiva da generare: parte sempre vuota, così un click su "Genera" senza nuovi numeri non crea nulla di duplicato. "Giacenza proiettata" è la giacenza attesa a fine periodo se tutto va come pianificato (già programmato + da aggiungere ora): se scende sotto zero, la copertura non basta ancora.</p>
                ${matriciHTML || '<p style="font-size:11px;color:#9a9a8f; margin-left:10px;">Nessun prodotto con distinta base da pianificare. Crea prima una BOM in CS01.</p>'}
              </div>
            </div>
          `;

        document.querySelectorAll('.mat-cell').forEach(inp => {
            inp.addEventListener('input', e => {
                const {prodotto, linea, week} = e.target.dataset;
                const cellKey = `${prodotto}::${linea || '_'}::${week}`;
                mf50CellDraft[cellKey] = e.target.value;
                // ricalcola live SOLO la riga "Giacenza proiettata" del blocco di questo prodotto
                const blocco = document.querySelector(`[data-prodotto-block="${prodotto}"]`);
                if (!blocco)
                    return;
                const r = righeCalc.find(x => x.codice === prodotto);
                const richiestoWeek = new Array(buckets.length).fill(0);
                ordiniVendita.filter(o => o.stato === 'aperto').forEach(o => {
                    o.righe.forEach(riga => {
                        if (riga.prodotto === prodotto) {
                            const idx = bucketIndexForDate(riga.dataRichiesta, buckets);
                            if (idx !== null)
                                richiestoWeek[idx] += riga.quantita;
                        }
                    });
                });
                const lineeRiga = r.linee.length > 0 ? r.linee : [null];
                const pianificatoTot = new Array(buckets.length).fill(0);
                lineeRiga.forEach(l => {
                    const key = l || '_';
                    const baseline = existingPlanPerWeek(prodotto, l);
                    for (let i = 0; i < buckets.length; i++) {
                        const ck = `${prodotto}::${key}::${i}`;
                        const daAggiungere = mf50CellDraft[ck] !== undefined ? (Number(mf50CellDraft[ck]) || 0) : 0;
                        pianificatoTot[i] += (baseline[i] || 0) + daAggiungere;
                    }
                });
                let run = r.giacenza;
                const proiez = [];
                for (let i = 0; i < buckets.length; i++) {
                    run = run + pianificatoTot[i] - richiestoWeek[i];
                    proiez.push(run);
                }
                blocco.querySelectorAll('.proiezione-cell').forEach((td, i) => {
                    td.textContent = proiez[i];
                    td.style.color = proiez[i] < 0 ? '#a83232' : '#1a6b2e';
                });
            });
        });

        document.querySelectorAll('.genera-piano').forEach(btn => {
            btn.addEventListener('click', () => withGuard(async () => {
                const prodotto = btn.dataset.prodotto;
                const r = righeCalc.find(x => x.codice === prodotto);
                const bom = getBOM(prodotto);
                const lineeRiga = r.linee.length > 0 ? r.linee : [null];
                const creati = [];

                // Ricarico la lista più recente prima di calcolare la baseline e generare i numeri ordine,
                // per evitare che due discenti che confermano quasi in contemporanea si cancellino a vicenda.
                const opFreschi = await loadList('ordiniProduzione');
                ordiniProduzione = opFreschi;

                for (const l of lineeRiga) {
                    const key = l || '_';
                    for (let i = 0; i < buckets.length; i++) {
                        const cellKey = `${prodotto}::${key}::${i}`;
                        if (mf50CellDraft[cellKey] === undefined)
                            continue;
                        // Il campo "Da aggiungere ora" contiene già la quantità AGGIUNTIVA da generare
                        // (non più un totale da cui sottrarre il già-programmato): niente più ambiguità
                        // tra "quanto c'era" e "quanto scrivo".
                        const delta = Number(mf50CellDraft[cellKey]) || 0;
                        if (delta > 0) {
                            const rec = {
                                numero: await prossimoNumero('OP'),
                                prodotto,
                                quantita: delta,
                                origine: 'MF50/MRP (piano settimanale)',
                                stato: 'aperto',
                                dataPianificata: buckets[i].startISO,
                                linea: l,
                                componenti: bom.componenti.map(c => ({
                                    codice: c.codice,
                                    qtaUnitaria: Number(c.qta),
                                    qtaTotale: Number(c.qta) * delta
                                })),
                                creatoDa: currentUser,
                                creatoIl: nowStr(),
                                confermatoDa: null,
                                confermatoIl: null,
                            };
                            creati.push(rec);
                        }
                        delete mf50CellDraft[cellKey];
                    }
                }

                if (creati.length === 0) {
                    setStatus('Nessuna nuova quantità pianificata da confermare per questo prodotto.', true);
                    return;
                }
                for (const rec of creati) {
                    await aggiungiRecord('ordiniProduzione', rec);
                    ordiniProduzione.push(rec);
                }
                const riepilogo = creati.map(c => `${c.numero}${c.linea ? ' (' + c.linea + ')' : ''}: ${c.quantita} pz il ${c.dataPianificata}`).join(' — ');
                setStatus(`Generati ${creati.length} ordine/i di produzione per ${prodotto}: ${riepilogo}`);
                renderMain();
            }));
        });
    }
